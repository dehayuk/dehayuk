<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3534">
<title>Pilah Kelereng</title>
<meta name="description" content="Pilah Kelereng: pindahkan kelereng antar tabung bambu sampai tiap tabung satu warna. Santai tanpa waktu, level tanpa batas, tantangan harian, dan duel lewat WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Font tidak menahan tampilan pertama: dimuat sebagai print lalu dialihkan ke all. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap"></noscript>
<style>
:root {
  color-scheme: dark;
  --ground: #0E3534;
  --board: #15504D;
  --board-edge: #2A7A75;
  --tile: #F4C152;
  --tile-shade: #C9952A;
  --tile-ink: #3B2A05;
  --ink: #EAF6F3;
  --muted: #9EC6C0;
  --good: #7FE0A3;
  --bad: #FF7A70;
  --gold: #FFD76A;
  --display: "Baloo 2", ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, -apple-system, Roboto, sans-serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
body {
  margin: 0; background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 15px;
  overflow-x: hidden;
}
/* Latar: gradasi teal yang bergeser sangat pelan */
body::before {
  content: ""; position: fixed; inset: -25%; z-index: -1; pointer-events: none;
  background: radial-gradient(40% 35% at 30% 30%, rgba(42, 122, 117, .35), transparent 70%),
              radial-gradient(45% 40% at 75% 70%, rgba(21, 80, 77, .55), transparent 70%);
  animation: drift 40s ease-in-out infinite alternate;
}
@keyframes drift { to { transform: translate(6%, -5%) rotate(8deg); } }
.wrap {
  max-width: 520px; margin: 0 auto;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
section { display: flex; flex-direction: column; gap: 14px; }
.hub { color: var(--muted); font-size: 13px; font-weight: 800; text-decoration: none; display: inline-block; padding: 6px 0; }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: .5px; margin: 0; }
.brand span { color: var(--tile); }
.head-right { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  min-width: 44px; min-height: 44px; border-radius: 999px; cursor: pointer; font-size: 17px; line-height: 1;
  background: var(--board); border: 1px solid var(--board-edge); color: var(--ink);
}
.pill {
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
  background: var(--board); border: 1px solid var(--board-edge);
  padding: 8px 12px; border-radius: 999px; font-weight: 800; font-variant-numeric: tabular-nums;
}
.pill.bump { animation: bump .45s ease-out; }
@keyframes bump { 40% { transform: scale(1.18); border-color: var(--tile); } }
.emas-dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 30%, #fff 0 12%, #FFE08A 25%, #E0A526 70%, #9C6A10); }

/* Menu utama */
.hero {
  background: var(--board); border: 1px solid var(--board-edge); border-radius: 16px;
  padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center;
}
.label { display: block; color: var(--muted); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
.big { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.05; color: var(--tile); }
.sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mini { display: flex; gap: 6px; align-items: flex-end; }
.mini .tube { pointer-events: none; }
.modes { display: grid; gap: 10px; }
.mode {
  display: grid; grid-template-columns: 1fr auto; grid-template-areas: "name state" "desc state";
  gap: 2px 12px; align-items: center; text-align: left; width: 100%;
  background: var(--board); border: 1px solid var(--board-edge); border-radius: 14px;
  padding: 13px 16px; color: var(--ink); font-family: var(--body); cursor: pointer; min-height: 44px;
}
.mode-name { grid-area: name; font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.1; }
.mode-desc { grid-area: desc; font-size: 12.5px; color: var(--muted); }
.mode-state {
  grid-area: state; max-width: 150px; text-align: center; font-weight: 800; font-size: 12px;
  background: var(--tile); color: var(--tile-ink); box-shadow: inset 0 -3px 0 var(--tile-shade);
  padding: 7px 10px; border-radius: 9px; font-variant-numeric: tabular-nums;
}
.mode.primary { border-color: var(--tile-shade); box-shadow: 0 0 0 1px var(--tile-shade) inset; }
.mode.primary .mode-name { color: var(--tile); }
.mode.done .mode-state { background: transparent; box-shadow: none; color: var(--good); border: 1px solid var(--good); }
.mode.plain .mode-state { background: transparent; box-shadow: none; color: var(--ink); border: 1px solid var(--board-edge); }
.foot { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; }
.foot a, .foot button { color: var(--muted); font-size: 12px; padding: 10px; background: none; border: 0; font-family: var(--body); cursor: pointer; text-decoration: underline; }

/* Layar permainan: satu layar penuh tanpa gulir */
#game { height: calc(100dvh - max(12px, env(safe-area-inset-top)) - max(16px, env(safe-area-inset-bottom))); min-height: 420px; gap: 8px; }
@supports not (height: 100dvh) { #game { height: calc(100vh - 28px); } }
.topbar { display: flex; align-items: center; gap: 8px; }
.back {
  background: none; border: 1px solid var(--board-edge); color: var(--ink); border-radius: 10px;
  min-height: 44px; padding: 8px 12px; font-family: var(--body); font-weight: 800; font-size: 13px; cursor: pointer; flex: none;
}
.title-box { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
.chip { font-family: var(--display); font-weight: 800; font-size: 19px; color: var(--tile); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { font-size: 11px; font-weight: 800; letter-spacing: .5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag.hot { color: var(--bad); }
.tag.mys { color: #C9A8FF; }
.score-box { margin-left: 4px; text-align: right; line-height: 1.15; font-variant-numeric: tabular-nums; flex: none; }
.moves { font-weight: 800; font-size: 15px; }
.target { font-size: 11px; color: var(--muted); }
.target b { color: var(--tile); font-weight: 800; letter-spacing: -1px; }
.info { min-height: 22px; text-align: center; font-size: 13px; font-weight: 800; color: var(--muted); margin: 0; }
.info.guide { color: var(--tile); }

.board {
  flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 22px;
  margin: 0 -12px; /* papan memakai hampir seluruh lebar layar agar sasaran ketuk >= 44px */
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.row { display: flex; justify-content: center; }
.tube {
  position: relative; padding: 18px 0 6px; cursor: pointer; outline: none; border-radius: 12px;
  width: var(--hw, auto); display: flex; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.tube:focus-visible { box-shadow: 0 0 0 3px #fff; }
.glass {
  position: relative; width: var(--tw); height: var(--th);
  border-radius: 6px 6px calc(var(--tw) / 2) calc(var(--tw) / 2);
  background: rgba(6, 30, 18, .5);
  box-shadow: inset 0 0 0 3px var(--fr), inset 5px 0 0 3px rgba(255, 255, 255, .08), 0 3px 0 rgba(0, 0, 0, .25);
  transition: box-shadow .2s, transform .15s;
}
/* Ruas bambu (tema 0) */
.glass::before {
  content: ""; position: absolute; left: 0; right: 0; top: 34%; height: 4px; background: var(--node); pointer-events: none;
  box-shadow: 0 calc(var(--th) * .33) 0 var(--node);
}
.glass::after {
  content: ""; position: absolute; left: -3px; right: -3px; top: -3px; height: 7px; border-radius: 4px; background: var(--rim); pointer-events: none;
}
.th0 { --fr: #93B347; --node: rgba(93, 125, 38, .85); --rim: #B7D26A; }
.th1 { --fr: rgba(210, 250, 245, .55); --node: transparent; --rim: rgba(230, 255, 252, .7); }
.th1 .glass { background: linear-gradient(90deg, rgba(255,255,255,.1), rgba(255,255,255,.02) 30%, rgba(255,255,255,.08) 80%, rgba(255,255,255,.14)); }
.th2 { --fr: #C4693B; --node: rgba(140, 62, 26, .7); --rim: #E08A57; }
.th2 .glass { background: rgba(60, 22, 8, .5); border-radius: 12px 12px calc(var(--tw) / 2) calc(var(--tw) / 2); }
.th2 .glass::before { top: 12%; height: 3px; box-shadow: none; }
.th3 { --fr: #8B5C34; --node: rgba(70, 40, 16, .6); --rim: #A87445; }
.th3 .glass { background: repeating-linear-gradient(90deg, rgba(60, 32, 10, .55) 0 5px, rgba(80, 45, 18, .5) 5px 9px); }
.th3 .glass::before { top: 50%; height: 2px; box-shadow: none; }

.tube.sel .glass { box-shadow: inset 0 0 0 3px var(--fr), 0 0 0 3px rgba(255, 255, 255, .85), 0 3px 0 rgba(0, 0, 0, .25); }
.tube.done .glass { box-shadow: inset 0 0 0 3px var(--gold), 0 0 14px 3px rgba(255, 215, 106, .55); }
.tube.guide .glass { animation: guide 1s ease-in-out infinite; }
@keyframes guide { 50% { box-shadow: inset 0 0 0 3px var(--fr), 0 0 0 4px var(--tile), 0 0 18px 4px rgba(244, 193, 82, .6); } }
.tube.shake { animation: shake .15s linear 2; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.cap {
  position: absolute; left: 50%; top: 8px; width: calc(var(--tw) + 6px); height: 10px; margin-left: calc(var(--tw) / -2 - 3px);
  border-radius: 6px 6px 3px 3px; background: linear-gradient(#FFE9A8, var(--tile) 60%, var(--tile-shade));
  box-shadow: 0 2px 0 rgba(0, 0, 0, .25); transform: scale(0); pointer-events: none;
}
.tube.done .cap { transform: scale(1); }
.tube.done.pop .cap { animation: capPop .35s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes capPop { from { transform: translateY(-10px) scale(0); } to { transform: none; } }
.board.win .tube { animation: wave .5s ease both; animation-delay: calc(var(--i) * 60ms); }
@keyframes wave { 40% { transform: translateY(-16px); } 70% { transform: translateY(3px); } }
.tube.plus .glass { box-shadow: inset 0 0 0 3px var(--tile), 0 3px 0 rgba(0,0,0,.25); }

/* Kelereng */
.m {
  position: absolute; left: 50%; width: var(--ms); height: var(--ms); margin-left: calc(var(--ms) / -2);
  border-radius: 50%; display: grid; place-items: center; color: var(--mo, rgba(255, 255, 255, .88)); z-index: 1;
  background:
    radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .95) 0 8%, rgba(255, 255, 255, 0) 16%),
    radial-gradient(circle at 40% 38%, rgba(255, 255, 255, .32), rgba(255, 255, 255, 0) 48%),
    radial-gradient(circle at 50% 55%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, .38) 100%),
    var(--c);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .16), 0 2px 2px rgba(0, 0, 0, .35);
  transition: transform .12s ease-out;
}
.m svg { width: 52%; height: 52%; fill: currentColor; stroke: currentColor; }
.m.up { transform: translateY(-14px); animation: bob 1.2s ease-in-out .12s infinite; }
@keyframes bob { 0%, 100% { transform: translateY(-14px); } 50% { transform: translateY(-16px); } }
.m.land { animation: land 90ms ease-out; transform-origin: 50% 100%; }
@keyframes land { from { transform: scaleY(.9); } }
.m.flip { animation: flip .3s ease-out; }
@keyframes flip { from { transform: rotateY(90deg); } }
.m.fade { animation: fade .14s ease-out; }
@keyframes fade { from { opacity: 0; } }
.m.fly { position: fixed; margin: 0; left: 0; top: 0; z-index: 25; pointer-events: none; transition: none; will-change: transform; }
.c0 { --c: #E0413A; }
.c1 { --c: #2F6FE4; }
.c2 { --c: #F7D23E; --mo: rgba(70, 45, 0, .6); }
.c3 { --c: #37A556; }
.c4 { --c: #8E4FC7; }
.c5 { --c: #F5861C; --mo: rgba(70, 30, 0, .6); }
.c6 { --c: #22C3B5; --mo: rgba(0, 55, 50, .6); }
.c7 { --c: #F77EB9; --mo: rgba(90, 10, 50, .55); }
.c8 { --c: #8A5733; }
.c9 { --c: #A3ADB5; --mo: rgba(30, 40, 50, .6); }
.c10 { --c: #F2F0EA; --mo: rgba(60, 60, 70, .6); }
.c11 { --c: #2A2A2E; }
.m.q { --c: #6F7F7D; color: rgba(255, 255, 255, .9); font-family: var(--display); font-weight: 800; font-size: calc(var(--ms) * .5); }
/* Gaya kilau kelereng (hadiah bintang) */
.sh1 .m:not(.q) { background:
    radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 8%, rgba(255,255,255,0) 16%),
    linear-gradient(135deg, rgba(255,255,255,.35), rgba(255,255,255,0) 40%, rgba(170,220,255,.25) 70%, rgba(255,190,240,.3)),
    radial-gradient(circle at 50% 55%, rgba(0,0,0,0) 50%, rgba(0,0,0,.3) 100%), var(--c); }
.sh2 .m:not(.q) { background:
    radial-gradient(circle at 30% 26%, rgba(255,255,255,1) 0 10%, rgba(255,255,255,0) 18%),
    radial-gradient(circle at 70% 75%, rgba(255,255,255,.45) 0 6%, rgba(255,255,255,0) 14%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.18) 0 30%, rgba(0,0,0,0) 31%),
    radial-gradient(circle at 50% 55%, rgba(0,0,0,0) 45%, rgba(0,0,0,.45) 100%), var(--c); }
.sh3 .m:not(.q) { box-shadow: 0 0 0 2px #E9B949, 0 0 0 3px rgba(80, 50, 0, .5), 0 2px 3px rgba(0, 0, 0, .4); }

.sparkle {
  position: fixed; width: 8px; height: 8px; z-index: 26; pointer-events: none; margin: -4px 0 0 -4px;
  background: var(--gold); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
  animation: spark .6s ease-out forwards;
}
@keyframes spark { from { transform: translate(0, 0) scale(.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; } }

.actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.btn {
  border: 1px solid var(--board-edge); background: var(--board); color: var(--ink);
  border-radius: 10px; padding: 8px 6px; min-height: 48px; font-family: var(--body); font-weight: 800; font-size: 14px;
  cursor: pointer; line-height: 1.2; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn small { display: block; font-weight: 600; color: var(--muted); font-size: 11px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.main {
  background: var(--tile); color: var(--tile-ink); border: 0; box-shadow: inset 0 -4px 0 var(--tile-shade);
  font-family: var(--display); font-size: 19px; padding: 10px 18px;
}
.btn.pulse { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.05); } }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.btn .lbl { display: flex; flex-direction: column; align-items: flex-start; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

.confetti {
  position: fixed; top: -14px; width: 9px; height: 13px; border-radius: 2px; z-index: 30; pointer-events: none;
  animation: fall 1.5s ease-in forwards;
}
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .7; } }

.overlay {
  position: fixed; inset: 0; background: rgba(5, 20, 20, .86);
  display: grid; place-items: center; padding: 16px; z-index: 10; overflow-y: auto;
}
.panel {
  width: 100%; max-width: 380px; background: var(--board); border: 1px solid var(--board-edge);
  border-radius: 16px; padding: 20px 18px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center;
}
.panel h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.1; color: var(--tile); }
.panel p { margin: 0; color: var(--muted); line-height: 1.45; }
.panel b { color: var(--ink); }
.panel .row2 { display: flex; gap: 8px; width: 100%; }
.panel .row2 .btn { flex: 1; }
.panel .wide { width: 100%; }
.panel .left { text-align: left; }
.panel ul { margin: 0; padding-left: 20px; text-align: left; color: var(--muted); line-height: 1.5; }
.stars { display: flex; gap: 6px; font-size: 42px; line-height: 1; }
.stars i { font-style: normal; color: rgba(255, 255, 255, .18); }
.stars i.on { color: var(--tile); text-shadow: 0 2px 0 var(--tile-shade); animation: starIn .45s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: calc(var(--d) * 280ms + 150ms); }
@keyframes starIn { from { transform: scale(0) rotate(-40deg); opacity: 0; } }
.stat { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--ink); }
.versus { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; width: 100%; }
.versus .side { background: var(--ground); border: 1px solid var(--board-edge); border-radius: 12px; padding: 10px 6px; min-width: 0; }
.versus .side.win { border-color: var(--good); box-shadow: 0 0 0 1px var(--good); }
.versus .who { font-weight: 800; overflow-wrap: anywhere; }
.versus .score { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.1; }
.versus .side.win .score { color: var(--good); }
.versus .time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.versus .vs { font-family: var(--display); font-weight: 800; color: var(--tile); }
.field {
  width: 100%; padding: 10px 12px; border-radius: 10px; text-align: center;
  border: 1px solid var(--board-edge); background: var(--ground); color: var(--ink);
  font-family: var(--body); font-weight: 800; font-size: 18px;
}
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; }
.lv {
  min-height: 48px; border-radius: 10px; border: 1px solid var(--board-edge); background: var(--ground); color: var(--ink);
  font-family: var(--display); font-weight: 800; font-size: 16px; cursor: pointer; line-height: 1; padding: 4px 0;
}
.lv small { display: block; font-family: var(--body); font-size: 9px; color: var(--tile); letter-spacing: -1px; margin-top: 3px; }
.lv.cur { border-color: var(--tile); box-shadow: inset 0 0 0 1px var(--tile); }
.pager { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 8px; }
.pager .btn { min-width: 64px; }
.opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; }
.opt {
  border: 1px solid var(--board-edge); background: var(--ground); color: var(--ink); border-radius: 10px; padding: 8px 2px 6px;
  font-family: var(--body); font-weight: 800; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 76px;
}
.opt.on { border-color: var(--tile); box-shadow: inset 0 0 0 2px var(--tile); }
.opt:disabled { opacity: .5; cursor: default; }
.opt .tube { padding: 8px 0 0; pointer-events: none; }
.opt .glass { --tw: 20px; --th: 34px; }
.opt .m { --ms: 22px; position: relative; left: 0; margin: 4px 0 0; }
.toggle { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 8px; color: var(--ink); font-weight: 800; }

.toast {
  position: fixed; left: 50%; top: calc(60px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--ground); font-weight: 800; font-size: 13px;
  padding: 8px 14px; border-radius: 999px; z-index: 40; max-width: calc(100% - 32px); text-align: center;
}

@media (prefers-reduced-motion: reduce) {
  body::before, .m.up, .tube.guide .glass, .board.win .tube, .btn.pulse, .pill.bump, .tube.shake, .stars i.on, .m.flip, .m.land { animation: none; }
  .m.up { transform: translateY(-14px); }
  .confetti, .sparkle { display: none; }
  .m, .glass { transition: none; }
}
</style>

<symbol id="s0" viewBox="0 0 20 20"><circle cx="10" cy="10" r="4.2" stroke="none"/></symbol>

<script>
// ==CORE-START==
// Aturan permainan murni (tanpa DOM), supaya bisa diuji di node.
// Tabung disimpan sebagai string dari bawah ke atas; tiap huruf 'a'..'l' = satu warna.
const GameCore = (() => {
  const CAP = 4;
  const MAX_K = 12;
  const NODE_LIMIT = 60000;

  function hash32(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return h >>> 0;
  }
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function shuffle(list, rand) {
    for (let k = list.length - 1; k > 0; k--) {
      const j = Math.floor(rand() * (k + 1));
      [list[k], list[j]] = [list[j], list[k]];
    }
    return list;
  }

  // Parameter level ke-n: jumlah warna, tabung kosong, jenis level.
  function levelParams(n) {
    let k;
    if (n <= 3) k = 3;
    else if (n <= 10) k = 4;
    else if (n <= 25) k = 5;
    else if (n <= 50) k = 6;
    else if (n <= 100) k = 7;
    else if (n <= 200) k = 8;
    else k = Math.min(MAX_K, 9 + Math.floor((n - 201) / 150));
    let e = 2;
    const tantangan = n >= 30 && n % 7 === 0;
    // Dengan satu tabung kosong, papan acak di atas 7 warna hampir selalu buntu, jadi dibatasi 7.
    if (tantangan) { e = 1; k = Math.min(k - 1, 7); }
    const misteri = n >= 20 && n % 10 === 0;
    return { k, e, tantangan, misteri };
  }
  function levelSeed(n) { return hash32("pk" + n); }

  const top = (t) => t[t.length - 1];
  function runLen(t) {
    let r = 0;
    const c = top(t);
    for (let i = t.length - 1; i >= 0 && t[i] === c; i--) r++;
    return r;
  }
  function isUniform(t) {
    for (let i = 1; i < t.length; i++) if (t[i] !== t[0]) return false;
    return true;
  }
  function isComplete(t, cap) { return t.length === cap && isUniform(t); }

  // Berapa kelereng yang pindah bila tabung a dituang ke b (0 = tidak sah).
  function moveCount(tubes, a, b, cap) {
    cap = cap || CAP;
    if (a === b) return 0;
    const A = tubes[a], B = tubes[b];
    if (!A || !A.length || B === undefined || B.length >= cap) return 0;
    if (B.length && top(B) !== top(A)) return 0;
    return Math.min(runLen(A), cap - B.length);
  }
  function applyMove(tubes, a, b, cap) {
    const n = moveCount(tubes, a, b, cap);
    if (!n) return null;
    const next = tubes.slice();
    next[b] = tubes[b] + tubes[a].slice(-n);
    next[a] = tubes[a].slice(0, -n);
    return next;
  }
  function isWin(tubes, cap) {
    cap = cap || CAP;
    return tubes.every((t) => t.length === 0 || isComplete(t, cap));
  }
  function canon(tubes) { return tubes.slice().sort().join(","); }

  // Buntu: tidak ada langkah sah yang mengubah keadaan (memindah tabung sewarna utuh ke tabung kosong tidak dihitung).
  function isStuck(tubes, cap) {
    cap = cap || CAP;
    if (isWin(tubes, cap)) return false;
    const key = canon(tubes);
    for (let a = 0; a < tubes.length; a++) {
      for (let b = 0; b < tubes.length; b++) {
        const next = applyMove(tubes, a, b, cap);
        if (next && canon(next) !== key) return false;
      }
    }
    return true;
  }

  // Jalan buntu: tak ada lagi keadaan menang yang terjangkau, walau langkah bolak-balik masih ada.
  // Pemecah cepat dicoba dulu; bila gagal, semua keadaan terjangkau ditelusuri sampai batas.
  // Lewat batas dianggap masih hidup (komponen buntu selalu kecil).
  function isDead(tubes, cap, limit) {
    cap = cap || CAP;
    limit = limit || 12000;
    if (isWin(tubes, cap)) return false;
    if (isStuck(tubes, cap)) return true;
    if (solve(tubes, cap, 3000)) return false;
    const seen = new Set([canon(tubes)]);
    const stack = [tubes];
    while (stack.length) {
      const s = stack.pop();
      for (let a = 0; a < s.length; a++) {
        for (let b = 0; b < s.length; b++) {
          const next = applyMove(s, a, b, cap);
          if (!next) continue;
          if (isWin(next, cap)) return false;
          const key = canon(next);
          if (seen.has(key)) continue;
          if (seen.size >= limit) return false;
          seen.add(key);
          stack.push(next);
        }
      }
    }
    return true;
  }

  // Batas bawah langkah yang sah: tiap langkah hanya menyatukan satu deretan satu warna,
  // jadi warna yang terpecah dalam s deretan butuh paling sedikit s-1 langkah (minimal 1).
  function minMoves(tubes, cap) {
    cap = cap || CAP;
    const seg = {};
    for (const t of tubes) {
      for (let i = 0; i < t.length; i++) if (i === 0 || t[i] !== t[i - 1]) seg[t[i]] = (seg[t[i]] || 0) + 1;
    }
    let sum = 0;
    for (const c in seg) {
      const complete = tubes.some((t) => t[0] === c && isComplete(t, cap));
      if (!complete) sum += Math.max(1, seg[c] - 1);
    }
    return sum;
  }

  // Langkah berurutan menurut prioritas: menyelesaikan tabung, ke warna sama, ke tabung kosong.
  function orderedMoves(tubes, cap) {
    const list = [];
    let firstEmpty = -1;
    for (let b = 0; b < tubes.length; b++) if (!tubes[b].length) { firstEmpty = b; break; }
    for (let a = 0; a < tubes.length; a++) {
      const A = tubes[a];
      if (!A.length || isComplete(A, cap)) continue;
      const r = runLen(A);
      const c = top(A);
      for (let b = 0; b < tubes.length; b++) {
        if (b === a) continue;
        const B = tubes[b];
        if (!B.length) {
          if (b !== firstEmpty || r === A.length) continue;
          list.push([a, b, 3 + (r === 1 ? 0.5 : 0)]);
        } else if (B.length < cap && top(B) === c) {
          const moved = Math.min(r, cap - B.length);
          const done = B.length + moved === cap && isUniform(B);
          // Mengosongkan sumber atau menuang utuh sedikit lebih disukai.
          list.push([a, b, done ? 1 : 2 - (moved === A.length ? 0.4 : 0) - (moved === r ? 0.2 : 0)]);
        }
      }
    }
    list.sort((x, y) => x[2] - y[2]);
    return list;
  }

  // DFS iteratif dengan batas simpul. Mengembalikan jalur langkah [a,b] atau null.
  function solve(start, cap, limit) {
    cap = cap || CAP;
    limit = limit || NODE_LIMIT;
    if (isWin(start, cap)) return [];
    const seen = new Set([canon(start)]);
    const stack = [{ t: start, m: orderedMoves(start, cap), i: 0 }];
    const path = [];
    let nodes = 0;
    while (stack.length) {
      const f = stack[stack.length - 1];
      if (f.i >= f.m.length) { stack.pop(); path.pop(); continue; }
      const mv = f.m[f.i++];
      const next = applyMove(f.t, mv[0], mv[1], cap);
      const key = canon(next);
      if (seen.has(key)) continue;
      seen.add(key);
      path.push([mv[0], mv[1]]);
      if (isWin(next, cap)) return path;
      if (++nodes > limit) return null;
      stack.push({ t: next, m: orderedMoves(next, cap), i: 0 });
    }
    return null;
  }

  // Memendekkan jalur: dari tiap keadaan, lompat ke keadaan terjauh di jalur yang terjangkau satu langkah.
  function shortLength(start, path, cap) {
    const states = [start];
    let s = start;
    for (const [a, b] of path) { s = applyMove(s, a, b, cap); states.push(s); }
    const index = new Map();
    states.forEach((st, i) => index.set(canon(st), i));
    let i = 0, len = 0;
    while (i < states.length - 1) {
      let best = i + 1;
      const cur = states[i];
      for (let a = 0; a < cur.length; a++) {
        for (let b = 0; b < cur.length; b++) {
          const next = applyMove(cur, a, b, cap);
          if (!next) continue;
          const j = index.get(canon(next));
          if (j !== undefined && j > best) best = j;
        }
      }
      i = best;
      len++;
    }
    return len;
  }

  function scramble(seed, k, e, cap) {
    const marbles = [];
    for (let c = 0; c < k; c++) for (let i = 0; i < cap; i++) marbles.push(String.fromCharCode(97 + c));
    shuffle(marbles, rng(seed));
    const tubes = [];
    for (let t = 0; t < k; t++) tubes.push(marbles.slice(t * cap, t * cap + cap).join(""));
    for (let t = 0; t < e; t++) tubes.push("");
    return tubes;
  }
  function badStart(tubes, cap) {
    return tubes.some((t) => t.length && (isComplete(t, cap) || runLen(t) >= 3));
  }

  // Pembuat level deterministik: seed yang sama selalu menghasilkan level yang sama di semua perangkat.
  function generate(seed, k, e, cap) {
    cap = cap || CAP;
    seed = seed >>> 0;
    let fallback = null;
    // Papan satu tabung kosong lebih sering buntu, tetapi gagalnya cepat, jadi dicoba lebih banyak.
    const tries = e === 1 ? 300 : 50;
    for (let attempt = 0; attempt < tries; attempt++) {
      const s = (seed + attempt) >>> 0;
      const tubes = scramble(s, k, e, cap);
      if (badStart(tubes, cap)) continue;
      const path = solve(tubes, cap);
      if (!path) continue;
      const par = shortLength(tubes, path, cap);
      const level = { seed: s, k, e, tubes, par, first: path[0] };
      if (par >= 2 * k) return level;
      if (!fallback) fallback = level;
    }
    if (fallback) return fallback;
    // Sangat jarang: tidak ada yang terpecahkan, longgarkan dengan satu tabung kosong lagi.
    return generate(seed, k, e + 1, cap);
  }

  // Level persis dari seed (untuk link duel): tanpa mencoba seed lain.
  function fromSeed(seed, k, e, cap) {
    cap = cap || CAP;
    const tubes = scramble(seed >>> 0, k, e, cap);
    const path = badStart(tubes, cap) ? null : solve(tubes, cap);
    if (!path) return Object.assign(generate(seed, k, e, cap), { exact: false });
    return { seed: seed >>> 0, k, e, tubes, par: shortLength(tubes, path, cap), first: path[0], exact: true };
  }

  function levelFor(n) {
    const p = levelParams(n);
    return Object.assign(generate(levelSeed(n), p.k, p.e), { n, misteri: p.misteri, tantangan: p.tantangan });
  }

  // Bintang dari langkah bersih m terhadap par p.
  function stars(m, p) {
    if (m <= p) return 3;
    if (m <= Math.ceil(p * 1.35)) return 2;
    return 1;
  }

  return {
    CAP, hash32, rng, shuffle, levelParams, levelSeed, runLen, isUniform, isComplete,
    moveCount, applyMove, isWin, isStuck, isDead, minMoves, canon, solve, shortLength, scramble, badStart,
    generate, fromSeed, levelFor, stars
  };
})();
// ==CORE-END==
// ==APP-START==
const G = GameCore;
const CAP = G.CAP;
const SITE = "https://dehayuk.netlify.app/pilah-kelereng/";
const STORE_KEY = "pilah-kelereng.v1";
const DAILY_LAUNCH = "2026-09-26"; // Harian #1 (hari rilis)
const COLOR_NAMES = ["merah", "biru", "kuning", "hijau", "ungu", "oranye", "toska", "pink", "coklat", "abu", "putih", "hitam"];
const THEMES = ["Bambu", "Kaca", "Kendi", "Kayu"];
const SHINES = [["Klasik", 0], ["Mutiara", 100], ["Kaca", 300], ["Emas", 600]];
const FLY_MS = 180;
const STAGGER_MS = 40;

// ---------- Simpanan ----------
function freshState() {
  return {
    level: 1, stars: "", totalStars: 0, emas: 3, wins: 0,
    daily: null, streak: 0, bestStreak: 0, lastDailyDate: null,
    settings: { mute: false, vibrate: true }, theme: 0, shine: 0,
    name: "", duelWins: 0, duelLosses: 0, duelDraws: 0, pendingDuel: null,
    tutDone: false, play: {}
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return freshState();
    const s = Object.assign(freshState(), JSON.parse(raw));
    s.settings = Object.assign({ mute: false, vibrate: true }, s.settings);
    if (!s.play || typeof s.play !== "object") s.play = {};
    // Simpanan lama: soal buatan sendiri pernah menumpang di slot duel.
    if (s.play.duel && s.play.duel.mode === "make") { if (!s.play.make) s.play.make = s.play.duel; delete s.play.duel; }
    if (!Number.isInteger(s.level) || s.level < 1) s.level = 1;
    return s;
  } catch (e) { return freshState(); }
}
const state = loadState();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

const $ = (id) => document.getElementById(id);
const reduced = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

// ---------- Suara dan getar ----------
let audioCtx = null;
function beep(freq, dur, type, vol, delay) {
  if (state.settings.mute) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol || 0.05, t + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  lift() { beep(880, 0.05, "sine", 0.03); },
  // Bunyi kelereng kaca beradu: dua nada tinggi yang cepat hilang, makin tinggi tiap butir.
  klik(i) { const f = 1 + 0.05 * (i || 0); beep(1800 * f, 0.03, "sine", 0.06); beep(2700 * f, 0.03, "sine", 0.03); },
  bad() { beep(170, 0.16, "sine", 0.07); },
  ting() { beep(2400, 0.12, "sine", 0.04); beep(3600, 0.08, "sine", 0.02, 0.03); },
  chime() { [784, 988, 1319].forEach((f, i) => beep(f, 0.18, "triangle", 0.05, i * 0.08)); },
  star(i) { beep([1047, 1319, 1568][i] || 1568, 0.25, "triangle", 0.06); },
  win() { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.2, "triangle", 0.05, i * 0.08)); }
};
function buzz(pattern) {
  try { if (state.settings.vibrate && navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}
function confetti() {
  if (reduced()) return;
  const colors = ["#F4C152", "#7FE0A3", "#FF7A70", "#EAF6F3", "#6EC1FF", "#C9A8FF"];
  for (let i = 0; i < 28; i++) {
    const c = document.createElement("i");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = Math.random() * 0.4 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2200);
  }
}
function sparkles(el) {
  if (reduced() || !el) return;
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 6; i++) {
    const s = document.createElement("i");
    s.className = "sparkle";
    const ang = (i / 6) * Math.PI * 2 + 0.3;
    s.style.left = r.left + r.width / 2 + "px";
    s.style.top = r.top + 14 + "px";
    s.style.setProperty("--dx", Math.cos(ang) * 30 + "px");
    s.style.setProperty("--dy", Math.sin(ang) * 26 - 8 + "px");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 700);
  }
}
function renderSound() {
  document.querySelectorAll(".snd").forEach((b) => {
    b.textContent = state.settings.mute ? "🔇" : "🔊";
    b.setAttribute("aria-label", state.settings.mute ? "Nyalakan suara" : "Matikan suara");
  });
}

// ---------- Tanggal, format, link ----------
function dateKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function today() { return dateKey(new Date()); }
function prevDay(key) { const [y, m, d] = key.split("-").map(Number); return dateKey(new Date(y, m - 1, d - 1)); }
function streakNow() {
  return state.lastDailyDate === today() || state.lastDailyDate === prevDay(today()) ? state.streak : 0;
}
function dailySeed(key) { return (G.hash32(key) ^ 0x4B4C) >>> 0; }
// Nomor harian dari tanggal kalender (UTC, bebas geseran jam), jadi tiap hari punya nomor sendiri.
function dailyNumber(key) {
  const day = (k) => { const [y, m, d] = k.split("-").map(Number); return Date.UTC(y, m - 1, d) / 86400000; };
  return Math.max(1, day(key) - day(DAILY_LAUNCH) + 1);
}
function isSunday(key) { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d).getDay() === 0; }
function fmtClock(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
function untilMidnight() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const s = Math.max(0, Math.floor((next - now) / 1000));
  return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map((n) => String(n).padStart(2, "0")).join(":");
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
}
function cleanName(s) { return String(s || "").replace(/[^\p{L}\p{N} ._-]/gu, "").trim().slice(0, 12); }
function starText(n) { return "⭐".repeat(n) + "☆".repeat(3 - n); }

function encodeDuel(d) {
  const json = JSON.stringify({ v: 1, s: d.s, k: d.k, e: d.e, x: d.x ? 1 : 0, n: d.n, m: d.m, t: d.t });
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeDuel(code) {
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(String(code).replace(/-/g, "+").replace(/_/g, "/")))));
    if (!o || o.v !== 1) return null;
    const ok = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
    if (!ok(o.s, 0, 4294967295) || !ok(o.k, 3, 12) || !ok(o.e, 1, 3) || !ok(o.m, 1, 9999) || !ok(o.t, 0, 359999)) return null;
    const n = cleanName(o.n);
    if (!n) return null;
    return { s: o.s, k: o.k, e: o.e, x: o.x === 1, n, m: o.m, t: o.t };
  } catch (e) { return null; }
}
function duelLink(d) { return SITE + "#d=" + encodeDuel(d); }
// Menang = langkah bersih lebih sedikit; bila sama, waktu lebih cepat; bila sama lagi, seri.
function compareDuel(a, b) {
  if (a.m !== b.m) return a.m < b.m ? 1 : -1;
  if (a.t !== b.t) return a.t < b.t ? 1 : -1;
  return 0;
}

// ---------- Level ----------
const levelCache = new Map();
function levelDef(n) {
  if (!levelCache.has(n)) {
    if (levelCache.size > 6) levelCache.delete(levelCache.keys().next().value);
    levelCache.set(n, G.levelFor(n));
  }
  return levelCache.get(n);
}
function starsOf(n) { return +(state.stars[n - 1] || 0); }
function setStars(n, s) {
  let str = state.stars;
  while (str.length < n) str += "0";
  str = str.slice(0, n - 1) + s + str.slice(n);
  state.stars = str;
  let total = 0;
  for (const ch of str) total += +ch;
  state.totalStars = total;
}
function themesOpen() { return Math.min(THEMES.length, 1 + Math.floor((state.level - 1) / 25)); }
function shinesOpen() { return SHINES.filter((s) => state.totalStars >= s[1]).length; }

// ---------- Permainan ----------
// play = satu permainan yang sedang berjalan (Petualangan, Harian, duel, atau membuat tantangan).
let play = null;
let tick = null;
let geo = { tw: 40, ms: 32, th: 140 };

function startPlay(kind, def, extra) {
  stopClock();
  const tubes = def.tubes.slice();
  let id = 0;
  const ids = tubes.map((t) => Array.from(t, () => id++));
  play = Object.assign({
    kind, def, tubes, ids, hist: [], path: [], revealed: new Set(), plus: false,
    undos: 0, timeMs: 0, since: 0, sel: -1, busy: false, queue: [], over: false, tut: 0
  }, extra || {});
  revealTops();
  const saved = extra && extra.resume;
  if (saved) restoreProgress(saved);
  showGameScreen();
  if (kind === "adv" && def.n === 1 && !state.tutDone && play.path.length === 0) play.tut = 1;
  renderAll();
  startClock();
  // Papan simpanan yang sudah buntu langsung diberi tahu.
  if (saved && !G.isWin(play.tubes, CAP) && G.isDead(play.tubes, CAP)) showStuck();
}
function revealTops() {
  play.ids.forEach((list) => { if (list.length) play.revealed.add(list[list.length - 1]); });
}
function addPlusTube() {
  play.tubes.push("");
  play.ids.push([]);
  play.hist.forEach((h) => { h.tubes.push(""); h.ids.push([]); });
  play.plus = true;
}
// Melanjutkan permainan yang terputus: langkah diputar ulang dari awal.
function restoreProgress(saved) {
  if (saved.plus) addPlusTube();
  for (const mv of saved.path || []) {
    if (!Array.isArray(mv) || !G.moveCount(play.tubes, mv[0], mv[1], CAP)) break;
    doMove(mv[0], mv[1]);
  }
  (saved.rev || []).forEach((x) => play.revealed.add(x));
  play.undos = saved.undos || 0;
  play.timeMs = saved.timeMs || 0;
}
function doMove(a, b) {
  const n = G.moveCount(play.tubes, a, b, CAP);
  if (!n) return 0;
  play.hist.push({ tubes: play.tubes.slice(), ids: play.ids.map((l) => l.slice()) });
  play.tubes = G.applyMove(play.tubes, a, b, CAP);
  const moved = play.ids[a].slice(-n);
  play.ids[a] = play.ids[a].slice(0, -n);
  play.ids[b] = play.ids[b].concat(moved);
  moved.forEach((x) => play.revealed.add(x));
  // Kelereng yang kini teratas di tabung asal terbuka untuk selamanya (mode Misteri).
  if (play.ids[a].length) play.revealed.add(play.ids[a][play.ids[a].length - 1]);
  play.path.push([a, b]);
  return n;
}
function progressKey() {
  const d = play.def;
  if (play.kind === "adv") return { n: d.n };
  if (play.kind === "daily") return { date: play.date };
  return { mode: play.kind, s: d.seed, k: d.k, e: d.e, x: d.misteri ? 1 : 0, opp: play.opp || null };
}
function saveProgress() {
  if (!play) return;
  // Tiap mode punya slot sendiri, jadi duel dan soal buatan sendiri tidak saling menghapus.
  const slot = play.kind;
  if (play.over) { delete state.play[slot]; save(); return; }
  state.play[slot] = Object.assign(progressKey(), {
    path: play.path, plus: play.plus, undos: play.undos, timeMs: clockMs(),
    rev: [...play.revealed].slice(0, 200)
  });
  save();
}

// Jam: berjalan hanya selama layar permainan terbuka dan halaman terlihat.
function clockMs() { return play ? play.timeMs + (play.since ? Date.now() - play.since : 0) : 0; }
function startClock() {
  if (!play || play.over || play.since || document.hidden) return;
  play.since = Date.now();
  if (play.kind !== "adv" && !tick) tick = setInterval(renderClock, 1000);
}
function stopClock() {
  if (play && play.since) { play.timeMs += Date.now() - play.since; play.since = 0; }
  clearInterval(tick);
  tick = null;
}
document.addEventListener("visibilitychange", () => {
  if (!play || $("game").hidden) return;
  if (document.hidden) { stopClock(); saveProgress(); } else startClock();
});
window.addEventListener("pagehide", () => { if (play && !$("game").hidden) { stopClock(); saveProgress(); } });

// ---------- Tampilan papan ----------
function marbleHtml(c, hidden, bottom, cls) {
  const style = bottom === null ? "" : " style=\"bottom:" + bottom + "px\"";
  if (hidden) return "<i class=\"m q" + (cls || "") + "\"" + style + ">?</i>";
  return "<i class=\"m c" + c + (cls || "") + "\"" + style + "><svg aria-hidden=\"true\"><use href=\"#s" + c + "\"/></svg></i>";
}
function tubeLabel(i) {
  const t = play.tubes[i];
  if (!t.length) return "Tabung " + (i + 1) + ": kosong";
  const parts = Array.from(t, (ch, k) => isHidden(i, k) ? "tersembunyi" : COLOR_NAMES[ch.charCodeAt(0) - 97]);
  return "Tabung " + (i + 1) + ", bawah ke atas: " + parts.join(", ");
}
function isHidden(i, k) { return !!(play.def.misteri && !play.revealed.has(play.ids[i][k])); }

function layout() {
  const board = $("board");
  const T = play.tubes.length;
  const W = board.clientWidth || 352;
  const H = board.clientHeight || 400;
  // Tiap tabung (seluruh kolomnya) jadi sasaran ketuk minimal 44px; bila tak muat, tambah baris.
  const maxPer = Math.max(1, Math.floor(W / 44));
  let perRow = T <= 7 ? T : Math.ceil(T / 2);
  if (perRow > maxPer) perRow = Math.ceil(T / Math.ceil(T / maxPer));
  const rows = Math.ceil(T / perRow);
  const hw = Math.max(44, Math.floor(W / perRow));
  let tw = Math.min(56, hw - 8);
  let ms = tw - 8;
  // Batas tinggi: tiap baris butuh tabung + ruang angkat + jarak.
  const maxMs = Math.floor(((H - (rows - 1) * 22) / rows - 24 - 16) / CAP);
  if (ms > maxMs) { ms = Math.max(18, maxMs); tw = ms + 8; }
  geo = { tw, ms, th: ms * CAP + 12, perRow };
  board.style.setProperty("--hw", hw + "px");
  board.style.setProperty("--tw", tw + "px");
  board.style.setProperty("--ms", ms + "px");
  board.style.setProperty("--th", geo.th + "px");
}
function renderBoard(landing) {
  const board = $("board");
  // Fokus papan ketik/pembaca layar tetap di tabung yang sama setelah papan digambar ulang.
  const ae = document.activeElement;
  const focusI = ae && ae !== board && board.contains(ae) ? ae.dataset.i : null;
  layout();
  let html = "";
  for (let i = 0; i < play.tubes.length; i++) {
    if (i % geo.perRow === 0) html += (i ? "</div>" : "") + "<div class=\"row\">";
    const t = play.tubes[i];
    let inner = "";
    for (let k = 0; k < t.length; k++) {
      inner += marbleHtml(t.charCodeAt(k) - 97, isHidden(i, k), 4 + k * geo.ms, "");
    }
    const done = G.isComplete(t, CAP);
    const plus = play.plus && i === play.tubes.length - 1;
    html += "<div class=\"tube" + (done ? " done" : "") + (plus ? " plus" : "") + "\" role=\"button\" tabindex=\"0\" data-i=\"" + i + "\" style=\"--i:" + i + "\" aria-label=\"" +
      esc(tubeLabel(i)) + "\"><div class=\"glass\">" + inner + "</div><b class=\"cap\"></b></div>";
  }
  html += "</div>";
  board.innerHTML = html;
  board.className = board.className.replace(/\b(th|sh)\d\b/g, "").trim() + " th" + state.theme + " sh" + state.shine;
  if (!play.over) board.classList.remove("win");
  if (play.sel >= 0) applySelection();
  if (focusI != null) focusEl(tubeEl(focusI));
  if (landing) landing();
}
function focusEl(el) { if (el) { try { el.focus({ preventScroll: true }); } catch (e) {} } }
function tubeEl(i) { return $("board").querySelector(".tube[data-i=\"" + i + "\"]"); }
function marbleEls(i) { const t = tubeEl(i); return t ? Array.from(t.querySelectorAll(".m")) : []; }

function renderHud() {
  const d = play.def;
  let chip = "Level " + d.n, tag = "";
  if (play.kind === "daily") chip = "Harian #" + dailyNumber(play.date) + (state.daily && state.daily.done && state.daily.date === play.date ? " · Latihan" : "");
  else if (play.kind === "duel") chip = "Duel vs " + play.opp.n;
  else if (play.kind === "make") chip = "Tantang Teman";
  if (d.tantangan) tag = "TANTANGAN";
  if (d.misteri) tag = (tag ? tag + " · " : "") + "MISTERI";
  $("gChip").textContent = chip;
  play.tagBase = tag;
  $("gTag").className = "tag" + (d.tantangan ? " hot" : d.misteri ? " mys" : "");
  $("gMoves").textContent = "Langkah " + play.path.length;
  renderClock();
  const plusAllowed = play.kind === "adv";
  $("btnPlus").hidden = !plusAllowed;
  $("btnPlus").disabled = play.plus || state.emas < 1 || play.over;
  $("plusNote").textContent = play.plus ? "sudah dipakai" : state.emas + " emas";
  $("btnUndo").disabled = !play.path.length || play.over;
  $("btnReset").disabled = !play.path.length || play.over;
  $("btnPlus").parentElement.style.gridTemplateColumns = plusAllowed ? "" : "1fr 1fr";
}
// Mode berwaktu (Harian dan duel) menampilkan jam di bawah judul.
function renderClock() {
  if (!play) return;
  $("gTarget").innerHTML = "Target <b>★★★</b> ≤ " + play.def.par;
  const clock = play.kind === "adv" ? "" : "⏱ " + fmtClock(clockMs() / 1000);
  $("gTag").textContent = [clock, play.tagBase].filter(Boolean).join(" · ");
}
function renderInfo() {
  const info = $("gInfo");
  info.className = "info";
  document.querySelectorAll(".tube.guide").forEach((el) => el.classList.remove("guide"));
  if (play.tut === 1 || play.tut === 2) {
    const first = play.def.first;
    info.classList.add("guide");
    if (play.sel < 0) {
      info.textContent = "Ketuk tabung yang bersinar untuk mengangkat kelereng";
      const el = tubeEl(first[0]);
      if (el && play.path.length === 0) el.classList.add("guide");
    } else {
      info.textContent = "Lalu ketuk tabung tujuan: yang kosong atau yang warnanya sama";
      const el = tubeEl(first[1]);
      if (el && play.path.length === 0 && play.sel === first[0]) el.classList.add("guide");
    }
    return;
  }
  if (play.tut === 3) { info.textContent = "Bagus! Kumpulkan tiap warna dalam satu tabung."; return; }
  if (play.kind === "duel") info.textContent = play.opp.n + ": " + play.opp.m + " langkah (" + fmtClock(play.opp.t) + "). Kalahkan!";
  else if (play.kind === "make") info.textContent = "Selesaikan dulu, lalu kirim tantangannya ke teman";
  else if (play.kind === "daily") info.textContent = "Tanpa +1 Tabung. Hemat langkah, lalu bagikan hasilmu.";
  else if (play.def.tantangan) info.textContent = "Hanya 1 tabung kosong. Pikirkan dulu sebelum menuang!";
  else if (play.def.misteri) info.textContent = "Kelereng bawah tersembunyi sampai muncul di atas";
  else info.textContent = "";
}
function renderAll() { renderBoard(); renderHud(); renderInfo(); }

// ---------- Memilih dan memindah ----------
function selectableRun(i) {
  // Jumlah kelereng teratas yang terangkat: satu deretan warna, hanya yang sudah terlihat.
  const t = play.tubes[i];
  const r = G.runLen(t);
  let shown = 0;
  for (let k = t.length - 1; k >= t.length - r; k--) { if (isHidden(i, k)) break; shown++; }
  return Math.max(1, shown);
}
function applySelection() {
  document.querySelectorAll(".tube.sel").forEach((el) => el.classList.remove("sel"));
  document.querySelectorAll(".m.up").forEach((el) => el.classList.remove("up"));
  if (play.sel < 0) return;
  const el = tubeEl(play.sel);
  if (!el) return;
  el.classList.add("sel");
  const ms = marbleEls(play.sel);
  const n = selectableRun(play.sel);
  ms.slice(-n).forEach((m) => m.classList.add("up"));
}
function tapTube(i) {
  if (!play || play.over) return;
  if (play.busy) {
    if (play.queue.length < 2) play.queue.push(i);
    return;
  }
  if (play.sel < 0) {
    if (!play.tubes[i].length || G.isComplete(play.tubes[i], CAP)) {
      if (play.tubes[i].length) { sfx.lift(); }
      return;
    }
    play.sel = i;
    sfx.lift();
    buzz(8);
    applySelection();
    if (play.tut) renderInfo();
    return;
  }
  const a = play.sel;
  play.sel = -1;
  if (a === i) { applySelection(); if (play.tut) renderInfo(); return; }
  const n = G.moveCount(play.tubes, a, i, CAP);
  if (!n) {
    // Tujuan tidak sah: angkatan turun dan tabung tujuan bergoyang pelan.
    applySelection();
    const el = tubeEl(i);
    if (el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
    sfx.bad();
    buzz(30);
    if (play.tut) renderInfo();
    return;
  }
  animateMove(a, i, n);
}

function animateMove(a, b, n) {
  const fromRects = marbleEls(a).slice(-n).map((m) => m.getBoundingClientRect());
  const srcLen = play.tubes[a].length;
  const topBefore = play.ids[a][srcLen - n - 1];
  const wasHidden = srcLen - n - 1 >= 0 && play.def.misteri && !play.revealed.has(topBefore);
  const wasDone = G.isComplete(play.tubes[b], CAP);
  doMove(a, b);
  if (play.tut === 1 || play.tut === 2) play.tut = 3;
  else if (play.tut === 3) play.tut = 4;
  play.busy = true;
  const noAnim = reduced() || !Element.prototype.animate;
  renderBoard();
  renderHud();
  renderInfo();
  const targets = marbleEls(b).slice(-n);
  let finishMs = noAnim ? 140 : FLY_MS + (n - 1) * STAGGER_MS;
  if (noAnim) {
    targets.forEach((m) => m.classList.add("fade"));
    sfx.klik(0);
  } else {
    targets.forEach((m, k) => {
      const from = fromRects[k];
      const to = m.getBoundingClientRect();
      if (!from) return;
      m.style.visibility = "hidden";
      const fly = m.cloneNode(true);
      fly.classList.add("fly");
      fly.classList.remove("up", "land");
      fly.style.width = from.width + "px";
      fly.style.height = from.height + "px";
      fly.style.bottom = "";
      document.body.appendChild(fly);
      const dx = to.left - from.left, dy = to.top - from.top;
      const lift = Math.min(dy, 0) - 34;
      const order = n - 1 - k;
      const anim = fly.animate([
        { transform: "translate(" + from.left + "px," + from.top + "px) scale(1)" },
        { transform: "translate(" + (from.left + dx * 0.5) + "px," + (from.top + lift) + "px) scale(1.12)", offset: 0.45 },
        { transform: "translate(" + to.left + "px," + to.top + "px) scale(1)" }
      ], { duration: FLY_MS, delay: order * STAGGER_MS, easing: "ease-in-out", fill: "both" });
      anim.onfinish = () => {
        fly.remove();
        m.style.visibility = "";
        m.classList.add("land");
        sfx.klik(order);
      };
      anim.oncancel = anim.onfinish;
    });
  }
  if (wasHidden) {
    const els = marbleEls(a);
    const el = els[els.length - 1];
    if (el) { el.classList.add("flip"); setTimeout(sfx.ting, 60); }
  }
  const p = play;
  setTimeout(() => { if (play === p) afterMove(b, wasDone); }, finishMs + 10);
}

function afterMove(b, wasDone) {
  if (!play) return;
  play.busy = false;
  const t = play.tubes[b];
  if (!wasDone && G.isComplete(t, CAP)) {
    const el = tubeEl(b);
    if (el) { el.classList.add("pop"); sparkles(el); }
    sfx.chime();
    buzz([15, 30, 15]);
  }
  if (G.isWin(play.tubes, CAP)) return winLevel();
  saveProgress();
  if (G.isDead(play.tubes, CAP)) { play.queue = []; return showStuck(); }
  const q = play.queue.splice(0);
  q.forEach((i) => tapTube(i));
}

function undo() {
  if (!play || play.busy || play.over || !play.hist.length) return;
  const h = play.hist.pop();
  play.tubes = h.tubes;
  play.ids = h.ids;
  play.path.pop();
  play.undos++;
  play.sel = -1;
  sfx.lift();
  renderAll();
  saveProgress();
  if (G.isDead(play.tubes, CAP)) { const info = $("gInfo"); info.className = "info guide"; info.textContent = "Masih buntu. Urung lagi atau Ulang."; }
}
function resetLevel() {
  if (!play || play.busy || play.over || !play.path.length) return;
  const keepPlus = play.plus;
  play.tubes = play.def.tubes.slice();
  let id = 0;
  play.ids = play.tubes.map((t) => Array.from(t, () => id++));
  if (keepPlus) { play.tubes.push(""); play.ids.push([]); }
  play.hist = [];
  play.path = [];
  play.sel = -1;
  sfx.lift();
  renderAll();
  saveProgress();
}
function usePlus() {
  if (!play || play.busy || play.over || play.kind !== "adv") return;
  if (play.plus) return toast("+1 Tabung hanya sekali per level");
  if (state.emas < 1) return toast("Kelereng Emas habis. Dapatkan dari level bintang ★★★.");
  state.emas--;
  addPlusTube();
  play.sel = -1;
  sfx.chime();
  renderAll();
  saveProgress();
  toast("Tabung kosong ditambahkan (−1 Kelereng Emas)");
}

function showStuck() {
  const canPlus = play.kind === "adv" && !play.plus && state.emas > 0;
  const loop = !G.isStuck(play.tubes, CAP);
  showPanel(
    "<h2>Buntu!</h2><p>Coba Urung atau Ulang.</p>" +
    (loop ? "<p>Langkah yang tersisa hanya bolak-balik dan tak lagi bisa menyelesaikan papan.</p>" : "") +
    "<div class=\"row2\"><button class=\"btn\" id=\"pUndo\" type=\"button\">Urung</button>" +
    "<button class=\"btn main\" id=\"pReset\" type=\"button\">Ulang</button></div>" +
    (canPlus ? "<button class=\"btn wide\" id=\"pPlus\" type=\"button\"><i class=\"emas-dot\"></i>+1 Tabung (1 emas)</button>" : ""),
    () => {
      $("pUndo").onclick = () => { hideOverlay(); undo(); };
      $("pReset").onclick = () => { hideOverlay(); resetLevel(); };
      if (canPlus) $("pPlus").onclick = () => { hideOverlay(); usePlus(); };
    }
  );
}

// ---------- Menang ----------
function winLevel() {
  play.over = true;
  play.sel = -1;
  stopClock();
  const m = play.path.length;
  const par = play.def.par;
  const st = G.stars(m, par);
  const timeSec = Math.round(play.timeMs / 1000);
  const result = { m, par, st, timeSec };
  sfx.win();
  buzz([20, 40, 20]);
  if (!reduced()) $("board").classList.add("win");
  if (play.kind === "adv") winAdventure(result);
  else if (play.kind === "daily") winDaily(result);
  else if (play.kind === "duel") winDuel(result);
  else winMake(result);
  saveProgress();
  if (st === 3) setTimeout(confetti, 500);
  const waitMs = reduced() ? 250 : 650 + play.tubes.length * 60;
  const kind = play.kind;
  setTimeout(() => { if (play && play.over && play.kind === kind && !$("game").hidden) result.show(); }, waitMs);
}
function starsHtml(st) {
  let h = "<div class=\"stars\" aria-label=\"" + st + " dari 3 bintang\">";
  for (let i = 0; i < 3; i++) h += "<i class=\"" + (i < st ? "on" : "") + "\" style=\"--d:" + i + "\">★</i>";
  return h + "</div>";
}
function chimeStars(st) { for (let i = 0; i < st; i++) setTimeout(() => sfx.star(i), (reduced() ? 0 : 150) + i * 280); }

function winAdventure(r) {
  const n = play.def.n;
  const prev = starsOf(n);
  const themesBefore = themesOpen(), shinesBefore = shinesOpen();
  let emasGain = 0;
  if (r.st > prev) {
    setStars(n, r.st);
    if (r.st === 3) { state.emas++; emasGain = 1; }
  }
  state.wins++;
  if (n === 1) state.tutDone = true;
  if (n >= state.level) state.level = n + 1;
  const unlocks = [];
  if (themesOpen() > themesBefore) { state.theme = themesOpen() - 1; unlocks.push("Tema tabung baru: " + THEMES[state.theme] + "!"); }
  if (shinesOpen() > shinesBefore) { state.shine = shinesOpen() - 1; unlocks.push("Kilau kelereng baru: " + SHINES[state.shine][0] + "!"); }
  save();
  // Siapkan level berikutnya di belakang layar, supaya tombol Lanjut langsung jalan.
  setTimeout(() => { try { levelDef(n + 1); } catch (e) {} }, 0);
  const canDuel = !play.plus;
  const def = play.def;
  r.show = () => {
    chimeStars(r.st);
    showPanel(
      "<h2>Level " + n + " selesai!</h2>" + starsHtml(r.st) +
      "<p><span class=\"stat\">" + r.m + " langkah</span> · target ★★★ ≤ " + r.par + "</p>" +
      (r.st < 3 ? "<p>Coba lagi dengan langkah lebih hemat untuk ★★★.</p>" : "") +
      (emasGain ? "<p><b>+1 Kelereng Emas</b> untuk ★★★</p>" : "") +
      unlocks.map((u) => "<p><b>🎉 " + esc(u) + "</b></p>").join("") +
      "<button class=\"btn main wide pulse\" id=\"pNext\" type=\"button\">Lanjut ▶</button>" +
      "<div class=\"row2\"><button class=\"btn\" id=\"pAgain\" type=\"button\">Ulangi</button>" +
      (canDuel ? "<button class=\"btn\" id=\"pDuel\" type=\"button\">Tantang teman</button>" : "") + "</div>",
      () => {
        $("pNext").onclick = () => { hideOverlay(); startAdventure(n + 1); };
        $("pAgain").onclick = () => { hideOverlay(); startAdventure(n); };
        if (canDuel) $("pDuel").onclick = () => withName(() => shareChallenge(def, r), r.show);
      },
      true
    );
  };
}

function winDaily(r) {
  const d = state.daily && state.daily.date === play.date ? state.daily : null;
  const first = !(d && d.done);
  if (first) {
    state.daily = { date: play.date, done: true, moves: r.m, timeSec: r.timeSec, undos: play.undos, par: r.par, stars: r.st };
    if (state.lastDailyDate !== play.date) {
      state.streak = state.lastDailyDate === prevDay(play.date) ? state.streak + 1 : 1;
      state.lastDailyDate = play.date;
    }
    state.bestStreak = Math.max(state.bestStreak || 0, state.streak);
    save();
  }
  r.show = () => showDailyResult(first ? null : r);
}
function dailyShareText() {
  const d = state.daily;
  return "Pilah Kelereng Harian #" + dailyNumber(d.date) + "\n🔮 " + starText(d.stars) +
    "\n👣 " + d.moves + " langkah (target " + d.par + ")\n⏱ " + fmtClock(d.timeSec) + " · ↩ " + d.undos + " urung" +
    "\n🔥 " + state.streak + " hari beruntun\n" + SITE;
}
// Hasil harian: catatan pertama yang dibagikan; hasil latihan hanya ditampilkan.
function showDailyResult(practice) {
  const d = state.daily;
  const isToday = d.date === today();
  chimeStars(practice ? practice.st : d.stars);
  showPanel(
    "<h2>Harian #" + dailyNumber(d.date) + "</h2>" + starsHtml(d.stars) +
    "<p><span class=\"stat\">👣 " + d.moves + " langkah</span> (target " + d.par + ") · <span class=\"stat\">⏱ " + fmtClock(d.timeSec) + "</span> · ↩ " + d.undos + " urung</p>" +
    (practice ? "<p>Latihan barusan: <b>" + practice.m + " langkah</b> " + starText(practice.st) + ". Catatan resmi tetap yang pertama.</p>" : "") +
    "<p>🔥 " + state.streak + " hari beruntun</p>" +
    (isToday ? "<p>Soal baru dalam <b>" + untilMidnight() + "</b></p>" : "") +
    "<button class=\"btn main wide\" id=\"pShare\" type=\"button\">Bagikan hasil</button>" +
    "<div class=\"row2\"><button class=\"btn\" id=\"pMenu\" type=\"button\">Menu</button>" +
    (isToday ? "<button class=\"btn\" id=\"pPractice\" type=\"button\">Main latihan</button>" : "") + "</div>",
    () => {
      $("pShare").onclick = () => shareText(dailyShareText());
      $("pMenu").onclick = () => { hideOverlay(); goHome(); };
      if (isToday) $("pPractice").onclick = () => { hideOverlay(); startDaily(true); };
    },
    true
  );
}

function winDuel(r) {
  const me = { m: r.m, t: r.timeSec };
  const opp = play.opp;
  const res = compareDuel(me, opp);
  if (res > 0) state.duelWins++; else if (res < 0) state.duelLosses++; else state.duelDraws++;
  state.pendingDuel = null;
  save();
  if (res > 0) setTimeout(confetti, 400);
  r.show = () => {
    const side = (who, s, win) => "<div class=\"side" + (win ? " win" : "") + "\"><div class=\"who\">" + esc(who) + "</div>" +
      "<div class=\"score\">" + s.m + "</div><div class=\"time\">langkah · " + fmtClock(s.t) + "</div></div>";
    showPanel(
      "<h2>" + (res > 0 ? "Kamu menang!" : res < 0 ? esc(opp.n) + " menang" : "Seri!") + "</h2>" +
      "<div class=\"versus\">" + side("Kamu", me, res > 0) + "<span class=\"vs\">VS</span>" + side(opp.n, opp, res < 0) + "</div>" +
      "<p>" + (res > 0 ? "Langkahmu lebih hemat. Kabari " + esc(opp.n) + "!" : res < 0 ? "Belum beruntung. Balas dengan soal baru!" : "Sama persis. Tanding ulang?") + "</p>" +
      "<button class=\"btn main wide\" id=\"pReply\" type=\"button\">Balas tantangan</button>" +
      "<div class=\"row2\"><button class=\"btn\" id=\"pMenu\" type=\"button\">Menu</button>" +
      "<button class=\"btn\" id=\"pTell\" type=\"button\">Kirim hasil</button></div>",
      () => {
        $("pReply").onclick = () => { hideOverlay(); startMake(); };
        $("pMenu").onclick = () => { hideOverlay(); goHome(); };
        $("pTell").onclick = () => shareText("Duel Pilah Kelereng\nAku: " + me.m + " langkah (" + fmtClock(me.t) + ")\n" + opp.n + ": " + opp.m +
          " langkah (" + fmtClock(opp.t) + ")\n" + (res > 0 ? "Aku menang! 😎" : res < 0 ? "Kamu menang kali ini 😅" : "Seri! 🤝") + "\n" + SITE);
      },
      true
    );
  };
}
function winMake(r) {
  const def = play.def;
  r.show = () => {
    chimeStars(r.st);
    showPanel(
      "<h2>Selesai!</h2>" + starsHtml(r.st) +
      "<p><span class=\"stat\">" + r.m + " langkah</span> · ⏱ " + fmtClock(r.timeSec) + "</p>" +
      "<p>Kirim soal yang sama ke teman. Siapa yang lebih hemat langkah?</p>" +
      "<button class=\"btn main wide pulse\" id=\"pSend\" type=\"button\">Kirim tantangan</button>" +
      "<div class=\"row2\"><button class=\"btn\" id=\"pMenu\" type=\"button\">Menu</button>" +
      "<button class=\"btn\" id=\"pNew\" type=\"button\">Soal lain</button></div>",
      () => {
        $("pSend").onclick = () => withName(() => shareChallenge(def, r), r.show);
        $("pMenu").onclick = () => { hideOverlay(); goHome(); };
        $("pNew").onclick = () => { hideOverlay(); startMake(); };
      },
      true
    );
  };
}
function shareChallenge(def, r) {
  const link = duelLink({ s: def.seed, k: def.k, e: def.e, x: def.misteri, n: state.name, m: r.m, t: r.timeSec });
  shareText("Aku menyelesaikan Pilah Kelereng dalam " + r.m + " langkah (" + fmtClock(r.timeSec) + "). Bisa lebih hemat? 🔮\n" + link);
}
// Nama penantang diminta sekali, lalu diingat.
function withName(next, back) {
  if (state.name) return next();
  showPanel(
    "<h2>Namamu?</h2><p>Nama ini tampil di layar temanmu.</p>" +
    "<input class=\"field\" id=\"pName\" maxlength=\"12\" autocomplete=\"nickname\" placeholder=\"misal: Sari\">" +
    "<button class=\"btn main wide\" id=\"pNameOk\" type=\"button\">Lanjut</button>",
    () => {
      const go = () => {
        const n = cleanName($("pName").value);
        if (!n) return toast("Tulis namamu dulu");
        state.name = n;
        save();
        hideOverlay();
        if (back) back();
        next();
      };
      $("pNameOk").onclick = go;
      $("pName").onkeydown = (e) => { if (e.key === "Enter") go(); };
      setTimeout(() => { try { $("pName").focus(); } catch (e) {} }, 50);
    }
  );
}

// ---------- Mode ----------
function startAdventure(n) {
  n = Math.max(1, Math.min(n || state.level, state.level));
  const def = levelDef(n);
  const saved = state.play.adv && state.play.adv.n === n ? state.play.adv : null;
  startPlay("adv", def, { resume: saved });
}
function startDaily(practice) {
  const t = today();
  if (state.daily && state.daily.date === t && state.daily.done && !practice) return showDailyResult(null);
  const def = Object.assign(G.generate(dailySeed(t), 7, 2), { misteri: isSunday(t), tantangan: false });
  const saved = state.play.daily && state.play.daily.date === t ? state.play.daily : null;
  startPlay("daily", def, { date: t, resume: saved });
}
// Jenis Tantangan diambil dari papan yang benar-benar dibuat, bukan dari isi link.
function duelDef(s, k, e, x) { const d = G.fromSeed(s, k, e); return Object.assign(d, { misteri: !!x, tantangan: d.e === 1 }); }
// Periksa link duel terhadap papannya: seed harus menghasilkan papan itu persis,
// dan hasil lawan harus mungkin (langkah >= batas bawah, waktu masuk akal).
function duelProblem(opp) {
  const def = duelDef(opp.s, opp.k, opp.e, opp.x);
  if (!def.exact || def.e !== opp.e || def.k !== opp.k) return "Link tantangan tidak valid, minta tantangan baru.";
  if (opp.m < Math.max(opp.k, G.minMoves(def.tubes, CAP)) || opp.t < Math.max(2, Math.floor(opp.m * 0.15))) {
    return "Hasil di link tantangan tidak mungkin, minta tantangan baru.";
  }
  return "";
}
function startMake() {
  const saved = state.play.make && state.play.make.mode === "make" ? state.play.make : null;
  if (saved) return startPlay("make", duelDef(saved.s, saved.k, saved.e, saved.x), { resume: saved });
  const seed = Math.floor(Math.random() * 4294967296) >>> 0;
  const def = Object.assign(G.generate(seed, 6, 2), { misteri: false, tantangan: false });
  startPlay("make", def);
}
function startDuel(opp) {
  const saved = state.play.duel && state.play.duel.mode === "duel" && state.play.duel.opp &&
    state.play.duel.s === opp.s && state.play.duel.opp.n === opp.n && state.play.duel.opp.m === opp.m ? state.play.duel : null;
  startPlay("duel", duelDef(opp.s, opp.k, opp.e, opp.x), { opp, resume: saved });
}
function openDuelMenu() {
  const p = state.pendingDuel;
  const going = state.play.make && state.play.make.path && state.play.make.path.length;
  if (!p) return startMake();
  showPanel(
    "<h2>Tantang Teman</h2>" +
    "<p><b>" + esc(p.n) + "</b> menantang kamu: " + p.m + " langkah (" + fmtClock(p.t) + ").</p>" +
    "<button class=\"btn main wide\" id=\"pAccept\" type=\"button\">Lawan " + esc(p.n) + "</button>" +
    "<button class=\"btn wide\" id=\"pMake\" type=\"button\">" + (going ? "Lanjutkan soal tantanganku" : "Buat tantangan baru") + "</button>",
    () => {
      $("pAccept").onclick = () => { hideOverlay(); startDuel(p); };
      $("pMake").onclick = () => { hideOverlay(); startMake(); };
    }
  );
}
function checkIncomingDuel() {
  const m = /[#&]d=([A-Za-z0-9_-]+)/.exec(location.hash || "");
  if (!m && !/[#&]d=/.test(location.hash || "")) return;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  const opp = m ? decodeDuel(m[1]) : null;
  if (!opp) return toast("Link tantangan tidak valid, minta tantangan baru.");
  const problem = duelProblem(opp);
  if (problem) return toast(problem);
  state.pendingDuel = opp;
  save();
  renderHome();
  showPanel(
    "<h2>Tantangan!</h2>" +
    "<p><b>" + esc(opp.n) + "</b> menantang kamu! " + esc(opp.n) + " selesai dalam <b>" + opp.m + " langkah</b> (" + fmtClock(opp.t) + ").</p>" +
    "<p>Soalnya sama persis. Langkah paling sedikit menang; bila sama, yang lebih cepat. Tanpa +1 Tabung.</p>" +
    "<div class=\"row2\"><button class=\"btn\" id=\"pLater\" type=\"button\">Nanti</button>" +
    "<button class=\"btn main\" id=\"pGo\" type=\"button\">Terima</button></div>",
    () => {
      $("pLater").onclick = () => { hideOverlay(); renderHome(); };
      $("pGo").onclick = () => { hideOverlay(); startDuel(opp); };
    }
  );
}

// ---------- Layar ----------
function showGameScreen() {
  $("home").hidden = true;
  $("game").hidden = false;
  hideOverlay();
  enterScreen();
}
function goHome() {
  if (play) {
    stopClock();
    play.queue = [];
    if (!play.over) saveProgress();
  }
  play = null;
  document.querySelectorAll(".m.fly").forEach((el) => el.remove());
  $("game").hidden = true;
  $("home").hidden = false;
  hideOverlay();
  renderHome();
}
function heroArt() {
  const cols = [[0, 1, 0], [1, 2, 2], [0, 1]];
  return cols.map((c) => "<div class=\"tube\" style=\"padding:0\"><div class=\"glass\" style=\"--tw:26px;--th:" + (4 * 18 + 8) + "px;--ms:18px\">" +
    c.map((x, k) => marbleHtml(x, false, 3 + k * 18, "")).join("") + "</div></div>").join("");
}
function renderHome() {
  $("totalStars").textContent = state.totalStars;
  $("heroLevel").textContent = "Level " + state.level;
  $("heroSub").innerHTML = "⭐ " + state.totalStars + " bintang · <i class=\"emas-dot\" style=\"display:inline-block;vertical-align:-2px\"></i> " +
    state.emas + " Kelereng Emas" + (streakNow() ? " · 🔥 " + streakNow() + " hari" : "");
  const art = $("heroArt");
  if (!art.firstChild) art.innerHTML = heroArt();
  art.className = "mini th" + state.theme + " sh" + state.shine;
  const adv = state.play.adv;
  $("stAdv").textContent = adv && adv.n === state.level && adv.path && adv.path.length ? "Lanjutkan Lv " + state.level : "Level " + state.level;
  const t = today();
  const d = state.daily && state.daily.date === t && state.daily.done ? state.daily : null;
  $("modeDaily").classList.toggle("done", !!d);
  $("stDaily").textContent = d ? "Selesai ✓ · baru lagi " + untilMidnight()
    : state.play.daily && state.play.daily.date === t && state.play.daily.path.length ? "Lanjutkan #" + dailyNumber(t) : "Harian #" + dailyNumber(t);
  const p = state.pendingDuel;
  $("stDuel").textContent = p ? "Ditantang " + p.n + "!"
    : state.duelWins + state.duelLosses + state.duelDraws > 0 ? "Menang " + state.duelWins + " · Kalah " + state.duelLosses : "Tantang";
  $("stLevels").textContent = (state.level - 1) + " selesai";
  $("stLook").textContent = themesOpen() + "/4 · " + shinesOpen() + "/4";
}
setInterval(() => { if (!$("home").hidden && $("overlay").hidden) renderHome(); }, 1000);

// ---------- Panel ----------
let panelFinal = false;
let panelReturn = null;
function showPanel(html, wire, final) {
  const o = $("overlay");
  // Ingat fokus sebelum panel, supaya bisa dikembalikan saat panel ditutup.
  if (o.hidden) {
    const ae = document.activeElement;
    panelReturn = ae && ae !== document.body ? (ae.classList.contains("tube") && ae.dataset.i != null ? { i: ae.dataset.i } : { el: ae }) : null;
  }
  o.innerHTML = "<div class=\"panel\">" + html + "</div>";
  o.hidden = false;
  panelFinal = !!final;
  enterScreen();
  if (wire) wire();
  const btn = o.querySelector("button:not([hidden]):not(:disabled)");
  if (btn) { try { btn.focus({ preventScroll: true }); } catch (e) {} }
}
function hideOverlay() {
  const o = $("overlay");
  const wasOpen = !o.hidden;
  o.hidden = true;
  o.innerHTML = "";
  panelFinal = false;
  const r = panelReturn;
  panelReturn = null;
  if (!wasOpen || !r) return;
  const el = r.i != null ? (play && !$("game").hidden ? tubeEl(r.i) : null) : r.el;
  if (el && el.isConnected && !el.closest("[hidden]")) focusEl(el);
}

const PAGE = 50;
function showLevels(page) {
  const maxN = state.level;
  const pages = Math.ceil(maxN / PAGE);
  if (page === undefined) page = Math.floor((maxN - 1) / PAGE);
  page = Math.max(0, Math.min(pages - 1, page));
  let grid = "";
  for (let n = page * PAGE + 1; n <= Math.min(maxN, page * PAGE + PAGE); n++) {
    const s = starsOf(n);
    grid += "<button class=\"lv" + (n === maxN ? " cur" : "") + "\" type=\"button\" data-n=\"" + n + "\" aria-label=\"Level " + n + ", " + s + " bintang\">" + n +
      "<small>" + (n === maxN ? "baru" : "★".repeat(s) + "☆".repeat(3 - s)) + "</small></button>";
  }
  showPanel(
    "<h2>Pilih Level</h2>" +
    (pages > 1 ? "<div class=\"pager\"><button class=\"btn\" id=\"pPrev\" type=\"button\"" + (page ? "" : " disabled") + ">‹</button><b>" +
      (page * PAGE + 1) + "–" + Math.min(maxN, page * PAGE + PAGE) + "</b><button class=\"btn\" id=\"pNextPg\" type=\"button\"" + (page < pages - 1 ? "" : " disabled") + ">›</button></div>" : "") +
    "<div class=\"grid\" id=\"pGrid\">" + grid + "</div>" +
    "<button class=\"btn wide\" id=\"pClose\" type=\"button\">Tutup</button>",
    () => {
      $("pGrid").onclick = (e) => {
        const b = e.target.closest(".lv");
        if (!b) return;
        hideOverlay();
        startAdventure(+b.dataset.n);
      };
      $("pClose").onclick = hideOverlay;
      if (pages > 1) {
        $("pPrev").onclick = () => showLevels(page - 1);
        $("pNextPg").onclick = () => showLevels(page + 1);
      }
    }
  );
}
function showLook() {
  const tOpen = themesOpen(), sOpen = shinesOpen();
  const themeBtns = THEMES.map((name, i) => "<button class=\"opt" + (state.theme === i ? " on" : "") + " th" + i + "\" type=\"button\" data-t=\"" + i + "\"" +
    (i < tOpen ? "" : " disabled") + "><div class=\"tube\"><div class=\"glass\"></div></div>" + (i < tOpen ? name : "Lv " + (i * 25 + 1)) + "</button>").join("");
  const shineBtns = SHINES.map((s, i) => "<button class=\"opt" + (state.shine === i ? " on" : "") + " sh" + i + "\" type=\"button\" data-s=\"" + i + "\"" +
    (i < sOpen ? "" : " disabled") + ">" + marbleHtml(1, false, null, "") + (i < sOpen ? s[0] : "⭐" + s[1]) + "</button>").join("");
  showPanel(
    "<h2>Tampilan</h2>" +
    "<p>Tema tabung (terbuka tiap 25 level)</p><div class=\"opts\" id=\"pThemes\">" + themeBtns + "</div>" +
    "<p>Kilau kelereng (dari total bintang)</p><div class=\"opts\" id=\"pShines\">" + shineBtns + "</div>" +
    "<label class=\"toggle\">Getar <input type=\"checkbox\" id=\"pVib\"" + (state.settings.vibrate ? " checked" : "") + "></label>" +
    "<button class=\"btn main wide\" id=\"pOk\" type=\"button\">Selesai</button>",
    () => {
      $("pThemes").onclick = (e) => { const b = e.target.closest(".opt"); if (!b || b.disabled) return; state.theme = +b.dataset.t; save(); renderHome(); showLook(); };
      $("pShines").onclick = (e) => { const b = e.target.closest(".opt"); if (!b || b.disabled) return; state.shine = +b.dataset.s; save(); renderHome(); showLook(); };
      $("pVib").onchange = (e) => { state.settings.vibrate = e.target.checked; save(); buzz(20); };
      $("pOk").onclick = hideOverlay;
    }
  );
}

// ---------- Bagikan ----------
function shareText(text) {
  if (navigator.share) {
    navigator.share({ text }).catch((e) => { if (!e || e.name !== "AbortError") copyText(text); });
  } else copyText(text);
}
function copyText(text) {
  const done = () => toast("Tersalin. Tempel di WhatsApp!");
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy") ? done() : toast("Gagal menyalin"); } catch (e) { toast("Gagal menyalin"); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}
let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

// ---------- Tombol Back ----------
// Tiap kali meninggalkan menu atau membuka panel, satu langkah riwayat ditambahkan,
// jadi Back menutup panel atau kembali ke menu, bukan keluar dari situs.
let backArmed = false;
function enterScreen() {
  if (backArmed) return;
  try { history.pushState({ pk: 1 }, ""); backArmed = true; } catch (e) {}
}
window.addEventListener("popstate", () => {
  backArmed = false;
  const inGame = !$("game").hidden;
  if (!$("overlay").hidden) {
    const wasFinal = panelFinal;
    hideOverlay();
    if (inGame && wasFinal) return goHome();
    if (inGame) enterScreen();
    return;
  }
  if (inGame) goHome();
});

// ---------- Masukan ----------
$("board").addEventListener("pointerdown", (e) => {
  if (e.button !== undefined && e.button > 0) return;
  const t = e.target.closest(".tube");
  if (!t) return;
  e.preventDefault();
  tapTube(+t.dataset.i);
});
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && (e.key === "z" || e.key === "Z") && play && $("overlay").hidden) { e.preventDefault(); return undo(); }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$("overlay").hidden) {
    if (e.key === "Escape") { if (panelFinal) goHome(); else hideOverlay(); }
    return;
  }
  if ($("game").hidden || !play) return;
  const focused = document.activeElement && document.activeElement.closest ? document.activeElement.closest(".tube") : null;
  if ((e.key === "Enter" || e.key === " ") && focused) { e.preventDefault(); return tapTube(+focused.dataset.i); }
  if (/^[1-9]$/.test(e.key)) { const i = +e.key - 1; if (i < play.tubes.length) tapTube(i); return; }
  if (e.key === "0" && play.tubes.length >= 10) return tapTube(9);
  if (e.key === "z" || e.key === "Z" || e.key === "Backspace") { e.preventDefault(); return undo(); }
  if (e.key === "r" || e.key === "R") return resetLevel();
  if (e.key === "Escape") { if (play.sel >= 0) { play.sel = -1; applySelection(); } }
});
let resizeRaf = 0;
window.addEventListener("resize", () => {
  if (!play || $("game").hidden || play.busy) return;
  cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(() => { if (play && !play.busy) { renderBoard(); renderInfo(); } });
});

$("modeAdv").onclick = () => startAdventure(state.level);
$("modeDaily").onclick = () => startDaily(false);
$("modeDuel").onclick = openDuelMenu;
$("modeLevels").onclick = () => showLevels();
$("modeLook").onclick = showLook;
$("btnHelp").onclick = showHelp;
$("btnStats").onclick = showStats;
$("btnBack").onclick = goHome;
$("btnUndo").onclick = undo;
$("btnReset").onclick = resetLevel;
$("btnPlus").onclick = usePlus;
document.querySelectorAll(".snd").forEach((b) => {
  b.onclick = () => {
    state.settings.mute = !state.settings.mute;
    save();
    renderSound();
    if (!state.settings.mute) sfx.klik(0);
  };
});

renderSound();
renderHome();
checkIncomingDuel();
window.addEventListener("hashchange", checkIncomingDuel);
// ==APP-END==
</script>
