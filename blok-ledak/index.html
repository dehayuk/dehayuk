<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a2aa8">
<title>Blok Ledak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/kit/kit.css">
<style>
:root{--dk-ink:#2a1250;--dk-lbl:#7a5580;--dk-p1:#fffaf0;--dk-p2:#ffe9cc;--dk-pe:#f2cf9e}
html,body{background:#4a2aa8}
body{position:fixed;inset:0}
canvas{display:block}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#col{position:fixed;top:0;bottom:0;pointer-events:none;z-index:10}
#probe{position:fixed;left:0;top:0;width:0;height:0;padding:var(--dk-st) var(--dk-sr) var(--dk-sb) var(--dk-sl);visibility:hidden}
.scr{position:absolute;inset:0}
/* judul */
#sTitle{display:flex;flex-direction:column;align-items:center;padding:calc(var(--dk-st) + 66px) 14px var(--padb,130px)}
#sTitle>*{pointer-events:auto}
.home{position:absolute!important;left:calc(var(--dk-sl) + 12px);top:calc(var(--dk-st) + 12px);width:44px!important;height:44px!important}
.home svg{width:22px!important;height:22px!important;filter:none!important}
.pill{display:flex;align-items:center;gap:5px;background:rgba(30,8,60,.72);border:3px solid var(--dk-ink);border-radius:999px;padding:3px 12px 3px 6px;font:800 17px/1.2 var(--dk-fd);white-space:nowrap}
.pill svg{width:22px;height:22px;flex:none}
.best{position:absolute;right:calc(var(--dk-sr) + 12px);top:calc(var(--dk-st) + 16px);color:#ffe36a}
.chip{position:absolute;left:50%;top:calc(var(--dk-st) + 16px);transform:translateX(-50%);font-size:15px;color:#fff}
#logo{flex:none;width:min(88%,340px,calc(34vh * 1.4));aspect-ratio:1.4/1}
.tmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;width:100%;min-height:0}
.chal{font:800 18px/1.1 var(--dk-fd);background:#ff5c93;border:3px solid var(--dk-ink);border-radius:14px;padding:6px 16px 8px;box-shadow:0 4px 0 var(--dk-ink);transform:rotate(-3deg);animation:dk-wig 1.4s ease-in-out infinite}
#bMain{font-size:40px;padding:14px 46px 18px;border-radius:28px;animation:dk-pulse 1.1s ease-in-out infinite}
#bMain svg{width:34px;height:34px}
#bMain.dk-pr{animation:none}
.icons{display:flex;gap:12px;justify-content:center}
.ent>*{animation:dk-pop .5s cubic-bezier(.2,1.5,.4,1) backwards}
.ent>:nth-child(2){animation-delay:.08s}.ent>:nth-child(3){animation-delay:.16s}
.chip .strk{display:flex;align-items:center;gap:3px;margin-left:3px;padding-left:7px;border-left:2px solid rgba(255,255,255,.25)}
.leave{animation:leave .28s ease-in forwards}
@keyframes leave{to{transform:translateY(40px) scale(.9);opacity:0}}
.cover .tmid,.cover .home,.cover .best,.cover .chip{display:none!important}
.cover #sTitle{justify-content:center;padding-top:0}
.cover #logo{width:min(44vw,450px);margin-top:-4vh}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--dk-st) + 8px) 10px 0;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
#hud>*{pointer-events:auto}
#hud .dk-circle{width:46px;height:46px}
.sc{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none!important}
.sc b{font:800 40px/1 var(--dk-fd);font-variant-numeric:tabular-nums;transition:transform .1s}
.sc b.bump{transform:scale(1.15)}
.sc small{margin-top:4px;font:800 12px/1 var(--dk-fd);background:#ff5c93;border:2px solid var(--dk-ink);border-radius:999px;padding:2px 8px 3px}
.hbest{margin-top:6px;color:#ffe36a;font-size:16px;pointer-events:none!important}
.hbest svg{width:19px;height:19px}
.hbest.live{background:#ff3d7f;color:#fff;animation:dk-pulse .7s ease-in-out infinite}
/* cip kombo: api, xN, 3 titik nyawa */
.cchip{margin-top:5px;display:flex;align-items:center;gap:4px;background:linear-gradient(#ffb36b,#ff7a2b);border:2.5px solid var(--dk-ink);border-radius:999px;padding:1px 8px 2px 3px;box-shadow:0 2px 0 var(--dk-ink)}
.cchip svg{width:18px;height:18px}
.cchip b{font:800 15px/1 var(--dk-fd)}
.pips{display:flex;gap:3px;margin-left:2px}
.pips i{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--dk-ink)}
.pips i.off{background:rgba(42,18,80,.35)}
.cchip.warn{background:#ff3b5c;animation:cshake .22s linear infinite}
@keyframes cshake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
/* panel */
.big{font:800 58px/1 var(--dk-fd);font-variant-numeric:tabular-nums}
.rtop{display:flex;align-items:center;gap:4px;width:100%}
.bcol{flex:none;width:108px;display:flex;flex-direction:column;align-items:center;gap:3px}
.stage{position:relative;width:96px;height:88px;display:grid;place-items:center}
.stage .rays{position:absolute;inset:-16px;border-radius:50%;background:repeating-conic-gradient(rgba(255,200,60,.6) 0 12deg,transparent 12deg 24deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stage div{position:relative;width:92px;height:86px;animation:dk-bob 2.2s ease-in-out infinite}
.stage svg{width:100%;height:100%;display:block}
.rrank{font:800 15px/1 var(--dk-fd);white-space:nowrap}
.rrank.new::after{content:" · baru!";color:#ff3d7f}
.rsc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.rrec{font:800 13px/1.15 var(--dk-fd);color:var(--dk-lbl);text-align:center}
.rbar{width:100%;height:14px;border:3px solid var(--dk-ink);border-radius:999px;background:#eadcf2;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.1)}
.rbar i{display:block;height:100%;width:0;background:linear-gradient(#ffe36a,#ffb21a);border-radius:999px}
.rbar.rec i{background:linear-gradient(#ffb3d9,#ff5c93)}
.rmisc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.stars{display:flex;gap:1px}.stars svg{width:28px;height:28px}
.goals{display:flex;gap:8px}
.goal{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:3px solid var(--dk-ink);border-radius:14px;box-shadow:0 3px 0 var(--dk-ink);padding:5px 8px 6px;min-width:70px}
.goal span{display:flex}.goal svg{width:18px;height:18px}
.goal b{font:800 16px/1 var(--dk-fd)}
.strk2{display:flex;align-items:center;gap:4px;font:800 15px/1 var(--dk-fd)}.strk2 svg{width:20px;height:20px}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px;width:100%}
.kb{display:flex;flex-direction:column;align-items:center;gap:2px}
.kb svg{width:66px;height:62px}
.kb b{font:800 14px/1 var(--dk-fd)}.kb span{font:800 11px/1 var(--dk-fd);color:var(--dk-lbl)}
.kb.lk b{color:#9d95bd}
#rNormal{font-size:17px;padding:8px 10px 10px}
.rek{position:absolute;right:-18px;top:-30px;width:96px;height:96px;display:grid;place-items:center;transform:rotate(12deg);z-index:2}
.rek::before,.rek::after{content:"";position:absolute;clip-path:polygon(50% 0,61% 16%,79% 7%,80% 27%,100% 30%,88% 47%,100% 64%,80% 69%,79% 90%,61% 82%,50% 100%,39% 82%,21% 90%,20% 69%,0 64%,12% 47%,0 30%,20% 27%,21% 7%,39% 16%)}
.rek::before{inset:0;background:var(--dk-ink)}
.rek::after{inset:5px;background:linear-gradient(#ffe36a,#ffb21a)}
.rek span{position:relative;z-index:1;font:800 17px/.95 var(--dk-fd);text-align:center}
.rek.go{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes stamp{from{transform:rotate(-30deg) scale(3);opacity:0}}
.stats{display:flex;gap:10px;width:100%}
.st{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--dk-ink);border-radius:16px;box-shadow:0 4px 0 var(--dk-ink);padding:6px 10px}
.st svg{width:30px;height:30px;flex:none}
.st div{display:flex;flex-direction:column}
.st b{font:800 24px/1 var(--dk-fd)}
.st span{font:800 12px/1.1 var(--dk-fd);color:var(--dk-lbl)}
.note{font:800 17px/1.1 var(--dk-fd);padding:5px 14px 7px;border-radius:12px;border:3px solid var(--dk-ink);background:#7fd8ff}
.note.win{background:#8ef06a}
.xp{font:800 14px/1 var(--dk-fd);background:var(--dk-ink);color:#ffe36a;border-radius:999px;padding:5px 12px 6px}
#rAgain{font-size:26px;padding:14px 10px 17px}
/* ponsel mendatar / layar pendek */
@media (max-height:500px){
  #sOver .dk-panel{max-width:640px;display:grid;grid-template-columns:1fr 1fr;column-gap:16px;row-gap:8px;align-items:center}
  #sOver .rtop{grid-column:1;grid-row:1}#sOver .rbar{grid-column:1;grid-row:2}#sOver .stats{grid-column:1;grid-row:3}
  #sOver .rmisc{grid-column:2;grid-row:1}#sOver .dk-stack{grid-column:2;grid-row:2/4}
  .big{font-size:42px}.stage{width:76px;height:70px}.stage div{width:72px;height:66px}.bcol{width:88px}
  #rAgain{font-size:20px;padding:9px 8px 11px}
  .rek{width:70px;height:70px;top:34px;right:auto;left:calc(50% - 66px)}.rek span{font-size:14px}
  .st{padding:3px 8px}.st b{font-size:20px}.st svg{width:24px;height:24px}
  .cal{display:none}
  .kgrid{grid-template-columns:repeat(5,1fr)}.kb svg{width:56px;height:52px}
}
.cal{width:104px;height:106px;border:4px solid var(--dk-ink);border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--dk-ink);overflow:hidden;display:flex;flex-direction:column;transform:rotate(-4deg)}
.cal i{display:block;height:30px;background:linear-gradient(#ff7a7a,#e8384f);border-bottom:4px solid var(--dk-ink);font:800 16px/27px var(--dk-fd);font-style:normal;color:#fff;text-align:center}
.cal b{flex:1;display:grid;place-items:center;font:800 50px/1 var(--dk-fd)}
.mini{display:grid;grid-template-columns:repeat(4,22px);gap:3px;transform:rotate(-6deg)}
.mini i{width:22px;height:22px;border-radius:6px;border:2.5px solid var(--dk-ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.5)}
#uji{position:fixed;left:4px;top:4px;right:4px;bottom:4px;overflow:auto;z-index:99;background:rgba(0,0,0,.86);color:#fff;font:12px/1.35 monospace;padding:8px;white-space:pre-wrap;border-radius:8px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="probe"></div>
<div id="col">
  <section id="sTitle" class="scr">
    <a href="/" class="dk-btn dk-yellow dk-circle home" aria-label="Beranda"><svg viewBox="0 0 24 24"><path fill="#2a1250" d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg></a>
    <div class="pill chip dk-ol" id="tProg"><svg viewBox="0 0 24 24"><path fill="#ffd23a" stroke="#2a1250" stroke-width="2" stroke-linejoin="round" d="M12 2.8l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.7l-5.4 2.9 1.1-6.1-4.5-4.3 6.1-.8z"/></svg><span id="tLv">Lv 1</span><span class="strk" id="tStrk" hidden><svg viewBox="0 0 24 24"><path fill="#ff8a1a" stroke="#2a1250" stroke-width="2" stroke-linejoin="round" d="M12 2.5c1.2 3.6 5.5 5.6 5.5 11a5.5 5.5 0 0 1-11 0c0-2.8 1.4-4.4 2.8-5.4-.1 2.1.8 3.2 2 3.4-.7-3.2.2-6.4.7-9z"/><path fill="#ffe36a" d="M12 12.5c.9 1.5 2.3 2.3 2.3 4a2.3 2.3 0 0 1-4.6 0c0-1.2.9-2.1 2.3-4z"/></svg><span id="tStrkN">1 hari</span></span></div>
    <div class="pill best dk-ol" id="tBest"><svg viewBox="0 0 24 24"><path fill="#ffd23a" stroke="#2a1250" stroke-width="2" stroke-linejoin="round" d="M3 18h18l1-11-6 4-4-7-4 7-6-4z"/></svg><span>0</span></div>
    <div id="logo"></div>
    <div class="tmid ent" id="tMid">
      <div class="chal dk-ol" id="tChal" hidden>Kalahkan skor 0!</div>
      <button class="dk-btn dk-green dk-ol" id="bMain"><svg viewBox="0 0 24 24"><path fill="#fff" stroke="#2a1250" stroke-width="2" stroke-linejoin="round" d="M7 4.5v15l12-7.5z"/></svg>MAIN</button>
      <div class="icons">
        <button class="dk-round dk-yellow" id="bHarian"><i><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><rect x="4" y="5.5" width="16" height="15" rx="3" fill="#fff" stroke="#2a1250" stroke-width="2"/><path d="M4.5 10h15" stroke="#e8384f" stroke-width="4"/><path d="M8.5 3.5v4M15.5 3.5v4" stroke="#2a1250" stroke-width="2.6"/><rect x="9.5" y="13" width="5" height="5" rx="1.2" fill="#b35cff"/></svg><b class="dk-dot" id="dDaily" hidden></b></i><span>Harian</span></button>
        <button class="dk-round dk-pink" id="bTantang" aria-label="Tantang"><i class="dk-ol" aria-hidden="true">VS</i><span>Tantang</span></button>
        <button class="dk-round dk-blue" id="bKoleksi"><i><svg viewBox="0 0 24 24"><path d="M8 13 5 21l3-1.3 1.8 2.6L12.5 15z" fill="#ff5c93" stroke="#2a1250" stroke-width="1.6" stroke-linejoin="round"/><path d="M16 13l3 8-3-1.3-1.8 2.6L11.5 15z" fill="#4f7fff" stroke="#2a1250" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="7" fill="#ffd23a" stroke="#2a1250" stroke-width="2"/><path d="M12 5.8l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z" fill="#fff"/></svg></i><span>Koleksi</span></button>
        <button class="dk-round dk-purple" id="bSetelan"><i><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.2" stroke="#2a1250" stroke-width="6.5" stroke-dasharray="2.9 2.75"/><circle cx="12" cy="12" r="7.2" stroke="#fff" stroke-width="4" stroke-dasharray="2.9 2.75"/><circle cx="12" cy="12" r="6" fill="#fff" stroke="#2a1250" stroke-width="2"/><circle cx="12" cy="12" r="2.4" fill="#8f5cf0" stroke="#2a1250" stroke-width="1.6"/></svg></i><span>Setelan</span></button>
      </div>
    </div>
  </section>

  <div id="hud" hidden>
    <button class="dk-btn dk-orange dk-circle" id="bPause" aria-label="Jeda"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.5" fill="#fff" stroke="#2a1250" stroke-width="1.8"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5" fill="#fff" stroke="#2a1250" stroke-width="1.8"/></svg></button>
    <div class="sc"><b class="dk-ol" id="hScore">0</b><small class="dk-ol" id="hTag" hidden>Harian</small><div class="cchip" id="hCombo" hidden><svg viewBox="0 0 24 24"><path fill="#ff8a1a" stroke="#2a1250" stroke-width="2" stroke-linejoin="round" d="M12 2.5c1.2 3.6 5.5 5.6 5.5 11a5.5 5.5 0 0 1-11 0c0-2.8 1.4-4.4 2.8-5.4-.1 2.1.8 3.2 2 3.4-.7-3.2.2-6.4.7-9z"/><path fill="#ffe36a" d="M12 12.5c.9 1.5 2.3 2.3 2.3 4a2.3 2.3 0 0 1-4.6 0c0-1.2.9-2.1 2.3-4z"/></svg><b class="dk-ol" id="hComboN">x1</b><span class="pips"><i></i><i></i><i></i></span></div></div>
    <div class="pill hbest dk-ol" id="hBestP"><svg viewBox="0 0 24 24"><path fill="#ffd23a" stroke="#2a1250" stroke-width="2" stroke-linejoin="round" d="M3 18h18l1-11-6 4-4-7-4 7-6-4z"/></svg><span id="hBest">0</span></div>
  </div>

  <section id="sPause" class="dk-overlay" hidden>
    <div class="dk-panel">
      <div class="dk-ribbon dk-blue dk-ol">Jeda</div>
      <div class="dk-stack">
        <button class="dk-btn dk-green dk-ol" id="pGo"><svg viewBox="0 0 24 24"><path fill="#fff" stroke="#2a1250" stroke-width="2" stroke-linejoin="round" d="M7 4.5v15l12-7.5z"/></svg>Lanjut</button>
        <button class="dk-btn dk-yellow dk-ol" id="pRe"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M19 12a7 7 0 1 1-2.1-5" stroke="#2a1250" stroke-width="5"/><path d="M19 12a7 7 0 1 1-2.1-5" stroke="#fff" stroke-width="2.6"/><path d="M13.5 3.5h5v5z" fill="#fff" stroke="#2a1250" stroke-width="1.8" stroke-linejoin="round"/></svg>Ulang</button>
        <button class="dk-btn dk-orange dk-ol" id="pMenu"><svg viewBox="0 0 24 24"><path fill="#fff" stroke="#2a1250" stroke-width="1.8" stroke-linejoin="round" d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg>Menu</button>
      </div>
    </div>
  </section>

  <section id="sOver" class="dk-overlay" hidden>
    <div class="dk-panel">
      <div class="dk-ribbon dk-ol">Selesai!</div>
      <div class="rek dk-ol" id="rRek" hidden><span>Rekor<br>baru!</span></div>
      <div class="rtop">
        <div class="bcol"><div class="stage"><div class="rays"></div><div id="rBadge"></div></div><div class="rrank dk-ol" id="rRank">Perunggu</div></div>
        <div class="rsc"><div class="dk-lbl" id="rMode">Skor</div><div class="big dk-ol" id="rScore">0</div><div class="rrec" id="rRec"></div></div>
      </div>
      <div class="rbar" id="rBarW"><i id="rBar"></i></div>
      <div class="stats">
        <div class="st"><svg viewBox="0 0 24 24" stroke="#2a1250" stroke-width="1.8"><rect x="2.5" y="4" width="19" height="5" rx="1.5" fill="#27c6ea"/><rect x="2.5" y="10.5" width="19" height="5" rx="1.5" fill="#58d24a"/><rect x="2.5" y="17" width="9" height="5" rx="1.5" fill="#ffd32e"/></svg><div><b id="rLines">0</b><span>Baris</span></div></div>
        <div class="st"><svg viewBox="0 0 24 24"><path fill="#ff8a1a" stroke="#2a1250" stroke-width="1.8" stroke-linejoin="round" d="M12 2.5c1.2 3.6 5.5 5.6 5.5 11a5.5 5.5 0 0 1-11 0c0-2.8 1.4-4.4 2.8-5.4-.1 2.1.8 3.2 2 3.4-.7-3.2.2-6.4.7-9z"/><path fill="#ffe36a" d="M12 12.5c.9 1.5 2.3 2.3 2.3 4a2.3 2.3 0 0 1-4.6 0c0-1.2.9-2.1 2.3-4z"/></svg><div><b id="rCombo">x0</b><span>Kombo</span></div></div>
      </div>
      <div class="rmisc"><div class="stars" id="rStars" hidden></div><div class="note dk-ol" id="rNote" hidden></div><div class="xp" id="rXp" hidden></div></div>
      <div class="dk-stack">
        <button class="dk-btn dk-green dk-ol" id="rAgain"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M19 12a7 7 0 1 1-2.1-5" stroke="#2a1250" stroke-width="5"/><path d="M19 12a7 7 0 1 1-2.1-5" stroke="#fff" stroke-width="2.6"/><path d="M13.5 3.5h5v5z" fill="#fff" stroke="#2a1250" stroke-width="1.8" stroke-linejoin="round"/></svg>Main lagi</button>
        <button class="dk-btn dk-purple dk-ol" id="rNormal" hidden>Main biasa</button>
        <div class="dk-row">
          <button class="dk-btn dk-blue dk-ol" id="rShare"><svg viewBox="0 0 24 24" stroke="#2a1250" stroke-width="1.8"><path d="M7 12l10-6M7 12l10 6" stroke-width="4.5"/><path d="M7 12l10-6M7 12l10 6" stroke="#fff" stroke-width="2"/><circle cx="6.5" cy="12" r="3.3" fill="#fff"/><circle cx="17.5" cy="5.5" r="3.3" fill="#fff"/><circle cx="17.5" cy="18.5" r="3.3" fill="#fff"/></svg>Bagikan</button>
          <button class="dk-btn dk-orange dk-ol" id="rMenu"><svg viewBox="0 0 24 24"><path fill="#fff" stroke="#2a1250" stroke-width="1.8" stroke-linejoin="round" d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg>Menu</button>
        </div>
      </div>
    </div>
  </section>

  <section id="sHarian" class="dk-overlay" hidden>
    <div class="dk-panel">

<script>

const KIT = window.DehayukKit, SLUG = "blok-ledak", ST = KIT.store(SLUG), TAU = Math.PI * 2;

/* ================= INTI PERMAINAN (tanpa DOM) ================= */
const N = 8;

  ["xxx/.x.", 2], [".x./xxx", 2], ["x./xx/x.", 2], [".x/xx/.x", 2],
  ["xx./.xx", 2], [".xx/xx.", 2], ["x./xx/.x", 2], [".x/xx/x.", 2],
  ["xxxxx", 2], ["x/x/x/x/x", 2],
  ["xxx/x../x..", 1.5], ["xxx/..x/..x", 1.5], ["x../x../xxx", 1.5], ["..x/..x/xxx", 1.5],

Core.prototype.fitsAt = function (s, gx, gy) {

    }

/* ================= UJI ================= */
function runUji() {
  const out = []; let ok = true;

  chk(g.gN === 2 && g.gRows === 4 && g.gCols === 32 && rest === 1 && g.b[56] === 1 && g.score - sc0 === 1 + LINE_PTS[2], "baris + kolom terhapus bersamaan, sel lain tetap (+" + (g.score - sc0) + ")");

  g.reset(3); g.b.fill(0); g.combo = 0; g.miss = 0; g.b[63] = 6;

  for (let i = 0; i < 64; i++) g.b[i] = ((i >> 3) + (i & 7)) & 1 ? 1 : 0;
  chk(!g.fitsAny(SQ3) && !g.fitsAny(O) && !g.fitsAny(shapeOf("xx")) && g.fitsAny(MONO) && g.fitsAt(MONO, 0, 0) && !g.fitsAt(MONO, 1, 0), "papan catur: hanya satu sel yang muat");
  // 5 kalah terdeteksi
  setTray(SQ3, I5, O); chk(g.over, "baki tanpa bentuk yang muat = permainan selesai");
  setTray(SQ3, MONO, O); chk(!g.over, "satu bentuk yang muat = masih jalan");
  g.b.fill(1); g.b[0] = 0; g.b[1] = 0; g.b[2] = 0; g.b[3] = 0; g.b[4] = 0;
  setTray(I5V, SQ3, -1); chk(g.over, "baris kosong horizontal, bentuk tegak tak muat");

  // 6 benih sama = permainan sama
  const run = (seed, max) => { const c = new Core(); c.reset(seed); let trail = 0; for (let m = 0; m < max && !c.over; m++) { if (c.bestMove() < 0) break; trail = (Math.imul(trail, 31) + c.ts[c.mk] * 97 + c.tc[c.mk] * 7 + c.mx * 8 + c.my) | 0; c.place(c.mk, c.mx, c.my); } return c.score + ":" + c.moves + ":" + trail; };
  const r1 = run(20260927, 400), r2 = run(20260927, 400), r3 = run(20260928, 400);
  chk(r1 === r2 && r1 !== r3, "benih sama = urutan & skor sama (" + r1.split(":").slice(0, 2).join(" skor, ") + " langkah)");

  const c = new Core(), anyShape = () => { for (let s = 0; s < NS; s++) if (c.fitsAny(s)) return true; return false; };
  const t0 = performance.now();

    c.reset(seed * 7919); games++;

  const b0 = bigAt(0), b5 = bigAt(5000);
  chk(b0 < 0.22 && b5 > 0.27 && b5 < 0.34, "bentuk 5+ sel: " + (b0 * 100).toFixed(0) + "% di skor 0, " + (b5 * 100).toFixed(0) + "% di skor 5000");

  if (lifted) for (let i = 0; i < xs.length; i++) c.drawImage(SHADOW, x0 + xs[i] * cs + cs * 0.08, y0 + ys[i] * cs + cs * 0.2, cs, cs);
  for (let i = 0; i < xs.length; i++) c.drawImage(img, x0 + xs[i] * cs, y0 + ys[i] * cs, cs, cs);
}
function drawParticles(dt) {
  const c = ctx;
  for (let i = 0; i < PN; i++) {
    if (pL[i] <= 0) continue;
    pL[i] -= dt; if (pL[i] <= 0) continue;
    const k = pK[i];
    pVY[i] += (k === 20 ? 250 : 1100) * dt; pX[i] += pVX[i] * dt; pY[i] += pVY[i] * dt; pVX[i] *= 1 - dt * 1.2; pR[i] += pVR[i] * dt;
    const l = pL[i] / pM[i], s = pS[i] * (k === 20 ? (l > 0.8 ? (1 - l) * 5 : 1) : 0.5 + l * 0.5);
    c.globalAlpha = l < 0.35 ? l / 0.35 : 1;
    const co = Math.cos(pR[i]) * dpr, si = Math.sin(pR[i]) * dpr;
    c.setTransform(co, si, -si, co, pX[i] * dpr, pY[i] * dpr);

}
const BN_Y = [0.36, 0.58, 0.16];
function drawTexts(dt) {
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0); c.textAlign = "center"; c.textBaseline = "middle"; c.lineJoin = "round";
  for (let i = 0; i < TN; i++) {
    if (tL[i] <= 0) continue; tL[i] -= dt * 1.1; if (tL[i] <= 0) continue;
    const l = tL[i], age = 1 - l; tY[i] -= 50 * dt;
    const s = age < 0.15 ? 0.5 + age / 0.15 * 0.7 : age < 0.3 ? 1.2 - (age - 0.15) / 0.15 * 0.2 : 1;
    c.globalAlpha = l < 0.3 ? l / 0.3 : 1;
    c.font = FONTS[Math.min(139, Math.round(tSz[i] * s * dpr))];
    c.lineWidth = 6 * dpr; c.strokeStyle = INK; c.strokeText(tTx[i], tX[i] * dpr, tY[i] * dpr);
    c.fillStyle = tC[i]; c.fillText(tTx[i], tX[i] * dpr, tY[i] * dpr);
  }
  for (let k = 0; k < 3; k++) {
    const B = BN[k]; if (B.t <= 0) continue;
    B.t -= dt; const age = B.d - B.t;
    const s = (age < 0.18 ? 0.3 + age / 0.18 : age < 0.32 ? 1.3 - (age - 0.18) / 0.14 * 0.3 : 1) * B.fit;
    c.globalAlpha = B.t < 0.3 ? Math.max(0, B.t / 0.3) : 1;
    const fsz = bannerSize(k, B.sz) * dpr;
    const x = (BX + BO / 2) * dpr, y = (BY + BO * BN_Y[k] - age * (k === 1 ? 6 : 10)) * dpr;
    c.setTransform(s, 0, 0, s, x, y); c.rotate(k === 1 ? 0.04 : -0.05 + Math.sin(time * 7) * 0.025);
    c.font = FONTS[Math.min(139, Math.round(fsz))];

}
function renderTitle(dt) {
  const c = ctx;

    setT(1, 0, 0); c.drawImage(PBLK[p.c], p.x, p.y - hop * PP * 0.35, PP, PP);
  }
  if (LOGO) {
    const L = LOGO, cx = L.x + L.w / 2;

    const byy = L.y + L.h * 0.66;

    const T = L.T, tot = 4 * T + 3 * L.gap, x0 = cx - tot / 2, ty = L.y + T * 0.62;
    for (let i = 0; i < 4; i++) {
      const hop = Math.pow(Math.max(0, Math.sin(time * 2.4 - i * 0.55)), 10);
      const x = x0 + i * (T + L.gap) + T / 2, y = ty - hop * T * 0.28, rot = (i & 1 ? 0.07 : -0.07) + hop * (i & 1 ? -0.08 : 0.08);
      const co2 = Math.cos(rot) * dpr, si2 = Math.sin(rot) * dpr;
      c.setTransform(co2, si2, -si2, co2, x * dpr, y * dpr);
      c.drawImage(L.tiles[i], -(T + 8) / 2, -(T + 8) / 2, T + 8, T + 8);
    }
    const ls = 1 + Math.sin(time * 2.2) * 0.025;
    setT(ls, cx - L.lw / 2 * ls, L.y + L.h - L.lh * 0.98 * ls);
    c.drawImage(L.L, 0, 0, L.lw, L.lh);
    if (Math.random() < dt * 2.2) { const i = (Math.random() * 4) | 0; sparkle(x0 + i * (T + L.gap) + Math.random() * T, ty - T * 0.4, 1, 90); }
  }
  if (Math.random() < dt * 1.2 && PILE.length) { const p = PILE[(Math.random() * PILE.length) | 0]; if (p.top) sparkle(p.x + PP / 2, p.y, 1, 60); }
  drawParticles(dt);
}

const demoR = KIT.rng(4242), HOLD = parseInt(Q.get("hold") || "0", 10), FREEZE = parseInt(Q.get("freeze") || "0", 10), END = parseFloat(Q.get("end") || "0");
let demoPh = 0, demoW = 0.6, demoSX = 0, demoSY = 0, demoTX = 0, demoTY = 0, demoT = 0, demoTotal = 0, demoClears = 0, demoK = -1, demoGX = 0, demoGY = 0;
function demoTick(dt) {
  demoTotal += dt;
  if (END && demoTotal > END && mode === "play") { if (dragK >= 0) cancelDrag(); core.over = true; updFit(); mode = "ending"; endT = 0; banner(0, "Tak ada tempat!", 2, 3); SFX.over(); return; }
  if (mode !== "play") return;
  if (demoPh === 0) {
    demoW -= dt; if (demoW > 0) return; if (core.bestMove() < 0) return;
    demoK = core.mk; demoGX = core.mx; demoGY = core.my;
    const s = core.ts[demoK]; demoSX = slotCX(demoK); demoSY = slotCY(demoK) + (LAND ? 0 : C * 0.3);
    demoTX = bx + (demoGX + SW[s] / 2) * C; demoTY = by + (demoGY + SH[s] / 2) * C + SH[s] * C / 2 + 50;
    beginDrag(demoK, demoSX, demoSY, true, -7); demoPh = 1; demoT = 0; return;
  }
  if (demoPh === 1) {
    demoT += dt / 0.55; const k = Math.min(1, demoT), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    fx0 = demoSX + (demoTX - demoSX) * e + Math.sin(k * Math.PI) * 30; fy0 = demoSY + (demoTY - demoSY) * e; snap();
    if (k >= 1) { if (HOLD && core.moves >= HOLD && gMask) { demoPh = 3; return; } demoPh = 2; demoW = 0.12; }
    return;
  }
  if (demoPh === 2) { demoW -= dt; if (demoW > 0) return; const before = core.lines; endDrag(); if (core.lines > before) { demoClears++; if (FREEZE && demoClears >= FREEZE) setTimeout(() => { timeScale = 0; }, 110); } demoPh = 0; demoW = 0.25 + demoR() * 0.2; }
}
