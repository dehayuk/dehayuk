<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3534">
<title>Titik Kotak</title>
<meta name="description" content="Titik Kotak: permainan titik-titik di belakang buku tulis. Tarik garis, tutup kotak, kuasai papan! Lawan Komputer (Mudah sampai Jago), main berdua di satu HP, Papan Hari Ini, dan tantangan lewat WhatsApp. Gratis, langsung main di browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Font dimuat tanpa menahan tampilan pertama; bila gagal, font sistem tetap dipakai. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap"></noscript>
<style>
  :root {
    color-scheme: dark;
    --ground: #0E3534;
    --board: #15504D;
    --board-edge: #2A7A75;
    --slot-edge: #3E8C86;
    --tile: #F4C152;
    --tile-shade: #C9952A;
    --tile-ink: #3B2A05;
    --ink: #EAF6F3;
    --muted: #9EC6C0;
    --good: #7FE0A3;
    --bad: #FF7A70;
    --well: #0B2B2A;
    --red: #FF7A70;
    --blue: #6FA8FF;
    --display: "Baloo 2", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 15px;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior-y: contain;
  }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; font-family: var(--body); }
  button:focus-visible, a:focus-visible, input:focus-visible, .paper:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .wrap {
    max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
  }
  .wrap.playing { min-height: 100%; min-height: 100dvh; }
  .wrap.playing #play { flex: 1; }
  /* Ruang kosong dibagi: sedikit di atas papan, lebih banyak di bawah, supaya papan dekat jempol dan tidak mengambang. */
  .wrap.playing .grow { flex: 1; }
  .wrap.playing #play::after { content: ""; flex: 1.6; }
  .wrap.playing { padding-left: calc(8px + env(safe-area-inset-left, 0px)); padding-right: calc(8px + env(safe-area-inset-right, 0px)); }
  section { display: flex; flex-direction: column; gap: 12px; }
  #play { gap: 8px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .wrap.playing header { padding: 0 8px; }
  .brand-box { display: flex; flex-direction: column; min-width: 0; }
  .hub { color: var(--muted); font-size: 12px; font-weight: 800; text-decoration: none; padding: 2px 0; }
  .brand { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: .5px; }
  .brand span { color: var(--tile); }
  .head-right { display: flex; align-items: center; gap: 8px; }
  .best {
    display: flex; align-items: center; gap: 6px; background: var(--board); border: 1px solid var(--board-edge);
    padding: 6px 12px; border-radius: 999px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .best.bump { animation: bump .45s ease-out; }
  @keyframes bump { 40% { transform: scale(1.18); border-color: var(--tile); } }
  .icon-btn {
    min-width: 44px; min-height: 44px; border-radius: 999px; cursor: pointer; font-size: 17px; line-height: 1;
    background: var(--board); border: 1px solid var(--board-edge); color: var(--ink);
  }

  /* Menu utama */
  .hero {
    background: var(--board); border: 1px solid var(--board-edge); border-radius: 14px; padding: 16px;
    display: flex; gap: 14px; align-items: center;
  }
  .logo { width: 62px; height: 62px; flex: none; border-radius: 10px; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .hero p { margin: 0; color: var(--muted); line-height: 1.45; }
  .hero b { color: var(--ink); font-family: var(--display); font-size: 19px; display: block; line-height: 1.15; }
  .stats { font-size: 12.5px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; margin: 0; }
  .modes { display: grid; gap: 10px; }
  .mode {
    display: grid; grid-template-columns: 1fr auto; grid-template-areas: "name state" "desc state";
    gap: 2px 12px; align-items: center; text-align: left; cursor: pointer;
    background: var(--board); border: 1px solid var(--board-edge); border-radius: 14px; padding: 14px 16px; color: var(--ink);
  }
  .mode-name { grid-area: name; font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1.1; }
  .mode-desc { grid-area: desc; font-size: 12.5px; color: var(--muted); }
  .mode-state {
    grid-area: state; max-width: 140px; text-align: center; font-weight: 800; font-size: 12px;
    background: var(--tile); color: var(--tile-ink); box-shadow: inset 0 -3px 0 var(--tile-shade);
    padding: 7px 10px; border-radius: 9px; font-variant-numeric: tabular-nums;
  }
  .mode.primary { border-color: var(--tile-shade); box-shadow: 0 0 0 1px var(--tile-shade) inset; }
  .mode.primary .mode-name { color: var(--tile); }
  .mode.done .mode-state { background: transparent; box-shadow: none; color: var(--good); border: 1px solid var(--good); }
  .home-foot { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .link-btn { background: none; border: 1px solid var(--board-edge); color: var(--muted); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 12.5px; cursor: pointer; min-height: 44px; }
  .home-foot a { color: var(--muted); font-size: 12px; padding: 10px; }

  /* Layar main */
  .topbar { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px; }
  .back {
    background: none; border: 1px solid var(--board-edge); color: var(--ink); border-radius: 8px;
    min-height: 44px; padding: 8px 12px; font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap; flex: none;
  }
  .chip {
    font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--tile); border: 1px solid var(--tile-shade); padding: 1px 10px; border-radius: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .spacer { flex: 1; }
  .undo { background: var(--board); border: 1px solid var(--board-edge); color: var(--ink); border-radius: 999px; min-height: 44px; padding: 8px 14px; font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .undo:disabled { opacity: .4; cursor: default; }
  .undo, .topbar .icon-btn { flex: none; min-width: 44px; }
  /* Layar sempit (360px): tulisan "Batal" disembunyikan, ikon ↶ tetap (aria-label "Batal"), chip dirapatkan */
  @media (max-width: 380px) {
    .topbar { gap: 6px; }
    .back { padding: 8px 10px; }
    .chip { letter-spacing: .3px; padding: 1px 7px; }
    .undo { padding: 8px 10px; }
    .undo .ul { display: none; }
  }

  .scores { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: stretch; padding: 0 8px; }
  .side {
    display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0;
    background: var(--board); border: 2px solid var(--board-edge); border-radius: 12px; padding: 6px 10px; transition: border-color .2s, box-shadow .2s;
  }
  .side .nm { font-weight: 800; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .side .nm small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .side b { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
  .side.r b { color: var(--red); } .side.b b { color: var(--blue); }
  .side.r.turn { border-color: var(--red); box-shadow: 0 0 0 2px rgba(255,122,112,.25); }
  .side.b.turn { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(111,168,255,.25); }
  .side b.bump { animation: bump .35s ease-out; }
  .mid { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); font-weight: 800; text-align: center; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .mid b { font-family: var(--display); font-size: 15px; color: var(--ink); }

  .pill {
    align-self: center; min-height: 36px; display: flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 999px;
    background: var(--board); border: 1px solid var(--board-edge); font-weight: 800; font-size: 14px; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pill.on.r { background: var(--red); color: #3A0C08; border-color: var(--red); }
  .pill.on.b { background: var(--blue); color: #08234A; border-color: var(--blue); }
  .pill.flip { transform: rotate(180deg); }
  .status { margin: 0; text-align: center; font-weight: 800; font-size: 14px; min-height: 22px; color: var(--muted); }
  .status.me { color: var(--ink); }

  .stage { position: relative; margin: 0 auto; }
  .paper {
    position: relative; border-radius: 12px; padding-left: 8px; touch-action: none; cursor: pointer;
    --inkR: #D23B3B; --inkB: #2B62C9; --inkN: #7C7C80; --dot: #1E2433; --fillR: #F7C3BF; --fillB: #C6D7F6;
    --txtR: #A82626; --txtB: #1D4BA3; --hl: #F4C152;
    background-color: #FBF7EC;
    background-image:
      linear-gradient(90deg, transparent 3px, rgba(222,82,82,.7) 3px, rgba(222,82,82,.7) 5px, transparent 5px),
      repeating-linear-gradient(180deg, transparent 0 21px, rgba(96,146,214,.33) 21px 22px);
    box-shadow: 0 5px 0 rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.25);
  }
  .paper.t-kotak {
    background-image:
      linear-gradient(90deg, transparent 3px, rgba(222,82,82,.7) 3px, rgba(222,82,82,.7) 5px, transparent 5px),
      repeating-linear-gradient(90deg, transparent 0 13px, rgba(96,146,214,.24) 13px 14px),
      repeating-linear-gradient(180deg, transparent 0 13px, rgba(96,146,214,.24) 13px 14px);
  }
  .paper.t-tulis {
    --inkR: #FF9F97; --inkB: #9CC4FF; --inkN: #C9CFC9; --dot: #F4F4EC; --fillR: rgba(255,130,120,.34); --fillB: rgba(120,170,255,.34);
    --txtR: #FFE0DC; --txtB: #E0ECFF; --hl: #FFF3B0;
    background-color: #22463B;
    background-image: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.07), transparent 60%), radial-gradient(ellipse at 80% 90%, rgba(255,255,255,.05), transparent 55%);
    box-shadow: 0 0 0 5px #7A5230, 0 5px 0 5px rgba(0,0,0,.3);
  }
  #svg { display: block; overflow: visible; }
  .dot { fill: var(--dot); }
  .ln { fill: none; stroke-linecap: round; stroke-width: .09; visibility: hidden; }
  .ln.on { visibility: visible; }
  .p1 { stroke: var(--inkR); } .p2 { stroke: var(--inkB); }
  .ln.p3 { stroke: var(--inkN); stroke-width: .075; stroke-dasharray: .12 .08; }
  .ln.draw { stroke-dasharray: 1 1; animation: stroke var(--sd, .25s) ease-out both; }
  @keyframes stroke { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  .ghost { fill: none; stroke-linecap: round; stroke-width: .17; visibility: hidden; opacity: .5; }
  .ghost.on { visibility: visible; animation: ghost .8s ease-in-out infinite alternate; }
  @keyframes ghost { from { opacity: .3; } to { opacity: .62; } }
  #hl { fill: none; stroke: var(--hl); stroke-width: .34; stroke-linecap: round; opacity: 0; }
  #hl.on { animation: hl 2s ease-out forwards; }
  @keyframes hl { 0% { opacity: .75; } 60% { opacity: .5; } 100% { opacity: 0; } }
  .bx { visibility: hidden; }
  .bx.o1, .bx.o2 { visibility: visible; }
  .bx rect { transform-box: fill-box; transform-origin: center; }
  .bx.o1 rect { fill: var(--fillR); } .bx.o2 rect { fill: var(--fillB); }
  .bx text { font-family: var(--display); font-weight: 800; font-size: .44px; text-anchor: middle; dominant-baseline: central; }
  .bx.o1 text { fill: var(--txtR); } .bx.o2 text { fill: var(--txtB); }
  .bx.in rect { animation: boxIn .32s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes boxIn { from { transform: scale(.1); } to { transform: scale(1); } }
  .fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .float {
    position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-weight: 800; font-size: 22px;
    color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 0 6px rgba(0,0,0,.35); animation: rise .9s ease-out forwards; white-space: nowrap;
  }
  @keyframes rise { from { opacity: 1; transform: translate(-50%, -50%); } to { opacity: 0; transform: translate(-50%, calc(-50% - 46px)); } }
  .stamp { position: absolute; transform: translate(-50%, -50%); font-size: 26px; font-weight: 800; color: #2E8B57; animation: stamp .7s ease-out forwards; }
  @keyframes stamp { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2.2) rotate(-18deg); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-8deg); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(.9) rotate(-8deg); } }
  .banner {
    position: absolute; left: 50%; top: -8px; transform: translate(-50%, -100%); background: var(--tile); color: var(--tile-ink);
    font-family: var(--display); font-weight: 800; font-size: 17px; padding: 4px 14px; border-radius: 999px; white-space: nowrap;
    box-shadow: inset 0 -3px 0 var(--tile-shade); animation: banner 2.2s ease-out forwards; z-index: 3;
  }
  @keyframes banner { 0% { opacity: 0; transform: translate(-50%, -60%) scale(.7); } 12% { opacity: 1; transform: translate(-50%, -100%) scale(1.08); } 20% { transform: translate(-50%, -100%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
  .hint { font-size: 12.5px; color: var(--muted); text-align: center; margin: 0; }
  .confetti { position: fixed; top: -14px; width: 5px; height: 16px; border-radius: 2px; z-index: 50; pointer-events: none; animation: fall 1.6s ease-in forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .7; } }

  /* Panel */
  .overlay { position: fixed; inset: 0; background: rgba(5, 20, 20, .88); display: grid; place-items: center; padding: 16px; z-index: 60; overflow-y: auto; }
  .panel {
    width: 100%; max-width: 380px; background: var(--board); border: 1px solid var(--board-edge); border-radius: 16px;
    padding: 20px 16px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center;
    animation: slideUp .28s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .panel h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 27px; line-height: 1.1; color: var(--tile); }
  .panel h3 { margin: 2px 0 -4px; font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; align-self: flex-start; }
  .panel p { margin: 0; color: var(--muted); line-height: 1.45; }
  .panel b { color: var(--ink); }
  .col { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .row { display: flex; gap: 8px; width: 100%; }
  .row .btn { flex: 1; }
  .btn {
    border: 1px solid var(--board-edge); background: var(--ground); color: var(--ink); border-radius: 10px;
    padding: 11px 8px; font-weight: 800; font-size: 14px; cursor: pointer; line-height: 1.2; min-height: 44px;
  }
  .btn.main { background: var(--tile); color: var(--tile-ink); border: 0; box-shadow: inset 0 -4px 0 var(--tile-shade); font-family: var(--display); font-size: 20px; }
  .seg { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 6px; width: 100%; }
  .opt {
    border: 1px solid var(--board-edge); background: var(--ground); color: var(--ink); border-radius: 10px; min-height: 52px;
    padding: 6px 4px; font-weight: 800; font-size: 14px; cursor: pointer; line-height: 1.15; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  }
  .opt small { font-size: 11px; color: var(--muted); font-weight: 600; }
  .opt[aria-pressed="true"] { background: var(--tile); color: var(--tile-ink); border-color: var(--tile); box-shadow: inset 0 -3px 0 var(--tile-shade); }
  .opt[aria-pressed="true"] small { color: var(--tile-ink); }
  .opt.locked { opacity: .55; }
  .note { font-size: 12.5px; }
  .help { text-align: left; margin: 0; padding-left: 20px; color: var(--ink); line-height: 1.5; display: flex; flex-direction: column; gap: 6px; }
  .help li::marker { color: var(--tile); }
  .versus { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; width: 100%; }
  .versus .side2 { background: var(--ground); border: 2px solid var(--board-edge); border-radius: 12px; padding: 10px 6px; min-width: 0; }
  .versus .side2.win { border-color: var(--good); }
  .versus .who { font-weight: 800; overflow-wrap: anywhere; }
  .versus .pts { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .versus .r .pts { color: var(--red); } .versus .b .pts { color: var(--blue); }
  .versus .vs { font-family: var(--display); font-weight: 800; color: var(--tile); }
  .mini { display: grid; gap: 3px; justify-content: center; }
  .mini i { width: 16px; height: 16px; border-radius: 3px; display: block; }
  .mini .m1 { background: var(--red); } .mini .m2 { background: var(--blue); } .mini .m0 { background: #3F5957; }
  .tip { background: var(--ground); border: 1px dashed var(--tile-shade); border-radius: 12px; padding: 10px 12px; text-align: left; width: 100%; }
  .tip b { color: var(--tile); display: block; font-family: var(--display); font-size: 16px; }
  .tip.lock { border-color: var(--board-edge); opacity: .7; }
  .fam { width: 100%; display: flex; flex-direction: column; gap: 4px; }
  .fam div { display: flex; justify-content: space-between; gap: 8px; background: var(--ground); border-radius: 8px; padding: 7px 10px; font-size: 13px; font-weight: 800; }
  .fam span:last-child { color: var(--tile); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .name-input {
    width: 100%; padding: 10px 12px; border-radius: 10px; text-align: center; border: 2px solid var(--board-edge);
    background: var(--ground); color: var(--ink); font-family: var(--body); font-weight: 800; font-size: 18px; user-select: text; -webkit-user-select: text; min-height: 48px;
  }
  .name-input.r { border-color: var(--red); } .name-input.b { border-color: var(--blue); }
  .swatch { width: 100%; height: 34px; border-radius: 6px; margin-bottom: 2px; }
  .toast {
    position: fixed; left: 50%; top: calc(62px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    background: var(--ink); color: var(--ground); font-weight: 800; font-size: 13px; padding: 8px 14px; border-radius: 999px;
    z-index: 70; max-width: calc(100% - 32px); text-align: center; pointer-events: none;
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .best.bump, .side b.bump, .panel, .bx.in rect, .ghost.on, .ln.draw, .stamp, .float { animation: none; }
    .stamp, .float { display: none; }
    #hl.on { animation: none; opacity: .5; }
    .confetti { display: none; }
  }
</style>

<div class="wrap" id="wrap">
  <header>
    <div class="brand-box">
      <a class="hub" href="/">‹ Dehayuk</a>
      <div class="brand">Titik<span>Kotak</span></div>
    </div>
    <div class="head-right">
      <div class="best" id="bestBox" title="Menang melawan Komputer">🏆 <span id="best">0</span></div>
      <button class="icon-btn" id="btnSound" type="button" aria-label="Matikan suara" title="Suara">🔊</button>
    </div>
  </header>

  <section id="home">
    <div class="hero">
      <svg class="logo" viewBox="0 0 62 62" aria-hidden="true">
        <rect width="62" height="62" rx="10" fill="#FBF7EC"/>
        <path d="M0 14H62M0 25H62M0 36H62M0 47H62M0 58H62" stroke="#9DBBE3" stroke-width="1"/>
        <path d="M7 0V62" stroke="#E07070" stroke-width="2"/>
        <rect x="15" y="15" width="16" height="16" rx="2" fill="#F7C3BF"/>
        <rect x="33" y="33" width="16" height="16" rx="2" fill="#C6D7F6"/>

<script>
/*CORE:BEGIN*/
// Aturan murni Titik Kotak: tanpa DOM, bisa diuji di Node.
const GameCore = (() => {
  const SIZES = [
    { name: "Kecil", R: 4, C: 4 },
    { name: "Sedang", R: 5, C: 6 },
    { name: "Besar", R: 6, C: 7 }
  ];
  const LEVELS = ["Mudah", "Sedang", "Sulit", "Jago"];
  const DAILY_LAUNCH = "2026-09-26"; // Harian #1
  const now = () => (typeof performance !== "undefined" && performance.now ? performance.now() : Date.now());

  // Generator acak mulberry32 (sama dengan game Dehayuk lain).
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);

  function next(g) {

  // ---------- Geometri papan ----------
  // Titik R baris x C kolom. Garis mendatar dulu (R*(C-1)), lalu garis tegak ((R-1)*C).
  const GEO = {};
  function geo(R, C) {
    const key = R + "x" + C;
    if (GEO[key]) return GEO[key];
    const W = C - 1, NH = R * W, E = NH + (R - 1) * C, B = (R - 1) * W;

      eb[2 * e] = r > 0 ? (r - 1) * W + c : -1;
      eb[2 * e + 1] = r < R - 1 ? r * W + c : -1;

    for (let r = 0; r < R - 1; r++) for (let c = 0; c < C; c++) {

      mx[e] = c; my[e] = r + 0.5;
      eb[2 * e] = c > 0 ? r * W + c - 1 : -1;
      eb[2 * e + 1] = c < W ? r * W + c : -1;
    }
    for (let r = 0; r < R - 1; r++) for (let c = 0; c < W; c++) {

      be[4 * b] = r * W + c; be[4 * b + 1] = (r + 1) * W + c;

  // ---------- Permainan ----------
  // g.ed[e]: 0 kosong, 1 garis pemain 1 (merah), 2 pemain 2 (biru), 3 garis bawaan (netral).
  function newGame(o) {
    const g = { v: 1, R: o.R, C: o.C, pre: (o.pre || []).slice(), hist: [], first: o.first ? 1 : 0, seed: (o.seed || 0) >>> 0, rs: (o.seed || 0) | 0 };
    rebuild(g);

  }
  // Menyusun ulang seluruh keadaan dari garis bawaan + riwayat langkah. Mengembalikan false bila ada yang tidak sah.
  function rebuild(g) {
    const G = geo(g.R, g.C);

    g.ed = new Array(G.E).fill(0); g.own = new Array(G.B).fill(0); g.cnt = new Array(G.B).fill(0);
    g.turn = g.first; g.sc = [0, 0]; g.over = false; g.chain = 0; g.bestChain = [0, 0]; g.minLead = [0, 0];

      g.ed[e] = 3;
      for (let k = 0; k < 2; k++) { const b = G.eb[2 * e + k]; if (b >= 0 && ++g.cnt[b] > 2) return false; }
    }
    for (const e of hist) if (!play(g, e)) return false;
    return true;
  }
  function play(g, e) {
    const G = geo(g.R, g.C);
    if (!g || g.over || !Number.isInteger(e) || e < 0 || e >= G.E || g.ed[e]) return null;
    const p = g.turn, caps = [];
    g.ed[e] = p + 1;
    for (let k = 0; k < 2; k++) {
      const b = G.eb[2 * e + k];
      if (b >= 0 && ++g.cnt[b] === 4) { g.own[b] = p + 1; caps.push(b); }

      g.sc[p] += caps.length; g.chain += caps.length;
      if (g.chain > g.bestChain[p]) g.bestChain[p] = g.chain;
    } else { g.turn = 1 - p; g.chain = 0; }
    const lead = g.sc[0] - g.sc[1];
    if (lead < g.minLead[0]) g.minLead[0] = lead;
    if (-lead < g.minLead[1]) g.minLead[1] = -lead;
    g.over = g.sc[0] + g.sc[1] === G.B;
    return { e, p, caps, chain: caps.length ? g.chain : 0, again: caps.length > 0 && !g.over, over: g.over };
  }
  // Batal (khusus Mudah): kembali ke sebelum langkah terakhir pemain `who`, termasuk langkah lawan sesudahnya.
  function undoHuman(g, who) {
    const i = g.movers.lastIndexOf(who);
    if (i < 0 || g.over) return false;
    g.hist = g.hist.slice(0, i);
    return rebuild(g);
  }
  function restore(o) {
    if (!o || o.v !== 1 || sizeOf(o.R, o.C) < 0 || !Array.isArray(o.pre) || !Array.isArray(o.hist) ||
      (o.first !== 0 && o.first !== 1) || !Number.isInteger(o.rs)) return null;
    const G = geo(o.R, o.C);
    if (o.pre.length > 12 || o.hist.length > G.E) return null;
    const g = { v: 1, R: o.R, C: o.C, pre: o.pre.slice(), hist: o.hist.slice(), first: o.first, seed: (o.seed || 0) >>> 0, rs: o.rs };
    return rebuild(g) ? g : null;
  }

  // ---------- Papan bawaan (Harian dan Tantangan) ----------
  // Garis netral acak; tidak ada kotak yang punya 3 sisi atau tertutup.
  function genPre(seed, R, C) {
    const G = geo(R, C), r = rng(seed);
    for (const target of [6, 4]) {
      const cnt = new Array(G.B).fill(0), used = new Uint8Array(G.E), out = [];
      for (let tries = 0; tries < 200 && out.length < target; tries++) {
        const e = Math.floor(r() * G.E);
        if (used[e]) continue;
        const b1 = G.eb[2 * e], b2 = G.eb[2 * e + 1];
        if ((b1 >= 0 && cnt[b1] >= 2) || (b2 >= 0 && cnt[b2] >= 2)) continue;
        used[e] = 1; out.push(e);
        if (b1 >= 0) cnt[b1]++;
        if (b2 >= 0) cnt[b2]++;
      }
      if (out.length === target) return out;
    }
    return [];
  }

  // ---------- Kecerdasan Komputer ----------
  // Keadaan cepat: d[e] garis sudah ditarik, c[b] jumlah sisi kotak.
  function stateOf(g) {
    const G = geo(g.R, g.C), d = new Uint8Array(G.E), c = new Uint8Array(G.B);
    for (let e = 0; e < G.E; e++) d[e] = g.ed[e] ? 1 : 0;
    for (let b = 0; b < G.B; b++) c[b] = g.cnt[b];
    return { G, d, c };
  }
  function draw(G, d, c, e) {
    d[e] = 1;
    let n = 0;
    const b1 = G.eb[2 * e], b2 = G.eb[2 * e + 1];
    if (b1 >= 0 && ++c[b1] === 4) n++;
    if (b2 >= 0 && ++c[b2] === 4) n++;
    return n;
  }
  function undraw(G, d, c, e) {
    d[e] = 0;
    const b1 = G.eb[2 * e], b2 = G.eb[2 * e + 1];
    if (b1 >= 0) c[b1]--;
    if (b2 >= 0) c[b2]--;
  }
  const otherBox = (G, e, b) => (G.eb[2 * e] === b ? G.eb[2 * e + 1] : G.eb[2 * e]);
  function missing(G, d, b) {
    for (let k = 0; k < 4; k++) { const e = G.be[4 * b + k]; if (!d[e]) return e; }
    return -1;
  }
  function nextEdge(G, d, b, from) {
    for (let k = 0; k < 4; k++) { const e = G.be[4 * b + k]; if (!d[e] && e !== from) return e; }
    return -1;
  }
  function isSafe(G, c, e) {
    const b1 = G.eb[2 * e], b2 = G.eb[2 * e + 1];
    return (b1 < 0 || c[b1] < 2) && (b2 < 0 || c[b2] < 2);
  }
  function safeEdges(G, d, c) {
    const out = [];
    for (let e = 0; e < G.E; e++) if (!d[e] && isSafe(G, c, e)) out.push(e);
    return out;
  }
  function hasSafe(G, d, c) {
    for (let e = 0; e < G.E; e++) if (!d[e] && isSafe(G, c, e)) return true;
    return false;
  }
  function capEdges(G, d, c) {
    const out = [];
    for (let b = 0; b < G.B; b++) if (c[b] === 3) { const e = missing(G, d, b); if (out.indexOf(e) < 0) out.push(e); }
    return out;
  }
  function undrawnList(G, d) {
    const out = [];
    for (let e = 0; e < G.E; e++) if (!d[e]) out.push(e);
    return out;
  }
  // Ambil semua kotak yang bisa diambil berturut-turut. Mengubah d dan c; mengembalikan jumlah kotak.
  function greedy(G, d, c, rec) {
    let K = 0, found = true;
    while (found) {
      found = false;
      for (let b = 0; b < G.B; b++) if (c[b] === 3) {
        const e = missing(G, d, b);
        if (rec) rec.push(e);
        K += draw(G, d, c, e);
        found = true;
      }
    }
    return K;
  }
  // Rangkaian kotak yang sedang terbuka (bisa diambil). t 'a': berujung di tepi/simpang; 'b': kedua ujungnya terbuka (lingkaran dibuka).
  // cost = kotak yang direlakan untuk tetap memegang kendali (2 untuk rantai, 4 untuk lingkaran), 0 bila tidak bisa.
  function threads(G, d, c) {
    const vis = new Uint8Array(G.B), out = [];
    for (let b0 = 0; b0 < G.B; b0++) {
      if (c[b0] !== 3 || vis[b0]) continue;
      vis[b0] = 1;
      const path = [b0];
      let e = missing(G, d, b0), cur = b0, t = "a", far = -1;
      for (;;) {
        const nb = otherBox(G, e, cur);
        if (nb < 0 || c[nb] < 2) { far = e; break; }
        if (c[nb] === 3) { vis[nb] = 1; path.push(nb); t = "b"; break; }
        vis[nb] = 1; path.push(nb);
        e = nextEdge(G, d, nb, e); cur = nb;
      }
      const cost = t === "a" ? (path.length >= 2 ? 2 : 0) : (path.length >= 4 ? 4 : 0);
      out.push({ t, path, far, cost });
    }
    return out;
  }
  // Pecah papan akhir (tanpa garis aman) menjadi rantai dan lingkaran. Kotak simpang digabung ke dua cabang terpanjangnya.
  // Hasil: angka n untuk rantai, 1000+n untuk lingkaran.
  function decompose(G, d, c) {
    const seg = new Int16Array(G.B).fill(-1), segs = [];

          if (c[nb] === 2) {
            if (seg[nb] === id) { s.loop = true; break; }
            seg[nb] = id; s.n++;
            e = nextEdge(G, d, nb, e); cur = nb;
          } else { s.ends.push(nb); break; }
        }
      }
    }
    const par = segs.map((_, i) => i), size = segs.map((s) => s.n), loop = segs.map((s) => s.loop);
    const find = (x) => { while (par[x] !== x) x = par[x] = par[par[x]]; return x; };
    const att = {};
    segs.forEach((s, i) => { for (const j of s.ends) if (j >= 0) (att[j] = att[j] || []).push(i); });
    for (const j in att) {
      const L = att[j].slice().sort((x, y) => size[find(y)] - size[find(x)]);
      if (L.length === 1) { size[find(L[0])] += 1; continue; }
      const ra = find(L[0]), rb = find(L[1]);
      if (ra === rb) { loop[ra] = true; size[ra] += 1; }
      else { par[rb] = ra; size[ra] += size[rb] + 1; loop[ra] = loop[ra] || loop[rb]; }
    }
    const out = [];
    for (let i = 0; i < segs.length; i++) if (find(i) === i) out.push(loop[i] && size[i] >= 4 ? 1000 + size[i] : size[i]);
    return out;
  }
  // Nilai terbaik (kotakku - kotak lawan) bagi pemain yang terpaksa membuka salah satu komponen.
  const memo = new Map();
  function dpVal(list) {
    if (!list.length) return 0;
    list.sort((a, b) => a - b);
    const key = list.join(",");
    const hit = memo.get(key);
    if (hit !== undefined) return hit;
    let best = -Infinity;
    for (let i = 0; i < list.length; i++) {
      if (i > 0 && list[i] === list[i - 1]) continue;
      const rest = list.slice(0, i).concat(list.slice(i + 1));
      const r = dpVal(rest), x = list[i];
      let opp;
      if (x >= 1000) { const n = x - 1000; opp = Math.max(n + r, n - 8 - r); }
      else if (x <= 2) opp = x + r;
      else opp = Math.max(x + r, x - 4 - r);
      if (-opp > best) best = -opp;

  let lastK = 0;
  function endValue(G, d, c) {
    const th = threads(G, d, c);
    let cost = 0;
    for (const t of th) if (t.cost && (!cost || t.cost < cost)) cost = t.cost;
    const d2 = d.slice(), c2 = c.slice();
    const K = greedy(G, d2, c2);
    const V = dpVal(decompose(G, d2, c2));

    let v = K + V;
    if (cost && K - 2 * cost - V > v) v = K - 2 * cost - V;
    return v;
  }
  const pick = (arr, rand) => arr[Math.floor(rand() * arr.length)];

  // Terpaksa membuka: pilih garis yang paling sedikit menguntungkan lawan.
  function bestOpening(G, d, c, rand, smart) {
    let best = [], bv = Infinity, bk = Infinity;
    for (let e = 0; e < G.E; e++) {
      if (d[e]) continue;

      let v, k;
      if (smart) { v = endValue(G, d, c); k = lastK; }
      else { const d2 = d.slice(), c2 = c.slice(); k = greedy(G, d2, c2); v = k; }
      undraw(G, d, c, e);
      if (v < bv || (v === bv && k < bk)) { bv = v; bk = k; best = [e]; }

  // Keputusan saat ada kotak yang bisa diambil: ambil semua, atau "korbankan 2" untuk tetap memegang kendali.
  function captureChoice(G, d, c, rand) {
    const caps = capEdges(G, d, c);

    for (const t of th) if (t.cost && (!opt || t.cost < opt.cost || (t.cost === opt.cost && t.path.length > opt.path.length))) opt = t;

      if (opt.path.length > 4) return missing(G, d, opt.path[0]);

  function rollout(G, d, c, back) {

// Nama garis untuk pembaca layar: arah, baris, dan kolom (mulai dari 1).
function edgeName(e, who) {
  const h = e < G.NH, k = h ? e : e - G.NH, n = h ? G.W : G.C;
  return who + " menarik garis " + (h ? "mendatar" : "tegak") + " baris " + (Math.floor(k / n) + 1) + " kolom " + (k % n + 1) + ".";

// Satu langkah (pemain atau Komputer). Hasil resmi dicatat seketika saat permainan selesai.
function applyMove(e, byCpu) {
  const cur = run, g = cur.g;
  const res = GameCore.play(g, e);
  if (!res) return false;
  hoverEdge = -1;
  setGhost(-1);
  $("hint").hidden = true;
  const el = lineEls[e];
  el.setAttribute("class", lineCls(e) + (RM ? "" : " draw"));
  el.style.setProperty("--sd", byCpu ? ".25s" : ".12s");
  hlEl.setAttribute("d", wob[e]);
  hlEl.setAttribute("class", "");
  void hlEl.getBoundingClientRect();
  hlEl.setAttribute("class", "on");
  scratch();
  buzz(8);
  const who = cur.kind === "duo" ? cur.names[res.p] : res.p === 0 ? "Kamu" : "Komputer";
  if (res.caps.length) {
    const delay = byCpu ? 180 : 60;
    later(() => {
      res.caps.forEach((b, i) => {
        boxEls[b].setAttribute("class", "bx o" + (res.p + 1) + " in");
        boxEls[b].lastChild.textContent = cur.ini[res.p];
        const [x, y] = boxCenter(b);
        floatText(x, y, "✓", "stamp");
        sfx.pop(res.chain - res.caps.length + i + 1);
      });
      if (res.chain >= 3) {
        const [x, y] = boxCenter(res.caps[0]);
        floatText(x, y - cell * 0.35, "Rantai " + res.chain + "!");
      }
      bump($("sc" + res.p));
    }, delay);
    buzz([15, 30, 15]);
    say(who + " merebut " + res.caps.length + " kotak. " + cur.names[0] + " " + g.sc[0] + ", " + cur.names[1] + " " + g.sc[1] + ".");
    if (cur.kind !== "duo" && res.p === 0 && res.chain >= 5) earnBadge("rantai");
  } else if ((byCpu || cur.kind === "duo") && !res.over) {
    // Langkah biasa lawan juga diumumkan ke pembaca layar (aria-live), tidak hanya saat merebut kotak.
    say(edgeName(e, who) + " " + (cur.kind === "duo" ? "Giliran " + cur.names[g.turn] + "." : "Giliranmu."));
  }
  renderHud();
  if (res.over) {
    ptr = null;
    finalize(cur);
    later(showResult, RM ? 300 : 1100);
    return true;
  }
  saveRun();
  if (isCpuTurn()) later(aiStep, byCpu ? (res.caps.length ? 430 : 520) : 520);
  return true;
}
function aiStep() {
  if (!run || run.g.over || !isCpuTurn()) return;
  const e = GameCore.aiMove(run.g, lvOf(run), { capMs: 200 });
  applyMove(e, true);
}
function commit(e) {
  if (!canHuman() || e < 0 || run.g.ed[e]) return;
  applyMove(e, false);
}

// ---------- Sentuhan, tetikus, keyboard ----------
let ptr = null;
// Ketukan dipetakan ke garis kosong terdekat (jarak ke titik tengah garis, bentuk belah ketupat).
function hitEdge(cx, cy) {
  if (!svg) return -1;
  const r = svg.getBoundingClientRect();
  if (!r.width) return -1;
  const ux = (cx - r.left) / r.width * (G.W + 2 * M) - M, uy = (cy - r.top) / r.height * (G.R - 1 + 2 * M) - M;
  let best = -1, bd = 0.56;
  for (let e = 0; e < G.E; e++) {
    if (run.g.ed[e]) continue;
    const dd = Math.abs(ux - G.mx[e]) + Math.abs(uy - G.my[e]);
    if (dd < bd) { bd = dd; best = e; }
  }
  return best;
}
paperEl.addEventListener("pointerdown", (ev) => {
  if (!canHuman()) return;
  if (ev.pointerType === "mouse" && ev.button !== 0) return;
  ptr = { id: ev.pointerId, x: ev.clientX, y: ev.clientY, type: ev.pointerType };
  ev.preventDefault();
});
document.addEventListener("pointerup", (ev) => {
  if (!ptr || ev.pointerId !== ptr.id) return;
  const p = ptr;
  ptr = null;
  if (!canHuman() || Math.hypot(ev.clientX - p.x, ev.clientY - p.y) > 26) return;
  const e = hitEdge(p.x, p.y);
  if (e < 0) { if (ghost >= 0) { setGhost(-1); renderHud(); } return; }
  if (p.type === "mouse" || S.settings.oneTap || ghost === e) commit(e);
  else { setGhost(e); sfx.tap(); buzz(5); renderHud(); }
});
document.addEventListener("pointercancel", (ev) => { if (ptr && ev.pointerId === ptr.id) ptr = null; });
paperEl.addEventListener("pointermove", (ev) => {
  if (ev.pointerType !== "mouse" || !canHuman() || ptr) return;
  const e = hitEdge(ev.clientX, ev.clientY);
  if (e !== hoverEdge) { hoverEdge = e; setGhost(e); }
});
paperEl.addEventListener("pointerleave", (ev) => { if (ev.pointerType === "mouse" && hoverEdge >= 0) { hoverEdge = -1; setGhost(-1); } });
document.addEventListener("keydown", (ev) => {
  if ($("play").hidden || !$("overlay").hidden || !canHuman() || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const tag = document.activeElement && document.activeElement.tagName;
  const mv = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[ev.key];
  if (mv) {
    ev.preventDefault();
    paperEl.focus();
    const g = run.g;
    if (kcur < 0 || g.ed[kcur]) {
      // Mulai dari garis kosong terdekat ke tengah papan.
      let best = -1, bd = Infinity;
      for (let e = 0; e < G.E; e++) if (!g.ed[e]) { const dd = Math.abs(G.mx[e] - G.W / 2) + Math.abs(G.my[e] - (G.R - 1) / 2); if (dd < bd) { bd = dd; best = e; } }
      kcur = best;
    } else {
      let best = -1, bd = Infinity;
      for (let e = 0; e < G.E; e++) {
        if (g.ed[e] || e === kcur) continue;
        const dx = G.mx[e] - G.mx[kcur], dy = G.my[e] - G.my[kcur];
        const along = dx * mv[0] + dy * mv[1];
        if (along <= 0.01) continue;
        const side = Math.abs(dx * mv[1]) + Math.abs(dy * mv[0]);
        const score = along + side * 2;
        if (score < bd) { bd = score; best = e; }
      }
      if (best >= 0) kcur = best;
    }
    setGhost(kcur);
    renderHud();
    return;
  }
  if ((ev.key === "Enter" || ev.key === " ") && kcur >= 0 && (tag !== "BUTTON" && tag !== "A")) {
    ev.preventDefault();
    const e = kcur;
    kcur = -1;
    commit(e);
  }
});

// Mencatat hasil satu kali, langsung saat permainan berakhir (sinkron, sebelum animasi apa pun).
function finalize(r) {
  if (!r || r.finalized || !r.g.over) return;
  r.finalized = true;
  const g = r.g, me = g.sc[0], op = g.sc[1], margin = me - op;
  const verdict = Math.sign(margin);
  const sz = GameCore.sizeOf(g.R, g.C);
  const res = { kind: r.kind, me, op, margin, verdict, sz, own: g.own.slice(), R: g.R, C: g.C, seed: r.seed, record: false, tip: null, theme: null, jagoNew: false, official: false };
  if (r.kind === "duo") {
    const a = r.names[0], b = r.names[1];
    const key = [a.toLowerCase(), b.toLowerCase()].sort().join("|");
    const f = S.fam[key] = S.fam[key] || { n: {}, w: {}, d: 0, t: 0 };
    f.n[a.toLowerCase()] = a; f.n[b.toLowerCase()] = b;
    if (verdict > 0) f.w[a.toLowerCase()] = (f.w[a.toLowerCase()] || 0) + 1;
    else if (verdict < 0) f.w[b.toLowerCase()] = (f.w[b.toLowerCase()] || 0) + 1;
    else f.d++;
    f.t = Date.now();
    res.famKey = key;
  } else {
    const winsBefore = S.wins;
    S.games++;
    if (verdict > 0) S.wins++;
    if (verdict < 0) S.losses++;
    if (r.kind === "cpu") {
      const k = r.lv + "-" + sz;
      const st = S.lv[k] = S.lv[k] || { w: 0, l: 0, d: 0, best: 0 };
      if (verdict > 0) st.w++; else if (verdict < 0) st.l++; else st.d++;
      // "Rekor baru" hanya bila mengalahkan selisih terbaik lama yang lebih dari 0.
      if (verdict > 0 && margin > st.best) { res.record = st.best > 0; st.best = margin; }
      if (r.lv === 2 && sz === 1 && verdict > 0 && !S.jago) { S.jago = true; res.jagoNew = true; }
      if (r.lv === 3 && verdict > 0) earnBadge("jago");
      if (sz === 0 && verdict > 0 && op === 0) earnBadge("sempurna");
    }
    if (verdict > 0 && g.minLead[0] <= -5) earnBadge("bangkit");
    if (r.kind === "daily" && !r.practice) {
      const done = S.daily && S.daily.date === r.date && S.daily.done;
      if (!done) {
        res.official = true;
        S.daily = { date: r.date, me, op, own: g.own.slice(), done: true };
        if (S.streak.last !== r.date) {
          S.streak.count = S.streak.last === GameCore.prevDay(r.date) ? S.streak.count + 1 : 1;
          S.streak.last = r.date;
        }
      }
    }
    if (r.kind === "chal" && r.chal.mode === "in") {
      const it = S.chalDone.find((x) => x.code === r.chal.code);
      if (it) { it.mine = margin; it.me = me; it.op = op; }
      if (S.pendingChal === r.chal.code) S.pendingChal = null;
    }
    // Tantangan buatan sendiri disimpan, supaya tetap bisa dikirim walau layar hasil terlewat.
    if (r.kind === "chal" && r.chal.mode === "out") S.lastOut = { seed: r.seed, sz, margin, replyTo: r.chal.replyTo || "" };
    const unlocked = TIPS.filter((t) => S.losses >= t.need).length;
    if (verdict < 0 && unlocked > S.tipsShown) { res.tip = TIPS[unlocked - 1]; S.tipsShown = unlocked; }
    const th = THEMES.find((t) => t.need > winsBefore && t.need <= S.wins);
    if (th) res.theme = th;
  }
  r.result = res;
  delete S.runs[slotOf(r)];
  save();
}

// ---------- Bagikan ----------
function shareText(text) {
  if (navigator.share) navigator.share({ text }).catch((e) => { if (!e || e.name !== "AbortError") copyText(text, true); });
  else copyText(text, true);
}
function copyText(text, wa) {
  const done = () => {
    toast("Tersalin. Tempel di WhatsApp!");
    if (wa) { try { window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener"); } catch (e) {} }
  };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("Gagal menyalin"); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}
function shareDaily() {
  const d = S.daily;
  if (!d || !d.done) return toast("Selesaikan Harian dulu, ya");
  shareText(GameCore.dailyShare({ number: GameCore.dailyNumber(d.date), me: d.me, op: d.op, grid: GameCore.shareGrid(d.own, 5, 6, 1), streak: streakNow(), url: shareUrl() }));
}
function sendChallenge(seed, sz, margin, replyTo) {
  if (!S.name) return askName(() => sendChallenge(seed, sz, margin, replyTo));
  const code = GameCore.encodeDuel({ s: seed, sz, m: margin, n: S.name });
  const B = GameCore.boxesOf(sz), op = (B - margin) / 2;
  const text = (replyTo ? "Balasan untukmu, " + replyTo + "! " : "") + "Aku " + (margin > 0 ? "menang" : margin < 0 ? "kalah" : "seri") + " " + (B - op) + " – " + op +
    " lawan Komputer Sulit di Titik Kotak ✏️\nPapannya sama persis buatmu. Bisa menang lebih telak?\n👉 " + shareUrl() + "#t=" + code;
  shareText(text);
  if (run && run.result) showResult();
}

function sendLastOut(o) {

function dailyLockOf(inv) {
  if (inv.sz !== 1) return null;
  const t = today(), p = t.split("-").map(Number);
  const keys = [t, GameCore.dateKey(new Date(p[0], p[1] - 1, p[2] + 1))];
  return keys.find((k) => GameCore.dailySeed(k) === inv.s && !(S.daily && S.daily.date === k && S.daily.done)) || null;
}

function startChalIn(inv) {
  const r = loadRun("chalIn");
  if (r && r.chal.code === inv.code) return openRun(r);
  const done = chalDoneOf(inv.code);
  if (done) return showChalDone(done);
  const lock = dailyLockOf(inv);
  if (lock) { S.pendingChal = inv.code; save(); return showDailyLock(inv, lock); }
  // Dicatat sejak mulai, supaya tantangan tidak bisa diulang dari awal untuk memperbaiki hasil.
  S.chalDone = S.chalDone.filter((x) => x.code !== inv.code).concat([{ code: inv.code, n: inv.n, m: inv.m, sz: inv.sz, mine: null }]).slice(-30);
  save();
  openRun(makeRun("chal", GameCore.seededGame(inv.s, inv.sz), { seed: inv.s, chal: { mode: "in", n: inv.n, m: inv.m, code: inv.code } }));
}

function readChalHash() {
  if (!/^#t=/.test(location.hash || "")) return;
  const m = /^#t=([A-Za-z0-9_-]{8,400})$/.exec(location.hash || "");
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  const inv = m ? GameCore.decodeDuel(m[1]) : null;
  if (!inv) { toast("Link tantangan tidak valid. Minta link baru, ya."); return; }
  inv.code = m[1];
  if (!$("play").hidden) goHome();
  const done = chalDoneOf(inv.code);
  const saved = S.runs.chalIn && S.runs.chalIn.chal && S.runs.chalIn.chal.code === inv.code;
  if (!done) { S.pendingChal = inv.code; save(); }
  renderHome();
  if (saved) { const r = loadRun("chalIn"); if (r) return openRun(r); }
  if (done) return showChalDone(done);
  const lock = dailyLockOf(inv);
  if (lock) showDailyLock(inv, lock); else showInvite(inv);
}

  $("stDaily").textContent = d ? "Selesai ✓ · " + d.me + "–" + d.op : dr && dr.date === t ? "Lanjutkan" : "#" + GameCore.dailyNumber(t) + " · Main";
  const inv = S.pendingChal ? GameCore.decodeDuel(S.pendingChal) : null;
  $("stChal").textContent = inv ? "Ditantang " + inv.n + "!" : S.runs.chalOut ? "Lanjutkan" : lastOutOk() ? "Kirim tantangan" : "Tantang";
  const st = streakNow();
  $("stats").textContent = S.games ? "Main " + S.games + " kali · menang " + S.wins + (st ? " · 🔥 " + st + " hari" : "") + (S.badges.length ? " · 🏅 " + S.badges.length : "") : "Selamat datang! Coba Lawan Komputer tingkat Mudah dulu.";
  renderToggles();
}
function renderToggles() {
  $("btnSound").textContent = S.settings.mute ? "🔇" : "🔊";
  $("btnSound").setAttribute("aria-label", S.settings.mute ? "Nyalakan suara" : "Matikan suara");
  $("btnVibe").textContent = "📳 Getar: " + (S.settings.vibrate ? "nyala" : "mati");
  $("btnTap").textContent = "👆 Ketuk sekali: " + (S.settings.oneTap ? "nyala" : "mati");
}
function goHome() {
  stopRunTimers();
  if (run && !run.g.over) saveRun();
  run = null; busy = false; G = null;
  fxEl.innerHTML = "";
  $("play").hidden = true;
  $("home").hidden = false;
  $("wrap").classList.remove("playing");
  renderHome();
}

// ---------- Panel, tombol Back, pesan ----------
let backArmed = false, overlayBack = null;
function enterScreen() {
  if (backArmed) return;
  try { history.pushState({ titik: 1 }, ""); backArmed = true; } catch (e) {}
}
function showPanel(html, wire, onBack) {
  const o = $("overlay");
  o.innerHTML = "<div class=\"panel\" role=\"dialog\" aria-modal=\"true\">" + html + "</div>";
  o.hidden = false;
  o.scrollTop = 0;
  overlayBack = onBack || null;
  ptr = null;
  enterScreen();
  if (wire) wire();
  const btn = o.querySelector(".btn.main") || o.querySelector("button");
  if (btn && !o.querySelector("input")) btn.focus();
}
function hideOverlay() { $("overlay").hidden = true; $("overlay").innerHTML = ""; overlayBack = null; }
// Back menutup panel atau kembali ke menu; tidak pernah keluar dari situs saat sedang main.
window.addEventListener("popstate", () => {
  backArmed = false;
  if (!$("overlay").hidden) {
    const after = overlayBack;
    hideOverlay();
    if (after) after();
    else if (!$("play").hidden) enterScreen();
    return;
  }
  if (!$("play").hidden) goHome();
});
window.addEventListener("hashchange", readChalHash);
let toastTimer = 0;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2400);
}

$("modeCpu").onclick = openCpuMenu;
$("modeDuo").onclick = openDuoMenu;
$("modeDaily").onclick = startDaily;
$("modeChal").onclick = openChalMenu;
$("btnHelp").onclick = showHelp;
$("btnTips").onclick = showTips;
$("btnTheme").onclick = showThemes;
$("btnMenu").onclick = goHome;
$("btnUndo").onclick = () => {
  if (!run || run.kind !== "cpu" || run.lv !== 0 || run.g.over || busy) return;
  stopRunTimers();
  if (!GameCore.undoHuman(run.g, 0)) return toast("Belum ada langkah untuk dibatalkan");
  sfx.tap();
  paintAll();
  renderHud();
  saveRun();
  say("Langkah dibatalkan. Giliranmu.");
};
$("btnRestart").onclick = () => {
  if (!run || busy) return;
  const r = run;
  showPanel("<h2>Permainan baru?</h2><p>Permainan ini tidak akan disimpan.</p>" +
    "<div class=\"row\"><button class=\"btn\" id=\"qNo\" type=\"button\">Lanjut main</button><button class=\"btn main\" id=\"qYes\" type=\"button\">Baru</button></div>",
  () => {
    $("qNo").onclick = hideOverlay;
    $("qYes").onclick = () => {
      hideOverlay();
      if (run !== r) return;
      delete S.runs[slotOf(r)];
      const sz = GameCore.sizeOf(r.g.R, r.g.C);
      if (r.kind === "cpu") startCpu(r.lv, sz);
      else if (r.kind === "duo") startDuo(r.names[0], r.names[1], sz);
      else if (r.practice) startPractice();
    };
  });
};
$("btnSound").onclick = () => { S.settings.mute = !S.settings.mute; save(); renderToggles(); if (!S.settings.mute) sfx.tap(); };
$("btnVibe").onclick = () => { S.settings.vibrate = !S.settings.vibrate; save(); renderToggles(); buzz(20); };
$("btnTap").onclick = () => {
  S.settings.oneTap = !S.settings.oneTap; save(); renderToggles();
  toast(S.settings.oneTap ? "Garis langsung ditarik dengan satu ketukan" : "Ketuk sekali untuk memilih, ketuk lagi untuk menarik");
};
let resizeRaf = 0;
window.addEventListener("resize", () => {
  if (resizeRaf) return;
  resizeRaf = requestAnimationFrame(() => { resizeRaf = 0; layout(); });
});
document.addEventListener("visibilitychange", () => { if (document.hidden && run) saveRun(); });

renderHome();
readChalHash();
</script>
</html>
