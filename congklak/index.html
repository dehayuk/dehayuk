<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3534">
<title>Congklak</title>
<meta name="description" content="Congklak (Dakon), permainan biji dan lubang warisan nenek moyang. Lawan Komputer dari Mudah sampai Jago, main berdua bersama keluarga di satu HP, dan Tantangan Harian. Gratis, langsung main di browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Font dimuat tanpa menahan tampilan pertama; bila gagal, font sistem tetap dipakai. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap"></noscript>
<style>
  :root {
    color-scheme: dark;
    --ground: #0E3534;
    --board: #15504D;
    --board-edge: #2A7A75;
    --slot-edge: #3E8C86;
    --tile: #F4C152;
    --tile-shade: #C9952A;
    --tile-ink: #3B2A05;
    --ink: #EAF6F3;
    --muted: #9EC6C0;
    --good: #7FE0A3;
    --bad: #FF7A70;
    --red: #FF7A70;
    --blue: #5EC8F2;
    --wood-dark: #5A3218;
    --wood: #8A552A;
    --wood-light: #A8703C;
    --hole: #2B170A;
    --display: "Baloo 2", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ph: 48px; --sh: 70px; --bw: 320px; --bh: 500px; --hw: 86px; --sd: 10px;
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 15px;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior-y: contain;
  }
  html.playing, body.playing { overflow: hidden; }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; font-family: var(--body); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .wrap {
    max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; min-height: 100%;
    padding: calc(10px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
  }
  body.playing .wrap { height: 100vh; height: 100dvh; min-height: 0; padding-left: calc(10px + env(safe-area-inset-left, 0px)); padding-right: calc(10px + env(safe-area-inset-right, 0px)); gap: 8px; }
  section { display: flex; flex-direction: column; gap: 12px; }
  #play { gap: 6px; flex: 1; min-height: 0; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand-box { display: flex; flex-direction: column; min-width: 0; }
  .hub { color: var(--muted); font-size: 12px; font-weight: 800; text-decoration: none; padding: 2px 0; }
  .brand { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: .5px; }
  .brand span { color: var(--tile); }
  .head-right { display: flex; align-items: center; gap: 8px; }
  .best {
    display: flex; align-items: center; gap: 6px; background: var(--board); border: 1px solid var(--board-edge);
    padding: 6px 12px; border-radius: 999px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .best.bump { animation: bump .45s ease-out; }
  @keyframes bump { 40% { transform: scale(1.18); border-color: var(--tile); } }
  .icon-btn {
    min-width: 44px; min-height: 44px; border-radius: 999px; cursor: pointer; font-size: 17px; line-height: 1;
    background: var(--board); border: 1px solid var(--board-edge); color: var(--ink); padding: 0 8px;
  }

  /* Menu utama */
  .hero {
    background: var(--board); border: 1px solid var(--board-edge); border-radius: 14px; padding: 16px;
    display: flex; gap: 14px; align-items: center;
  }
  .hero p { margin: 0; color: var(--muted); line-height: 1.45; }
  .hero b { color: var(--ink); font-family: var(--display); font-size: 19px; display: block; line-height: 1.15; }
  /* Ikon dakon kecil: perahu kayu dengan dua baris lubang dan lumbung di tiap ujung. */
  .logo {
    flex: none; width: 92px; height: 40px; border-radius: 50% / 40%; position: relative;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 2px, transparent 2px 6px), linear-gradient(180deg, var(--wood-light), var(--wood) 55%, var(--wood-dark));
    box-shadow: inset 0 2px 0 rgba(255,255,255,.18), 0 3px 0 rgba(0,0,0,.3);
    display: grid; grid-template-columns: 14px repeat(4, 11px) 14px; grid-template-rows: 11px 11px; gap: 3px 4px; place-content: center;
  }
  .logo i { width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #F3E4C2 0 2px, transparent 2.5px), radial-gradient(circle at 68% 62%, #E9D3A8 0 2px, transparent 2.5px), radial-gradient(circle, #2B170A 55%, #4A2A12 100%); }
  .logo i.st { grid-row: span 2; width: 14px; height: 25px; border-radius: 50%; }
  .stats { font-size: 12.5px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; margin: 0; }
  .modes { display: grid; gap: 10px; }
  .mode {
    display: grid; grid-template-columns: 1fr auto; grid-template-areas: "name state" "desc state";
    gap: 2px 12px; align-items: center; text-align: left; cursor: pointer;
    background: var(--board); border: 1px solid var(--board-edge); border-radius: 14px; padding: 14px 16px; color: var(--ink);
  }
  .mode-name { grid-area: name; font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1.1; }
  .mode-desc { grid-area: desc; font-size: 12.5px; color: var(--muted); }
  .mode-state {
    grid-area: state; max-width: 140px; text-align: center; font-weight: 800; font-size: 12px;
    background: var(--tile); color: var(--tile-ink); box-shadow: inset 0 -3px 0 var(--tile-shade);
    padding: 7px 10px; border-radius: 9px; font-variant-numeric: tabular-nums;
  }
  .mode.primary { border-color: var(--tile-shade); box-shadow: 0 0 0 1px var(--tile-shade) inset; }
  .mode.primary .mode-name { color: var(--tile); }
  .mode.done .mode-state { background: transparent; box-shadow: none; color: var(--good); border: 1px solid var(--good); }
  .home-foot { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .link-btn { background: none; border: 1px solid var(--board-edge); color: var(--muted); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 12.5px; cursor: pointer; min-height: 44px; }
  .home-foot a { color: var(--muted); font-size: 12px; padding: 10px; }

  /* Layar main */
  .topbar { display: flex; align-items: center; gap: 6px; min-height: 44px; }
  .back {
    background: none; border: 1px solid var(--board-edge); color: var(--ink); border-radius: 8px;
    min-height: 44px; padding: 8px 12px; font-weight: 800; font-size: 13px; cursor: pointer; flex: none;
  }
  .chip {
    font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--tile); border: 1px solid var(--tile-shade); padding: 1px 10px; border-radius: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .tb-right { margin-left: auto; display: flex; gap: 6px; flex: none; }
  .skip { background: var(--tile); color: var(--tile-ink); border: 0; box-shadow: inset 0 -3px 0 var(--tile-shade); border-radius: 999px; min-height: 44px; padding: 0 14px; font-weight: 800; font-size: 14px; cursor: pointer; }

  .arena { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; touch-action: none; }
  .stagebox { position: relative; width: var(--bw); height: var(--bh); transition: transform .55s cubic-bezier(.3,.1,.2,1); }
  .stagebox.flip { transform: rotate(180deg); }
  /* Papan dakon: perahu kayu berukir, serat kayu dari gradien berulang. */
  .dakon {
    position: absolute; inset: 0; border-radius: 50% / calc(var(--sh) * 1.5);
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 2px, transparent 2px 7px),
      repeating-linear-gradient(90deg, rgba(255,230,190,.05) 0 1px, transparent 1px 17px),
      radial-gradient(ellipse at 30% 20%, rgba(255,220,170,.16), transparent 55%),
      linear-gradient(90deg, #633719, var(--wood) 22%, var(--wood-light) 50%, var(--wood) 78%, #5C3216);
    box-shadow: inset 0 0 0 2px rgba(255,214,160,.14), inset 0 -6px 14px rgba(0,0,0,.35), 0 8px 0 #3A1F0D, 0 14px 24px rgba(0,0,0,.45);
  }
  /* Saat papan diputar, tebal kayu tetap tampak di bawah. */
  .stagebox.flip .dakon { box-shadow: inset 0 0 0 2px rgba(255,214,160,.14), inset 0 6px 14px rgba(0,0,0,.35), 0 -8px 0 #3A1F0D, 0 -14px 24px rgba(0,0,0,.45); }
  .dakon::before { content: ""; position: absolute; inset: 7px; border-radius: inherit; border: 1.5px solid rgba(255,214,160,.16); pointer-events: none; }
  .cols {
    position: absolute; left: 10px; right: 10px; top: calc(var(--sh) + 11px); height: calc(var(--ph) * 7);
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(7, var(--ph)); column-gap: 6px;
  }
  .cols::before { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 3px; margin-left: -1.5px; border-radius: 3px; background: rgba(40,20,8,.45); box-shadow: 1px 0 0 rgba(255,220,170,.12); }
  .col-glow { position: absolute; top: -4px; bottom: -4px; width: calc(50% - 3px); border-radius: 24px; pointer-events: none; opacity: 0; transition: opacity .25s; }
  .col-glow.a { left: 0; box-shadow: 0 0 0 2px var(--red), 0 0 18px rgba(255,122,112,.5); background: rgba(255,122,112,.08); }
  .col-glow.b { right: 0; box-shadow: 0 0 0 2px var(--blue), 0 0 18px rgba(94,200,242,.5); background: rgba(94,200,242,.08); }
  .col-glow.on { opacity: 1; }
  .pit {
    position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 4px;
    background: none; border: 0; color: var(--ink); cursor: pointer; border-radius: 16px; min-width: 0;
  }
  .pit.b { flex-direction: row-reverse; }
  .num {
    display: inline-block; min-width: 28px; text-align: center; font-family: var(--display); font-weight: 800;
    font-size: clamp(18px, calc(var(--ph) * .44), 26px); line-height: 1; color: #FFF3DC; text-shadow: 0 2px 0 rgba(0,0,0,.45);
    font-variant-numeric: tabular-nums; transition: transform .45s;
  }
  .hole {
    position: relative; flex: none; width: var(--hw); height: calc(var(--ph) - 8px); border-radius: 50%;
    background: radial-gradient(ellipse at 50% 38%, #1E0F05 0%, var(--hole) 50%, #4A2A12 100%);
    box-shadow: inset 0 4px 7px rgba(0,0,0,.7), inset 0 -2px 3px rgba(255,210,150,.12), 0 1px 0 rgba(255,225,180,.18);
  }
  .pit.ok .hole { box-shadow: inset 0 4px 7px rgba(0,0,0,.7), 0 0 0 2px rgba(255,236,190,.55), 0 0 10px rgba(255,220,150,.35); }
  @media (hover: hover) { .pit.ok:hover .hole { box-shadow: inset 0 4px 7px rgba(0,0,0,.7), 0 0 0 3px #FFE7B0, 0 0 12px rgba(255,220,150,.6); } }
  .pit.dim .num { opacity: .45; }
  .pit.flash .hole { animation: flash .45s ease-out; }
  @keyframes flash { 30% { box-shadow: inset 0 4px 7px rgba(0,0,0,.5), 0 0 0 3px #fff, 0 0 18px #fff; } }
  .pit.shake, .store.shake { animation: pshake .32s linear; }
  @keyframes pshake { 0%,100% { translate: 0 0; } 20% { translate: -4px 1px; } 40% { translate: 4px -1px; } 60% { translate: -3px 0; } 80% { translate: 3px 1px; } }
  .pit.hint .hole { animation: hint 1s ease-in-out infinite; }
  @keyframes hint { 50% { box-shadow: inset 0 4px 7px rgba(0,0,0,.7), 0 0 0 4px var(--tile), 0 0 20px var(--tile); } }
  /* Lubang hangus: tertutup papan gelap, dilewati semua taburan. */
  .pit.burn .hole { background: repeating-linear-gradient(45deg, #1A110A 0 5px, #241710 5px 10px); box-shadow: inset 0 0 0 2px rgba(0,0,0,.5), 0 1px 0 rgba(255,225,180,.1); }
  .pit.burn .hole::after { content: "hangus"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: rgba(255,230,200,.45); letter-spacing: .5px; }
  .store {
    position: absolute; left: 50%; width: calc(var(--bw) * .6); margin-left: calc(var(--bw) * -.3); height: calc(var(--sh) - 8px);
    display: grid; place-items: center;
  }
  .store.sb { top: 12px; }
  .store.sa { bottom: 12px; }
  .store .hole { position: absolute; inset: 0; width: auto; height: auto; }
  .store .num {
    position: relative; font-size: clamp(24px, calc(var(--sh) * .42), 40px); border-radius: 999px;
    background: rgba(30,14,4,.6); min-width: 1.75em; height: 1.75em; display: grid; place-items: center;
  }
  .store.on .hole { box-shadow: inset 0 4px 7px rgba(0,0,0,.7), 0 0 0 2px var(--c), 0 0 16px var(--c); }
  .store.sa { --c: var(--red); }
  .store.sb { --c: var(--blue); }
  /* Biji: kerang/batu oval dengan sebaran acak ber-seed per lubang. */
  .sd {
    position: absolute; width: var(--sd); height: calc(var(--sd) * .72); margin: calc(var(--sd) * -.36) 0 0 calc(var(--sd) * -.5);
    border-radius: 50%; transform: rotate(var(--r, 0deg)); pointer-events: none;
    background: radial-gradient(ellipse at 34% 30%, #FFFBF1 0 16%, #EEDBB4 46%, #B08A5A 100%);
    box-shadow: 0 1px 1.5px rgba(0,0,0,.6);
  }
  .sd::after { content: ""; position: absolute; left: 20%; right: 20%; top: 48%; height: 1px; background: rgba(95,62,30,.6); }
  .sd.v1 { background: radial-gradient(ellipse at 34% 30%, #FFF6E6 0 16%, #E3C79A 48%, #9A7446 100%); }
  .sd.v2 { background: radial-gradient(ellipse at 34% 30%, #F4F0E8 0 16%, #CFC6B6 48%, #857A6A 100%); }
  .sd.v2::after { display: none; }
  .sd.pop { animation: pop .2s ease-out; }
  @keyframes pop { from { transform: rotate(var(--r)) scale(1.9); } }
  .sd.fly { position: fixed; margin: 0; z-index: 36; left: 0; top: 0; will-change: transform; }

  .pill {
    position: absolute; z-index: 3; left: 50%; display: flex; align-items: center; justify-content: center;
    min-height: 34px; max-width: calc(var(--bw) - 24px); padding: 0 14px; border-radius: 999px; white-space: nowrap;
    background: #123F3D; border: 2px solid var(--board-edge); color: var(--muted); font-weight: 800; font-size: 14px;
    transition: background .2s, border-color .2s, color .2s;
  }
  .pill .pin { display: flex; gap: 6px; align-items: baseline; overflow: hidden; text-overflow: ellipsis; transition: transform .45s; }
  .pill b { font-family: var(--display); font-size: 16px; overflow: hidden; text-overflow: ellipsis; }
  .pill em { font-style: normal; font-size: 13px; }
  .pill.p0 { bottom: -22px; transform: translateX(-50%); }
  .pill.p1 { top: -22px; transform: translateX(-50%); }
  .pill.p0.on { background: var(--red); border-color: #FFB1A9; color: #3A0C07; }
  .pill.p1.on { background: var(--blue); border-color: #B5E8FC; color: #06293A; }
  .dots::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  /* Berhadapan: HP di meja, pemain duduk di kiri dan kanan HP; tulisan menghadap masing-masing. */
  .hadap .pill { writing-mode: vertical-rl; min-height: 0; min-width: 34px; max-width: none; max-height: calc(var(--bh) - 40px); padding: 14px 0; top: 50%; bottom: auto; }
  .hadap .pill.p0 { left: -44px; transform: translateY(-50%); }
  .hadap .pill.p1 { left: auto; right: -44px; transform: translateY(-50%) rotate(180deg); }
  .hadap .pit.a .num, .hadap .store.sa .num { transform: rotate(90deg); }
  .hadap .pit.b .num, .hadap .store.sb .num { transform: rotate(-90deg); }
  .stagebox.flip .num, .stagebox.flip .pill .pin { transform: rotate(180deg); }
  .hand {
    position: fixed; left: 0; top: 0; z-index: 34; pointer-events: none; border-radius: 50%;
    width: 56px; height: 56px; margin: -28px 0 0 -28px; border: 3px solid #FFE7B0;
    box-shadow: 0 0 14px rgba(255,231,176,.8), inset 0 0 10px rgba(255,231,176,.35); transition: transform var(--hs, .12s) ease-out;
  }
  .hand b {
    position: absolute; right: -12px; top: -12px; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px;
    background: var(--tile); color: var(--tile-ink); font-family: var(--display); font-size: 15px; line-height: 26px; text-align: center;
    box-shadow: 0 2px 0 var(--tile-shade);
  }
  .hand.c0 { border-color: #FFC3BC; } .hand.c1 { border-color: #BDEBFD; }

  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 37; overflow: hidden; }
  .float {
    position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-weight: 800; font-size: 22px;
    color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.45); animation: rise .95s ease-out forwards; white-space: nowrap;
  }
  .float.big { font-size: 30px; color: var(--tile); animation-duration: 1.25s; }
  .float.tag { font-size: 17px; background: var(--tile); color: var(--tile-ink); padding: 2px 14px; border-radius: 999px; text-shadow: none; box-shadow: inset 0 -3px 0 var(--tile-shade); animation-duration: 1.2s; }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, calc(-50% - 44px)); } }
  .confetti { position: fixed; top: -14px; width: 9px; height: 13px; border-radius: 2px; z-index: 50; pointer-events: none; animation: fall 1.6s ease-in forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .7; } }

  /* Panel */
  .overlay { position: fixed; inset: 0; background: rgba(5, 20, 20, .88); display: grid; place-items: center; padding: 16px; z-index: 60; overflow-y: auto; }
  .panel {
    width: 100%; max-width: 380px; background: var(--board); border: 1px solid var(--board-edge); border-radius: 16px;
    padding: 20px 16px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center;
    animation: slideUp .28s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .panel h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 27px; line-height: 1.1; color: var(--tile); }
  .panel p { margin: 0; color: var(--muted); line-height: 1.45; }
  .panel b { color: var(--ink); }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .facts div { background: var(--ground); border: 1px solid var(--board-edge); border-radius: 10px; padding: 8px 4px; font-size: 11.5px; color: var(--muted); }
  .facts b { display: block; font-size: 18px; font-family: var(--display); }
  .col { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .row { display: flex; gap: 8px; width: 100%; }
  .row .btn { flex: 1; }
  .btn {
    border: 1px solid var(--board-edge); background: var(--ground); color: var(--ink); border-radius: 10px;
    padding: 11px 8px; font-weight: 800; font-size: 14px; cursor: pointer; line-height: 1.2; min-height: 44px;
  }
  .btn.main { background: var(--tile); color: var(--tile-ink); border: 0; box-shadow: inset 0 -4px 0 var(--tile-shade); font-family: var(--display); font-size: 20px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .versus { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; width: 100%; }
  .versus .side { background: var(--ground); border: 1px solid var(--board-edge); border-radius: 12px; padding: 10px 6px; min-width: 0; }
  .versus .side.win { border-color: var(--good); box-shadow: 0 0 0 1px var(--good); }
  .versus .who { font-weight: 800; overflow-wrap: anywhere; font-size: 13.5px; }
  .versus .pts { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .versus .side.win .pts { color: var(--good); }
  .versus .vs { font-family: var(--display); font-weight: 800; color: var(--tile); }
  .name-input {
    width: 100%; padding: 10px 12px; border-radius: 10px; text-align: center; border: 1px solid var(--board-edge);
    background: var(--ground); color: var(--ink); font-family: var(--body); font-weight: 800; font-size: 18px; user-select: text; -webkit-user-select: text; min-height: 44px;
  }
  .names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .names label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 800; text-align: left; }
  .names label.r { color: var(--red); } .names label.u { color: var(--blue); }
  .levels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .lvl { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px; }

<script>
/*CORE:BEGIN*/
// Aturan murni Congklak "Aturan Dehayuk": tanpa DOM, bisa diuji di Node dan dijalankan di Web Worker.
// Indeks papan: 0..6 = lubang A (a0..a6), 7 = lumbung A, 8..14 = lubang B (b0..b6), 15 = lumbung B.
// Arah tabur = indeks naik (a0 -> a6 -> lumbung A -> b0 -> b6 -> lumbung B -> a0). Seberang lubang i = 14 - i.
const GameCore = (() => {
  const SA = 7, SB = 15, START = 7, TOTAL = 98, MAX_ROUNDS = 5;
  const CAP = 1000;       // pengaman tabur bersambung tanpa akhir; dari 368 ribu giliran uji, terpanjang di bawah 500 biji
  const TURN_CAP = 500;   // batas giliran per putaran (pengaman); sisa biji di lubang masuk lumbung pemiliknya
  const RICH = 3;         // lubang seberang dianggap "kaya" (ancaman tembak) mulai 3 biji
  // Main lagi maksimal EXTRA_CAP kali beruntun; langkah pembuka putaran tanpa main lagi. Tanpa ini yang
  // mulai duluan hampir selalu menang (Sulit vs Sulit, 30 papan: 30-0). Dengan ini: 14-14, 2 seri.
  const EXTRA_CAP = 2;
  const DAILY_LAUNCH = "2026-09-26"; // Harian #1
  const LEVELS = ["mudah", "sedang", "sulit", "jago"];
  const NODE_BUDGET = { mudah: 2000, sedang: 20000, sulit: 30000, jago: 400000 };
  const TIME_CAP = { mudah: 150, sedang: 150, sulit: 1500, jago: 350 };
  const MAX_DEPTH = { mudah: 1, sedang: 3, sulit: 6, jago: 30 };
  const SLACK = { sulit: 1.5, jago: 1 };  // variasi: langkah sejauh ini (dalam biji) dari yang terbaik boleh dipilih

  const ownerOf = (i) => (i < 8 ? 0 : 1);
  const isStore = (i) => i === SA || i === SB;
  const opposite = (i) => 14 - i;

  // Hasil sampingan giliran terakhir (dipakai tanpa membuat objek baru di pencarian AI).
  let lastDrops = 0, lastRelays = 0, lastCapped = false;

  // Satu giliran penuh dari lubang `pit`. b dimutasi. burn: bitmask lubang hangus.
  // ev (opsional) diisi kejadian untuk animasi. Mengembalikan (tembak << 1) | mainLagi.
  function sow(b, burn, side, pit, ev) {
    const own = side ? SB : SA, skip = side ? SA : SB;
    let hand = b[pit], pos = pit, drops = 0, relays = 0, extra = 0, tembak = 0;
    lastCapped = false;
    b[pit] = 0;
    if (ev) ev.push({ k: "lift", at: pit, n: hand });
    for (;;) {
      while (hand > 0) {
        pos = (pos + 1) & 15;
        if (pos === skip || (burn >> pos) & 1) continue;
        b[pos]++; hand--; drops++;
        if (ev) ev.push({ k: "drop", at: pos, hand });
      }
      if (pos === own) { extra = 1; if (ev) ev.push({ k: "extra", at: pos }); break; }
      if (b[pos] > 1) {
        if (drops >= CAP) { lastCapped = true; if (ev) ev.push({ k: "cap", at: pos }); break; }
        hand = b[pos]; b[pos] = 0; relays++;
        if (ev) ev.push({ k: "relay", at: pos, n: hand });
        continue;
      }
      if (ownerOf(pos) === side) {
        const o = opposite(pos);
        if (b[o] > 0) {
          tembak = b[o] + 1;
          if (ev) ev.push({ k: "tembak", at: pos, from: o, to: own, n: tembak });
          b[own] += tembak; b[o] = 0; b[pos] = 0;
        } else if (ev) ev.push({ k: "stop", at: pos });
      } else if (ev) ev.push({ k: "stop", at: pos });
      break;
    }
    lastDrops = drops; lastRelays = relays;
    return (tembak << 1) | extra;
  }

  // Siapa jalan berikutnya: -1 bila semua lubang kosong (putaran selesai). Pemain tanpa biji dilewati.
  function nextSide(b, side, extra) {
    let sa = 0, sb = 0;
    for (let k = 0; k < 7; k++) { sa += b[k]; sb += b[8 + k]; }
    if (!sa && !sb) return -1;
    let nx = extra ? side : 1 - side;
    if (!(nx ? sb : sa)) nx = 1 - nx;
    return nx;
  }
  function sideSum(b, side) { let s = 0; for (let k = 0; k < 7; k++) s += b[(side ? 8 : 0) + k]; return s; }
  function legalMoves(g) {
    const out = [];
    if (!g || g.over || g.roundOver) return out;
    for (let k = 0; k < 7; k++) { const i = (g.turn ? 8 : 0) + k; if (g.b[i] > 0) out.push(i); }
    return out;
  }

  // ---------- Permainan ----------
  function newGame(o) {
    o = o || {};
    const s = o.start || [7, 7, 7, 7, 7, 7, 7];
    const b = new Array(16).fill(0);
    for (let k = 0; k < 7; k++) { b[k] = s[k]; b[8 + k] = s[k]; }
    const first = o.first ? 1 : 0;
    return {
      v: 1, b, burn: 0, turn: first, first, round: 1, maxRounds: o.multi ? MAX_ROUNDS : 1, rt: 0, moves: 0, fm: EXTRA_CAP,
      over: false, roundOver: false, winner: -1, why: "", tembak: [0, 0], tembakSeeds: [0, 0], longest: [0, 0], extras: [0, 0], swept: null
    };
  }
  function applyMove(g, pit, wantEvents) {
    if (!g || g.over || g.roundOver) return null;
    const side = g.turn;
    if (!Number.isInteger(pit) || pit < 0 || pit > 15 || isStore(pit) || ownerOf(pit) !== side || !(g.b[pit] > 0)) return null;
    const ev = wantEvents ? [] : null;
    const code = sow(g.b, g.burn, side, pit, ev);
    // fm = hitungan main lagi beruntun (langkah pembuka putaran mulai dari EXTRA_CAP).
    const fm = Number.isInteger(g.fm) ? g.fm : 0, raw = !!(code & 1);
    const extra = raw && fm < EXTRA_CAP, tembak = code >> 1;
    if (raw && !extra && ev && ev[ev.length - 1].k === "extra") Object.assign(ev[ev.length - 1], { k: "noextra", open: g.rt === 0 });
    g.fm = extra ? fm + 1 : 0;
    g.moves++; g.rt++;
    if (tembak) { g.tembak[side]++; g.tembakSeeds[side] += tembak; }
    if (extra) g.extras[side]++;
    if (lastRelays && lastDrops > g.longest[side]) g.longest[side] = lastDrops;
    const res = { side, pit, extra, noExtra: raw && !extra, tembak, drops: lastDrops, relays: lastRelays, capped: lastCapped, events: ev, passed: false, passedOwn: false, roundOver: false, over: false };
    let nx = nextSide(g.b, side, extra);
    if (nx >= 0 && g.rt >= TURN_CAP) nx = -1;
    if (nx < 0) endRound(g, ev);
    else {
      res.passed = nx !== (extra ? side : 1 - side);
      res.passedOwn = res.passed && extra;
      if (nx !== side) g.fm = 0;
      if (res.passed && ev) ev.push({ k: "pass", side: 1 - nx });
      g.turn = nx;
    }
    res.roundOver = g.roundOver; res.over = g.over;
    return res;
  }
  function endRound(g, ev) {
    const sa = sideSum(g.b, 0), sb = sideSum(g.b, 1);
    g.swept = [sa, sb];
    if (sa || sb) {
      for (let k = 0; k < 7; k++) { g.b[k] = 0; g.b[8 + k] = 0; }
      g.b[SA] += sa; g.b[SB] += sb;
      if (ev) ev.push({ k: "sweep", a: sa, b: sb });
    }
    g.roundOver = true;
    const a = g.b[SA], bb = g.b[SB];
    if (g.round >= g.maxRounds) finish(g, a > bb ? 0 : bb > a ? 1 : 2, "putaran");
    else if (a < START || bb < START) finish(g, a < START ? 1 : 0, "habis");
  }
  function finish(g, winner, why) { g.over = true; g.winner = winner; g.why = why; }
  // Putaran baru: tiap pemain mengisi lubangnya 7 biji dari lumbung sendiri; yang tidak kebagian 7 menjadi hangus.
  function refill(b, side) {
    const st = side ? SB : SA, base = side ? 8 : 0;
    let s = b[st], burn = 0, filled = 0;
    for (let k = 0; k < 7; k++) {
      if (s >= START) { b[base + k] = START; s -= START; filled++; }
      else { b[base + k] = 0; burn |= 1 << (base + k); }
    }
    b[st] = s;
    return { burn, filled };
  }
  function nextRound(g) {
    if (!g || g.over || !g.roundOver) return null;
    const ra = refill(g.b, 0), rb = refill(g.b, 1);
    g.burn = ra.burn | rb.burn;
    g.round++; g.rt = 0; g.fm = EXTRA_CAP; g.roundOver = false; g.swept = null;
    g.turn = (g.first + g.round - 1) % 2;
    if (!sideSum(g.b, g.turn)) g.turn = 1 - g.turn;
    return { filled: [ra.filled, rb.filled] };
  }
  // Pratinjau isi ulang (untuk panel akhir putaran), tanpa mengubah permainan.
  function refillPreview(g) {
    const b = g.b.slice();
    return [refill(b, 0).filled, refill(b, 1).filled];
  }
  // Terapkan satu kejadian animasi ke papan tampilan. Setelah semua kejadian, hasilnya sama dengan papan permainan.
  function applyEvent(D, e) {
    switch (e.k) {
      case "lift": case "relay": D[e.at] = 0; break;
      case "drop": D[e.at]++; break;
      case "tembak": D[e.to] += e.n; D[e.from] = 0; D[e.at] = 0; break;
      case "sweep": for (let k = 0; k < 7; k++) { D[k] = 0; D[8 + k] = 0; } D[SA] += e.a; D[SB] += e.b; break;
    }
    return D;
  }
  function total(b) { let s = 0; for (let i = 0; i < 16; i++) s += b[i]; return s; }
  function isValid(g) {
    if (!g || g.v !== 1 || !Array.isArray(g.b) || g.b.length !== 16) return false;
    if (!g.b.every((x) => Number.isInteger(x) && x >= 0 && x <= TOTAL) || total(g.b) !== TOTAL) return false;
    if (!Number.isInteger(g.burn) || (g.turn !== 0 && g.turn !== 1) || !Number.isInteger(g.round)) return false;
    if (typeof g.over !== "boolean" || typeof g.roundOver !== "boolean") return false;
    for (let i = 0; i < 16; i++) if (((g.burn >> i) & 1) && g.b[i]) return false;
    if (!g.over && !g.roundOver && !sideSum(g.b, g.turn)) return false;
    return Array.isArray(g.tembak) && Array.isArray(g.longest);
  }

  // ---------- Komputer: negamax alpha-beta dengan pendalaman bertahap ----------
  const ABORT = { abort: true };
  const MAXPLY = 34;
  const KB = [], KN = [], KK = [], KP = [], KO = [], KF = [];
  for (let p = 0; p < MAXPLY; p++) {
    const row = [];
    for (let k = 0; k < 7; k++) row.push(new Int16Array(16));
    KB.push(row); KN.push(new Int8Array(7)); KK.push(new Int16Array(7)); KP.push(new Int8Array(7)); KO.push(new Int8Array(7)); KF.push(new Int8Array(7));
  }
  let nodes = 0, budget = 0, deadline = 0, single = true, simple = false;
  const now = () => (typeof performance !== "undefined" && performance.now ? performance.now() : Date.now());

  function evaluate(b, burn, side) {
    const own = side ? SB : SA, oth = side ? SA : SB;
    const v = b[own] - b[oth];
    if (simple) return v;
    const ob = side ? 8 : 0, tb = side ? 0 : 8;
    let so = 0, st = 0, to = 0, tt = 0;
    for (let k = 0; k < 7; k++) {
      const i = ob + k, j = tb + k;
      so += b[i]; st += b[j];
      if (!b[i] && !((burn >> i) & 1) && b[14 - i] >= RICH) to++;
      if (!b[j] && !((burn >> j) & 1) && b[14 - j] >= RICH) tt++;
    }
    return v + 0.25 * (so - st) + 0.5 * (to - tt);
  }
  // Akhir putaran di dalam pencarian: semua biji sudah di lumbung.
  function terminal(b, side) {
    const own = side ? b[SB] : b[SA], oth = side ? b[SA] : b[SB], d = own - oth;
    if (single) return d + (d > 0 ? 500 : d < 0 ? -500 : 0);
    return d + (own < START ? -500 : 0) + (oth < START ? 500 : 0);
  }
  // Isi anak-anak posisi: papan, giliran berikutnya, urutan (main lagi dulu, lalu tembak).
  // fm seperti di applyMove; KF = fm untuk tiap anak.
  function gen(b, burn, side, ply, fm) {
    const base = side ? 8 : 0, cb = KB[ply], cn = KN[ply], ck = KK[ply], cp = KP[ply], ko = KO[ply], kf = KF[ply];
    let n = 0;
    for (let k = 0; k < 7; k++) {
      const pit = base + k;
      if (!b[pit]) continue;
      const c = cb[n];
      c.set(b);
      const code = sow(c, burn, side, pit, null), ex = code & 1 && fm < EXTRA_CAP ? 1 : 0;
      cn[n] = nextSide(c, side, ex);
      kf[n] = ex ? fm + 1 : 0;
      cp[n] = pit;
      ck[n] = (ex ? 1000 : 0) + (code >> 1);
      let q = n;
      while (q > 0 && ck[ko[q - 1]] < ck[n]) { ko[q] = ko[q - 1]; q--; }
      ko[q] = n;
      n++;
    }
    return n;
  }
  function nega(b, burn, side, depth, alpha, beta, ply, fm) {
    if ((++nodes & 511) === 0 && (nodes > budget || now() > deadline)) throw ABORT;
    if (depth <= 0 || ply >= MAXPLY - 1) return evaluate(b, burn, side);
    const n = gen(b, burn, side, ply, fm);
    const cb = KB[ply], cn = KN[ply], ko = KO[ply], kf = KF[ply];
    let best = -Infinity;
    for (let q = 0; q < n; q++) {
      const i = ko[q], nx = cn[i];
      let v;
      if (nx < 0) v = terminal(cb[i], side);
      else if (nx === side) v = nega(cb[i], burn, side, depth - 1, alpha, beta, ply + 1, kf[i]);
      else v = -nega(cb[i], burn, nx, depth - 1, -beta, -alpha, ply + 1, 0);
      if (v > best) best = v;
      if (v > alpha) alpha = v;
      if (alpha >= beta) break;
    }
    return best;
  }
  // Nilai tiap langkah di akar. full = jendela penuh untuk semua langkah (nilai pasti, dipakai level Sedang).
  // slack: langkah sedekat slack dari yang terbaik tetap dihitung pasti (untuk variasi).
  function rootScores(b, burn, side, depth, full, prefer, fm, slack) {
    const n = gen(b, burn, side, 0, fm);
    const cb = KB[0], cn = KN[0], cp = KP[0], ko = Array.from(KO[0].slice(0, n));
    if (prefer != null) { const at = ko.findIndex((i) => cp[i] === prefer); if (at > 0) ko.unshift(ko.splice(at, 1)[0]); }

    if (g.longest[0] >= 20) got.push("sambung20");
    if (win && b < 30) got.push("bersih");
    for (const id of got) if (!S.badges.includes(id)) { S.badges.push(id); o.badges.push(id); }
  }
  if (r.kind === "vs") {
    const st = S.lv[r.level];
    if (g.winner === 0) st.w++; else if (g.winner === 1) st.l++; else st.d++;
    if (g.winner === 0) {
      // Rekor hanya bila memang ada rekor lama yang dikalahkan.
      if (st.best > 0 && m > st.best) o.record = true;
      if (m > st.best) st.best = m;
    }
  }
  if (r.kind === "daily" && !r.practice) {
    const already = S.daily && S.daily.date === r.date && S.daily.done;
    if (!already) {
      o.official = true;
      S.daily = { date: r.date, a, b, m, tembak: g.tembak[0], done: true };
      if (S.streak.last !== r.date) {
        S.streak.count = S.streak.last === GameCore.prevDay(r.date) ? S.streak.count + 1 : 1;
        S.streak.last = r.date;
      }
    }
  }
  if (r.kind === "chal" && r.chal) {
    o.verdict = m > r.chal.m ? 1 : m < r.chal.m ? -1 : 0;
    if (o.verdict > 0) S.chal.w++; else if (o.verdict < 0) S.chal.l++; else S.chal.d++;
    if (S.pendingChal === r.chal.code) S.pendingChal = null;
    // Tantangan yang sudah dimainkan diingat menurut papannya (seed), jadi tidak bisa diulang sampai menang.
    S.chalDone = S.chalDone.filter((x) => chalSeed(x) !== r.seed).concat([{ s: r.seed, code: r.chal.code, n: r.chal.n, m: r.chal.m, mine: m, a, b }]).slice(-300);
  }
  if (r.kind === "duo") {
    const [n0, n1] = r.names;
    let f = S.family.find((x) => (x.n[0] === n0 && x.n[1] === n1) || (x.n[0] === n1 && x.n[1] === n0));
    if (!f) { f = { n: [n0, n1], w: [0, 0], d: 0 }; S.family.push(f); }
    if (g.winner === 2) f.d++;
    else { const who = r.names[g.winner]; f.w[f.n[0] === who ? 0 : 1]++; }
    S.family = S.family.slice(-8);
    o.family = f;
  }
  r.result = o;
  delete S.runs[r.kind];
  save();
}
function gameOver() {
  const r = run;
  if (!r || !r.g.over || r.shownOver) return;
  finalize(r);
  r.shownOver = true;
  busy = false;
  renderTurn();
  const o = r.result, humanWin = r.kind === "duo" ? o.winner !== 2 : o.winner === 0;
  if (o.winner === 2) sfx.draw(); else if (humanWin) sfx.win(); else sfx.lose();
  buzz(humanWin ? [30, 40, 60] : [40]);

    if (run !== r) return;
    if (humanWin) confetti();
    showResult(o);

  }, RM ? 200 : 900);
}

// ---------- Bagikan ----------
function shareText(text) {
  if (navigator.share) navigator.share({ text }).catch((e) => { if (!e || e.name !== "AbortError") copyText(text, true); });
  else copyText(text, true);
}
function copyText(text, wa) {
  const done = () => {
    toast("Tersalin. Tempel di WhatsApp!");
    if (wa) { try { window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener"); } catch (e) {} }
  };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("Gagal menyalin"); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}
function shareDaily() {
  const d = S.daily;
  if (!d || !d.done) return toast("Selesaikan Tantangan Hari Ini dulu, ya");
  shareText(GameCore.dailyShare({ number: GameCore.dailyNumber(d.date), a: d.a, b: d.b, tembak: d.tembak, streak: streakNow(), url: shareUrl() }));

  if (d) return dailyDonePanel();
  const r = S.runs.daily;
  if (r && r.date === t && !r.practice && GameCore.isValid(r.g) && !r.g.over) return openRun(r);
  openRun(newRun("daily", GameCore.newGame({ start: GameCore.perturb(GameCore.dailySeed(t)) }), { date: t, practice: false, seed: GameCore.dailySeed(t) }));
}
function startPractice() {
  const t = today();
  openRun(newRun("daily", GameCore.newGame({ start: GameCore.perturb(GameCore.dailySeed(t)) }), { date: t, practice: true, seed: GameCore.dailySeed(t) }));
}
function dailyDonePanel() {
  const d = S.daily;
  showPanel(
    "<h2>Harian #" + GameCore.dailyNumber(d.date) + " selesai ✓</h2>" +
    "<div class=\"versus\"><div class=\"side" + (d.m > 0 ? " win" : "") + "\"><div class=\"who\">Kamu</div><div class=\"pts\">" + d.a + "</div></div><span class=\"vs\">VS</span><div class=\"side" + (d.m < 0 ? " win" : "") + "\"><div class=\"who\">Komputer Sulit</div><div class=\"pts\">" + d.b + "</div></div></div>" +
    "<p>Selisih <b>" + GameCore.signed(d.m) + "</b> · tembak " + d.tembak + "x · 🔥 " + streakNow() + " hari beruntun</p>" +
    "<p>Papan baru muncul besok. Mau latihan dengan papan hari ini? Hasil resmi tidak berubah.</p>" +
    "<div class=\"col\"><button class=\"btn main\" id=\"dShare\" type=\"button\">Bagikan hasil</button>" +
    "<div class=\"row\"><button class=\"btn\" id=\"dClose\" type=\"button\">Tutup</button><button class=\"btn\" id=\"dPractice\" type=\"button\">Latihan</button></div></div>",
    () => {
      $("dShare").onclick = shareDaily;
      $("dClose").onclick = hideOverlay;
      $("dPractice").onclick = () => { hideOverlay(); startPractice(); };
    });
}
// Tantangan: papan acak dari seed, lawan Komputer Sulit, satu putaran, pemain selalu mulai.
function startChal(inv, replyTo) {
  const live = liveInvite();
  if (inv) {
    if (live && live.seed === inv.s) return openRun(live);
    const done = chalDoneOf(inv.s);
    if (done) return showChalDone(done);
    if (live) return finishFirst(live);
    if (dailyBlock(inv.s)) return;
    // Dicatat "sudah dimulai" sebelum main, jadi membuka link lagi tidak memberi percobaan baru.
    S.chalDone = S.chalDone.filter((x) => chalSeed(x) !== inv.s).concat([{ s: inv.s, code: inv.code, n: inv.n, m: inv.m, started: true }]).slice(-300);
    if (S.pendingChal && (GameCore.decodeDuel(S.pendingChal) || {}).s === inv.s) S.pendingChal = null;
    return openRun(newRun("chal", GameCore.newGame({ start: GameCore.perturb(inv.s) }), { seed: inv.s, chal: { n: inv.n, m: inv.m, code: inv.code } }));
  }
  if (live) return finishFirst(live);
  const seed = newSeed();
  openRun(newRun("chal", GameCore.newGame({ start: GameCore.perturb(seed) }), { seed, replyTo: replyTo || "" }));
}
function startReply(name) { hideOverlay(); startChal(null, GameCore.cleanName(name)); }
// Seed papan dari catatan tantangan (catatan lama hanya menyimpan kode link).
function chalSeed(x) { return x.s != null ? x.s : (GameCore.decodeDuel(x.code) || {}).s; }
const chalDoneOf = (s) => S.chalDone.find((x) => chalSeed(x) === s) || null;
// Tantangan dari teman yang sedang berjalan (belum selesai), bila ada.
function liveInvite() { const r = resumable("chal"); return r && r.chal ? r : null; }
function finishFirst(r) {
  showPanel("<h2>Selesaikan dulu</h2><p>Tantangan dari <b>" + esc(r.chal.n) + "</b> belum selesai. Mainkan sampai habis dulu, baru tantangan lain.</p>" +
    "<div class=\"col\"><button class=\"btn main\" id=\"fGo\" type=\"button\">Lanjutkan tantangan " + esc(r.chal.n) + "</button><button class=\"btn\" id=\"fClose\" type=\"button\">Tutup</button></div>",
    () => { $("fGo").onclick = () => { hideOverlay(); openRun(r); }; $("fClose").onclick = () => { hideOverlay(); renderHome(); }; });
}
// Papan tantangan tak boleh sama dengan Harian hari ini/besok yang belum dimainkan. Dibandingkan papannya,
// bukan seed-nya, jadi link palsu berseed lain dengan papan sama juga tertahan.
function dailyBlock(s) {
  const t = today(), [y, m, d] = t.split("-").map(Number), tomorrow = GameCore.dateKey(new Date(y, m - 1, d + 1));
  const board = GameCore.perturb(s).join();
  for (const key of [t, tomorrow]) {
    if (S.daily && S.daily.date === key && S.daily.done) continue;
    if (GameCore.perturb(GameCore.dailySeed(key)).join() !== board) continue;
    const now = key === t;
    showPanel("<h2>Mainkan Harian dulu</h2><p>Papan tantangan ini sama dengan <b>Tantangan Hari Ini" + (now ? "" : " besok") + "</b>. Mainkan Harian dulu, baru terima tantangannya.</p>" +
      "<div class=\"col\">" + (now ? "<button class=\"btn main\" id=\"bDaily\" type=\"button\">Main Tantangan Hari Ini</button>" : "") + "<button class=\"btn\" id=\"bClose\" type=\"button\">Tutup</button></div>",
      () => { if (now) $("bDaily").onclick = () => { hideOverlay(); startDaily(); }; $("bClose").onclick = () => { hideOverlay(); renderHome(); }; });
    return true;
  }
  return false;
}
function showChalDone(d) {
  if (d.started) {
    return showPanel("<h2>Sudah dimulai</h2><p>Tantangan dari <b>" + esc(d.n) + "</b> dengan papan ini sudah pernah kamu mulai. Satu tantangan hanya bisa dimainkan sekali.</p>" +
      "<div class=\"col\"><button class=\"btn main\" id=\"xReply\" type=\"button\">Balas dengan papan baru</button><button class=\"btn\" id=\"xClose\" type=\"button\">Tutup</button></div>",
      () => { $("xReply").onclick = () => startReply(d.n); $("xClose").onclick = () => { hideOverlay(); renderHome(); }; });
  }
  const v = d.mine > d.m ? "Kamu menang" : d.mine < d.m ? esc(d.n) + " unggul" : "Seri";
  showPanel(
    "<h2>Sudah dimainkan</h2><p>Tantangan dari <b>" + esc(d.n) + "</b> ini sudah kamu mainkan. Selisihmu <b>" + GameCore.signed(d.mine) + "</b>, selisih " + esc(d.n) + " <b>" + GameCore.signed(d.m) + "</b>. " + v + ".</p>" +
    "<p class=\"note\">Satu tantangan hanya bisa dimainkan sekali. Balas dengan papan baru!</p>" +
    "<div class=\"col\"><button class=\"btn main\" id=\"xReply\" type=\"button\">Balas tantangan</button><button class=\"btn\" id=\"xClose\" type=\"button\">Tutup</button></div>",
    () => {
      $("xReply").onclick = () => startReply(d.n);
      $("xClose").onclick = () => { hideOverlay(); renderHome(); };
    });
}
function showInvite(inv) {
  const target = inv.m > 0 ? "menang dengan selisih lebih dari <b>" + inv.m + "</b>" : inv.m === 0 ? "<b>menang</b>" : "kalah dengan selisih kurang dari <b>" + Math.abs(inv.m) + "</b>, atau menang";
  showPanel(
    "<h2>Ada tantangan!</h2><p><b>" + esc(inv.n) + "</b> " + esc(GameCore.verdictText(49 + inv.m / 2, 49 - inv.m / 2, "Komputer Sulit")) + ".</p>" +
    "<p>Papan dan komputernya sama persis. Targetmu: " + target + "!</p><p class=\"note\">Hanya bisa dimainkan sekali.</p>" +
    "<div class=\"col\"><button class=\"btn main\" id=\"iGo\" type=\"button\">Terima tantangan</button><button class=\"btn\" id=\"iLater\" type=\"button\">Nanti saja</button></div>",
    () => {
      $("iGo").onclick = () => { hideOverlay(); startChal(inv); };
      $("iLater").onclick = () => { hideOverlay(); renderHome(); };
    });
}
function chalPanel() {
  const inv = S.pendingChal ? GameCore.decodeDuel(S.pendingChal) : null;
  if (inv) return showInvite(Object.assign(inv, { code: S.pendingChal }));
  const r = resumable("chal");
  showPanel(
    "<h2>Tantang Teman</h2><p>Kamu mendapat papan acak dan melawan <b>Komputer Sulit</b>. Setelah selesai, kirim link-nya lewat WhatsApp. Temanmu mendapat papan dan komputer yang sama persis, lalu harus mengalahkan selisihmu.</p>" +
    (S.chal.w + S.chal.l + S.chal.d ? "<p>Tantangan diterima: menang " + S.chal.w + " · kalah " + S.chal.l + " · seri " + S.chal.d + "</p>" : "") +
    "<div class=\"col\">" + (r ? "<button class=\"btn main\" id=\"cResume\" type=\"button\">Lanjutkan · " + r.g.b[SA] + "–" + r.g.b[SB] + "</button>" : "") +
    "<button class=\"btn" + (r ? "" : " main") + "\" id=\"cGo\" type=\"button\">Main papan baru</button><button class=\"btn\" id=\"cClose\" type=\"button\">Tutup</button></div>",
    () => {
      if ($("cResume")) $("cResume").onclick = () => { hideOverlay(); openRun(r); };
      $("cGo").onclick = () => { hideOverlay(); startChal(null, ""); };
      $("cClose").onclick = hideOverlay;
    });
}
function readChalHash() {
  if (!/^#t=/.test(location.hash || "")) return;
  const m = /^#t=([A-Za-z0-9_-]{8,300})$/.exec(location.hash || "");
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  const inv = m ? GameCore.decodeDuel(m[1]) : null;
  if (!inv) { toast("Link tantangan tidak valid. Minta tantangan baru, ya."); return; }
  inv.code = m[1];
  if (!$("play").hidden) goHome();
  const live = liveInvite(), done = live && live.seed === inv.s ? null : chalDoneOf(inv.s);
  if (!done && !(live && live.seed === inv.s)) { S.pendingChal = inv.code; save(); }
  renderHome();
  if (done) showChalDone(done); else showInvite(inv);
}

// ---------- Bantuan dan pengaturan ----------
function mini(cells) {
  return "<span class=\"mini\">" + cells.map((c) => {
    const s = String(c), h = s[0] === "*", v = h ? s.slice(1) : s;
    const l = v[0] === "L", x = v === "x";
    return "<i class=\"" + (h ? "h " : "") + (l ? "l" : "") + (x ? "x" : "") + "\">" + (x ? "" : l ? v.slice(1) : v) + "</i>";
  }).join("") + "</span>";
}
function mini2(top, bot, store) {
  let h = "<span class=\"mini two\">";
  for (let k = 0; k < top.length; k++) h += mini1(top[k]) + mini1(bot[k]);
  return h + "<i class=\"l\">" + store + "</i></span>";
}
function mini1(c) { const s = String(c), hl = s[0] === "*"; return "<i class=\"" + (hl ? "h" : "") + "\">" + (hl ? s.slice(1) : s) + "</i>"; }

    "</div><p class=\"help-foot\">Tak punya biji saat giliranmu? Giliran dilewati. Satu putaran selesai bila semua lubang kosong.<br>Di daerahmu aturannya beda? Ini aturan yang kami pakai.</p>" +
    "<button class=\"btn main\" id=\"hOk\" type=\"button\">Siap!</button>",
    () => { $("hOk").onclick = hideOverlay; });
}

      $("sVibe").onclick = () => { S.settings.vibrate = !S.settings.vibrate; save(); $("sVibe").setAttribute("aria-pressed", S.settings.vibrate); buzz(20); };
      wireSeat("sSeat", () => { if (run) { applySeat(); layout(); } });

}

// ---------- Menu utama ----------
function renderHome() {
  $("best").textContent = S.wins;
  const rv = resumable("vs");
  $("stVs").textContent = rv ? "Lanjutkan · " + LV_NAME[rv.level] : "Level " + LV_NAME[LV[S.open]] + " terbuka";
  const rd = resumable("duo"), fam = S.family.slice(-1)[0];
  $("stDuo").textContent = rd ? "Lanjutkan" : fam ? fam.n[0] + " " + fam.w[0] + "–" + fam.w[1] + " " + fam.n[1] : "Main";
  const t = today();
  const d = S.daily && S.daily.date === t && S.daily.done ? S.daily : null;
  const dr = S.runs.daily;
  $("modeDaily").classList.toggle("done", !!d);
  $("stDaily").textContent = d ? "Selesai ✓ · " + GameCore.signed(d.m) : dr && dr.date === t && !dr.practice && dr.g && !dr.g.over ? "Lanjutkan" : "#" + GameCore.dailyNumber(t) + " · Main";
  const inv = S.pendingChal ? GameCore.decodeDuel(S.pendingChal) : null;
  $("stChal").textContent = inv ? "Ditantang " + inv.n + "!" : resumable("chal") ? "Lanjutkan" : "Tantang";
  const st = streakNow();
  $("stats").textContent = S.games ? "Main " + S.games + " kali · menang " + S.wins + " kali lawan komputer" + (st ? " · 🔥 " + st + " hari" : "") + (S.badges.length ? " · 🏅 " + S.badges.length + "/5" : "") : "Selamat datang! Coba Lawan Komputer Mudah dulu.";
  renderToggles();
}
function renderToggles() {
  $("btnSound").textContent = S.settings.mute ? "🔇" : "🔊";
  $("btnSound").setAttribute("aria-label", S.settings.mute ? "Nyalakan suara" : "Matikan suara");
}
function goHome() {
  // Animasi cukup dibatalkan: permainan sudah tersimpan dalam keadaan setelah langkah.
  stopRun();
  if (run && !run.g.over) saveRun();
  run = null;
  $("play").hidden = true;
  $("home").hidden = false;
  document.body.classList.remove("playing");
  document.documentElement.classList.remove("playing");
  stageEl.classList.remove("flip");
  renderHome();
}

// ---------- Panel, tombol Back, pesan ----------
let backArmed = false, overlayBack = null;
function enterScreen() {
  if (backArmed) return;
  try { history.pushState({ congklak: 1 }, ""); backArmed = true; } catch (e) {}
}
function showPanel(html, wire, onBack) {
  const o = $("overlay");
  o.innerHTML = "<div class=\"panel\" role=\"dialog\" aria-modal=\"true\">" + html + "</div>";
  o.hidden = false;
  o.scrollTop = 0;
  overlayBack = onBack || null;
  enterScreen();
  if (wire) wire();
  const btn = o.querySelector("button");
  if (btn && !o.querySelector("input")) btn.focus({ preventScroll: true });
  renderTurn();
}
function hideOverlay() { $("overlay").hidden = true; $("overlay").innerHTML = ""; overlayBack = null; renderTurn(); }
// Back menutup panel atau kembali ke menu; tidak pernah keluar dari situs saat sedang main.
window.addEventListener("popstate", () => {
  backArmed = false;
  if (!$("overlay").hidden) {
    const after = overlayBack;
    hideOverlay();
    if (after) after();
    else if (!$("play").hidden) enterScreen();
    return;
  }
  if (!$("play").hidden) goHome();
  // Di menu tanpa panel: entri sisa panel yang ditutup tombol, jadi teruskan Back.
  else if (!/^#t=/.test(location.hash)) try { history.back(); } catch (e) {}
});
window.addEventListener("hashchange", readChalHash);
let toastTimer = 0;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2400);
}

// ---------- Ukuran papan ----------
function layout() {
  if (!run || $("play").hidden) return;
  const W = arenaEl.clientWidth || 340, H = arenaEl.clientHeight || 500;
  const hadap = arenaEl.classList.contains("hadap");
  const aw = hadap ? W - 2 * 46 : W, ah = hadap ? H - 8 : H - 2 * 24;
  let ph = Math.floor((ah - 22) / (7 + 2 * 1.42));
  ph = Math.max(34, Math.min(74, ph));
  const sh = Math.round(ph * 1.42), bh = ph * 7 + sh * 2 + 22;
  const bw = Math.max(220, Math.min(aw, 400, Math.round(ph * 6.7)));
  const colW = (bw - 26) / 2;
  const hw = Math.max(40, Math.min(Math.round(ph * 1.9), Math.floor(colW - 40)));
  const rs = document.documentElement.style;
  rs.setProperty("--ph", ph + "px");
  rs.setProperty("--sh", sh + "px");
  rs.setProperty("--bh", bh + "px");
  rs.setProperty("--bw", bw + "px");
  rs.setProperty("--hw", hw + "px");
  rs.setProperty("--sd", Math.max(7, Math.min(13, Math.round(ph * 0.22))) + "px");
}

$("btnMenu").onclick = goHome;
$("btnHint").onclick = useHint;
$("btnSkip").onclick = (e) => { e.stopPropagation(); skipAnim(); };
$("btnRestart").onclick = () => {
  if (!run || anim) return;
  showPanel(
    "<h2>Mulai ulang?</h2><p>Permainan ini tidak akan disimpan.</p>" +
    "<div class=\"row\"><button class=\"btn\" id=\"qNo\" type=\"button\">Lanjut main</button><button class=\"btn main\" id=\"qYes\" type=\"button\">Mulai ulang</button></div>",
    () => {
      $("qNo").onclick = () => { hideOverlay(); if (run) step(); };
      $("qYes").onclick = () => {
        hideOverlay();

        else startVs(run.level, true);
      };

};
$("btnSound").onclick = () => {
  S.settings.mute = !S.settings.mute;
  save();
  renderToggles();
  if (!S.settings.mute) sfx.tap();
};
// Ketuk di mana saja saat menabur: percepat 4x sampai giliran selesai.
$("play").addEventListener("pointerdown", (e) => {
  if (!S.settings.mute) { try { audio(); } catch (err) {} }
  if (anim && !e.target.closest("button.skip, #btnMenu")) speedUp();
});
document.addEventListener("keydown", (e) => {
  if ($("play").hidden || !$("overlay").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  if (anim && (e.key === "Escape" || e.key === "Enter" || e.key === " ")) { e.preventDefault(); return skipAnim(); }
  if (/^[1-7]$/.test(e.key) && canHuman()) {
    e.preventDefault();
    const i = (run.g.turn ? 8 : 0) + (+e.key - 1);
    pitEls[i].focus();
    tapPit(i);
  }
});
let resizeRaf = 0;
window.addEventListener("resize", () => {
  if (resizeRaf) return;
  resizeRaf = requestAnimationFrame(() => { resizeRaf = 0; layout(); });
});
document.addEventListener("visibilitychange", () => { if (document.hidden && run) saveRun(); });

renderHome();
readChalHash();
if (/[?&]uji=1/.test(location.search)) {
  const t0 = performance.now(), res = GameCore.selfTest(1000);
  console.log("Uji Congklak:", res.ok ? "SEMUA LULUS" : "ADA YANG GAGAL", res, Math.round(performance.now() - t0) + " ms");
}
