<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3534">
<title>Sambung Kembar</title>
<meta name="description" content="Sambung Kembar: cari dua ubin bergambar sama yang bisa disambung garis dengan paling banyak dua belokan, lalu bersihkan papan sebelum waktu habis. Ada Harian, mode Santai tanpa waktu, dan tantangan lewat WhatsApp. Gratis, langsung main di browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Font dimuat tanpa menahan tampilan pertama; bila gagal, font sistem tetap dipakai. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap"></noscript>
<style>
  :root {
    color-scheme: dark;
    --ground: #0E3534;
    --board: #15504D;
    --board-edge: #2A7A75;
    --slot-edge: #3E8C86;
    --tile: #F4C152;
    --tile-shade: #C9952A;
    --tile-ink: #3B2A05;
    --ink: #EAF6F3;
    --muted: #9EC6C0;
    --good: #7FE0A3;
    --bad: #FF7A70;
    --well: #0B2B2A;
    --link: #5EF0FF;
    --tb: #F2F8F5; --tsh: #B7CEC7; --tgrain: none;
    --display: "Baloo 2", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --app-h: 100vh; --tsz: 38px;
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 15px;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior-y: contain;
  }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; font-family: var(--body); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .wrap {
    max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
  }
  body.playing { overflow: hidden; }
  body.playing .wrap {
    height: var(--app-h); gap: 0;
    padding: calc(6px + env(safe-area-inset-top, 0px)) calc(8px + env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) calc(8px + env(safe-area-inset-left, 0px));
  }
  body.playing header { display: none; }
  section { display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand-box { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .hub { color: var(--muted); font-size: 12px; font-weight: 800; text-decoration: none; padding: 2px 0; }
  .brand { font-family: var(--display); font-weight: 800; font-size: clamp(19px, 5.6vw, 24px); line-height: 1; letter-spacing: .5px; white-space: nowrap; }
  .brand span { color: var(--tile); }
  .head-right { display: flex; align-items: center; gap: 8px; flex: none; }
  .best {
    display: flex; align-items: center; gap: 6px; background: var(--board); border: 1px solid var(--board-edge);
    padding: 6px 10px; border-radius: 999px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .best.bump { animation: bump .45s ease-out; }
  @keyframes bump { 40% { transform: scale(1.18); border-color: var(--tile); } }
  .icon-btn {
    min-width: 44px; min-height: 44px; border-radius: 999px; cursor: pointer; font-size: 17px; line-height: 1;
    background: var(--board); border: 1px solid var(--board-edge); color: var(--ink);
  }

  /* Menu utama */
  .hero {
    background: var(--board); border: 1px solid var(--board-edge); border-radius: 14px; padding: 16px;
    display: flex; gap: 14px; align-items: center;
  }
  .logo { flex: none; width: 74px; height: 74px; }
  .hero p { margin: 0; color: var(--muted); line-height: 1.45; }
  .hero b { color: var(--ink); font-family: var(--display); font-size: 19px; display: block; line-height: 1.15; }
  .stats { font-size: 12.5px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; margin: 0; }
  .modes { display: grid; gap: 10px; }
  .mode {
    display: grid; grid-template-columns: 1fr auto; grid-template-areas: "name state" "desc state";
    gap: 2px 12px; align-items: center; text-align: left; cursor: pointer;
    background: var(--board); border: 1px solid var(--board-edge); border-radius: 14px; padding: 14px 16px; color: var(--ink);
  }
  .mode-name { grid-area: name; font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1.1; }
  .mode-desc { grid-area: desc; font-size: 12.5px; color: var(--muted); }
  .mode-state {
    grid-area: state; max-width: 140px; text-align: center; font-weight: 800; font-size: 12px;
    background: var(--tile); color: var(--tile-ink); box-shadow: inset 0 -3px 0 var(--tile-shade);
    padding: 7px 10px; border-radius: 9px; font-variant-numeric: tabular-nums;
  }
  .mode.primary { border-color: var(--tile-shade); box-shadow: 0 0 0 1px var(--tile-shade) inset; }
  .mode.primary .mode-name { color: var(--tile); }
  .mode.done .mode-state { background: transparent; box-shadow: none; color: var(--good); border: 1px solid var(--good); }
  .badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .badges span {
    font-size: 11.5px; font-weight: 800; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--board-edge);
    color: var(--muted); opacity: .55; white-space: nowrap;
  }
  .badges span.on { opacity: 1; color: var(--tile); border-color: var(--tile-shade); background: rgba(244,193,82,.1); }
  .home-foot { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .link-btn { background: none; border: 1px solid var(--board-edge); color: var(--muted); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 12.5px; cursor: pointer; min-height: 44px; }
  .home-foot a { color: var(--muted); font-size: 12px; padding: 12px; }

  /* Layar main */
  #play { gap: 6px; flex: 1 1 auto; min-height: 0; }
  .topbar { display: flex; align-items: center; gap: 8px; min-height: 44px; flex: none; }
  .back {
    background: none; border: 1px solid var(--board-edge); color: var(--ink); border-radius: 10px;
    min-height: 44px; padding: 8px 12px; font-weight: 800; font-size: 13px; cursor: pointer; flex: none;
  }
  .chip {
    font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .5px; text-transform: uppercase;
    color: var(--tile); border: 1px solid var(--tile-shade); padding: 1px 9px; border-radius: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .score {
    margin-left: auto; font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1;
    font-variant-numeric: tabular-nums; white-space: nowrap; flex: none;
  }
  .score.bump { animation: bump .3s ease-out; }
  .score.small { font-size: 20px; }
  .hud2 { display: flex; align-items: center; gap: 8px; min-height: 24px; flex: none; font-weight: 800; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tb { flex: 1; height: 10px; border-radius: 99px; background: var(--well); box-shadow: inset 0 0 0 1px var(--board-edge); overflow: hidden; }
  .tb i { display: block; height: 100%; width: 100%; background: var(--good); border-radius: 99px; transform-origin: 0 50%; transition: transform .25s linear, background .3s; }
  .tb.warn i { background: var(--bad); }
  .time-text { min-width: 40px; text-align: right; color: var(--ink); }
  .time-text.warn { color: var(--bad); }
  .combo { color: var(--tile); visibility: hidden; white-space: nowrap; font-weight: 800; font-size: 13px; flex: none; }
  .combo.on { visibility: visible; }
  .pairs-left { white-space: nowrap; }
  .spacer { flex: 1; }

  .board-box { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .stage {
    position: relative; flex: none; background: var(--well); border-radius: 14px; box-shadow: 0 0 0 1px var(--board-edge);
    touch-action: none; cursor: pointer; transition: background .4s;
  }
  .stage:focus { outline: none; }
  .stage:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .stage.warn { animation: warnPulse 1s ease-in-out infinite; }
  @keyframes warnPulse { 50% { background: #3A1E1B; box-shadow: 0 0 0 1px var(--bad); } }
  .stage.veil .tl { visibility: hidden; }
  .stage.grav .tl { transition-duration: .12s; }
  .stage.still .tl { transition: none; }
  .tiles { position: absolute; inset: 0; }
  .tl {
    position: absolute; left: 0; top: 0; width: var(--tsz); height: var(--tsz); pointer-events: none;
    transition: transform .2s ease-out; will-change: transform;
  }
  .face {
    position: absolute; inset: 0; border-radius: 24%; background: var(--tb); background-image: var(--tgrain);
    box-shadow: inset 0 -3px 0 var(--tsh), 0 2px 3px rgba(0,0,0,.35); display: grid; place-items: center;
    transition: transform .12s ease-out, box-shadow .12s;
  }
  .face svg { width: 84%; height: 84%; display: block; }
  .tl.sel .face { transform: translateY(-3px) scale(1.07); box-shadow: 0 0 0 3px var(--tile), inset 0 -3px 0 var(--tsh), 0 7px 10px rgba(0,0,0,.45); }
  .tl.hit .face { box-shadow: 0 0 0 3px var(--link), 0 0 12px var(--link); transform: scale(1.05); }
  .tl.pop .face { animation: pop .24s ease-in forwards; }
  @keyframes pop { to { transform: scale(0) rotate(28deg); opacity: 0; } }
  .tl.no .face { animation: nope .28s linear; }
  @keyframes nope { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
  .tl.flip .face { animation: flip .32s ease-in-out; }
  @keyframes flip { 50% { transform: scaleX(0) scaleY(.9); } }
  .tl.hint .face { animation: hintPulse .7s ease-in-out infinite alternate; }
  @keyframes hintPulse { from { box-shadow: 0 0 0 2px var(--link), inset 0 -3px 0 var(--tsh); } to { box-shadow: 0 0 0 4px var(--link), 0 0 16px var(--link), inset 0 -3px 0 var(--tsh); transform: scale(1.06); } }
  .tl.in .face { animation: tin .38s cubic-bezier(.3,1.4,.6,1) both; animation-delay: var(--d, 0ms); }
  @keyframes tin { from { transform: translateY(-26px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  .kc { position: absolute; left: 0; top: 0; border-radius: 26%; box-shadow: 0 0 0 3px #fff; pointer-events: none; transition: transform .1s; }
  .pathsvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .pathsvg polyline { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .pathsvg .glow { stroke: var(--link); stroke-opacity: .35; }
  .pathsvg .core { stroke: #E9FEFF; }
  .fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .float {
    position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-weight: 800; font-size: 20px;
    color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.45); animation: rise .8s ease-out forwards; white-space: nowrap;
  }
  .float small { display: block; font-size: 14px; color: var(--link); line-height: 1; text-align: center; }
  @keyframes rise { from { opacity: 1; transform: translate(-50%, -50%); } to { opacity: 0; transform: translate(-50%, calc(-50% - 42px)); } }
  .banner {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); background: var(--tile); color: var(--tile-ink);
    font-family: var(--display); font-weight: 800; font-size: 18px; padding: 6px 16px; border-radius: 999px; white-space: nowrap;
    box-shadow: inset 0 -3px 0 var(--tile-shade), 0 6px 18px rgba(0,0,0,.45); animation: banner 2s ease-out forwards; z-index: 5;
  }
  .banner.big { font-size: 34px; padding: 6px 26px; }
  @keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 20% { transform: translate(-50%, -50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }

  .bottombar { display: grid; grid-template-columns: 1fr 1fr 56px; gap: 8px; flex: none; padding-top: 2px; }
  .tool {
    min-height: 52px; border-radius: 12px; border: 1px solid var(--board-edge); background: var(--board); color: var(--ink);
    font-weight: 800; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 6px;
  }
  .tool b { background: var(--tile); color: var(--tile-ink); border-radius: 999px; min-width: 24px; padding: 1px 7px; font-size: 13px; }
  .tool:disabled { opacity: .45; cursor: default; }
  .tool.pause { font-size: 18px; }
  /* Papan 8x10: HUD dan tombol sedikit lebih rapat supaya ubin tetap >= 40px di layar 360x560 */
  body.tall #play { gap: 3px; }
  body.tall .hud2 { min-height: 20px; }
  body.tall .tool { min-height: 48px; }
  body.tall .bottombar { padding-top: 0; }

  #fxc { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 35; }
  .confetti { position: fixed; top: -14px; width: 9px; height: 13px; border-radius: 2px; z-index: 50; pointer-events: none; animation: fall 1.5s ease-in forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .7; } }

  /* Panel */
  /* margin:auto memusatkan panel tanpa memotong bagian atasnya bila panel lebih tinggi dari layar */
  .overlay { position: fixed; inset: 0; background: rgba(5, 20, 20, .9); display: flex; flex-direction: column; padding: 16px; z-index: 60; overflow-y: auto; }
  .panel {
    width: 100%; max-width: 380px; margin: auto; flex: none; background: var(--board); border: 1px solid var(--board-edge); border-radius: 16px;
    padding: 22px 18px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center;
    animation: slideUp .28s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .panel h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.1; color: var(--tile); }
  .panel p { margin: 0; color: var(--muted); line-height: 1.45; }
  .panel b { color: var(--ink); }
  .big { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .stars { font-size: 36px; letter-spacing: 4px; line-height: 1; color: var(--tile); text-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .stars .off { color: #2F6360; }
  .stars span { display: inline-block; animation: starIn .4s cubic-bezier(.3,1.6,.6,1) both; }
  @keyframes starIn { from { transform: scale(0) rotate(-40deg); } }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .facts div { background: var(--ground); border: 1px solid var(--board-edge); border-radius: 10px; padding: 8px 4px; font-size: 11.5px; color: var(--muted); }
  .facts b { display: block; font-size: 18px; font-family: var(--display); font-variant-numeric: tabular-nums; }
  .col { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .row { display: flex; gap: 8px; width: 100%; }
  .row .btn { flex: 1; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .btn {
    border: 1px solid var(--board-edge); background: var(--ground); color: var(--ink); border-radius: 10px;
    padding: 11px 8px; font-weight: 800; font-size: 14px; cursor: pointer; line-height: 1.2; min-height: 44px;
  }
  .btn small { display: block; font-weight: 600; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .btn.main { background: var(--tile); color: var(--tile-ink); border: 0; box-shadow: inset 0 -4px 0 var(--tile-shade); font-family: var(--display); font-size: 20px; }
  .help { text-align: left; margin: 0; padding-left: 20px; color: var(--ink); line-height: 1.5; display: flex; flex-direction: column; gap: 6px; }
  .help li::marker { color: var(--tile); }
  .demo { width: 124px; height: 124px; flex: none; }
  .versus { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; width: 100%; }
  .versus .side { background: var(--ground); border: 1px solid var(--board-edge); border-radius: 12px; padding: 10px 6px; min-width: 0; }
  .versus .side.win { border-color: var(--good); box-shadow: 0 0 0 1px var(--good); }
  .versus .who { font-weight: 800; overflow-wrap: anywhere; }
  .versus .pts { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .versus .side.win .pts { color: var(--good); }
  .versus .vs { font-family: var(--display); font-weight: 800; color: var(--tile); }
  .name-input {
    width: 100%; padding: 10px 12px; border-radius: 10px; text-align: center; border: 1px solid var(--board-edge);
    background: var(--ground); color: var(--ink); font-family: var(--body); font-weight: 800; font-size: 18px; user-select: text; -webkit-user-select: text;
  }
  .toast {
    position: fixed; left: 50%; top: calc(62px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    background: var(--ink); color: var(--ground); font-weight: 800; font-size: 13px; padding: 8px 14px; border-radius: 999px;
    z-index: 70; max-width: calc(100% - 32px); text-align: center; pointer-events: none;
  }
  body.playing .toast { top: auto; bottom: calc(74px + env(safe-area-inset-bottom, 0px)); }
  .sr { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Tema ubin: hanya warna latar ubin, ikon tetap sama agar mudah dibaca */
  .th-kayu { --tb: #EDCB97; --tsh: #B4834C; --tgrain: repeating-linear-gradient(100deg, rgba(120,70,20,.0) 0 6px, rgba(120,70,20,.08) 6px 8px); }
  .th-kertas { --tb: #FFFDF6; --tsh: #D7CDB0; --tgrain: radial-gradient(circle at 30% 25%, rgba(0,0,0,.035) 0 1px, transparent 1.5px), radial-gradient(circle at 70% 65%, rgba(0,0,0,.035) 0 1px, transparent 1.5px); }
  .th-kaca { --tb: #D5F1F6; --tsh: #7FB8C8; --tgrain: linear-gradient(135deg, rgba(255,255,255,.75) 0 22%, rgba(255,255,255,0) 40%); }

  @media (prefers-reduced-motion: reduce) {
    .best.bump, .score.bump, .panel, .tl.pop .face, .tl.no .face, .tl.flip .face, .tl.in .face, .stage.warn, .stars span { animation: none; }
    .tl.pop .face { opacity: 0; }
    .tl.hint .face { animation: none; box-shadow: 0 0 0 4px var(--link); }
    .tl { transition: none; }
    .confetti { display: none; }
  }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="sprite"></defs></svg>

<div class="wrap">
  <header>
    <div class="brand-box">
      <a class="hub" href="/">‹ Dehayuk</a>
      <div class="brand">Sambung<span>Kembar</span></div>
    </div>
    <div class="head-right">
      <div class="best" id="bestBox" title="Skor terbaik Petualangan">🏆 <span id="best">0</span></div>
      <button class="icon-btn" id="btnSound" type="button" aria-label="Matikan suara" title="Suara">🔊</button>
    </div>
  </header>

  <section id="home">
    <div class="hero">
      <svg class="logo" id="logo" viewBox="0 0 74 74" aria-hidden="true"></svg>
      <p><b>Cari yang kembar, sambungkan!</b>Ketuk dua gambar sama yang bisa dihubungkan garis dengan paling banyak dua belokan.</p>
    </div>
    <div class="modes">
      <button class="mode primary" id="modeAdv" type="button">
        <span class="mode-name">Petualangan</span>
        <span class="mode-desc">Level demi level, papan makin besar dan penuh kejutan.</span>
        <span class="mode-state" id="stAdv">Main</span>
      </button>
      <button class="mode" id="modeDaily" type="button">
        <span class="mode-name">Harian</span>
        <span class="mode-desc">Papan yang sama untuk semua pemain hari ini. Siapa paling cepat?</span>
        <span class="mode-state" id="stDaily">Main</span>
      </button>
      <button class="mode" id="modeSantai" type="button">
        <span class="mode-name">Santai</span>
        <span class="mode-desc">Tanpa batas waktu. Pilih ukuran papan, main sepuasnya.</span>
        <span class="mode-state" id="stSantai">Pilih papan</span>
      </button>
      <button class="mode" id="modeDuel" type="button">
        <span class="mode-name">Tantang Teman</span>
        <span class="mode-desc">Bersihkan satu papan, kirim ke WhatsApp. Temanmu dapat papan yang sama.</span>
        <span class="mode-state" id="stDuel">Tantang</span>
      </button>
    </div>
    <p class="stats" id="stats"></p>
    <div class="badges" id="badges" aria-label="Lencana"></div>
    <div class="home-foot">
      <button class="link-btn" id="btnHelp" type="button">❓ Cara main</button>
      <button class="link-btn" id="btnVibe" type="button">📳 Getar: nyala</button>
      <button class="link-btn" id="btnTheme" type="button" hidden>🎨 Ubin: Standar</button>

<script>
/*CORE:BEGIN*/
// Aturan murni Sambung Kembar: tanpa DOM, bisa diuji di Node.
const GameCore = (() => {
  const LAUNCH = "2026-09-26";            // Harian #1
  const ICON_COUNT = 18;
  // [kolom, baris, jumlah ikon berbeda]
  const SIZES = { s: [6, 6, 9], m: [6, 8, 12], l: [7, 8, 14], xl: [8, 10, 18] };
  const GRAVS = ["none", "down", "left", "center", "up", "right", "middle"];
  const HINTS = 3, SHUFFLES = 2;
  const MS_PER_PAIR = 8000, CONTINUE_MS = 30000, COMBO_MS = 3000, PENALTY_MS = 10000, HINT_COST_MS = 5000;
  // Batas waktu tantangan: 20 detik untuk 28 pasang sudah mustahil bagi manusia, 99 menit batas atas.
  const DUEL_MIN_MS = 20000, DUEL_MAX_MS = 99 * 60000;
  const MODES = ["adv", "daily", "duel", "santai"];

  // Generator acak mulberry32; keadaannya disimpan di g.rs agar permainan bisa dilanjutkan persis.
  function next(g) {
    const s = g.rs = (g.rs + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  function hashStr(s) {
    let h = 2166136261;
    for (let k = 0; k < s.length; k++) h = Math.imul(h ^ s.charCodeAt(k), 16777619);
    return h >>> 0;
  }
  function mix(a, b) {
    let h = Math.imul((a ^ 0x9E3779B9) >>> 0, 0x85EBCA6B) ^ Math.imul((b + 0x632BE5AB) | 0, 0xC2B2AE35);
    h ^= h >>> 15; h = Math.imul(h, 0x2C1B3C6D); h ^= h >>> 12;
    return h >>> 0;
  }
  function shuffleArr(g, a) {
    for (let k = a.length - 1; k > 0; k--) { const r = Math.floor(next(g) * (k + 1)); const x = a[k]; a[k] = a[r]; a[r] = x; }
    return a;
  }
  const sizeForLevel = (L) => L <= 3 ? "s" : L <= 8 ? "m" : L <= 15 ? "l" : "xl";
  // Level 9 tanpa gravitasi, 10 turun, 11 kiri, 12 ke tengah, lalu berulang dengan variasi.
  const gravityFor = (L) => L < 9 ? "none" : GRAVS[(L - 9) % GRAVS.length];

  // ---------- Jalur: BFS berlapis (belokan 0, 1, 2) di kisi berbingkai (W+2)x(H+2) ----------
  // target >= 0: kembalikan jalur {turns, pts} atau null.
  // target = -1: kembalikan Uint8Array berisi 1 untuk setiap ubin terisi yang terjangkau dari a.
  function search(W, H, b, a, target) {
    const PW = W + 2, PH = H + 2, N = PW * PH;
    const occ = new Uint8Array(N);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (b[x + y * W]) occ[x + 1 + (y + 1) * PW] = 1;
    const A = a % W + 1 + ((a / W | 0) + 1) * PW;
    const T = target >= 0 ? target % W + 1 + ((target / W | 0) + 1) * PW : -1;
    const dist = new Uint8Array(N * 4).fill(9);
    const par = T >= 0 ? new Int32Array(N * 4).fill(-1) : null;
    const reach = T >= 0 ? null : new Uint8Array(W * H);
    const OFF = [1, PW, -1, -PW];
    const layers = [[], [], []];
    function step(p, d, t, from) {
      const x = p % PW, y = p / PW | 0;
      if ((d === 0 && x === PW - 1) || (d === 1 && y === PH - 1) || (d === 2 && x === 0) || (d === 3 && y === 0)) return;
      const q = p + OFF[d];
      if (q === A) return;
      if (occ[q] && q !== T) {
        if (reach) reach[(q % PW - 1) + ((q / PW | 0) - 1) * W] = 1;
        return;
      }
      const s = q * 4 + d;
      if (dist[s] <= t) return;
      dist[s] = t;
      if (par) par[s] = from;
      layers[t].push(s);
    }
    for (let d = 0; d < 4; d++) step(A, d, 0, -1);
    for (let t = 0; t < 3; t++) {
      const L = layers[t];
      for (let k = 0; k < L.length; k++) {
        const s = L[k];
        if (dist[s] !== t) continue;
        const p = s >> 2, d = s & 3;
        if (p === T) {
          // Susun ulang jalur dari T ke A, lalu ambil titik belok saja.
          const cells = [];
          for (let u = s; u !== -1; u = par[u]) cells.push(u >> 2);
          cells.push(A);
          cells.reverse();
          const pts = [];
          for (let i = 0; i < cells.length; i++) {
            if (i > 0 && i < cells.length - 1) {
              const d1 = cells[i] - cells[i - 1], d2 = cells[i + 1] - cells[i];
              if (d1 === d2) continue;
            }
            pts.push([cells[i] % PW - 1, (cells[i] / PW | 0) - 1]);
          }
          return { turns: t, pts };
        }
        if (T >= 0 && occ[p]) continue;
        step(p, d, t, s);
        if (t < 2) { step(p, (d + 1) & 3, t + 1, s); step(p, (d + 3) & 3, t + 1, s); }
      }
    }
    return reach;
  }
  function pathBetween(W, H, b, i, j) {
    if (i === j || i < 0 || j < 0 || i >= W * H || j >= W * H) return null;
    return search(W, H, b, i, j);
  }
  // Pasangan sah pertama (untuk cek papan buntu).
  function findMove(W, H, b) {
    const n = W * H;
    for (let i = 0; i < n; i++) {
      const v = b[i];
      if (!v) continue;
      let twin = false;
      for (let j = i + 1; j < n; j++) if (b[j] === v) { twin = true; break; }
      if (!twin) continue;
      const reach = search(W, H, b, i, -1);
      for (let j = i + 1; j < n; j++) if (b[j] === v && reach[j]) return [i, j];
    }
    return null;
  }
  function listMoves(W, H, b) {
    const n = W * H, out = [];
    for (let i = 0; i < n; i++) {
      const v = b[i];
      if (!v) continue;
      let twin = false;
      for (let j = i + 1; j < n; j++) if (b[j] === v) { twin = true; break; }
      if (!twin) continue;
      const reach = search(W, H, b, i, -1);
      for (let j = i + 1; j < n; j++) if (b[j] === v && reach[j]) out.push([i, j]);
    }
    return out;
  }

  // ---------- Gravitasi ----------
  const lineCache = {};
  function gravLines(W, H, mode) {
    const key = W + "x" + H + mode;
    if (lineCache[key]) return lineCache[key];
    const L = [];
    const seq = (a, z) => { const r = []; if (a <= z) for (let k = a; k <= z; k++) r.push(k); else for (let k = a; k >= z; k--) r.push(k); return r; };
    const col = (x, ys) => ys.map((y) => x + y * W);
    const row = (y, xs) => xs.map((x) => x + y * W);
    const hw = Math.ceil(W / 2), hh = Math.ceil(H / 2);
    for (let x = 0; x < W; x++) {
      if (mode === "down") L.push(col(x, seq(H - 1, 0)));
      else if (mode === "up") L.push(col(x, seq(0, H - 1)));
      else if (mode === "middle") { L.push(col(x, seq(hh - 1, 0))); L.push(col(x, seq(hh, H - 1))); }
    }
    for (let y = 0; y < H; y++) {
      if (mode === "left") L.push(row(y, seq(0, W - 1)));
      else if (mode === "right") L.push(row(y, seq(W - 1, 0)));
      else if (mode === "center") { L.push(row(y, seq(hw - 1, 0))); L.push(row(y, seq(hw, W - 1))); }
    }
    return (lineCache[key] = L);
  }
  // Menggeser ubin sesuai arah gravitasi. Mengembalikan daftar [dari, ke].
  function applyGravity(W, H, b, t, mode) {
    const moves = [];
    if (!mode || mode === "none") return moves;
    for (const line of gravLines(W, H, mode)) {
      let w = 0;
      for (let k = 0; k < line.length; k++) {
        const i = line[k];
        if (!b[i]) continue;
        const dst = line[w++];
        if (dst !== i) {
          b[dst] = b[i]; b[i] = 0;
          if (t) { t[dst] = t[i]; t[i] = 0; }
          moves.push([i, dst]);
        }
      }
    }
    return moves;
  }
  // Pemecah rakus: ambil pasangan sah apa saja berulang kali (dengan gravitasi bila ada).
  function solvable(W, H, b0, mode) {
    const b = b0.slice();
    let left = b.filter((v) => v).length;
    while (left > 0) {
      const m = findMove(W, H, b);
      if (!m) return false;
      b[m[0]] = b[m[1]] = 0;
      left -= 2;
      applyGravity(W, H, b, null, mode);
    }
    return true;
  }

  // ---------- Pembuat papan (pasti bisa diselesaikan) ----------
  // Simulasi terbalik: dari sel-sel terisi, berulang kali ambil dua sel yang bisa disambung
  // dengan sel lain sebagai penghalang, lalu kosongkan. Urutan pengambilan = satu solusi sah.
  function pairUp(g, W, H, cells) {
    const b = new Array(W * H).fill(0);
    for (const c of cells) b[c] = 1;
    const rem = cells.slice();
    const pairs = [];
    while (rem.length) {
      shuffleArr(g, rem);
      let done = false;
      for (let k = 0; k < rem.length && !done; k++) {
        const A = rem[k];
        const reach = search(W, H, b, A, -1);
        const cand = [];
        let tot = 0;
        for (const B of rem) {
          if (B === A || !reach[B]) continue;
          // Pasangan yang berjauhan lebih disukai supaya papan terasa "menyambung".
          const w = 1 + Math.min(6, Math.abs(A % W - B % W) + Math.abs((A / W | 0) - (B / W | 0)));
          cand.push(B, w);
          tot += w;
        }
        if (!cand.length) continue;
        let x = next(g) * tot, B = cand[0];
        for (let q = 0; q < cand.length; q += 2) { x -= cand[q + 1]; if (x < 0) { B = cand[q]; break; } }
        b[A] = b[B] = 0;
        rem.splice(rem.indexOf(A), 1);
        rem.splice(rem.indexOf(B), 1);
        pairs.push([A, B]);
        done = true;
      }
      if (!done) return null;
    }
    return pairs;
  }
  // Cadangan terakhir: pasangan tegak bersebelahan, kolom demi kolom (selalu bisa, tanpa gravitasi).
  function columnCells(W, H, n) {
    const out = [];
    for (let x = 0; x < W && out.length < n; x++) for (let y = 0; y < H && out.length < n; y++) out.push(x + y * W);
    return out;
  }
  function makeBoard(g, W, H, k, grav) {
    const n = W * H, P = n / 2;
    const all = Array.from({ length: n }, (_, i) => i);
    let last = null;
    for (let attempt = 0; attempt < 12; attempt++) {
      const pool = shuffleArr(g, Array.from({ length: ICON_COUNT }, (_, i) => i + 1)).slice(0, k);
      // Tiap ikon muncul genap: 4 kali (papan besar: sebagian 6 kali).
      const pairIcons = shuffleArr(g, Array.from({ length: P }, (_, i) => pool[i % k]));
      let pairs = null;
      for (let r = 0; r < 20 && !pairs; r++) pairs = pairUp(g, W, H, all);
      if (!pairs) continue;
      const b = new Array(n).fill(0);
      pairs.forEach(([A, B], q) => { b[A] = b[B] = pairIcons[q]; });
      last = b;
      // Dijamin ada urutan penyelesaian; selain itu pemecah rakus pun harus lolos,
      // supaya pemain yang main "wajar" jarang tersesat (dan gravitasi tetap adil).
      if (solvable(W, H, b, grav)) return b;
    }
    if (last) return last;
    const b = new Array(n).fill(0);
    const cells = columnCells(W, H, n);
    for (let q = 0; q < P; q++) b[cells[2 * q]] = b[cells[2 * q + 1]] = (q % k) + 1;
    return b;
  }

  // ---------- Permainan ----------
  function setupBoard(g) {
    const [W, H, k] = SIZES[g.size];
    // Tantangan memakai ruang seed sendiri, supaya link buatan tidak bisa memunculkan papan Harian.
    g.rs = (g.mode === "adv" ? mix(g.seed, g.level) : g.mode === "santai" ? mix(g.seed, g.boards + 1) : g.mode === "duel" ? mix(g.seed, 0xD0E1) : g.seed) | 0;
    g.grav = g.mode === "adv" ? gravityFor(g.level) : "none";
    g.W = W; g.H = H;
    g.b = makeBoard(g, W, H, k, g.grav);
    g.t = g.b.map(() => g.nid++);
    g.pairs = g.left = W * H / 2;
    g.cleared = false; g.timeUp = false; g.continued = false;
    g.combo = 0; g.lastAt = -1e9;
    g.hintsLeft = HINTS; g.shufflesLeft = SHUFFLES; g.levelHints = 0; g.levelShuffles = 0;
    g.bonus = null; g.stars = 0;
    g.timeMax = g.timed ? MS_PER_PAIR * g.pairs : 0;
    g.timeLeft = g.timeMax;
  }
  function newGame(mode, seed, opt) {
    const g = {
      v: 1, mode: MODES.includes(mode) ? mode : "adv", seed: seed >>> 0, rs: 0, level: 1, size: "l", boards: 0,
      grav: "none", W: 0, H: 0, b: [], t: [], nid: 1, pairs: 0, left: 0,
      score: 0, combo: 0, bestCombo: 0, lastAt: -1e9, clock: 0, penalty: 0,
      timed: false, timeLeft: 0, timeMax: 0, continued: false, timeUp: false,
      limited: true, hintsLeft: HINTS, shufflesLeft: SHUFFLES, hintsUsed: 0, shufflesUsed: 0, levelHints: 0, levelShuffles: 0,
      autoShuffles: 0, matches: 0, cleared: false, over: false, bonus: null, stars: 0
    };
    g.timed = g.mode === "adv";
    g.limited = g.mode !== "santai";
    if (g.mode === "adv") g.size = sizeForLevel(1);
    else if (g.mode === "santai") g.size = opt && SIZES[opt.size] ? opt.size : "s";
    setupBoard(g);
    return g;
  }
  const isRace = (g) => g.mode === "daily" || g.mode === "duel";
  const playable = (g) => !!g && !g.over && !g.cleared && !g.timeUp;
  const raceMs = (g) => Math.round(g.clock + g.penalty);

  // Kocok ulang ubin yang tersisa di posisinya sekarang.
  // Tanpa gravitasi: papan hasil selalu punya langkah. Dengan gravitasi: dicoba sampai 80 kali agar
  // pemecah rakus bisa membersihkannya; bila tetap gagal, papan terakhir dipakai. Itu aman, karena
  // papan buntu kapan pun langsung dikocok otomatis lagi (tidak pernah macet).
  function reshuffle(g) {
    const W = g.W, H = g.H, cells = [], count = {};
    for (let i = 0; i < W * H; i++) if (g.b[i]) { cells.push(i); count[g.b[i]] = (count[g.b[i]] || 0) + 1; }
    const pairIcons = [];
    for (const v of Object.keys(count).sort((a, b) => a - b)) for (let q = 0; q < count[v] / 2; q++) pairIcons.push(+v);
    const before = g.b.slice();
    let best = null;
    const tries = g.grav === "none" ? 30 : 80;
    for (let attempt = 0; attempt < tries; attempt++) {
      const pairs = pairUp(g, W, H, cells);
      if (!pairs) continue;
      shuffleArr(g, pairIcons);
      const b = new Array(W * H).fill(0);
      pairs.forEach(([A, B], q) => { b[A] = b[B] = pairIcons[q]; });
      best = b;
      if (g.grav === "none" || solvable(W, H, b, g.grav)) break;
    }
    const moves = [];
    if (best) g.b = best;
    else {
      // Cadangan (sangat jarang): rapatkan ubin ke kiri dengan pasangan tegak bersebelahan.
      const dest = columnCells(W, H, cells.length);
      const b = new Array(W * H).fill(0), t = new Array(W * H).fill(0);
      cells.forEach((c, q) => { t[dest[q]] = g.t[c]; if (c !== dest[q]) moves.push([c, dest[q]]); });
      for (let q = 0; q < pairIcons.length; q++) b[dest[2 * q]] = b[dest[2 * q + 1]] = pairIcons[q];
      g.b = b; g.t = t;
    }
    const changed = [];
    for (let i = 0; i < W * H; i++) if (g.b[i] && g.b[i] !== before[i]) changed.push(i);
    return { changed, moves, fallback: !best };
  }

  // Mencocokkan dua ubin. Mengembalikan null bila tidak sah.
  function match(g, i, j) {
    if (!playable(g) || i === j) return null;
    const n = g.W * g.H;
    if (!(i >= 0 && j >= 0 && i < n && j < n) || !g.b[i] || g.b[i] !== g.b[j]) return null;
    const path = search(g.W, g.H, g.b, i, j);
    if (!path) return null;
    const icon = g.b[i], ti = g.t[i], tj = g.t[j];
    g.b[i] = g.b[j] = 0;
    g.t[i] = g.t[j] = 0;
    g.left--;
    g.matches++;
    g.combo = g.clock - g.lastAt <= COMBO_MS ? Math.min(5, g.combo + 1) : 1;
    g.lastAt = g.clock;
    if (g.combo > g.bestCombo) g.bestCombo = g.combo;
    const pts = 10 + 2 * path.turns + 5 * (g.combo - 1);
    g.score += pts;
    if (g.timed) g.timeLeft = Math.min(Math.max(g.timeMax, g.timeLeft), g.timeLeft + 1000);
    const moves = applyGravity(g.W, g.H, g.b, g.t, g.grav);
    let shuffled = null;
    if (g.left === 0) {
      g.cleared = true;
      if (g.mode === "adv") {
        const time = Math.floor(g.timeLeft / 1000) * 5, hints = 50 * g.hintsLeft;
        g.bonus = { time, hints };
        g.score += time + hints;
        const ratio = g.timeLeft / g.timeMax;
        g.stars = g.continued ? 1 : ratio >= 0.5 ? 3 : ratio >= 0.25 ? 2 : 1;
      } else if (g.mode === "santai") g.boards++;
    } else if (!findMove(g.W, g.H, g.b)) {
      shuffled = reshuffle(g);
      g.autoShuffles++;
    }
    return { i, j, ti, tj, icon, path, turns: path.turns, pts, combo: g.combo, moves, shuffled, cleared: g.cleared };
  }
  function hint(g) {
    if (!playable(g) || (g.limited && g.hintsLeft <= 0)) return null;
    const moves = listMoves(g.W, g.H, g.b);
    if (!moves.length) return null;
    const m = moves[Math.floor(next(g) * moves.length)];
    if (g.limited) g.hintsLeft--;
    g.hintsUsed++; g.levelHints++;
    if (g.mode === "adv") g.timeLeft = Math.max(Math.min(g.timeLeft, 1000), g.timeLeft - HINT_COST_MS);
    else if (isRace(g)) g.penalty += PENALTY_MS;
    return m;
  }
  function shuffle(g) {
    if (!playable(g) || (g.limited && g.shufflesLeft <= 0) || g.left < 2) return null;
    if (g.limited) g.shufflesLeft--;
    g.shufflesUsed++; g.levelShuffles++;
    if (isRace(g)) g.penalty += PENALTY_MS;
    return reshuffle(g);
  }
  // Memajukan jam permainan. true bila waktu baru saja habis.
  function tick(g, dt) {
    if (!playable(g) || !(dt > 0)) return false;
    g.clock += dt;
    if (g.timed) {
      g.timeLeft -= dt;
      if (g.timeLeft <= 0) {
        g.timeLeft = 0;
        if (g.continued) g.over = true; else g.timeUp = true;
        return true;
      }
    }
    return false;
  }
  function continueRun(g) {
    if (!g.timeUp || g.continued || g.over) return false;
    g.continued = true; g.timeUp = false; g.timeLeft = CONTINUE_MS;
    return true;
  }
  function giveUp(g) {
    if (!g.timeUp || g.over) return false;
    g.timeUp = false; g.over = true;
    return true;
  }
  function nextBoard(g) {
    if (!g.cleared || g.over || isRace(g)) return false;
    if (g.mode === "adv") { g.level++; g.size = sizeForLevel(g.level); }
    setupBoard(g);
    return true;
  }
  function isValid(g) {
    if (!g || g.v !== 1 || !MODES.includes(g.mode) || !SIZES[g.size]) return false;
    const [W, H] = SIZES[g.size];
    if (g.W !== W || g.H !== H || !Array.isArray(g.b) || !Array.isArray(g.t) || g.b.length !== W * H || g.t.length !== W * H) return false;
    const count = {};
    let tiles = 0;
    for (let i = 0; i < W * H; i++) {
      const v = g.b[i];
      if (!Number.isInteger(v) || v < 0 || v > ICON_COUNT) return false;

    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.col;

    ctx.arc(p.x, p.y, p.sz / 2, 0, 6.283);

    "<circle id=\"spark\" r=\"" + (w * 1.2).toFixed(1) + "\" fill=\"#fff\" cx=\"" + xy[0][0] + "\" cy=\"" + xy[0][1] + "\"/>";

    const pd = S.pendingDuel ? GameCore.decodeDuel(S.pendingDuel) : null;
    if (S.pendingDuel === r.duel.code || (pd && pd.s === g.seed)) S.pendingDuel = null;
    // Papan yang sudah dimainkan diingat menurut SEED, supaya tidak bisa diulang sampai menang,
    // walau waktu atau nama di link diubah.
    S.duelDone = S.duelDone.filter((x) => x.s !== g.seed)
      .concat([{ s: g.seed, n: r.duel.n, t: r.duel.t, ms }]).slice(-20);
    markDuelSeed(g.seed);
    delete S.duelRuns[g.seed >>> 0];
  }
  // Papan buatan sendiri juga tercatat, jadi link sendiri tidak bisa dipakai untuk berlatih ulang.
  if (r.kind === "make" && g.cleared) markDuelSeed(g.seed);
  checkBadges();
  unlockThemes();
  r.result = {
    kind: r.kind, seed: g.seed, score: g.score, level: g.level, ms, clock: g.clock, hints: g.hintsUsed, shuffles: g.shufflesUsed,
    bestCombo: g.bestCombo, matches: g.matches, record: r.kind === "adv" && r.bestAtStart > 0 && g.score > r.bestAtStart,
    first: r.kind === "adv" && r.bestAtStart === 0 && g.score > 0, official, practice: !!r.practice, date: r.date,
    duel: r.duel, verdict, replyTo: r.replyTo || ""
  };
  delete S.runs[r.kind];
  save();
}

function shareText(text) {
  if (navigator.share) navigator.share({ text }).catch((e) => { if (!e || e.name !== "AbortError") copyText(text, true); });
  else copyText(text, true);
}
function copyText(text, wa) {
  const done = () => {
    toast("Tersalin. Tempel di WhatsApp!");
    if (wa) { try { window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener"); } catch (e) {} }
  };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("Gagal menyalin"); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}
function shareDaily() {
  const d = S.daily;

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
}

function readDuelHash() {
  const h = location.hash || "";
  if (!/^#t=/.test(h)) return;
  const m = /^#t=([A-Za-z0-9_-]+)$/.exec(h);
  try { history.replaceState(history.state, "", location.pathname + location.search); } catch (e) {}
  const inv = m ? GameCore.decodeDuel(m[1]) : null;
  if (!inv) { toast("Link tantangan tidak valid, minta tantangan baru."); return; }
  inv.code = m[1];
  if (!$("play").hidden) goHome();
  const done = duelDoneOf(inv);
  if (!done) { S.pendingDuel = inv.code; save(); }
  renderHome();
  if (done) showDuelDone(done); else showInvite(inv);
}

  $("stDuel").textContent = inv ? "Ditantang " + inv.n + "!" : S.duelW + S.duelL + S.duelD ? "Menang " + S.duelW + " · Kalah " + S.duelL : "Tantang";
  const st = streakNow();
  $("stats").textContent = S.games || S.pairs ? "Main " + fmt(S.games) + " kali · " + fmt(S.pairs) + " pasangan disambung" + (st ? " · 🔥 " + st + " hari" : "") : "Selamat datang! Coba Petualangan dulu.";
  $("badges").innerHTML = BADGES.map(([id, label, desc]) => "<span class=\"" + (S.badges.includes(id) ? "on" : "") + "\" title=\"" + desc + "\">" + label + "</span>").join("");
  renderToggles();
}
function renderToggles() {
  $("btnSound").textContent = S.settings.mute ? "🔇" : "🔊";
  $("btnSound").setAttribute("aria-label", S.settings.mute ? "Nyalakan suara" : "Matikan suara");
  $("btnVibe").textContent = "📳 Getar: " + (S.settings.vibrate ? "nyala" : "mati");
  const open = THEMES.filter((x) => themeOpen(x[2]));
  $("btnTheme").hidden = open.length < 2;
  const cur = THEMES.find((x) => x[0] === S.settings.theme) || THEMES[0];
  $("btnTheme").textContent = "🎨 Ubin: " + cur[1];
}
function goHome() {
  stopRunTimers();
  if (run && !run.finalized) saveRun();
  run = null; sel = null; paused = false;
  clearTiles();
  document.body.classList.remove("playing");
  $("play").hidden = true;
  $("home").hidden = false;
  renderHome();
}
function drawLogo() {
  // 3x3 ubin kecil: dua pisang disambung garis biru muda dengan satu belokan.
  const P = 24, s = [[1, 0, 9], [2, 0, 4], [1, 1, 3], [2, 1, 18]];
  let h = "";
  for (const [x, y, v] of s) h += "<rect x=\"" + (x * P + 2) + "\" y=\"" + (y * P + 2) + "\" width=\"22\" height=\"22\" rx=\"6\" fill=\"#F2F8F5\" opacity=\".55\"/><use href=\"#ic" + v + "\" x=\"" + (x * P + 5) + "\" y=\"" + (y * P + 5) + "\" width=\"16\" height=\"16\" opacity=\".55\"/>";
  h += "<polyline points=\"13,13 13,61 61,61\" fill=\"none\" stroke=\"#5EF0FF\" stroke-width=\"9\" stroke-opacity=\".3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>" +
    "<polyline points=\"13,13 13,61 61,61\" fill=\"none\" stroke=\"#5EF0FF\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>";
  for (const [x, y] of [[0, 0], [2, 2]]) h += "<rect x=\"" + (x * P + 1) + "\" y=\"" + (y * P + 1) + "\" width=\"24\" height=\"24\" rx=\"6\" fill=\"#F2F8F5\"/><use href=\"#ic1\" x=\"" + (x * P + 3) + "\" y=\"" + (y * P + 3) + "\" width=\"20\" height=\"20\"/>";
  $("logo").innerHTML = h;
}

// ---------- Panel, tombol Back, pesan ----------
let backArmed = false, overlayBack = null;
function enterScreen() {
  if (backArmed) return;
  try { history.pushState({ sk: 1 }, ""); backArmed = true; } catch (e) {}
}
function showPanel(html, wire, onBack) {
  const o = $("overlay");
  o.innerHTML = "<div class=\"panel\" role=\"dialog\" aria-modal=\"true\">" + html + "</div>";
  o.hidden = false;
  overlayBack = onBack || null;
  enterScreen();
  if (wire) wire();
  o.scrollTop = 0;
  const btn = o.querySelector("button");
  if (btn && !o.querySelector("input")) { try { btn.focus({ preventScroll: true }); } catch (e) { btn.focus(); } }
}
function hideOverlay() {
  $("overlay").hidden = true; $("overlay").innerHTML = ""; overlayBack = null;
  if (!$("play").hidden) { try { stageEl.focus({ preventScroll: true }); } catch (e) {} }
}
// Back menutup panel atau kembali ke menu; tidak pernah keluar dari situs saat sedang main.
window.addEventListener("popstate", () => {
  backArmed = false;
  if (!$("overlay").hidden) {
    const after = overlayBack;
    // Panel "waktu habis" harus dijawab dulu; Back tidak menutupnya.
    if (run && run.g.timeUp && !run.g.over && !after) { enterScreen(); return; }
    hideOverlay();
    if (after) after();
    if (!$("play").hidden || !$("overlay").hidden) enterScreen();
    return;
  }
  if (!$("play").hidden) {
    // Back saat bermain kembali ke menu; permainan tersimpan dan bisa dilanjutkan.
    goHome();
  }
});
window.addEventListener("hashchange", readDuelHash);
let toastTimer = 0;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

// ---------- Masukan ----------
function cellFromPoint(clientX, clientY) {
  if (!run) return -1;
  const g = run.g, r = stageEl.getBoundingClientRect();
  const x = Math.floor((clientX - r.left - ring) / pitch), y = Math.floor((clientY - r.top - ring) / pitch);
  if (x < 0 || y < 0 || x >= g.W || y >= g.H) return -1;
  return x + y * g.W;
}
stageEl.addEventListener("pointerdown", (e) => {
  if (e.button > 0) return;
  const i = cellFromPoint(e.clientX, e.clientY);
  if (i < 0) { if (sel != null && canPlay()) { sel = null; renderSel(); } return; }
  e.preventDefault();
  if (kcur != null) { kcur = i; renderCursor(); }
  tapCell(i);
});
stageEl.addEventListener("contextmenu", (e) => e.preventDefault());
function renderCursor() {
  if (!run || kcur == null) { kcEl.hidden = true; return; }
  kcEl.hidden = false;
  kcEl.style.transform = tileXY(kcur);
}
document.addEventListener("keydown", (e) => {
  if ($("play").hidden || !$("overlay").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "p" || e.key === "P" || e.key === "Escape") { e.preventDefault(); return showPause(); }
  if (!canPlay()) return;
  const g = run.g;
  const mv = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
  if (mv) {
    e.preventDefault();
    if (kcur == null) kcur = sel != null ? sel : 0;
    else {
      const x = Math.max(0, Math.min(g.W - 1, kcur % g.W + mv[0])), y = Math.max(0, Math.min(g.H - 1, Math.floor(kcur / g.W) + mv[1]));
      kcur = x + y * g.W;
    }
    return renderCursor();
  }
  if ((e.key === "Enter" || e.key === " ") && document.activeElement && !document.activeElement.closest("button")) {
    e.preventDefault();
    if (kcur == null) { kcur = 0; return renderCursor(); }
    return tapCell(kcur);
  }
  if (e.key === "h" || e.key === "H") { e.preventDefault(); doHint(); }
  if (e.key === "k" || e.key === "K") { e.preventDefault(); doShuffle(); }
});

function toggleSound() {
  S.settings.mute = !S.settings.mute;
  save();
  renderToggles();
  if (!S.settings.mute) sfx.tap();
}
$("modeAdv").onclick = () => startAdv(false);
$("modeDaily").onclick = startDaily;
$("modeSantai").onclick = () => sizePicker(false);
$("modeDuel").onclick = openDuelMenu;
$("btnHelp").onclick = showHelp;
$("btnMenu").onclick = goHome;
$("btnHint").onclick = doHint;
$("btnShuffle").onclick = doShuffle;
$("btnPause").onclick = showPause;
$("btnSound").onclick = toggleSound;
$("btnVibe").onclick = () => {
  S.settings.vibrate = !S.settings.vibrate;
  save();
  renderToggles();
  buzz(20);
};
$("btnTheme").onclick = () => {
  const open = THEMES.filter((x) => themeOpen(x[2]));
  const k = open.findIndex((x) => x[0] === S.settings.theme);
  S.settings.theme = open[(k + 1) % open.length][0];
  save();
  renderToggles();
};
let resizeRaf = 0;
window.addEventListener("resize", () => {
  if (resizeRaf) return;
  resizeRaf = requestAnimationFrame(() => { resizeRaf = 0; layout(); });
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (run) saveRun();
    // Pindah aplikasi saat waktu berjalan: otomatis jeda.
    if (run && canPlay() && (run.g.timed || GameCore.isRace(run.g))) showPause();
  } else resetClock();
});
window.addEventListener("pagehide", () => { if (run) saveRun(); });

drawLogo();
layout();
renderHome();
readDuelHash();
</script>
</html>
