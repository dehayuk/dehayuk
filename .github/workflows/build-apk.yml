# Membuat APK di server GitHub setiap kali ada perubahan, agar laptop tidak perlu Android SDK.
# Hasilnya diunduh dari tab Actions -> run terbaru -> bagian Artifacts -> tebak-kata-apk.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tebak-kata-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
