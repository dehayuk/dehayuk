# Membuat APK di server GitHub setiap kali ada perubahan, agar laptop tidak perlu Android SDK.
# Setiap APK diterbitkan sebagai Release, sehingga siapa pun bisa mengunduh tanpa akun GitHub:
# https://github.com/dehayuk/tebak-kata/releases/latest/download/dehayuk.apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      # Kunci tanda tangan tetap diambil dari GitHub Secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD).
      # Dengan kunci yang sama di setiap build, APK baru bisa memperbarui yang lama tanpa menghapus progres.
      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nalargame.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/nalargame.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 belum diisi, APK dibuat sebagai versi uji (debug)."
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../dehayuk.apk
            cp app/build/outputs/bundle/release/app-release.aab ../dehayuk.aab
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../dehayuk.apk
          fi

      # Berkas .aab untuk diunggah ke Play Console hanya disimpan di sini, tidak diterbitkan umum.
      - uses: actions/upload-artifact@v4
        with:
          name: dehayuk-app
          path: |
            dehayuk.apk
            dehayuk.aab
          if-no-files-found: warn

      - name: Terbitkan sebagai Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Dehayuk 0.1.${{ github.run_number }}
          body: |
            App Dehayuk untuk HP Android: NalarGame, Balok Ria, dan Pilah Kelereng dalam satu app.
            Unduh dehayuk.apk di bawah, lalu izinkan "instal dari sumber tidak dikenal".
          files: dehayuk.apk
          make_latest: true
