# Membuat APK di server GitHub setiap kali ada perubahan, agar laptop tidak perlu Android SDK.
# Setiap APK diterbitkan sebagai Release, sehingga siapa pun bisa mengunduh tanpa akun GitHub:
# https://github.com/socialiam/tebak-kata/releases/latest/download/tebak-kata.apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../tebak-kata.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tebak-kata-apk
          path: tebak-kata.apk

      - name: Terbitkan sebagai Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Tebak Kata 0.1.${{ github.run_number }}
          body: |
            Versi awal Tebak Kata untuk HP Android.
            Unduh tebak-kata.apk di bawah, lalu izinkan "instal dari sumber tidak dikenal".
          files: tebak-kata.apk
          make_latest: true
