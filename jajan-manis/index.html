<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7eb6">
<title>Jajan Manis</title>
<meta name="description" content="Tukar jajanan pasar, jejerkan tiga atau lebih, ledakkan! Klepon, onde-onde, kue lapis, dan kawan-kawan dalam ratusan level manis.">
<link rel="canonical" href="https://dehayuk.online/jajan-manis/">
<meta property="og:title" content="Jajan Manis">
<meta property="og:description" content="Tukar, jejerkan tiga, ledakkan! Puzzle jajanan pasar paling manis.">
<meta property="og:image" content="https://dehayuk.online/jajan-manis/sampul.jpg">
<meta property="og:url" content="https://dehayuk.online/jajan-manis/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/kit/kit.css">
<style>
:root{--dk-ink:#3b1740;--dk-lbl:#8a4a6a;--dk-p1:#fffaf4;--dk-p2:#ffe4f0;--dk-pe:#f6c4dc}
html,body{background:#ff9cc6}
body{position:fixed;inset:0}
canvas{display:block}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#col{position:fixed;top:0;bottom:0;pointer-events:none;z-index:10}
#probe{position:fixed;left:0;top:0;width:0;height:0;padding:var(--dk-st) var(--dk-sr) var(--dk-sb) var(--dk-sl);visibility:hidden}
.scr{position:absolute;inset:0}
#sTitle{display:flex;flex-direction:column;align-items:center;padding:calc(var(--dk-st) + 64px) 14px var(--padb,170px)}
#sTitle>*{pointer-events:auto}
.home{position:absolute!important;left:calc(var(--dk-sl) + 12px);top:calc(var(--dk-st) + 12px);width:44px!important;height:44px!important}
.home svg{width:22px!important;height:22px!important;filter:none!important}
.pill{display:flex;align-items:center;gap:5px;background:rgba(59,23,64,.72);border:3px solid var(--dk-ink);border-radius:999px;padding:3px 12px 3px 6px;font:800 17px/1.2 var(--dk-fd);white-space:nowrap}
.pill svg{width:22px;height:22px;flex:none}
.best{position:absolute;right:calc(var(--dk-sr) + 12px);top:calc(var(--dk-st) + 16px);color:#ffe36a}
.chip{position:absolute;left:50%;top:calc(var(--dk-st) + 16px);transform:translateX(-50%);font-size:15px;color:#fff}
.chip .strk{display:flex;align-items:center;gap:3px;margin-left:3px;padding-left:7px;border-left:2px solid rgba(255,255,255,.25)}
#logo{flex:none;width:min(92%,380px,calc(30vh * 1.6));aspect-ratio:1.6/1;margin-top:auto}
.tmid{flex:0 1 auto;margin-bottom:auto;padding-top:min(3vh,24px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;min-height:0}
.chal{font:800 17px/1.15 var(--dk-fd);text-align:center;background:#ff5c93;border:3px solid var(--dk-ink);border-radius:14px;padding:6px 14px 8px;box-shadow:0 4px 0 var(--dk-ink);transform:rotate(-3deg);animation:dk-wig 1.4s ease-in-out infinite;max-width:300px}
.mainw{display:flex;flex-direction:column;align-items:center}
#bMain{font-size:40px;padding:14px 46px 18px;border-radius:28px;animation:dk-pulse 1.1s ease-in-out infinite}
#bMain svg{width:34px;height:34px}
#bMain.dk-pr{animation:none}
.lvtag{cursor:pointer;margin-top:-8px;position:relative;z-index:1;font:800 16px/1 var(--dk-fd);background:#fff;color:var(--dk-ink);border:3px solid var(--dk-ink);border-radius:999px;padding:4px 14px 5px;box-shadow:0 3px 0 var(--dk-ink);display:flex;align-items:center;gap:4px}
.lvtag svg{width:16px;height:16px}
.icons{display:flex;gap:12px;justify-content:center}
.dstar{position:absolute;right:-8px;bottom:-6px;display:flex;align-items:center;gap:1px;background:#fff;border:2.5px solid var(--dk-ink);border-radius:999px;padding:0 5px 0 2px;font:800 12px/16px var(--dk-fd);color:var(--dk-ink)}
.dstar svg{width:13px!important;height:13px!important;filter:none!important}
.ent>*{animation:dk-pop .5s cubic-bezier(.2,1.5,.4,1) backwards}
.ent>:nth-child(2){animation-delay:.08s}.ent>:nth-child(3){animation-delay:.16s}
.leave{animation:leave .28s ease-in forwards}
@keyframes leave{to{transform:translateY(40px) scale(.9);opacity:0}}
.cover .tmid,.cover .home,.cover .best,.cover .chip{display:none!important}
.cover #logo{position:absolute;left:3vw;top:50%;transform:translateY(-54%);width:50vw;max-width:none}
#hud{position:absolute;left:calc(var(--dk-sl) + 10px);top:calc(var(--dk-st) + 10px);pointer-events:auto}
#hud .dk-circle{width:46px;height:46px}
.vhid{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.big{font:800 58px/1 var(--dk-fd);font-variant-numeric:tabular-nums}
.rstars{display:flex;align-items:flex-end;gap:2px;margin-top:-6px}
.rstars svg{width:62px;height:62px;filter:drop-shadow(0 3px 0 var(--dk-ink))}
.rstars svg:nth-child(2){width:78px;height:78px;margin-bottom:10px}
.rstars .on{animation:starin .45s cubic-bezier(.2,1.7,.4,1) backwards}
@keyframes starin{from{transform:scale(2.6) rotate(-40deg);opacity:0}}
.rsub{display:flex;flex-direction:column;align-items:center;gap:2px}
.rrec{font:800 13px/1.2 var(--dk-fd);color:var(--dk-lbl);text-align:center;white-space:pre-line}
.rbar{width:100%;height:14px;border:3px solid var(--dk-ink);border-radius:999px;background:#f3dde8;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.1)}
.rbar i{display:block;height:100%;width:0;background:linear-gradient(#ffe36a,#ffb21a);border-radius:999px}
.rbar.rec i{background:linear-gradient(#ffb3d9,#ff5c93)}
.rmisc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.stats{display:flex;gap:10px;width:100%}
.st{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--dk-ink);border-radius:16px;box-shadow:0 4px 0 var(--dk-ink);padding:6px 10px;min-width:0}
.st img,.st svg{width:30px;height:30px;flex:none}
.st div{display:flex;flex-direction:column;min-width:0}
.st b{font:800 22px/1 var(--dk-fd)}
.st span{font:800 12px/1.1 var(--dk-fd);color:var(--dk-lbl)}
.note{font:800 17px/1.1 var(--dk-fd);padding:5px 14px 7px;border-radius:12px;border:3px solid var(--dk-ink);background:#ffe36a;color:var(--dk-ink)}
.verd{font:800 26px/1 var(--dk-fd);padding:6px 20px 9px;border-radius:14px;border:4px solid var(--dk-ink);box-shadow:0 4px 0 var(--dk-ink);background:linear-gradient(#ff8a8a,#e8384f);transform:rotate(-3deg);text-align:center}
.verd.win{background:linear-gradient(#8ef06a,#3dbb2c)}
.verd small{display:block;font-size:13px;margin-top:3px}
.xp{font:800 14px/1 var(--dk-fd);background:var(--dk-ink);color:#ffe36a;border-radius:999px;padding:5px 12px 6px}
.gift{display:flex;align-items:center;gap:4px;font:800 13px/1 var(--dk-fd);background:#fff;color:var(--dk-ink);border:3px solid var(--dk-ink);border-radius:999px;padding:2px 10px 3px 4px;animation:dk-wig 1.4s ease-in-out infinite}.gift svg{width:22px;height:22px}
.jarp{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--dk-ink);border-radius:14px;padding:3px 10px 4px 4px}.jarp img{width:28px;height:28px}.jarp div{display:flex;flex-direction:column;gap:3px}
.jarp span{font:800 12px/1 var(--dk-fd);color:var(--dk-ink)}.jarp i{display:block;width:110px;height:8px;border:2px solid var(--dk-ink);border-radius:9px;background:#f3dde8;overflow:hidden}.jarp i b{display:block;height:100%;width:0;background:linear-gradient(#ffe36a,#ffb21a)}
#rAgain.pul{animation:dk-pulse 1.1s ease-in-out infinite}
#rAgain{font-size:26px;padding:14px 10px 17px}
.rek{position:absolute;right:-18px;top:-30px;width:96px;height:96px;display:grid;place-items:center;transform:rotate(12deg);z-index:2}
.rek::before,.rek::after{content:"";position:absolute;clip-path:polygon(50% 0,61% 16%,79% 7%,80% 27%,100% 30%,88% 47%,100% 64%,80% 69%,79% 90%,61% 82%,50% 100%,39% 82%,21% 90%,20% 69%,0 64%,12% 47%,0 30%,20% 27%,21% 7%,39% 16%)}
.rek::before{inset:0;background:var(--dk-ink)}
.rek::after{inset:5px;background:linear-gradient(#ffe36a,#ffb21a)}
.rek span{position:relative;z-index:1;font:800 17px/.95 var(--dk-fd);text-align:center}
.rek.go{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes stamp{from{transform:rotate(-30deg) scale(3);opacity:0}}
.goals{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.goal{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:3px solid var(--dk-ink);border-radius:14px;box-shadow:0 3px 0 var(--dk-ink);padding:5px 8px 6px;min-width:70px}
.goal span{display:flex}.goal svg{width:18px;height:18px}.goal img{width:34px;height:34px}
.goal b{font:800 15px/1 var(--dk-fd);text-align:center}
.goal i{font:800 11px/1 var(--dk-fd);font-style:normal;color:var(--dk-lbl)}
.strk2{display:flex;align-items:center;gap:4px;font:800 15px/1 var(--dk-fd)}.strk2 svg{width:20px;height:20px}
.cal{width:100px;height:102px;border:4px solid var(--dk-ink);border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--dk-ink);overflow:hidden;display:flex;flex-direction:column;transform:rotate(-4deg)}
.cal i{display:block;height:30px;background:linear-gradient(#b27bff,#7a3fe0);border-bottom:4px solid var(--dk-ink);font:800 16px/27px var(--dk-fd);font-style:normal;color:#fff;text-align:center}
.cal b{flex:1;display:grid;place-items:center;font:800 48px/1 var(--dk-fd)}
.jars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px;width:100%}
.jar{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.jar div{position:relative;width:62px;height:66px;border:3px solid var(--dk-ink);border-radius:14px 14px 18px 18px;background:linear-gradient(90deg,rgba(255,255,255,.9),rgba(220,240,255,.7) 40%,rgba(255,255,255,.95));display:grid;place-items:center;box-shadow:0 3px 0 var(--dk-ink)}
.jar div::before{content:"";position:absolute;left:6px;right:6px;top:-9px;height:9px;border:3px solid var(--dk-ink);border-bottom:0;border-radius:6px 6px 0 0;background:var(--lid,#ff5c93)}
.jar img{width:40px;height:40px}
.jar b{font:800 12px/1.05 var(--dk-fd)}.jar span{font:800 11px/1 var(--dk-fd);color:var(--dk-lbl)}
.jar .tier{position:absolute;right:-8px;bottom:-7px;font:800 10px/1 var(--dk-fd);background:#ffe36a;border:2px solid var(--dk-ink);border-radius:99px;padding:2px 5px 3px;color:var(--dk-ink)}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:100%;max-height:min(40vh,300px);overflow-y:auto;padding:4px 3px 6px;overscroll-behavior:contain}
.lvb{position:relative;border:3px solid var(--dk-ink);border-radius:14px;background:linear-gradient(#fff,#ffe0ee);box-shadow:0 3px 0 var(--dk-ink);font:800 17px/1 var(--dk-fd);color:var(--dk-ink);padding:7px 0 12px;min-height:46px}
.lvb.cur{background:linear-gradient(#8ef06a,#3dbb2c);color:#fff}
.lvb i{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center;gap:0}
.lvb i svg{width:11px;height:11px}
#rNormal{font-size:17px;padding:8px 10px 10px}
@media (max-height:500px){
  #sTitle{padding-top:calc(var(--dk-st) + 54px)}
  #logo{width:min(56%,270px,calc(34vh * 1.6))}
  .tmid{gap:9px}
  #bMain{font-size:28px;padding:9px 34px 12px}
  #bMain svg{width:26px;height:26px}
  .lvtag{font-size:13px;padding:3px 10px 4px}
  .dk-round>i{width:46px;height:46px}.dk-round>i svg{width:23px;height:23px}
  #sOver .dk-panel{max-width:640px;display:grid;grid-template-columns:1fr 1fr;column-gap:16px;row-gap:6px;align-items:center}
  #sOver .rstars{grid-column:1;grid-row:1}#sOver .rsub{grid-column:1;grid-row:2}#sOver .rbar{grid-column:1;grid-row:3}#sOver .rmisc{grid-column:1;grid-row:4}
  #sOver .stats{grid-column:2;grid-row:1}#sOver .dk-stack{grid-column:2;grid-row:2/5}
  .big{font-size:40px}.rstars svg{width:42px;height:42px}.rstars svg:nth-child(2){width:52px;height:52px;margin-bottom:6px}
  #rAgain{font-size:20px;padding:9px 8px 11px}
  .rek{width:64px;height:64px;top:-20px;right:-10px}.rek span{font-size:13px}
  .st{padding:3px 8px}.st b{font-size:18px}.st img,.st svg{width:24px;height:24px}
  .cal{display:none}
  #sKoleksi .dk-panel{max-width:620px}
  .jars{grid-template-columns:repeat(6,1fr)}.jar div{width:48px;height:50px}.jar img{width:32px;height:32px}.jar span{display:none}
  .lvgrid{grid-template-columns:repeat(8,1fr);max-height:34vh}
}
@media (max-height:760px) and (max-aspect-ratio:13/10){
  #sOver .dk-panel{padding-top:34px;gap:8px}
  #sOver .big{font-size:46px}
  #sOver .st{padding:4px 8px}#sOver .st b{font-size:19px}#sOver .st img,#sOver .st svg{width:24px;height:24px}
  #sOver .dk-stack{gap:9px}#rAgain{font-size:22px;padding:10px 8px 13px}#sOver .dk-row .dk-btn{padding:8px 6px 10px}
  #sOver .rek{width:78px;height:78px;right:-8px;top:-22px}#sOver .rek span{font-size:14px}
}
#uji{position:fixed;left:4px;top:4px;right:4px;bottom:4px;overflow:auto;z-index:99;background:rgba(0,0,0,.86);color:#fff;font:12px/1.35 monospace;padding:8px;white-space:pre-wrap;border-radius:8px}
</style>
</head>
<body>
<canvas id="cv" role="img" aria-label="Papan jajanan pasar"></canvas>
<div id="sr" class="vhid" aria-live="polite"></div>
<div id="probe"></div>
<div id="col">
  <section id="sTitle" class="scr">
    <a href="/" class="dk-btn dk-yellow dk-circle home" aria-label="Beranda"><svg viewBox="0 0 24 24"><path fill="#3b1740" d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg></a>
    <div class="pill chip dk-ol" id="tProg"><svg viewBox="0 0 24 24"><path fill="#ffd23a" stroke="#3b1740" stroke-width="2" stroke-linejoin="round" d="M12 2.8l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.7l-5.4 2.9 1.1-6.1-4.5-4.3 6.1-.8z"/></svg><span id="tLv">Lv 1</span><span class="strk" id="tStrk" hidden><svg viewBox="0 0 24 24"><path fill="#ff8a1a" stroke="#3b1740" stroke-width="2" stroke-linejoin="round" d="M12 2.5c1.2 3.6 5.5 5.6 5.5 11a5.5 5.5 0 0 1-11 0c0-2.8 1.4-4.4 2.8-5.4-.1 2.1.8 3.2 2 3.4-.7-3.2.2-6.4.7-9z"/><path fill="#ffe36a" d="M12 12.5c.9 1.5 2.3 2.3 2.3 4a2.3 2.3 0 0 1-4.6 0c0-1.2.9-2.1 2.3-4z"/></svg><span id="tStrkN">1 hari</span></span></div>
    <div class="pill best dk-ol" id="tBest" aria-label="Total bintang"><svg viewBox="0 0 24 24"><path fill="#ffd23a" stroke="#3b1740" stroke-width="2" stroke-linejoin="round" d="M12 2.8l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.7l-5.4 2.9 1.1-6.1-4.5-4.3 6.1-.8z"/></svg><span>0</span></div>
    <div id="logo"></div>
    <div class="tmid ent" id="tMid">
      <div class="chal dk-ol" id="tChal" hidden>Kalahkan skor temanmu!</div>
      <div class="mainw">
        <button class="dk-btn dk-green dk-ol" id="bMain"><svg viewBox="0 0 24 24"><path fill="#fff" stroke="#3b1740" stroke-width="2" stroke-linejoin="round" d="M7 4.5v15l12-7.5z"/></svg>MAIN</button>
        <button class="lvtag" id="bLv" aria-label="Pilih level">Level 1</button>
      </div>
      <div class="icons">
        <button class="dk-round dk-purple" id="bHarian"><i><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><rect x="4" y="5.5" width="16" height="15" rx="3" fill="#fff" stroke="#3b1740" stroke-width="2"/><path d="M4.5 10h15" stroke="#8f5cf0" stroke-width="4"/><path d="M8.5 3.5v4M15.5 3.5v4" stroke="#3b1740" stroke-width="2.6"/><circle cx="12" cy="15.5" r="2.8" fill="#35d05a" stroke="#3b1740" stroke-width="1.4"/></svg><b class="dk-dot" id="dDaily" hidden></b><b class="dstar" id="dStarN" hidden></b></i><span>Harian</span></button>
        <button class="dk-round dk-pink" id="bTantang" aria-label="Tantang"><i class="dk-ol" aria-hidden="true">VS</i><span>Tantang</span></button>
        <button class="dk-round dk-blue" id="bKoleksi"><i><svg viewBox="0 0 24 24" stroke="#3b1740" stroke-width="1.6"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2.2" fill="#35d05a"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="3.75" fill="#ffb52e"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="3.75" fill="#ff5fa8"/><path d="M16.75 13.2l3.6 6.9h-7.2z" fill="#a35cff" stroke-linejoin="round"/></svg></i><span>Koleksi</span></button>
        <button class="dk-round dk-orange" id="bPeringkat"><i><svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z" fill="#ffd23f" stroke="#3b1740" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 6H4.5a2.5 2.5 0 0 0 3 3.6M17 6h2.5a2.5 2.5 0 0 1-3 3.6" fill="none" stroke="#3b1740" stroke-width="1.8" stroke-linecap="round"/><path d="M12 14v3M8.5 20h7l-1-3h-5z" fill="#ffd23f" stroke="#3b1740" stroke-width="1.8" stroke-linejoin="round"/></svg></i><span>Peringkat</span></button>
        <button class="dk-round dk-yellow" id="bSetelan"><i><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.2" stroke="#3b1740" stroke-width="6.5" stroke-dasharray="2.9 2.75"/><circle cx="12" cy="12" r="7.2" stroke="#fff" stroke-width="4" stroke-dasharray="2.9 2.75"/><circle cx="12" cy="12" r="6" fill="#fff" stroke="#3b1740" stroke-width="2"/><circle cx="12" cy="12" r="2.4" fill="#ff5c93" stroke="#3b1740" stroke-width="1.6"/></svg></i><span>Setelan</span></button>
      </div>
    </div>
  </section>

  <div id="hud" hidden>
    <button class="dk-btn dk-orange dk-circle" id="bPause" aria-label="Jeda"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.5" fill="#fff" stroke="#3b1740" stroke-width="1.8"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5" fill="#fff" stroke="#3b1740" stroke-width="1.8"/></svg></button>
  </div>

  <section id="sPause" class="dk-overlay" hidden>
    <div class="dk-panel">
      <div class="dk-ribbon dk-blue dk-ol">Jeda</div>
      <div class="goals" id="pGoals"></div>
      <div class="dk-stack">
        <button class="dk-btn dk-green dk-ol" id="pGo"><svg viewBox="0 0 24 24"><path fill="#fff" stroke="#3b1740" stroke-width="2" stroke-linejoin="round" d="M7 4.5v15l12-7.5z"/></svg>Lanjut</button>
        <button class="dk-btn dk-yellow dk-ol" id="pRe"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M19 12a7 7 0 1 1-2.1-5" stroke="#3b1740" stroke-width="5"/><path d="M19 12a7 7 0 1 1-2.1-5" stroke="#fff" stroke-width="2.6"/><path d="M13.5 3.5h5v5z" fill="#fff" stroke="#3b1740" stroke-width="1.8" stroke-linejoin="round"/></svg>Ulang</button>
        <button class="dk-btn dk-orange dk-ol" id="pMenu"><svg viewBox="0 0 24 24"><path fill="#fff" stroke="#3b1740" stroke-width="1.8" stroke-linejoin="round" d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg>Menu</button>
      </div>
    </div>
  </section>

  <section id="sOver" class="dk-overlay" hidden>
    <div class="dk-panel">
      <div class="dk-ribbon dk-ol" id="rRib">Level 1</div>
      <div class="rek dk-ol" id="rRek" hidden><span>Rekor<br>baru!</span></div>
      <div class="rstars" id="rStars"></div>
      <div class="rsub"><div class="dk-lbl" id="rMode">Skor</div><div class="big dk-ol" id="rScore">0</div><div class="rrec" id="rRec"></div></div>

<script>
"use strict";

  for (let i = 0; i < NN; i++) { this.M[i] = def.mask[i] ? 1 : 0; this.J[i] = this.M[i] ? def.agar[i] : 0; }

};
Core.prototype.clone = function (rng) {

};
Core.prototype.rnd = function () { return (this.rng() * this.C) | 0; };
Core.prototype.agarLeft = function () { let s = 0; for (let i = 0; i < NN; i++) s += this.J[i]; return s; };
Core.prototype.color = function (i) { const t = this.T[i]; return t >= 0 && t < RBT ? t : -1; };
// menaruh t di i membuat tiga sejajar dengan dua sel di kiri atau di atasnya
Core.prototype.makesRun = function (i, t) {
  const T = this.T, c = i & 7;

};
Core.prototype.fill = function () {
  const T = this.T;
  for (let tries = 0; tries < 300; tries++) {
    for (let i = 0; i < NN; i++) {
      this.S[i] = 0;
      if (!this.M[i]) { T[i] = -1; this.ID[i] = 0; continue; }
      let t, k = 0; do { t = this.rnd(); } while (++k < 40 && this.makesRun(i, t));
      T[i] = t; this.ID[i] = this.idc++;

};
// deret 3+ sejenis, mendatar (h) dan menurun
Core.prototype.runs = function () {
  const T = this.T, out = [];
  for (let pass = 0; pass < 2; pass++) for (let a = 0; a < N; a++) {
    let b = 0;
    while (b < N) {
      const at = (k) => pass ? k * 8 + a : a * 8 + k, t = T[at(b)];
      if (t < 0 || t >= RBT) { b++; continue; }
      let e = b + 1; while (e < N && T[at(e)] === t) e++;
      if (e - b >= 3) { const cells = []; for (let k = b; k < e; k++) cells.push(at(k)); out.push({ h: !pass, cells, t }); }
      b = e;
    }
  }
  return out;
};
// deret yang berbagi sel digabung jadi satu bentuk (L, T, +)
Core.prototype.groups = function () {
  const R = this.runs(), par = R.map((_, k) => k), own = new Int16Array(NN).fill(-1);
  const find = (x) => { while (par[x] !== x) x = par[x] = par[par[x]]; return x; };
  R.forEach((r, k) => r.cells.forEach((i) => { if (own[i] >= 0) par[find(k)] = find(own[i]); else own[i] = k; }));
  const G = new Map();
  R.forEach((r, k) => { const g = find(k); if (!G.has(g)) G.set(g, { set: new Set(), runs: [], t: r.t }); const q = G.get(g); q.runs.push(r); r.cells.forEach((i) => q.set.add(i)); });
  return [...G.values()].map((q) => ({ cells: [...q.set], runs: q.runs, t: q.t }));
};
// istimewa dari bentuk: 5 sejajar = bintang pelangi, L/T = bungkus daun, 4 sejajar = garis gula
function groupSpecial(g) {
  let mx = 0, h = 0, v = 0, four = null;
  for (const r of g.runs) { const n = r.cells.length; if (n > mx) mx = n; if (r.h) h = 1; else v = 1; if (n === 4 && !four) four = r; }
  if (mx >= 5) return RB;
  if (h && v) return BOMB;
  if (mx === 4) return four.h ? SH : SV;
  return 0;
}
Core.prototype.pickCell = function (g) {
  const ok = (i) => i >= 0 && g.cells.indexOf(i) >= 0 && !this.S[i];
  if (this.pend) { if (ok(this.pend.b)) return this.pend.b; if (ok(this.pend.a)) return this.pend.a; }
  if (g.runs.length > 1) for (const i of g.cells) if (ok(i) && g.runs.filter((r) => r.cells.indexOf(i) >= 0).length > 1) return i;
  const r = g.runs.reduce((p, q) => q.cells.length > p.cells.length ? q : p), m = r.cells.length >> 1;
  for (let k = 0; k < r.cells.length; k++) { const i = r.cells[(m + k) % r.cells.length]; if (ok(i)) return i; }
  return -1;
};
// panjang deret yang melewati i
Core.prototype.lineAt = function (i) {
  const T = this.T, t = T[i]; if (t < 0 || t >= RBT) return 0;
  const r = i >> 3, c = i & 7; let h = 1, v = 1;
  for (let k = c - 1; k >= 0 && T[r * 8 + k] === t; k--) h++;
  for (let k = c + 1; k < N && T[r * 8 + k] === t; k++) h++;
  for (let k = r - 1; k >= 0 && T[k * 8 + c] === t; k--) v++;
  for (let k = r + 1; k < N && T[k * 8 + c] === t; k++) v++;
  return (h >= 3 ? h : 0) + (v >= 3 ? v : 0);
};
Core.prototype.canSwap = function (a, b) { return adj(a, b) && this.M[a] && this.M[b] && this.T[a] >= 0 && this.T[b] >= 0; };
Core.prototype.xchg = function (a, b) {
  for (const k of ["T", "S", "ID"]) { const A = this[k], x = A[a]; A[a] = A[b]; A[b] = x; }
};
// semua langkah sah; any = berhenti di yang pertama
Core.prototype.findMoves = function (any) {
  const out = [], S = this.S;
  for (let a = 0; a < NN; a++) for (const d of [1, 8]) {
    const b = a + d; if ((d === 1 && (a & 7) === 7) || !this.canSwap(a, b)) continue;
    let v;
    if (S[a] === RB || S[b] === RB || (S[a] && S[b])) v = 20 + S[a] + S[b];
    else { this.xchg(a, b); v = this.lineAt(a) + this.lineAt(b); this.xchg(a, b); if (!v) continue; }
    out.push({ a, b, v }); if (any) return out;
  }
  return out;
};
Core.prototype.swap = function (a, b) {
  if (this.moves <= 0 || !this.canSwap(a, b)) return null;
  const sa = this.S[a], sb = this.S[b], combo = sa === RB || sb === RB || (sa > 0 && sb > 0);
  this.xchg(a, b);
  if (!combo && !this.lineAt(a) && !this.lineAt(b)) { this.xchg(a, b); return { ok: false, a, b }; }
  this.moves--; this.used++; this.cascade = 0; this.pend = { a, b }; this.combo = combo ? { a, b } : null;
  return { ok: true, a, b, combo };
};
// warna terbanyak di papan (untuk bintang pelangi yang tersambar)
Core.prototype.topColor = function (skip) {
  const n = [0, 0, 0, 0, 0, 0]; let b = 0;
  for (let i = 0; i < NN; i++) { const t = this.color(i); if (t >= 0 && !(skip && skip.has(i))) n[t]++; }
  for (let t = 1; t < 6; t++) if (n[t] > n[b]) b = t;
  return b;
};
// ledakan berantai: seeds [{i, d}] (d = jeda detik untuk tampilan)
Core.prototype.blast = function (seeds, protect, fx) {
  const hit = new Map(), q = [];
  const add = (i, d) => { if (i < 0 || i >= NN || !this.M[i] || this.T[i] < 0 || protect.has(i) || hit.has(i)) return; hit.set(i, d); q.push(i); };
  for (const s of seeds) add(s.i, s.d || 0);
  for (let h = 0; h < q.length; h++) {
    const i = q[h], s = this.S[i]; if (!s || this.fired.has(i)) continue;
    this.fired.add(i); this.fire(i, s, hit.get(i), add, fx, hit);
  }
  return hit;
};
Core.prototype.fire = function (i, s, d, add, fx, hit) {
  const r = i >> 3, c = i & 7;
  if (s === SH || s === SV) {
    fx.push({ k: s === SH ? "row" : "col", r, c, d });
    for (let k = 0; k < N; k++) add(s === SH ? r * 8 + k : k * 8 + c, d + 0.035 * Math.abs(k - (s === SH ? c : r)));
  } else if (s === BOMB) {
    fx.push({ k: "bomb", r, c, d, rad: 1 });
    for (let y = r - 1; y <= r + 1; y++) for (let x = c - 1; x <= c + 1; x++) if (y >= 0 && y < N && x >= 0 && x < N) add(y * 8 + x, d + 0.05);
  } else if (s === RB) {
    const t = this.topColor(hit), to = [];
    for (let k = 0; k < NN; k++) if (this.color(k) === t && !hit.has(k)) to.push(k);
    fx.push({ k: "rb", r, c, d, to, t });
    to.forEach((k, n) => add(k, d + 0.12 + 0.02 * n));
  }
};
// gabungan dua istimewa atau bintang pelangi; pusat di b (tempat bidak pertama mendarat)
Core.prototype.comboSeeds = function (a, b, fx, seeds, conv) {
  const S = this.S, sa = S[a], sb = S[b], r = b >> 3, c = b & 7;
  if (sa === RB || sb === RB) {
    const rb = sa === RB ? a : b, o = rb === a ? b : a, os = S[o];
    this.fired.add(rb); seeds.push({ i: rb, d: 0 });
    if (os === RB) { // dua bintang: sapu bersih
      this.fired.add(o); fx.push({ k: "all", r, c, d: 0 });
      for (let k = 0; k < NN; k++) seeds.push({ i: k, d: 0.1 + 0.03 * (Math.abs((k >> 3) - r) + Math.abs((k & 7) - c)) });
      return "Sapu bersih!";
    }
    const t = this.T[o], to = [];
    for (let k = 0; k < NN; k++) if (this.color(k) === t) to.push(k);
    if (os) { // jadi istimewa semua lalu meledak
      for (const k of to) if (!S[k] || k === o) { S[k] = os === BOMB ? BOMB : (this.rng() < 0.5 ? SH : SV); conv.push({ i: k, s: S[k], id: this.ID[k] }); }
    }
    fx.push({ k: "rb", r: rb >> 3, c: rb & 7, d: 0, to, t });
    to.forEach((k, n) => seeds.push({ i: k, d: 0.15 + 0.025 * n + (os ? 0.25 : 0) }));
    return os === BOMB ? "Hujan bungkus!" : os ? "Hujan garis!" : "Pelangi!";
  }
  this.fired.add(a); this.fired.add(b); seeds.push({ i: a, d: 0 }, { i: b, d: 0 });
  const addRow = (y, d0) => { if (y < 0 || y >= N) return; fx.push({ k: "row", r: y, c, d: d0 }); for (let x = 0; x < N; x++) seeds.push({ i: y * 8 + x, d: d0 + 0.035 * Math.abs(x - c) }); };
  const addCol = (x, d0) => { if (x < 0 || x >= N) return; fx.push({ k: "col", r, c: x, d: d0 }); for (let y = 0; y < N; y++) seeds.push({ i: y * 8 + x, d: d0 + 0.035 * Math.abs(y - r) }); };
  if (sa === BOMB && sb === BOMB) {
    fx.push({ k: "bomb", r, c, d: 0, rad: 2 });
    for (let y = r - 2; y <= r + 2; y++) for (let x = c - 2; x <= c + 2; x++) if (y >= 0 && y < N && x >= 0 && x < N) seeds.push({ i: y * 8 + x, d: 0.05 });
    return "Bom besar!";
  }
  if (sa === BOMB || sb === BOMB) { for (let k = -1; k <= 1; k++) { addRow(r + k, 0.05); addCol(c + k, 0.05); } return "Silang raksasa!"; }
  addRow(r, 0); addCol(c, 0); return "Silang!";
};
// satu putaran: cocokkan (atau gabungan), ledakkan, jatuhkan, isi. null bila papan tenang.
Core.prototype.step = function () {
  const fx = [], seeds = [], protect = new Set(), made = [], conv = [], matched = new Set();
  let label = "";

  if (this.combo) { label = this.comboSeeds(this.combo.a, this.combo.b, fx, seeds, conv); this.combo = null; }
  else {
    const G = this.groups(); if (!G.length) { this.pend = null; return null; }
    for (const g of G) {
      g.cells.forEach((i) => matched.add(i));
      const k = groupSpecial(g), p = k ? this.pickCell(g) : -1;
      if (p >= 0) { protect.add(p); made.push({ i: p, s: k, t: g.t }); }
      g.cells.forEach((i) => { if (i !== p) seeds.push({ i, d: 0 }); });
    }
  }
  this.cascade++; this.pend = null; if (this.cascade > this.bestCascade) this.bestCascade = this.cascade;
  return this.apply(this.blast(seeds, protect, fx), { fx, made, conv, matched, label });
};
Core.prototype.apply = function (hit, o) {
  const T = this.T, S = this.S, J = this.J, ID = this.ID, cm = Math.min(8, Math.max(1, this.cascade));
  const clears = [], agar = []; let gain = 0;
  for (const [i, d] of hit) {
    const t = T[i];
    if (t >= 0 && t < RBT) this.got[t]++;
    if (J[i]) { J[i]--; agar.push({ i, d, left: J[i] }); gain += 100; }
    gain += (o.matched && o.matched.has(i) ? 20 : 30) * cm;
    clears.push({ i, id: ID[i], t, s: S[i], d });
    T[i] = -1; S[i] = 0; ID[i] = 0;
  }
  for (const m of o.made || []) {
    if (J[m.i]) { J[m.i]--; agar.push({ i: m.i, d: 0, left: J[m.i] }); gain += 100; }
    S[m.i] = m.s; if (m.s === RB) T[m.i] = RBT;
    gain += m.s === RB ? 400 : m.s === BOMB ? 200 : 120; this.made++;
    m.id = ID[m.i];
  }

};
// jatuh per kolom melewati lubang, lalu isi dari atas
