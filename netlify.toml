# Pengaturan Netlify untuk situs Dehayuk: halaman depan di akar, setiap game di foldernya sendiri (misal /jatuh-buah/).
# Semua halaman berupa berkas HTML biasa, jadi tidak ada langkah build.
# Setiap push ke cabang main di GitHub otomatis ditayangkan ulang oleh Netlify.
[build]
  publish = "."
  command = "echo Tidak ada langkah build untuk versi web"
  # Perubahan yang hanya menyangkut app Android atau berkas kerja tidak ditayangkan ulang,
  # agar kredit Netlify tidak terpakai. Keluar 0 berarti lewati penayangan.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)android' ':(exclude).github' ':(exclude)scripts' ':(exclude)STANDAR-GAME.md' ':(exclude)package.json' ':(exclude)package-lock.json'"

# Folder dan berkas app Android tidak perlu dibuka lewat web.
[[redirects]]
  from = "/android/*"
  to = "/"
  status = 302
  force = true

# Berkas kerja proyek juga tidak perlu dibuka lewat web.
[[redirects]]
  from = "/scripts/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/STANDAR-GAME.md"
  to = "/"
  status = 302
  force = true

# Penyimpanan di browser pengunjung, agar yang kembali tidak mengunduh ulang dan kredit Netlify hemat.
# Halaman HTML tetap selalu diperiksa ulang, jadi pembaruan game langsung terlihat.
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/kit/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/katalog.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"
