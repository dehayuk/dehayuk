# Pengaturan Netlify untuk situs Dehayuk: halaman depan di akar, setiap game di foldernya sendiri (misal /jatuh-buah/).
# Semua halaman berupa berkas HTML biasa, jadi tidak ada langkah build di Netlify:
# berkas buatan (katalog ringkas, info/, kartu/, main/, sitemap.xml, robots.txt, _redirects) dibuat di laptop
# dengan "npm run situs" lalu ikut di-commit.
# Setiap push ke cabang main di GitHub otomatis ditayangkan ulang oleh Netlify.
[build]
  publish = "."
  command = "echo Tidak ada langkah build untuk versi web"
  # Perubahan yang hanya menyangkut app Android atau berkas kerja tidak ditayangkan ulang,
  # agar kredit Netlify tidak terpakai. Keluar 0 berarti lewati penayangan.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)android' ':(exclude).github' ':(exclude)scripts' ':(exclude)STANDAR-GAME.md' ':(exclude)package.json' ':(exclude)package-lock.json'"

# Kunci web Firebase (papan peringkat) memang publik dan dijaga aturan Firestore, bukan rahasia.
# Pemindai rahasia Netlify tetap menyala untuk nilai lain.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCyount9nL0FC1ClSr1t0reg3gvOm5ARTE"

# Alamat lama diarahkan permanen ke domain utama, agar Google menganggapnya satu situs.
# Link lama (tantangan WhatsApp, isian toko app) tetap jalan; bagian #... ikut terbawa oleh browser.
[[redirects]]
  from = "https://dehayuk.netlify.app/*"
  to = "https://dehayuk.online/:splat"
  status = 301
  force = true

# Folder dan berkas app Android tidak perlu dibuka lewat web.
[[redirects]]
  from = "/android/*"
  to = "/"
  status = 302
  force = true

# Berkas kerja proyek juga tidak perlu dibuka lewat web.
[[redirects]]
  from = "/scripts/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/STANDAR-GAME.md"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/package.json"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/server.js"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/capacitor.config.json"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/kartu/sidik.json"
  to = "/"
  status = 302
  force = true

# Penyimpanan di browser pengunjung, agar yang kembali tidak mengunduh ulang dan kredit Netlify hemat.
# Halaman HTML tetap selalu diperiksa ulang, jadi pembaruan game langsung terlihat.
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/kartu/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

# Kit bernomor versi (/kit/v1/) tidak pernah berubah perilaku, jadi disimpan lama. Versi baru (v2) perlu aturan sendiri.
# Perbaikan bug di v1 tetap sampai ke pemain paling lambat seminggu.
[[headers]]
  for = "/kit/v1/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

# Alamat lama /kit/kit.js dan /kit/kit.css (salinan v1) tetap pendek, seperti sebelumnya.
[[headers]]
  for = "/kit/kit.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/kit/kit.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/katalog.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/info/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

# Service worker dan manifest selalu diperiksa ulang, agar pembaruan situs langsung sampai ke pemain.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/font/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
