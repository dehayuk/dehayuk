<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3534">
<title>Jatuh Buah</title>
<meta name="description" content="Jatuh Buah: jatuhkan buah Nusantara ke dalam bakul, satukan yang kembar sampai jadi durian sang raja buah. Ada Harian yang sama untuk semua pemain dan tantangan lewat WhatsApp. Gratis, langsung main di browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Font dimuat tanpa menahan tampilan pertama; bila gagal, font sistem tetap dipakai. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap"></noscript>
<style>
  :root {
    color-scheme: dark;
    --ground: #0E3534;
    --board: #15504D;
    --board-edge: #2A7A75;
    --slot-edge: #3E8C86;
    --tile: #F4C152;
    --tile-shade: #C9952A;
    --tile-ink: #3B2A05;
    --ink: #EAF6F3;
    --muted: #9EC6C0;
    --good: #7FE0A3;
    --bad: #FF7A70;
    --well: #0B2B2A;
    --rattan: #C8955A;
    --rattan-dark: #9A6A36;
    --display: "Baloo 2", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 15px;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior-y: contain;
  }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; font-family: var(--body); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  canvas:focus { outline: none; }
  .wrap {
    max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
  }
  body.playing .wrap { gap: 6px; padding: calc(10px + env(safe-area-inset-top, 0px)) calc(8px + env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) calc(8px + env(safe-area-inset-left, 0px)); }
  body.playing header { padding: 0 8px; }
  body.playing .topbar, body.playing #ladder, body.playing .targetbar { margin: 0 8px; }
  body.playing .toast { top: auto; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
  section { display: flex; flex-direction: column; gap: 12px; }
  #play { gap: 6px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand-box { display: flex; flex-direction: column; min-width: 0; }
  .hub { color: var(--muted); font-size: 12px; font-weight: 800; text-decoration: none; line-height: 16px; padding: 14px 18px 14px 0; margin: -14px 0 -12px; align-self: flex-start; }
  .brand { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: .5px; white-space: nowrap; }
  .brand span { color: var(--tile); }
  .head-right { display: flex; align-items: center; gap: 8px; }
  .best {
    display: flex; align-items: center; gap: 6px; background: var(--board); border: 1px solid var(--board-edge);
    padding: 6px 12px; border-radius: 999px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .best.bump { animation: bump .45s ease-out; }
  @keyframes bump { 40% { transform: scale(1.18); border-color: var(--tile); } }
  .icon-btn {
    min-width: 44px; min-height: 44px; border-radius: 999px; cursor: pointer; font-size: 17px; line-height: 1;
    background: var(--board); border: 1px solid var(--board-edge); color: var(--ink);
  }

  /* Menu utama */
  .hero {
    background: var(--board); border: 1px solid var(--board-edge); border-radius: 14px; padding: 14px 16px;
    display: flex; gap: 14px; align-items: center;
  }
  .logo { position: relative; width: 64px; height: 62px; flex: none; }
  .logo .bk {
    position: absolute; left: 2px; right: 2px; bottom: 0; height: 34px; border-radius: 6px 6px 26px 26px;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 4px, transparent 4px 8px), repeating-linear-gradient(0deg, #D9A866 0 5px, #B88246 5px 10px);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.25), inset 0 -4px 0 rgba(0,0,0,.2);
  }
  .logo img { position: absolute; }
  .logo .l1 { width: 46px; height: 46px; left: 5px; top: -2px; }
  .logo .l2 { width: 26px; height: 26px; right: -4px; top: 14px; }
  .hero p { margin: 0; color: var(--muted); line-height: 1.45; }
  .hero b { color: var(--ink); font-family: var(--display); font-size: 19px; display: block; line-height: 1.15; margin-bottom: 2px; }
  .stats { font-size: 12.5px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; margin: 0; }
  .modes { display: grid; gap: 10px; }
  .mode {
    display: grid; grid-template-columns: 1fr auto; grid-template-areas: "name state" "desc state";
    gap: 2px 12px; align-items: center; text-align: left; cursor: pointer; min-height: 64px;
    background: var(--board); border: 1px solid var(--board-edge); border-radius: 14px; padding: 12px 16px; color: var(--ink);
  }
  .mode-name { grid-area: name; font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1.1; }
  .mode-desc { grid-area: desc; font-size: 12.5px; color: var(--muted); }
  .mode-state {
    grid-area: state; max-width: 140px; text-align: center; font-weight: 800; font-size: 12px;
    background: var(--tile); color: var(--tile-ink); box-shadow: inset 0 -3px 0 var(--tile-shade);
    padding: 7px 10px; border-radius: 9px; font-variant-numeric: tabular-nums;
  }
  .mode.primary { border-color: var(--tile-shade); box-shadow: 0 0 0 1px var(--tile-shade) inset; }
  .mode.primary .mode-name { color: var(--tile); }
  .mode.done .mode-state { background: transparent; box-shadow: none; color: var(--good); border: 1px solid var(--good); }
  .kebun { background: var(--well); border: 1px solid var(--board-edge); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .kebun-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; color: var(--muted); font-weight: 800; }
  .kebun-head b { font-family: var(--display); font-size: 16px; color: var(--ink); }
  .home-foot { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .link-btn { background: none; border: 1px solid var(--board-edge); color: var(--muted); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 12.5px; cursor: pointer; min-height: 44px; }
  .home-foot a { color: var(--muted); font-size: 12px; line-height: 16px; padding: 14px 16px; display: inline-block; }

  /* Tangga buah: 11 buah kecil, yang belum tercapai berupa bayangan kelabu */
  .ladder { display: flex; justify-content: space-between; align-items: center; gap: 2px; }
  .ladder img, .ladder i { width: calc((100% - 20px) / 11); max-width: 30px; aspect-ratio: 1; display: block; }
  .ladder img { transition: filter .3s, opacity .3s, transform .3s; }
  .ladder .off { filter: grayscale(1) brightness(.55) contrast(.7); opacity: .5; }
  .ladder .top { transform: scale(1.18); filter: drop-shadow(0 0 4px rgba(244,193,82,.9)); }

  /* Layar main */
  .topbar { display: grid; grid-template-columns: 58px 1fr 58px; align-items: center; gap: 6px; min-height: 52px; }
  .scorebox { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .chip {
    font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--tile); border: 1px solid var(--tile-shade); padding: 0 9px; border-radius: 6px; line-height: 18px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .score { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .score.bump { animation: bump .3s ease-out; }
  .pause { width: 48px; height: 48px; border-radius: 12px; font-size: 18px; }
  .nextbox {
    justify-self: end; width: 56px; height: 52px; border-radius: 12px; background: var(--well); border: 1px solid var(--board-edge);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; position: relative;
  }
  .nextbox small { font-size: 9.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; line-height: 1; }
  .nextbox img { width: 32px; height: 32px; }
  .nextbox.gold { border-color: var(--tile); box-shadow: 0 0 10px rgba(244,193,82,.55); }
  .targetbar { position: relative; height: 24px; border-radius: 999px; background: var(--well); border: 1px solid var(--board-edge); overflow: hidden; }
  .targetbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--tile-shade), var(--tile)); transition: width .25s; }
  .targetbar.won i { background: linear-gradient(90deg, #3FAF72, var(--good)); }
  .targetbar span { position: relative; display: block; text-align: center; font-size: 12px; font-weight: 800; line-height: 22px; color: var(--ink); text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px; }

  .stage { position: relative; margin: 0 auto; touch-action: none; background: var(--well) no-repeat center / 100% 100%; border-radius: 4px 4px 20px 20px; }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; border-radius: 4px 4px 20px 20px; }
  .stage.shake { animation: shake .22s linear; }
  @keyframes shake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-4px,2px)} 40%{transform:translate(4px,-2px)} 60%{transform:translate(-3px,-1px)} 80%{transform:translate(3px,2px)} }
  .fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .float {
    position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-weight: 800; font-size: 20px;
    color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.45); animation: rise .8s ease-out forwards; white-space: nowrap;
  }
  .float.gold { color: var(--tile); font-size: 24px; }
  @keyframes rise { from { opacity: 1; transform: translate(-50%, -50%); } to { opacity: 0; transform: translate(-50%, calc(-50% - 44px)); } }
  .badge {
    position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%); text-align: center; white-space: nowrap;
    font-family: var(--display); font-weight: 800; font-size: 38px; line-height: 1; color: var(--bc, #F4C152);
    text-shadow: 0 3px 0 rgba(0,0,0,.45); animation: badge 1.3s ease-out forwards;
  }
  .badge small { display: block; font-size: 20px; color: #fff; margin-top: 4px; }
  @keyframes badge {
    0% { transform: translate(-50%,-50%) scale(.6); opacity: 0; } 12% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
    22% { transform: translate(-50%,-50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-60%) scale(1); }
  }
  .banner {
    position: absolute; left: 50%; top: 16%; transform: translate(-50%, -50%); background: var(--tile); color: var(--tile-ink);
    font-family: var(--display); font-weight: 800; font-size: 18px; padding: 3px 14px; border-radius: 999px; white-space: nowrap;
    box-shadow: inset 0 -3px 0 var(--tile-shade), 0 4px 10px rgba(0,0,0,.35); animation: banner 1.4s ease-out forwards;
  }
  @keyframes banner { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 20% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
  .hint { position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); width: 80%; text-align: center; font-size: 13px; font-weight: 800; color: var(--ink); background: rgba(11,43,42,.82); border: 1px solid var(--board-edge); border-radius: 12px; padding: 8px 10px; pointer-events: none; }
  .uji { position: absolute; left: 6px; top: 6px; font: 12px/1.35 ui-monospace, monospace; color: #fff; background: rgba(0,0,0,.65); padding: 6px 8px; border-radius: 6px; pointer-events: none; white-space: pre; z-index: 5; }

  .confetti { position: fixed; top: -14px; width: 9px; height: 13px; border-radius: 2px; z-index: 50; pointer-events: none; animation: fall 1.6s ease-in forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .7; } }

  /* Panel */
  .overlay { position: fixed; inset: 0; background: rgba(5, 20, 20, .88); display: grid; place-items: center; padding: 16px; z-index: 60; overflow-y: auto; }
  .panel {
    width: 100%; max-width: 380px; background: var(--board); border: 1px solid var(--board-edge); border-radius: 16px;
    padding: 20px 16px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center;
    animation: slideUp .28s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .panel h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 27px; line-height: 1.1; color: var(--tile); }
  .panel p { margin: 0; color: var(--muted); line-height: 1.45; }
  .panel b { color: var(--ink); }
  .panel .ladder { width: 100%; background: var(--well); border-radius: 12px; padding: 8px 6px; }
  .big { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .facts div { background: var(--ground); border: 1px solid var(--board-edge); border-radius: 10px; padding: 8px 4px; font-size: 11.5px; color: var(--muted); }
  .facts b { display: block; font-size: 17px; font-family: var(--display); line-height: 1.2; }
  .col { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .row { display: flex; gap: 8px; width: 100%; }
  .row .btn { flex: 1; }
  .btn {
    border: 1px solid var(--board-edge); background: var(--ground); color: var(--ink); border-radius: 10px;
    padding: 11px 8px; font-weight: 800; font-size: 14px; cursor: pointer; line-height: 1.2; min-height: 46px;
  }
  .btn.main { background: var(--tile); color: var(--tile-ink); border: 0; box-shadow: inset 0 -4px 0 var(--tile-shade); font-family: var(--display); font-size: 20px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.on { border-color: var(--tile); color: var(--tile); }
  .help { text-align: left; margin: 0; padding-left: 20px; color: var(--ink); line-height: 1.5; display: flex; flex-direction: column; gap: 6px; }
  .help li::marker { color: var(--tile); }
  .skins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .skin { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 12px; min-height: 84px; cursor: pointer;
    background: var(--ground); border: 1px solid var(--board-edge); color: var(--ink); font-weight: 800; font-size: 12.5px; }
  .skin i { width: 44px; height: 30px; border-radius: 4px 4px 16px 16px; display: block; }
  .skin.sel { border-color: var(--tile); box-shadow: 0 0 0 1px var(--tile) inset; color: var(--tile); }
  .skin:disabled { cursor: default; color: var(--muted); }
  .skin:disabled i { filter: grayscale(.8) brightness(.6); }
  .versus { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; width: 100%; }
  .versus .side { background: var(--ground); border: 1px solid var(--board-edge); border-radius: 12px; padding: 10px 6px; min-width: 0; }
  .versus .side.win { border-color: var(--good); box-shadow: 0 0 0 1px var(--good); }
  .versus .who { font-weight: 800; overflow-wrap: anywhere; }
  .versus .pts { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .versus .side.win .pts { color: var(--good); }
  .versus .vs { font-family: var(--display); font-weight: 800; color: var(--tile); }
  .name-input {
    width: 100%; padding: 10px 12px; border-radius: 10px; text-align: center; border: 1px solid var(--board-edge);
    background: var(--ground); color: var(--ink); font-family: var(--body); font-weight: 800; font-size: 18px; user-select: text; -webkit-user-select: text;
  }
  .toast {
    position: fixed; left: 50%; top: calc(62px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    background: var(--ink); color: var(--ground); font-weight: 800; font-size: 13px; padding: 8px 14px; border-radius: 999px;
    z-index: 70; max-width: calc(100% - 32px); text-align: center; pointer-events: none;
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .stage.shake, .best.bump, .score.bump, .panel, .badge, .banner, .float { animation-duration: .01s; }
    .badge, .banner { animation: none; opacity: 1; }
    .float { animation: none; opacity: 0; }
    .confetti { display: none; }
    .ladder img { transition: none; }
  }
</style>

<div class="wrap">
  <header>
    <div class="brand-box">
      <a class="hub" href="/">‹ Dehayuk</a>
      <div class="brand">Jatuh<span>Buah</span></div>
    </div>
    <div class="head-right">
      <div class="best" id="bestBox" title="Skor terbaik">🏆 <span id="best">0</span></div>
      <button class="icon-btn" id="btnSound" type="button" aria-label="Matikan suara" title="Suara">🔊</button>
    </div>
  </header>

  <section id="home">
    <div class="hero">
      <div class="logo" aria-hidden="true"><img class="l1" id="logo1" alt=""><div class="bk"></div><img class="l2" id="logo2" alt=""></div>
      <p><b>Satukan buah kembar, raih durian!</b>Jatuhkan buah ke bakul. Dua buah yang sama bersentuhan jadi buah yang lebih besar.</p>
    </div>
    <div class="modes">
      <button class="mode primary" id="modeBebas" type="button">
        <span class="mode-name">Main Bebas</span>
        <span class="mode-desc">Urutan buah baru tiap main. Kejar skor tertinggimu.</span>
        <span class="mode-state" id="stBebas">Main</span>
      </button>
      <button class="mode" id="modeDaily" type="button">
        <span class="mode-name">Harian</span>
        <span class="mode-desc">Urutan buah sama untuk semua pemain hari ini. Adu skor di grup!</span>
        <span class="mode-state" id="stDaily">Main</span>
      </button>
      <button class="mode" id="modeDuel" type="button">
        <span class="mode-name">Tantangan</span>
        <span class="mode-desc">Kirim link ke teman lewat WhatsApp dengan urutan buah yang sama.</span>
        <span class="mode-state" id="stDuel">Tantang</span>
      </button>
    </div>
    <div class="kebun" aria-label="Kebunmu: buah yang pernah kamu buat">
      <div class="kebun-head"><b>Kebunmu</b><span id="kebunInfo">Belum ada durian</span></div>
      <div class="ladder" id="kebunRow"></div>
    </div>
    <p class="stats" id="stats"></p>
    <div class="home-foot">
      <button class="link-btn" id="btnHelp" type="button">❓ Cara main</button>
      <button class="link-btn" id="btnSettings" type="button">⚙️ Pengaturan</button>
    </div>
    <div class="home-foot"><a href="/privasi/" target="_blank" rel="noopener">Privasi</a></div>
  </section>

  <section id="play" hidden>
    <div class="topbar">
      <button class="icon-btn pause" id="btnPause" type="button" aria-label="Jeda" title="Jeda">❚❚</button>
      <div class="scorebox">
        <span class="chip" id="modeChip">Bebas</span>
        <div class="score" id="score" aria-label="Skor">0</div>
      </div>
      <div class="nextbox" id="nextBox" title="Buah berikutnya"><small>Berikut</small><img id="nextImg" alt="Buah berikutnya"></div>
    </div>
    <div class="targetbar" id="targetBar" hidden><i id="targetFill"></i><span id="targetText"></span></div>
    <div class="stage" id="stage">
      <canvas id="cv" tabindex="0" aria-label="Bakul. Geser jari untuk membidik, angkat jari untuk menjatuhkan buah. Di papan ketik: panah kiri kanan dan Spasi."></canvas>
      <div class="fx" id="fx"></div>
      <div class="hint" id="hint" hidden>Geser jari untuk membidik,<br>angkat untuk menjatuhkan buah</div>
    </div>
    <div class="ladder" id="ladder" aria-label="Tangga buah"></div>
  </section>
</div>

<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="sr" id="sr" aria-live="polite"></div>

<script>
/*CORE:BEGIN*/
// Aturan murni Jatuh Buah: fisika lingkaran, antrean buah, skor, Harian, tantangan.
// Tanpa DOM, jadi bisa diuji di Node. Semua ukuran dalam satuan papan (lebar dalam bakul = 360).
const GameCore = (() => {
  const W = 360, H = 520, LOSE_Y = 70, STEP = 1 / 120, GRAV = 1800;
  const REST = 0.15, REST_MIN_V = 60, FRIC = 0.4, DAMP = 0.999, ADAMP = 0.998, VMAX = 2500;

  handleEvents(r, now);
  if (run !== r) return;
  if (g.over) { endRun(r); return; }
  if (pendingDrop && GameCore.canDrop(g) !== "wait") requestDrop();
  // Detak jantung saat buah melewati bibir bakul.
  if (g.dangerT > 0 && now - lastBeat > 620) { lastBeat = now; sfx.beat(); buzz(12); }
  const d0 = UJI ? performance.now() : 0;
  render(dt);
  const w1 = performance.now();
  if (UJI) { ujiDraw += w1 - d0; ujiWork += w1 - w0; ujiF++; }
  perfWatch(dt, w1 - w0);
  if (run !== r) return;
  loopId = requestAnimationFrame(frame);
}
function handleEvents(r, now) {
  const g = r.g;
  if (g.impact > 160 && now - lastBounce > 60) { lastBounce = now; sfx.bounce(g.impact); }
  g.impact = 0;
  if (!g.ev.length) return;
  let big = false;
  for (const m of g.ev) {
    const f = FRUITS[m.lv];
    burst(m.x, m.y, f.juice, m.boom ? 40 : 6 + Math.min(6, m.lv), m.boom ? 1.8 : 0.6 + m.lv * 0.08);
    sfx.merge(m.chain);
    floatText(m.x, m.y - f.r * 0.4, "+" + fmt(m.pts), m.gold);
    if (m.chain >= 3) banner("Rantai x" + m.chain + "!");
    if (m.boom) {
      if (!r.uji) S.kebun.lebur++;
      showBadge("Durian dilebur!", "+" + fmt(m.pts), "#CCD95E");
      sfx.durian(); buzz([40, 50, 90]); confetti(40); shake();
      big = true;
    } else if (m.lv === 10) {
      if (!r.uji) S.kebun.durian++;
      showBadge("Raja buah!", "Durian!", "#CCD95E");
      sfx.durian(); buzz([40, 50, 90]); confetti(34); shake();
      big = true;
    } else if (m.newTop && m.lv >= 5) {
      // Buah tertinggi baru di permainan ini: gerak lambat sejenak.
      if (!RM) slowUntil = now + 250;
      showBadge(f.name + "!", "", "#F4C152");
      sfx.top(); buzz(25); shake();
      big = true;
    } else if (m.lv >= 5) buzz(10);
    if (!r.uji && m.lv > S.kebun.top) { S.kebun.top = m.lv; big = true; }
    say(f.name + (m.boom ? " dilebur" : " jadi") + ", tambah " + m.pts + " poin");
  }
  g.ev.length = 0;
  bump($("score"));
  if (!r.uji && g.score > S.best) {
    S.best = g.score;
    if (r.bestAtStart > 0 && !r.recordShown) { r.recordShown = true; banner("Rekor baru!"); later(() => sfx.record(), 200); bump($("bestBox")); }
  }
  if (r.kind === "tantangan" && r.duel && !r.targetShown && g.score > r.duel.sc) { r.targetShown = true; banner("Lewat skor " + r.duel.n + "!"); }
  renderHud();
  checkBadges(g);
  if (big) saveRun();
}

// ---------- Gambar satu bingkai ----------
function render(dt) {
  if (!ctx || !run) return;
  const g = run.g, k = kpx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (bgCv && !bgCss) ctx.drawImage(bgCv, 0, 0);
  const ox = k * WALL, oy = k * TOPM;
  ctx.setTransform(k, 0, 0, k, ox, oy);
  // Garis bibir bakul: berkedip merah saat bahaya.
  const t = performance.now() / 1000;
  if (g.dangerT > 0) {
    const pulse = 0.55 + 0.45 * Math.sin(t * 14);
    ctx.fillStyle = "rgba(255,90,80," + (0.1 + 0.12 * pulse) + ")";
    ctx.fillRect(0, 0, 360, GameCore.LOSE_Y);
    ctx.strokeStyle = "rgba(255,110,100," + (0.6 + 0.4 * pulse) + ")"; ctx.lineWidth = 3.5; ctx.setLineDash([]);
  } else {
    ctx.strokeStyle = "rgba(244,193,82,.5)"; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
  }
  ctx.beginPath(); ctx.moveTo(0, GameCore.LOSE_Y); ctx.lineTo(360, GameCore.LOSE_Y); ctx.stroke();
  ctx.setLineDash([]);
  // Buah bayangan dan garis bidik
  if (!g.over && !busy) {
    const it = g.cur, r = FRUITS[it.l].r, x = clampAim(aimX, it.l);
    const state = GameCore.canDrop(g), ready = state === "ok";
    ctx.strokeStyle = aiming ? "rgba(255,255,255,.55)" : "rgba(255,255,255,.22)"; ctx.lineWidth = aiming ? 2 : 1.5;
    ctx.setLineDash([5, 7]);
    ctx.beginPath(); ctx.moveTo(x, r * 2 + 6); ctx.lineTo(x, 520); ctx.stroke();
    ctx.setLineDash([]);
    const sp = sprites[it.l * 2];
    if (sp) {
      const p = ready ? 1 : Math.max(0, 1 - (g.nextDropAt - g.t) / GameCore.COOLDOWN);
      ctx.globalAlpha = state === "full" ? 0.3 : ready ? 1 : 0.35 + 0.4 * p;
      const P = r * PADF, s = ready ? 1 : 0.75 + 0.25 * p;
      ctx.setTransform(k * s, 0, 0, k * s, ox + k * x, oy + k * r);
      ctx.drawImage(sp, -P, -P, 2 * P, 2 * P);
      if (it.g) goldRing(r, t);
      ctx.globalAlpha = 1;
      ctx.setTransform(k, 0, 0, k, ox, oy);
      if (!ready && state === "wait") {
        ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fillRect(x - r, r * 2 + 3, r * 2, 4);
        ctx.fillStyle = "#F4C152"; ctx.fillRect(x - r, r * 2 + 3, r * 2 * p, 4);
      }
    }
    if (state === "full") {
      ctx.font = "800 20px " + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = "center"; ctx.fillStyle = "#FF7A70";
      ctx.fillText("Bakul penuh sesak!", 180, GameCore.LOSE_Y + 26);
    }
  }
  // Buah
  for (let i = 0; i < g.M; i++) {
    if (!g.al[i]) continue;
    const lv = g.lv[i], r = g.r[i], age = g.ag[i];
    let sx = 1, sy = 1, sq = 0;
    if (g.mg[i] && age < 0.5) {
      sq = 1;
      if (age < 0.12) { const p = age / 0.12; sx = sy = 0.6 + 0.4 * (1 - (1 - p) * (1 - p)); }
      else if (age < 0.36 && !RM) { const p = (age - 0.12) / 0.24, w = Math.sin(Math.PI * p) * (1 - p); sx = 1 + 0.18 * w; sy = 1 - 0.14 * w; }
    }
    const sp = sprites[lv * 2 + sq];
    if (!sp) continue;
    // Putaran fisik ditampilkan sebagai goyangan kecil, supaya wajah lucu tetap tegak saat menggelinding.
    const a = RM ? 0 : 0.35 * Math.sin(g.an[i]), cs = Math.cos(a), sn = Math.sin(a), P = r * PADF, px = ox + k * g.x[i], py = oy + k * g.y[i];
    ctx.setTransform(k * sx * cs, k * sy * sn, -k * sx * sn, k * sy * cs, px, py);
    ctx.drawImage(sp, -P, -P, 2 * P, 2 * P);
    if (g.gd[i]) { ctx.setTransform(k, 0, 0, k, px, py); goldRing(r, t); }
  }
  // Partikel sari buah
  ctx.setTransform(k, 0, 0, k, ox, oy);
  const d = dt || 0;
  for (let i = 0; i < PN; i++) {
    if (pL[i] <= 0) continue;
    pVY[i] += 1400 * d; pX[i] += pVX[i] * d; pY[i] += pVY[i] * d; pL[i] -= d * 1.5;
    if (pL[i] <= 0) continue;
    ctx.globalAlpha = pL[i];
    ctx.fillStyle = pC[i];
    circ(ctx, pX[i], pY[i], pS[i]); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (g.over) { ctx.fillStyle = "rgba(8,24,24,.45)"; ctx.fillRect(-WALL, -TOPM, LW, LH); }
  if (UJI && run.uji) {
    const now = performance.now();
    if (!render.u || now - render.u > 500) {
      render.u = now;
      ujiShow = "buah " + g.live + " / " + g.cap + "\nlangkah " + (ujiN ? (ujiMs / ujiN).toFixed(3) : "-") + " ms\nkerja JS " + (ujiF ? (ujiWork / ujiF).toFixed(2) : "-") + " ms (gambar " + (ujiF ? (ujiDraw / ujiF).toFixed(2) : "-") + ")\nbingkai " + (d ? (d * 1000).toFixed(1) : "-") + " ms" + (hemat() ? "\nmode hemat" : "");
      ujiMs = 0; ujiN = 0; ujiWork = 0; ujiF = 0; ujiDraw = 0;
      const el = $("ujiBox"); if (el) el.textContent = ujiShow;
    }
  }
}
function goldRing(r, t) {
  ctx.strokeStyle = "#FFD84D"; ctx.lineWidth = 3;
  circ(ctx, 0, 0, r + 1); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 1;
  circ(ctx, 0, 0, r + 3); ctx.stroke();
  const a = t * 2.2, sx = Math.cos(a) * r * .75, sy = Math.sin(a) * r * .75;
  ctx.fillStyle = "#fff"; star(ctx, sx, sy, r * .28, r * .07, 4); ctx.fill();
}

// ---------- Jeda ----------
function pauseGame(showMenu, resumedRun) {

}
function resumeGame() {

}

// ---------- Selesai ----------
// Hasil dicatat SEKARANG, sinkron, sebelum animasi apa pun; keluar mendadak tidak bisa menghapus atau mengulang hasil.
function finalize(r) {
  if (!r || r.finalized || !r.g.over || r.uji) return;
  r.finalized = true;
  const g = r.g;
  S.games++;
  S.merges += g.merges;
  if (g.top > S.kebun.top) S.kebun.top = g.top;
  if (g.score > S.best) S.best = g.score;
  const record = r.bestAtStart > 0 && g.score > r.bestAtStart;
  const first = r.bestAtStart === 0 && g.score > 0;
  let official = false;
  if (r.kind === "harian" && !r.practice) {
    const already = S.daily && S.daily.date === r.date && S.daily.done;
    if (!already) {
      official = true;
      S.daily = { date: r.date, score: g.score, top: g.top, chain: g.maxChain, done: true };
      if (S.streak.last !== r.date) {
        S.streak.count = S.streak.last === GameCore.prevDay(r.date) ? S.streak.count + 1 : 1;
        S.streak.last = r.date;
      }
    }
  }
  let verdict = 0;
  if (r.kind === "tantangan" && r.duel) {
    verdict = g.score > r.duel.sc ? 1 : g.score < r.duel.sc ? -1 : 0;
    if (verdict > 0) S.duelW++; else if (verdict < 0) S.duelL++; else S.duelD++;
    if (S.pendingDuel === r.duel.code) S.pendingDuel = null;
    // Tantangan yang sudah dimainkan diingat, supaya tidak bisa diulang sampai menang.
    S.duelDone = S.duelDone.filter((x) => x.code !== r.duel.code)
      .concat([{ code: r.duel.code, n: r.duel.n, sc: r.duel.sc, score: g.score }]).slice(-30);
  }
  const newSkins = SKINS.filter((s) => s.need > 0 && r.bestAtStart < s.need && S.best >= s.need);
  checkBadges(g);
  r.result = {
    kind: r.kind, seed: g.seed, score: g.score, top: g.top, seen: g.seen, chain: g.maxChain, durians: g.durians, lebur: g.lebur,
    reason: g.reason, record, first, official, practice: !!r.practice, date: r.date, duel: r.duel, verdict, replyTo: r.replyTo || "",
    newSkins: newSkins.map((s) => s.name), badges: (r.newBadges || []).slice()
  };
  delete S.runs[r.slot];
  save();
}
let last = null;
function endRun(r) {
  if (r.uji) { r.g.over = false; return; }
  finalize(r);
  busy = true;
  releaseAim();
  pendingDrop = false;
  render(0);
  sfx.over();
  buzz([30, 40, 60]);
  showBadge(r.g.reason === "sesak" ? "Bakul sesak!" : "Bakul luber!", "", "#FF7A70");
  say("Permainan selesai. Skor " + r.g.score);
  last = r.result;
  later(() => {
    if (run !== r) return;
    if (last.record) { confetti(); sfx.record(); }
    showResult();
  }, RM ? 200 : 1100);
}

    () => {
      $("rAgain").onclick = () => { hideOverlay(); startBebas(true); };
      $("rHome").onclick = home;

// ---------- Bagikan ----------
function shareOut(text) {
  if (navigator.share) navigator.share({ text }).catch((e) => { if (!e || e.name !== "AbortError") copyText(text, true); });
  else copyText(text, true);
}
function copyText(text, wa) {
  const done = () => {
    toast("Tersalin. Tempel di WhatsApp!");
    if (wa) { try { window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener"); } catch (e) {} }
  };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("Gagal menyalin"); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}
function shareDaily() {
  const d = S.daily;
  if (!d || !d.done) return toast("Selesaikan Harian dulu, ya");
  shareOut(GameCore.shareText({ number: GameCore.dailyNumber(d.date), top: d.top, score: d.score, chain: d.chain, url: shareUrl() }));
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
}
// Link tantangan memuat seed permainan tadi: temanmu mendapat urutan buah yang sama.
function challenge(o) {
  if (!S.name) return askName(() => challenge(o));
  const code = GameCore.encodeDuel({ s: o.seed, sc: o.score, n: S.name });
  let text = GameCore.shareText({ top: o.top, score: o.score, chain: o.chain, url: shareUrl() + "#t=" + code });
  if (o.replyTo) text = "Balasan untukmu, " + o.replyTo + "!\n" + text;
  shareOut(text);
  showResult();
}
function askName(then) {
  showPanel(
    "<h2>Siapa namamu?</h2><p>Nama ini muncul di tantangan untuk temanmu.</p>" +
    "<input class=\"name-input\" id=\"nameIn\" maxlength=\"12\" autocomplete=\"nickname\" placeholder=\"misal: Andi\" aria-label=\"Namamu\">" +
    "<div class=\"row\"><button class=\"btn\" id=\"nBack\" type=\"button\">Batal</button><button class=\"btn main\" id=\"nOk\" type=\"button\">Lanjut</button></div>",
    () => {
      const inp = $("nameIn");
      const ok = () => {
        const n = GameCore.cleanName(inp.value);
        if (!n) { toast("Tulis namamu dulu"); return inp.focus(); }
        S.name = n; save(); then();
      };
      $("nOk").onclick = ok;
      $("nBack").onclick = () => (last && busy ? showResult() : hideOverlay());
      inp.onkeydown = (e) => { if (e.key === "Enter") ok(); };
      setTimeout(() => inp.focus(), 50);
    }, last && busy ? goHome : null);
}

// ---------- Mode ----------
function startBebas(fresh) {
  if (!fresh) { const r = loadRun("bebas"); if (r && !r.g.over) return openRun(r); }
  delete S.runs.bebas;
  openRun(newRun("bebas", "bebas", newSeed()));
}
function startDaily() {
  const t = today();
  const d = S.daily && S.daily.date === t && S.daily.done ? S.daily : null;
  if (d) return dailyDonePanel();
  const r = loadRun("harian");
  if (r && r.date === t) return openRun(r);
  openRun(newRun("harian", "harian", GameCore.dailySeed(t), { date: t, practice: false }));
}
function startPractice() {
  const t = today();
  openRun(newRun("latihan", "harian", GameCore.dailySeed(t), { date: t, practice: true }));
}
function dailyDonePanel() {
  const d = S.daily;
  showPanel(
    "<h2>Harian #" + GameCore.dailyNumber(d.date) + " selesai ✓</h2><div class=\"big\">" + fmt(d.score) + "</div>" +
    "<p>Buah tertinggi " + FRUITS[Math.max(0, d.top)].name + " · rantai x" + d.chain + " · 🔥 " + streakNow() + " hari beruntun</p>" +
    "<p>Urutan buah baru muncul besok. Mau latihan dengan urutan hari ini? Hasil resmi tidak berubah.</p>" +
    "<div class=\"col\"><button class=\"btn main\" id=\"dShare\" type=\"button\">Bagikan hasil</button>" +
    "<div class=\"row\"><button class=\"btn\" id=\"dClose\" type=\"button\">Tutup</button><button class=\"btn\" id=\"dPractice\" type=\"button\">Latihan</button></div></div>",
    () => {
      $("dShare").onclick = shareDaily;
      $("dClose").onclick = hideOverlay;
      $("dPractice").onclick = () => { hideOverlay(); startPractice(); };
    });
}
const duelDoneOf = (code) => S.duelDone.find((x) => x.code === code) || null;
// Balas tantangan: permainan Bebas baru dengan seed BARU; skornya dikirim sebagai tantangan baru.
// Bila ada permainan Bebas tersimpan yang belum selesai, pemain ditanya dulu: balasan memakai tempat yang sama.
function startReply(name, back, sure) {
  const saved = S.runs.bebas;
  if (!sure && saved && saved.g && !saved.g.over) {
    showPanel(
      "<h2>Timpa permainan tersimpan?</h2><p>Permainan Bebas yang tersimpan (<b>" + fmt(saved.g.score || 0) + "</b> poin) akan hilang. Lanjut?</p>" +
      "<div class=\"row\"><button class=\"btn\" id=\"cNo\" type=\"button\">Batal</button><button class=\"btn main\" id=\"cYes\" type=\"button\">Lanjut balas</button></div>",
      () => {
        $("cYes").onclick = () => startReply(name, back, true);
        $("cNo").onclick = () => (back ? back() : (hideOverlay(), renderHome()));
      }, back || null);
    return;
  }
  hideOverlay();
  delete S.runs.bebas;
  openRun(newRun("bebas", "bebas", newSeed(), { replyTo: GameCore.cleanName(name) }));
}
function showDuelDone(d) {
  const v = d.score > d.sc ? "Kamu menang" : d.score < d.sc ? "Kamu kalah" : "Seri";
  showPanel(
    "<h2>Sudah dimainkan</h2><p>Tantangan dari <b>" + esc(d.n) + "</b> ini sudah kamu mainkan: <b>" + fmt(d.score) + "</b> lawan <b>" + fmt(d.sc) + "</b>. " + v + ".</p>" +
    "<p>Tantangan hanya bisa dimainkan sekali. Balas dengan urutan buah baru!</p>" +
    "<div class=\"col\"><button class=\"btn main\" id=\"xReply\" type=\"button\">Balas tantangan</button><button class=\"btn\" id=\"xClose\" type=\"button\">Tutup</button></div>",
    () => {
      $("xReply").onclick = () => startReply(d.n, () => showDuelDone(d));
      $("xClose").onclick = () => { hideOverlay(); renderHome(); };
    });
}
function startDuel(inv) {
  const done = duelDoneOf(inv.code);
  if (done) return showDuelDone(done);
  const r = loadRun("tantangan");
  if (r && r.duel && r.duel.code === inv.code) return openRun(r);
  if (r && r.duel) {
    const d = r.duel, sc = r.g.score;
    if (sc > d.sc) S.duelW++; else if (sc < d.sc) S.duelL++; else S.duelD++;
    S.duelDone = S.duelDone.filter((x) => x.code !== d.code).concat([{ code: d.code, n: d.n, sc: d.sc, score: sc }]).slice(-30);
    delete S.runs.tantangan;
    save();
  }
  openRun(newRun("tantangan", "tantangan", inv.s, { duel: { n: inv.n, sc: inv.sc, code: inv.code } }));
}
function showInvite(inv) {
  showPanel(
    "<h2>Ada tantangan!</h2><p><b>" + esc(inv.n) + "</b> menantangmu dengan skor <b>" + fmt(inv.sc) + "</b>.</p>" +
    "<p>Urutan buahnya sama dengan punya " + esc(inv.n) + ". Gerak buahnya bisa sedikit berbeda, jadi andalkan bidikanmu!</p>" +
    "<div class=\"col\"><button class=\"btn main\" id=\"iGo\" type=\"button\">Terima tantangan</button><button class=\"btn\" id=\"iLater\" type=\"button\">Nanti saja</button></div>",
    () => {
      $("iGo").onclick = () => { hideOverlay(); startDuel(inv); };
      $("iLater").onclick = () => { hideOverlay(); renderHome(); };
    });
}
function openDuelMenu() {
  const inv = S.pendingDuel ? GameCore.decodeDuel(S.pendingDuel) : null;
  if (inv) return showInvite(Object.assign(inv, { code: S.pendingDuel }));
  showPanel(
    "<h2>Tantangan</h2><p>Main Bebas sampai selesai, lalu tekan <b>Bagikan</b>. Temanmu akan mendapat urutan buah yang sama denganmu.</p>" +
    (S.duelW + S.duelL + S.duelD ? "<p>Menang " + S.duelW + " · Kalah " + S.duelL + " · Seri " + S.duelD + "</p>" : "") +
    "<div class=\"col\"><button class=\"btn main\" id=\"uGo\" type=\"button\">Main Bebas</button><button class=\"btn\" id=\"uClose\" type=\"button\">Tutup</button></div>",
    () => {
      $("uGo").onclick = () => { hideOverlay(); startBebas(false); };
      $("uClose").onclick = hideOverlay;
    });
}
function readDuelHash() {
  const h = location.hash || "";
  if (!/^#t=/.test(h)) return;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  const m = /^#t=([A-Za-z0-9_-]+)$/.exec(h);
  const inv = m ? GameCore.decodeDuel(m[1]) : null;
  if (!$("play").hidden) goHome();
  if (!inv) { showPanel("<h2>Link tidak valid</h2><p>Link tantangan ini rusak atau sudah diubah. Minta temanmu mengirim tantangan baru, ya.</p><button class=\"btn main\" id=\"bOk\" type=\"button\">Oke</button>", () => { $("bOk").onclick = hideOverlay; }); return; }
  inv.code = m[1];
  const done = duelDoneOf(inv.code);
  if (!done) { S.pendingDuel = inv.code; save(); }
  renderHome();
  if (done) showDuelDone(done); else showInvite(inv);
}
function showHelp() {
  showPanel(
    "<h2>Cara main</h2><ol class=\"help\">" +
    "<li>Geser jari di atas bakul untuk membidik, lalu <b>angkat jari</b> untuk menjatuhkan buah. Ketuk sekali juga bisa.</li>" +
    "<li>Dua buah <b>kembar</b> yang bersentuhan melebur jadi buah berikutnya yang lebih besar.</li>" +
    "<li>Buah hasil leburan yang langsung melebur lagi membentuk <b>rantai</b>: poinnya berlipat sampai x3.</li>" +
    "<li>Jangan biarkan tumpukan melewati <b>garis bibir</b> bakul lebih dari 2 detik.</li>" +
    "<li><b>Buah emas</b> kadang muncul: poinnya dobel saat dilebur.</li>" +
    "<li>Di komputer: panah kiri/kanan untuk membidik, Spasi untuk menjatuhkan, P untuk jeda.</li></ol>" +
    "<p>Tangga buah, dari kecil ke raja buah:</p><div class=\"ladder\">" + ladderHTML(2047, 10) + "</div>" +
    "<button class=\"btn main\" id=\"hOk\" type=\"button\" style=\"width:100%\">Siap!</button>",
    () => { $("hOk").onclick = hideOverlay; });
}
function showSettings(back) {
  const skins = SKINS.map((s) => {
    const open = S.best >= s.need, sel = skinOf().id === s.id;
    return "<button class=\"skin" + (sel ? " sel" : "") + "\" type=\"button\" data-skin=\"" + s.id + "\"" + (open ? "" : " disabled") + " aria-pressed=\"" + sel + "\">" +
      "<i style=\"background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 4px,transparent 4px 8px),repeating-linear-gradient(0deg," + s.a + " 0 5px," + s.b + " 5px 10px)\"></i>" +
      s.name + (open ? "" : "<small>🔒 skor " + fmt(s.need) + "</small>") + "</button>";
  }).join("");
  showPanel(
    "<h2>Pengaturan</h2><div class=\"col\">" +
    "<button class=\"btn\" id=\"sVibe\" type=\"button\">📳 Getar: " + (S.settings.vibrate ? "nyala" : "mati") + "</button>" +
    "<button class=\"btn" + (hemat() ? " on" : "") + "\" id=\"sHemat\" type=\"button\">🔋 Mode hemat: " + (S.settings.hemat ? "nyala" : autoHemat ? "otomatis nyala" : "mati") + "</button>" +
    "<p style=\"font-size:12.5px\">Mode hemat membuat permainan lebih ringan untuk HP lama.</p></div>" +
    "<p><b>Bakul</b></p><div class=\"skins\">" + skins + "</div>" +
    "<button class=\"btn main\" id=\"sOk\" type=\"button\" style=\"width:100%\">Selesai</button>",
    () => {
      $("sVibe").onclick = () => { S.settings.vibrate = !S.settings.vibrate; save(); buzz(20); showSettings(back); };
      $("sHemat").onclick = () => {
        S.settings.hemat = !(S.settings.hemat || autoHemat);
        autoHemat = false;
        save();
        if (run) run.g.iter = hemat() ? 4 : 6;
        pL.fill(0);
        layout(); if (run) render(0);
        showSettings(back);
      };
      document.querySelectorAll("[data-skin]").forEach((b) => {
        b.onclick = () => { S.settings.skin = b.dataset.skin; save(); layout(); if (run) render(0); sfx.tap(); showSettings(back); };
      });
      $("sOk").onclick = () => (back ? back() : hideOverlay());
    }, back || null);
}

// ---------- Menu utama ----------
function renderHome() {
  $("best").textContent = fmt(S.best);
  const r = S.runs.bebas;
  $("stBebas").textContent = r && r.g && !r.g.over ? "Lanjutkan · " + fmt(r.g.score) : "Main";
  const t = today();
  const d = S.daily && S.daily.date === t && S.daily.done ? S.daily : null;
  const dr = S.runs.harian;
  $("modeDaily").classList.toggle("done", !!d);
  $("stDaily").textContent = d ? "Selesai ✓ · " + fmt(d.score) : dr && dr.date === t ? "Lanjutkan" : "#" + GameCore.dailyNumber(t) + " · Main";
  const inv = S.pendingDuel ? GameCore.decodeDuel(S.pendingDuel) : null;
  $("stDuel").textContent = inv ? "Ditantang " + inv.n + "!" : S.duelW + S.duelL + S.duelD ? "Menang " + S.duelW + " · Kalah " + S.duelL : "Tantang";
  let mask = 0;
  for (let lv = 0; lv <= S.kebun.top; lv++) mask |= 1 << lv;
  $("kebunRow").innerHTML = ladderHTML(mask, S.kebun.top);
  $("kebunInfo").textContent = S.kebun.durian ? "Durian dibuat " + fmt(S.kebun.durian) + " · dilebur " + fmt(S.kebun.lebur) : S.kebun.top >= 0 ? "Tertinggi: " + FRUITS[S.kebun.top].name : "Belum ada buah";
  const st = streakNow();
  $("stats").textContent = S.games ? "Main " + fmt(S.games) + " kali · " + fmt(S.merges) + " kali melebur" + (st ? " · 🔥 " + st + " hari" : "") : "Selamat datang! Coba Main Bebas dulu.";
  renderToggles();
}
function renderToggles() {
  $("btnSound").textContent = S.settings.mute ? "🔇" : "🔊";
  $("btnSound").setAttribute("aria-label", S.settings.mute ? "Nyalakan suara" : "Matikan suara");
}
function goHome() {
  stopRunTimers();
  if (run && !run.g.over) saveRun();
  run = null; busy = false; paused = false;
  $("play").hidden = true;
  $("home").hidden = false;
  document.body.classList.remove("playing");
  renderHome();
  settleBack();
}

// ---------- Panel, tombol Back, pesan ----------
let backArmed = false, overlayBack = null;
function enterScreen() {
  if (backArmed) return;
  try { history.pushState({ jb: 1 }, ""); backArmed = true; } catch (e) {}
}
function showPanel(html, wire, onBack) {
  const o = $("overlay");
  o.innerHTML = "<div class=\"panel\" role=\"dialog\" aria-modal=\"true\">" + html + "</div>";
  o.hidden = false;
  overlayBack = onBack || null;
  enterScreen();
  if (wire) wire();
  const btn = o.querySelector("button:not([disabled])");
  if (btn && !o.querySelector("input")) btn.focus();
}
function hideOverlay() { $("overlay").hidden = true; $("overlay").innerHTML = ""; overlayBack = null; settleBack(); }
// Setelah kembali ke menu lewat tombol (bukan Back), entri riwayat milik layar main/panel masih tersisa, sehingga
// Back berikutnya di menu "tidak terjadi apa-apa". Entri itu dibuang diam-diam, tapi hanya bila di detik yang sama
// tidak ada layar atau panel baru yang dibuka.
let skipPop = false;
function settleBack() {
  setTimeout(() => {
    if (!backArmed || !$("play").hidden || !$("overlay").hidden) return;
    backArmed = false; skipPop = true;
    setTimeout(() => { skipPop = false; }, 600);
    try { history.back(); } catch (e) { skipPop = false; }
  }, 0);
}
// Back menutup panel atau kembali ke menu; tidak pernah keluar dari situs saat sedang main.
window.addEventListener("popstate", () => {
  if (skipPop) { skipPop = false; return; }
  backArmed = false;
  if (!$("overlay").hidden) {
    const after = overlayBack;
    hideOverlay();
    if (after) after();
    if (!$("play").hidden || !$("overlay").hidden) enterScreen();
    return;
  }
  if (!$("play").hidden) goHome();
});
window.addEventListener("hashchange", readDuelHash);
let toastTimer = 0;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

$("modeBebas").onclick = () => startBebas(false);
$("modeDaily").onclick = startDaily;
$("modeDuel").onclick = openDuelMenu;
$("btnHelp").onclick = showHelp;
$("btnSettings").onclick = () => showSettings(null);
$("btnPause").onclick = () => pauseGame(true);
$("btnSound").onclick = () => {
  S.settings.mute = !S.settings.mute;
  save();
  renderToggles();
  if (!S.settings.mute) sfx.tap();
};
let resizeRaf = 0;
window.addEventListener("resize", () => {
  if (resizeRaf) return;
  resizeRaf = requestAnimationFrame(() => { resizeRaf = 0; layout(); if (run) render(0); });
});
// Pindah aplikasi: permainan dijeda dan disimpan (posisi buah dan antrean), lalu bisa dilanjutkan.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden || !run) return;
  if (!run.g.over && !paused && !busy) pauseGame(true); else saveRun();
});
window.addEventListener("pagehide", () => { if (run && !run.g.over) saveRun(); });

// Halaman uji beban (?uji=1): buah acak dijatuhkan otomatis sampai batas bakul, waktu per langkah ditampilkan.
function startUji() {
  const r = newRun("uji", "bebas", 12345, { uji: true });
  r.g.noLose = true;
  openRun(r);
  const box = document.createElement("div");
  box.className = "uji"; box.id = "ujiBox"; box.textContent = "menyiapkan...";
  stageEl.appendChild(box);
  const rnd = GameCore.rng(777);
  let n = 0;
  const tick = () => {
    if (run !== r) return;
    if (r.g.live < r.g.cap && !paused) {
      aimX = 20 + rnd() * 320;
      if (GameCore.drop(r.g, aimX, true) === "ok") n++;
    }
    later(tick, 110);
  };
  tick();
}

buildIcons();
$("logo1").src = ICONS[10];
$("logo2").src = ICONS[1];
$("ladder").innerHTML = ladderHTML(0, -1);
layout();
renderHome();
readDuelHash();
if (UJI) startUji();
</script>
</html>
