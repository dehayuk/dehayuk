<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff9e7a">
<title>Jatuh Buah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/kit/kit.css">
<style>
[hidden]{display:none!important}
:root{--ink:#3d1a0c;--cream:#fff4dc;--fd:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;--fb:Nunito,'Segoe UI',system-ui,sans-serif;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#ffb77f;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--fb);color:var(--ink);position:fixed;inset:0}
canvas{display:block}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
#col{position:fixed;top:0;bottom:0;pointer-events:none;z-index:10}
#probe{position:fixed;left:0;top:0;width:0;height:0;padding:var(--st) var(--sr) var(--sb) var(--sl);visibility:hidden}
button:focus-visible,a:focus-visible{outline:3px solid #287fa4;outline-offset:5px}
button,a{font-family:var(--fd);-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
.ol{color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink),0 4px 0 var(--ink)}
.scr{position:absolute;inset:0;pointer-events:auto}
/* tombol utama */
.b{--c1:#8ef06a;--c2:#3dbb2c;--cs:#27881b;position:relative;border:3px solid var(--ink);border-radius:20px;background:linear-gradient(var(--c1),var(--c2));
box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 var(--cs),inset 0 3px 0 rgba(255,255,255,.55);font-weight:800;font-size:22px;line-height:1;padding:12px 18px 14px;
display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s}
.b svg{width:24px;height:24px;flex:none;filter:drop-shadow(0 2px 0 var(--ink))}
.b.pr{transform:translateY(4px) scale(.95);box-shadow:0 1px 0 var(--ink),inset 0 -3px 0 var(--cs),inset 0 3px 0 rgba(255,255,255,.55)}
.b.y{--c1:#ffe36a;--c2:#ffb21a;--cs:#d98300}
.b.o{--c1:#ffb36b;--c2:#ff7a2b;--cs:#d2520e}
.b.bl{--c1:#7fd8ff;--c2:#2f9df0;--cs:#1b6fc0}
.b.p{--c1:#ff9fc3;--c2:#ff5c93;--cs:#d63a72}
.b.pu{--c1:#c9a3ff;--c2:#8f5cf0;--cs:#6a3cc8}
.rd{width:50px;height:50px;border-radius:50%;padding:0}
.rd svg{width:26px;height:26px}
/* judul */
#sTitle{display:flex;flex-direction:column;align-items:center;padding:calc(var(--st) + 10px) 14px var(--padb,120px)}
.home{position:absolute;left:calc(var(--sl) + 12px);top:calc(var(--st) + 12px);width:44px;height:44px;--c1:#fff6e0;--c2:#ffd89a;--cs:#e0a95a;border-radius:50%;padding:0;color:#fff}
.home svg{width:22px;height:22px;filter:none}
.best{position:absolute;right:calc(var(--sr) + 12px);top:calc(var(--st) + 16px);display:flex;align-items:center;gap:5px;background:rgba(61,26,12,.78);border:3px solid var(--ink);border-radius:999px;padding:3px 12px 3px 6px;font:800 17px/1.2 var(--fd);color:#ffe36a}
.best svg{width:22px;height:22px}
.chip{position:absolute;left:50%;top:calc(var(--st) + 16px);transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:rgba(61,26,12,.78);border:3px solid var(--ink);border-radius:999px;padding:3px 11px 3px 5px;font:800 15px/1.2 var(--fd);white-space:nowrap}
.chip svg{width:20px;height:20px;flex:none}
.chip .strk{display:flex;align-items:center;gap:3px;margin-left:3px;padding-left:7px;border-left:2px solid rgba(255,255,255,.25)}
#logo{flex:none;width:min(88%,360px,calc(30vh * 1.8));aspect-ratio:2/1.1;margin-top:40px;animation:bob 3s ease-in-out infinite;transform-origin:50% 80%}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.tmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%;min-height:0}
.chal{font:800 18px/1.1 var(--fd);background:#ff5c93;border:3px solid var(--ink);border-radius:14px;padding:6px 16px 8px;box-shadow:0 4px 0 var(--ink);transform:rotate(-3deg);animation:wig 1.4s ease-in-out infinite}
@keyframes wig{50%{transform:rotate(3deg) scale(1.05)}}
#bMain{font-size:40px;padding:14px 46px 18px;border-radius:28px;animation:pulse 1.1s ease-in-out infinite}
#bMain svg{width:34px;height:34px}
#bMain.pr{animation:none}
@keyframes pulse{50%{transform:scale(1.07)}}
.icons{display:flex;gap:clamp(6px,1.6vw,12px);justify-content:center;width:100%;max-width:350px}
.ic{display:flex;flex:1;min-width:0;max-width:62px;min-height:68px;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.ic .b{width:min(100%,54px);height:auto;aspect-ratio:1;min-width:44px;min-height:44px;border-radius:50%;padding:0;font-size:19px}
.ic .b svg{width:28px;height:28px}
.ic>span:last-child{font:800 clamp(11px,2.9vw,13px)/1.1 var(--fd)}
.dot{position:absolute;right:-3px;top:-3px;width:16px;height:16px;border-radius:50%;background:#ff3b5c;border:3px solid var(--ink);animation:pulse 1s infinite}
.ent>*{animation:popin .5s cubic-bezier(.2,1.5,.4,1) backwards}
.ent>:nth-child(2){animation-delay:.08s}.ent>:nth-child(3){animation-delay:.16s}.ent>:nth-child(4){animation-delay:.24s}
@keyframes popin{from{transform:scale(.3);opacity:0}}
.leave{animation:leave .28s ease-in forwards}
@keyframes leave{to{transform:translateY(40px) scale(.9);opacity:0}}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 8px) 10px 0;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
#hud>*{pointer-events:auto}
#hud .rd{width:46px;height:46px}
.sc{display:flex;flex-direction:column;align-items:center;pointer-events:none!important}
.sc b{font:800 38px/1 var(--fd);font-variant-numeric:tabular-nums;transition:transform .1s}
.sc b.bump{transform:scale(1.18)}
.sc small{margin-top:5px;display:flex;align-items:center;gap:3px;font:800 13px/1 var(--fd);background:rgba(61,26,12,.7);color:#ffe36a;border-radius:999px;padding:2px 8px 3px 4px}
.sc small svg{width:15px;height:15px}
.sc small.live{background:#ff3d7f;color:#fff;animation:pulse .7s ease-in-out infinite}
.nx{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#ffe9c2);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);position:relative;display:grid;place-items:center;pointer-events:none!important}
.nx img{width:150%;height:150%;object-fit:contain;animation:bob 2s ease-in-out infinite}
.nx i{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);font:800 11px/1 var(--fd);font-style:normal;background:var(--ink);color:#fff;border-radius:6px;padding:2px 6px 3px;white-space:nowrap}
/* overlay & panel */
.ov{z-index:1;display:flex;align-items:flex-start;justify-content:center;padding:calc(var(--st) + 30px) 16px calc(var(--sb) + 16px);overflow-y:auto;overscroll-behavior:contain}
.ov>.pn{margin:auto}
.pn:focus{outline:none}
.ov::before{content:"";position:fixed;inset:0;background:rgba(45,14,40,.55);z-index:-1}
.ov.in::before{animation:fade .2s}
@keyframes fade{from{opacity:0}}
.pn{position:relative;width:100%;max-width:340px;background:linear-gradient(#fff9ea,#ffeac4);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink),inset 0 -6px 0 #f5d59c,inset 0 4px 0 #fff;padding:40px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.in .pn{animation:popin .42s cubic-bezier(.2,1.5,.4,1)}
.rb{position:absolute;top:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;font:800 28px/1 var(--fd);padding:9px 30px 12px;background:linear-gradient(#ff7a7a,#e8384f);border:4px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 #b82239,inset 0 3px 0 rgba(255,255,255,.4)}
.rb.g{background:linear-gradient(#8ef06a,#3dbb2c);box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 #27881b,inset 0 3px 0 rgba(255,255,255,.4)}
.rb.bl{background:linear-gradient(#7fd8ff,#2f9df0);box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 #1b6fc0,inset 0 3px 0 rgba(255,255,255,.4)}
.rb.pu{background:linear-gradient(#c9a3ff,#8f5cf0);box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 #6a3cc8,inset 0 3px 0 rgba(255,255,255,.4)}
.x{position:absolute;right:-12px;top:-14px;width:44px;height:44px;--c1:#ff8a8a;--c2:#e8384f;--cs:#b82239}
.x svg{width:20px;height:20px}
.col{display:flex;flex-direction:column;gap:14px;width:100%;align-items:stretch}
.row{display:flex;gap:10px;width:100%}
.row .b{flex:1;font-size:19px;padding:11px 8px 13px}
.big{font:800 58px/1 var(--fd);font-variant-numeric:tabular-nums}
.lbl{font:800 15px/1.2 var(--fd);color:#8a5a3a;text-align:center}
/* hasil */
.stage{position:relative;width:128px;height:128px;display:grid;place-items:center}
.stage .rays{position:absolute;inset:-26px;border-radius:50%;background:repeating-conic-gradient(rgba(255,210,80,.55) 0 12deg,transparent 12deg 24deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stage img{position:relative;width:100%;height:100%;object-fit:contain;animation:bob 2.2s ease-in-out infinite}
.fname{font:800 20px/1 var(--fd);margin-top:-6px}
.rek{position:absolute;right:-16px;top:40px;width:96px;height:96px;display:grid;place-items:center;transform:rotate(12deg);z-index:2}
.rek::before{content:"";position:absolute;inset:0;background:#ffd23a;border:3px solid var(--ink);clip-path:polygon(50% 0,61% 16%,79% 7%,80% 27%,100% 30%,88% 47%,100% 64%,80% 69%,79% 90%,61% 82%,50% 100%,39% 82%,21% 90%,20% 69%,0 64%,12% 47%,0 30%,20% 27%,21% 7%,39% 16%)}
.rek::after{content:"";position:absolute;inset:6px;background:#ff5c93;clip-path:polygon(50% 0,61% 16%,79% 7%,80% 27%,100% 30%,88% 47%,100% 64%,80% 69%,79% 90%,61% 82%,50% 100%,39% 82%,21% 90%,20% 69%,0 64%,12% 47%,0 30%,20% 27%,21% 7%,39% 16%)}
.rek span{position:relative;z-index:1;font:800 17px/.95 var(--fd);text-align:center}
.rek.go{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes stamp{from{transform:rotate(-30deg) scale(3);opacity:0}}
.note{font:800 17px/1.1 var(--fd);padding:5px 14px 7px;border-radius:12px;border:3px solid var(--ink);background:#7fd8ff}
.note.win{background:#8ef06a}
.rL,.rR{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.rR{gap:12px}
.rrec{font:800 14px/1.15 var(--fd);color:#8a5a3a;text-align:center}
.rbar{width:100%;height:14px;border:3px solid var(--ink);border-radius:999px;background:#f3dfbd;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.1)}
.rbar i{display:block;height:100%;width:0;background:linear-gradient(#ffe36a,#ffb21a);border-radius:999px}
.rbar.rec i{background:linear-gradient(#ffb3d9,#ff5c93)}
.rmisc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.xp{font:800 14px/1 var(--fd);background:var(--ink);color:#ffe36a;border-radius:999px;padding:5px 12px 6px}
#rAgain{font-size:26px;padding:14px 10px 17px}
/* koleksi */
.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.kt{display:flex;flex-direction:column;align-items:center;gap:2px}
.kt div{position:relative;width:100%;aspect-ratio:1;border-radius:18px;border:3px solid var(--ink);background:radial-gradient(circle at 45% 35%,#fff,#ffe2ad);box-shadow:inset 0 -4px 0 #f0c47a;display:grid;place-items:center;overflow:hidden}
.kt.lk div{background:radial-gradient(circle at 45% 35%,#8a7a99,#5a4868);box-shadow:inset 0 -4px 0 #3e2f4c}
.kt img{width:125%;height:125%;object-fit:contain}
.kt b{position:absolute;font:800 26px/1 var(--fd)}
.kt span{font:800 12px/1.1 var(--fd);white-space:nowrap}
.kt.top div{background:radial-gradient(circle at 45% 35%,#fffbe0,#ffd23a)}
.prog{font:800 16px/1 var(--fd);background:var(--ink);color:#ffe36a;border-radius:999px;padding:4px 12px 6px}
/* setelan */
.tg{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 10px;box-shadow:0 4px 0 var(--ink)}
.tg .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#ffb21a;border:3px solid var(--ink)}
.tg .ico svg{width:22px;height:22px}
.tg b{flex:1;font:800 20px/1 var(--fd)}
.sw{width:66px;height:36px;border-radius:999px;border:3px solid var(--ink);background:#c9b8a8;position:relative;transition:background .2s;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--ink);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.sw.on{background:#3dbb2c}.sw.on::after{transform:translateX(30px)}
/* harian */
.cal{width:110px;height:112px;border:4px solid var(--ink);border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;transform:rotate(-4deg)}
.cal i{display:block;height:32px;background:linear-gradient(#ff7a7a,#e8384f);border-bottom:4px solid var(--ink);font:800 16px/28px var(--fd);font-style:normal;color:#fff;text-align:center}
.cal b{flex:1;display:grid;place-items:center;font:800 52px/1 var(--fd);color:var(--ink)}
.noanim *{animation:none!important;transition:none!important}
/* ponsel mendatar / layar pendek: panel rapat, lapisan penuh layar, bisa digulir */
@media (max-height:500px){
  .ov{position:fixed;padding:calc(var(--st) + 24px) 12px calc(var(--sb) + 10px)}
  #sTitle{position:fixed}
  .pn{padding:30px 12px 12px;gap:8px;border-radius:22px}
  .rb{font-size:22px;padding:6px 22px 9px;top:-21px}
  .col{gap:9px}
  .pn .b:not(.rd){font-size:18px;padding:9px 14px 11px;border-radius:16px}
  .pn .row .b{font-size:16px;padding:8px 6px 10px}
  .big{font-size:42px}
  .tg{padding:5px 8px}
  #sOver .pn{max-width:600px;display:grid;grid-template-columns:1fr 1fr;column-gap:16px;row-gap:8px;align-items:center}
  #sOver .rL{grid-column:1;grid-row:1}#sOver .rR{grid-column:2;grid-row:1;flex-direction:row;justify-content:center}
  #sOver .rmisc{grid-column:1;grid-row:2}#sOver .col{grid-column:2;grid-row:2}
  #sOver .stage{width:76px;height:76px}.stage .rays{inset:-16px}
  #rAgain{font-size:20px;padding:9px 8px 11px}
  .rek{width:70px;height:70px;top:30px;right:auto;left:calc(50% - 60px)}.rek span{font-size:14px}
  .cal{display:none}
  #sTantang .stage{width:70px!important;height:70px!important}
  #sKoleksi .pn{max-width:520px}.kg{grid-template-columns:repeat(6,1fr)}
}
#playHint{position:absolute;left:50%;transform:translateX(-50%);max-width:calc(100% - 42px);padding:9px 14px;border:2px solid rgba(108,72,25,.17);border-radius:15px;background:rgba(255,253,236,.93);box-shadow:0 3px 0 rgba(96,57,19,.12);font:800 13px/1.35 var(--fb);text-align:center;pointer-events:none;width:min(290px,calc(100% - 42px));white-space:normal}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
#uji{position:fixed;left:4px;top:4px;right:4px;z-index:99;background:rgba(0,0,0,.8);color:#fff;font:12px/1.35 monospace;padding:8px;white-space:pre-wrap;border-radius:8px;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="probe"></div>
<div id="col">
  <section id="sTitle" class="scr">
    <a href="/" class="b home" aria-label="Beranda"><svg viewBox="0 0 24 24"><path fill="#3d1a0c" d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg></a>
    <div class="chip ol" id="tProg"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffd23a" stroke="#3d1a0c" stroke-width="2" stroke-linejoin="round" d="M12 2.8l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.7l-5.4 2.9 1.1-6.1-4.5-4.3 6.1-.8z"/></svg><span id="tLv">Lv 1</span><span class="strk" id="tStrk" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff8a1a" stroke="#3d1a0c" stroke-width="2" stroke-linejoin="round" d="M12 2.5c1.2 3.6 5.5 5.6 5.5 11a5.5 5.5 0 0 1-11 0c0-2.8 1.4-4.4 2.8-5.4-.1 2.1.8 3.2 2 3.4-.7-3.2.2-6.4.7-9z"/><path fill="#ffe36a" d="M12 12.5c.9 1.5 2.3 2.3 2.3 4a2.3 2.3 0 0 1-4.6 0c0-1.2.9-2.1 2.3-4z"/></svg><span id="tStrkN">0 hari</span></span></div>
    <div class="best ol" id="tBest" aria-label="Rekor"><svg viewBox="0 0 24 24"><path fill="#ffd23a" stroke="#3d1a0c" stroke-width="2" stroke-linejoin="round" d="M3 18h18l1-11-6 4-4-7-4 7-6-4z"/></svg><span>0</span></div>
    <canvas id="logo"></canvas>
    <div class="tmid ent" id="tMid">
      <div class="chal ol" id="tChal" hidden>Kalahkan skor 0!</div>
      <button class="b ol" id="bMain"><svg viewBox="0 0 24 24"><path fill="#fff" stroke="#3d1a0c" stroke-width="2" stroke-linejoin="round" d="M7 4.5v15l12-7.5z"/></svg>MAIN</button>
      <div class="icons">
        <button class="ic" id="bHarian"><span class="b y ol"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><rect x="4" y="5.5" width="16" height="15" rx="3" fill="#fff" stroke="#3d1a0c" stroke-width="2"/><path d="M4.5 10h15" stroke="#e8384f" stroke-width="4"/><path d="M8.5 3.5v4M15.5 3.5v4" stroke="#3d1a0c"/><circle cx="12" cy="15.5" r="2.2" fill="#ff5c93" stroke="none"/></svg><i class="dot" id="dDaily" hidden></i></span><span class="ol">Harian</span></button>
        <button class="ic" id="bTantang" aria-label="Tantang"><span class="b p ol" style="font-size:20px" aria-hidden="true">VS</span><span class="ol">Tantang</span></button>

<script>
"use strict";
const KIT = window.DehayukKit, SLUG = "jatuh-buah";
/* ================= INTI FISIKA (tanpa DOM) ================= */
const W = 360, H = 600, DANGER = 104, SPAWN_Y = 48, DT = 1 / 120, GRAV = 1500, ITER = 6, MAXB = 110, CAP = 90;
const OVER_T = 2, AGE_MIN = 1, DURIAN_BONUS = 1000, VMAX = 13, TAU = Math.PI * 2;
const FR = [
  { n: "Ceri", r: 14, p: 1, j: "#ff4d5e" }, { n: "Rambutan", r: 18, p: 3, j: "#ff5a6a" },
  { n: "Duku", r: 23, p: 6, j: "#f3dc8a" }, { n: "Salak", r: 28, p: 10, j: "#f2e2bf" },
  { n: "Jeruk", r: 34, p: 15, j: "#ffa22a" }, { n: "Mangga", r: 41, p: 21, j: "#ffcc2e" },
  { n: "Manggis", r: 48, p: 28, j: "#b04a9a" }, { n: "Nanas", r: 56, p: 36, j: "#ffdd3d" },
  { n: "Pepaya", r: 64, p: 45, j: "#ff8a3a" }, { n: "Nangka", r: 73, p: 55, j: "#f5c93a" },
  { n: "Durian", r: 83, p: 66, j: "#e3e36a" }
];
const WEIGHTS = [30, 27, 21, 13, 9];
const RMAX = 83;
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function Core() {
  const F = (n) => new Float64Array(n);
  this.x = F(MAXB); this.y = F(MAXB); this.px = F(MAXB); this.py = F(MAXB); this.r = F(MAXB);
  this.age = F(MAXB); this.ang = F(MAXB); this.pv = F(MAXB); this.hit = F(MAXB);
  this.lv = new Int8Array(MAXB); this.al = new Uint8Array(MAXB); this.mk = new Uint8Array(MAXB);
  this.pin = new Uint8Array(MAXB); this.land = new Uint8Array(MAXB); this.born = new Uint8Array(MAXB);
  this.ord = new Int16Array(MAXB);
  this.MA = new Int16Array(64); this.MB = new Int16Array(64);
  this.EV = 64; this.eT = new Int8Array(64); this.eL = new Int8Array(64); this.eX = F(64); this.eY = F(64); this.eP = new Int32Array(64); this.eC = new Int16Array(64);
  this.evN = 0; this.next = [0, 0];
  this.reset(1);
}
Core.prototype.reset = function (seed) {
  this.al.fill(0); this.pin.fill(0); this.mk.fill(0);
  this.seed = seed >>> 0; this.rng = mulberry(this.seed);
  this.score = 0; this.t = 0; this.dangerT = 0; this.over = false; this.combo = 0; this.lastMerge = -9;
  this.top = 0; this.merges = 0; this.maxCombo = 0; this.durians = 0; this.drops = 0; this.live = 0; this.evN = 0; this.warn = 0;
  this.next[0] = this.roll(); this.next[1] = this.roll();
};
Core.prototype.roll = function () {
  let s = 0; for (let i = 0; i < 5; i++) s += WEIGHTS[i];
  let v = this.rng() * s;
  for (let i = 0; i < 5; i++) { v -= WEIGHTS[i]; if (v < 0) return i; }
  return 0;
};
Core.prototype.spawn = function (lv, x, y) {
  for (let i = 0; i < MAXB; i++) {
    if (this.al[i]) continue;
    this.al[i] = 1; this.lv[i] = lv; this.r[i] = FR[lv].r; this.x[i] = x; this.y[i] = y; this.px[i] = x; this.py[i] = y;
    this.age[i] = 0; this.ang[i] = 0; this.mk[i] = 0; this.pin[i] = 0; this.land[i] = 0; this.born[i] = 1; this.hit[i] = 0;
    if (lv > this.top) this.top = lv;
    return i;
  }
  return -1;
};
Core.prototype.drop = function (x) {
  const lv = this.next[0];
  const r = FR[lv].r; x = x < r ? r : x > W - r ? W - r : x;
  const k = this.spawn(lv, x, SPAWN_Y);
  if (k >= 0) { this.py[k] = SPAWN_Y - 1.5; this.land[k] = 2; }
  this.next[0] = this.next[1]; this.next[1] = this.roll(); this.drops++;
  return k;
};
Core.prototype.ev = function (type, lv, x, y, p, c) {
  if (this.evN >= this.EV) return;
  const n = this.evN++; this.eT[n] = type; this.eL[n] = lv; this.eX[n] = x; this.eY[n] = y; this.eP[n] = p; this.eC[n] = c;
};
Core.prototype.step = function () {
  if (this.over) return;
  const X = this.x, Y = this.y, PX = this.px, PY = this.py, R = this.r, AL = this.al, LV = this.lv, MK = this.mk, PIN = this.pin, ORD = this.ord;
  const g = GRAV * DT * DT;
  let n = 0;
  // 1) integrasi Verlet
  for (let i = 0; i < MAXB; i++) {
    if (!AL[i]) continue;
    this.age[i] += DT;
    ORD[n++] = i;
    if (PIN[i]) { PX[i] = X[i]; PY[i] = Y[i]; continue; }
    let vx = (X[i] - PX[i]) * 0.998, vy = (Y[i] - PY[i]) * 0.998;
    const sp = vx * vx + vy * vy;
    if (sp < 0.0016) { vx *= 0.6; vy *= 0.6; }              // redam getar mikro di tumpukan
    vy += g;
    const s2 = vx * vx + vy * vy;
    if (s2 > VMAX * VMAX) { const k = VMAX / Math.sqrt(s2); vx *= k; vy *= k; }
    PX[i] = X[i]; PY[i] = Y[i];
    X[i] += vx; Y[i] += vy;
    this.pv[i] = vy;
    this.ang[i] += vx / R[i];
  }
  // 2) urutkan dari bawah ke atas (hampir terurut: sisip)
  for (let a = 1; a < n; a++) {
    const v = ORD[a], yv = Y[v]; let b = a - 1;
    while (b >= 0 && Y[ORD[b]] < yv) { ORD[b + 1] = ORD[b]; b--; }
    ORD[b + 1] = v;
  }
  let mN = 0;
  // 3) putaran penyelesaian
  for (let it = 0; it < ITER; it++) {
    for (let k = 0; k < n; k++) {
      const i = ORD[k]; if (PIN[i]) continue;
      const r = R[i];
      if (X[i] < r) { const v = X[i] - PX[i]; X[i] = r; PX[i] = r + v * 0.2; }
      else if (X[i] > W - r) { const v = X[i] - PX[i]; X[i] = W - r; PX[i] = W - r + v * 0.2; }
      if (Y[i] > H - r) {
        const v = Y[i] - PY[i]; Y[i] = H - r; PY[i] = Y[i] + (v > 1.5 ? v * 0.18 : 0);
        PX[i] += (X[i] - PX[i]) * 0.06;
      }
    }
    for (let a = 0; a < n; a++) {
      const i = ORD[a]; if (!AL[i] || MK[i]) continue;
      const ri = R[i], yi = Y[i], lim = ri + RMAX + 6;
      for (let b = a + 1; b < n; b++) {
        const j = ORD[b];
        const dy = Y[j] - yi;
        if (-dy > lim) break;
        if (MK[j]) continue;
        const dx = X[j] - X[i], rs = ri + R[j], d2 = dx * dx + dy * dy;
        if (d2 >= (rs + 0.9) * (rs + 0.9)) continue;
        if (LV[i] === LV[j] && !PIN[i] && !PIN[j] && mN < 64) {
          MK[i] = 1; MK[j] = 1; this.MA[mN] = i; this.MB[mN] = j; mN++;
          break;
        }
        if (d2 >= rs * rs) continue;
        let d = Math.sqrt(d2), nx = 0, ny = 1;
        if (d > 1e-6) { nx = dx / d; ny = dy / d; } else d = 0;
        const ov = rs - d;
        const mi = PIN[i] ? 0 : 1 / (ri * ri), mj = PIN[j] ? 0 : 1 / (R[j] * R[j]), ms = mi + mj;
        if (ms === 0) continue;
        const c = (ov > 6 ? 6 : ov) * 0.85 / ms;
        X[i] -= nx * c * mi; Y[i] -= ny * c * mi; X[j] += nx * c * mj; Y[j] += ny * c * mj;
        if (it === 0) {
          // gesekan tangensial ringan pada titik sentuh
          const tx = -ny, ty = nx;
          const vt = ((X[j] - PX[j]) - (X[i] - PX[i])) * tx + ((Y[j] - PY[j]) - (Y[i] - PY[i])) * ty;
          const f = vt * 0.12 / ms;
          PX[i] -= tx * f * mi; PY[i] -= ty * f * mi; PX[j] += tx * f * mj; PY[j] += ty * f * mj;
        }
      }
    }
  }
  // 4) peleburan setelah semua putaran
  for (let q = 0; q < mN; q++) this.merge(this.MA[q], this.MB[q]);
  // 5) pendaratan, garis bahaya
  let danger = false, live = 0, warn = 0;
  for (let i = 0; i < MAXB; i++) {
    if (!AL[i]) continue;
    live++;
    const r = R[i];
    if (X[i] < r) X[i] = r; else if (X[i] > W - r) X[i] = W - r;
    if (Y[i] > H - r) Y[i] = H - r;
    const vy = Y[i] - PY[i], dv = this.pv[i] - vy;
    if (dv > 1.4 && !PIN[i]) {
      if (dv > this.hit[i]) this.hit[i] = dv;
      if (this.land[i] === 2) { this.land[i] = 1; this.ev(2, LV[i], X[i], Y[i] + r, 0, 0); }
    }
    if (this.age[i] >= AGE_MIN) {
      const top = Y[i] - r;
      if (top < DANGER) danger = true;
      if (top < DANGER + 60) warn = 1;
    }
  }
  this.live = live; this.warn = warn;
  this.dangerT = danger ? this.dangerT + DT : 0;
  this.t += DT;
  if (this.dangerT >= OVER_T - 1e-9 || live >= CAP) this.over = true;
};
Core.prototype.merge = function (i, j) {
  const X = this.x, Y = this.y, R = this.r;
  const L = this.lv[i], mi = R[i] * R[i], mj = R[j] * R[j], m = mi + mj;
  // titik sentuh
  const d = Math.hypot(X[j] - X[i], Y[j] - Y[i]) || 1;
  const cx = X[i] + (X[j] - X[i]) * R[i] / d, cy = Y[i] + (Y[j] - Y[i]) * R[i] / d;
  const wx = (X[i] * mi + X[j] * mj) / m, wy = (Y[i] * mi + Y[j] * mj) / m;
  const x = (cx + wx) / 2, y = (cy + wy) / 2;
  this.al[i] = 0; this.al[j] = 0; this.mk[i] = 0; this.mk[j] = 0;
  this.combo = this.t - this.lastMerge < 0.9 ? this.combo + 1 : 1;
  this.lastMerge = this.t;
  if (this.combo > this.maxCombo) this.maxCombo = this.combo;
  let pts;
  if (L >= 10) {
    pts = DURIAN_BONUS; this.durians++;
    this.ev(1, 10, x, y, 0, this.combo);
  } else {

    c.fillStyle = CCOL[cCol[k]]; c.fillRect(-w / 2, -h / 2, w, h);
  }
}

/* ================= DEMO (untuk tangkapan layar) ================= */
let demoT = 0; const demoR = mulberry(12345), DEMO_END = parseFloat(Q.get("end") || "0");
function demoTick(dt) {
  demoT += dt; aimX = 180 + Math.sin(time * 1.3) * 140;
  if (canDrop() && demoR() < .5) { aimX = 20 + demoR() * 320; doDrop(); }
  if (DEMO_END && demoT > DEMO_END) core.over = true;
}

/* ================= MULAI ================= */
function boot() {
  if (Q.get("noanim") === "1") document.documentElement.classList.add("noanim");
  buildUiImages();
  layout();
  parseHash();
  window.addEventListener("hashchange", () => { parseHash(); if (mode === "title") toTitle(); });
  toTitle();
  KIT.music.start(MUSIC);
  if (Q.get("uji") === "1") { runUji(); }
  if (Q.get("sheet") === "1") { // lembar sprite untuk pemeriksaan visual
    const c = mk(cv.width, cv.height), g = c.getContext("2d"); g.fillStyle = "#fff3d6"; g.fillRect(0, 0, c.width, c.height);
    const cell = c.width / 6;
    for (let lv = 0; lv < 11; lv++) for (let e = 0; e < 3; e++) { const s = makeFruit(lv, cell * .26, e); const k = lv * 3 + e; g.drawImage(s, (k % 6) * cell + cell / 2 - s.h, ((k / 6) | 0) * cell + cell / 2 - s.h); }
    BG = c; CLOUDS = []; TITLE = []; hideAll();
  }
  if (DEMO) setTimeout(() => startGame("normal", 777), 50);
  const s = Q.get("s");
  if (s) setTimeout(() => {
    if (s === "koleksi") openKoleksi(); else if (s === "setelan") openSetelan(); else if (s === "harian") openHarian(); else if (s === "tantang") openTantang();
    else if (s === "pause") { mode = "pause"; show($("sPause")); }
  }, DEMO ? parseFloat(Q.get("st") || "2500") : 60);
  if (DEMO) { let ft = 0; lastTs = 0; setInterval(() => { ft += 1000 / 60; frameCore(ft); }, 16); } else requestAnimationFrame((t) => { lastTs = t; frame(t); });
  if (document.fonts && document.fonts.load) document.fonts.load("800 40px 'Baloo 2'").then(() => { drawLogo(); }).catch(() => { });
}
boot();
