<html lang="id">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap"></noscript>
<style>
  :root {
    color-scheme: dark;
    --ground: #0E3534;
    --board: #15504D;
    --board-edge: #2A7A75;
    --slot-edge: #3E8C86;
    --tile: #F4C152;
    --tile-shade: #C9952A;
    --tile-ink: #3B2A05;
    --ink: #EAF6F3;
    --muted: #9EC6C0;
    --good: #7FE0A3;
    --bad: #FF7A70;
    --well: #0B2B2A;
    --r1: #5DB548; --r2: #8A5536; --r3: #EDBE3A; --r4: #EE7FA8; --r5: #5E3C73;
    --display: "Baloo 2", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 15px;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior-y: contain;
  }
  body.playing { overflow: hidden; }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; font-family: var(--body); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .wrap {
    max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
  }
  section { display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand-box { display: flex; flex-direction: column; min-width: 0; }
  .hub { color: var(--muted); font-size: 12px; font-weight: 800; text-decoration: none; padding: 2px 0; }
  .brand { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: .5px; white-space: nowrap; }
  .brand span { color: var(--tile); }
  .head-right { display: flex; align-items: center; gap: 8px; }
  .best {
    display: flex; align-items: center; gap: 6px; background: var(--board); border: 1px solid var(--board-edge);
    padding: 6px 12px; border-radius: 999px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .best.bump { animation: bump .45s ease-out; }
  @keyframes bump { 40% { transform: scale(1.18); border-color: var(--tile); } }
  .icon-btn {
    min-width: 44px; min-height: 44px; border-radius: 999px; cursor: pointer; font-size: 17px; line-height: 1;
    background: var(--board); border: 1px solid var(--board-edge); color: var(--ink);
  }

  /* Menu utama */
  .hero {
    background: var(--board); border: 1px solid var(--board-edge); border-radius: 14px; padding: 16px;
    display: flex; gap: 14px; align-items: center;
  }
  .logo { position: relative; flex: none; width: 58px; height: 62px; }
  .logo i { position: absolute; height: 10px; border-radius: 5px; background: var(--c); box-shadow: inset 0 3px 0 rgba(255,255,255,.3), inset 0 -2px 0 rgba(0,0,0,.25); }
  .logo i:nth-child(1) { left: 4px; width: 48px; bottom: 7px; }
  .logo i:nth-child(2) { left: 8px; width: 43px; bottom: 17px; }
  .logo i:nth-child(3) { left: 8px; width: 38px; bottom: 27px; }
  .logo i:nth-child(4) { left: 12px; width: 34px; bottom: 37px; }
  .logo i:nth-child(5) { left: 13px; width: 30px; bottom: 47px; }
  .logo i:nth-child(5)::after { content: ""; position: absolute; left: 1px; right: 1px; top: -2px; height: 4px; border-radius: 2px; background: #fff; }
  .logo b { position: absolute; left: 0; bottom: 2px; width: 58px; height: 7px; border-radius: 50%; background: #F4F1EA; }
  .hero p { margin: 0; color: var(--muted); line-height: 1.45; }
  .hero strong { color: var(--ink); font-family: var(--display); font-size: 19px; display: block; line-height: 1.15; }
  .stats { font-size: 12.5px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; margin: 0; }
  .modes { display: grid; gap: 10px; }
  .mode {
    display: grid; grid-template-columns: 1fr auto; grid-template-areas: "name state" "desc state";
    gap: 2px 12px; align-items: center; text-align: left; cursor: pointer;
    background: var(--board); border: 1px solid var(--board-edge); border-radius: 14px; padding: 14px 16px; color: var(--ink);
  }
  .mode-name { grid-area: name; font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1.1; }
  .mode-desc { grid-area: desc; font-size: 12.5px; color: var(--muted); }
  .mode-state {
    grid-area: state; max-width: 140px; text-align: center; font-weight: 800; font-size: 12px;
    background: var(--tile); color: var(--tile-ink); box-shadow: inset 0 -3px 0 var(--tile-shade);
    padding: 7px 10px; border-radius: 9px; font-variant-numeric: tabular-nums;
  }
  .mode.primary { border-color: var(--tile-shade); box-shadow: 0 0 0 1px var(--tile-shade) inset; }
  .mode.primary .mode-name { color: var(--tile); }
  .mode.done .mode-state { background: transparent; box-shadow: none; color: var(--good); border: 1px solid var(--good); }
  .home-foot { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .link-btn { background: none; border: 1px solid var(--board-edge); color: var(--muted); border-radius: 999px; padding: 8px 11px; font-weight: 800; font-size: 12.5px; cursor: pointer; min-height: 44px; }
  .home-foot a { color: var(--muted); font-size: 12px; padding: 12px; }

  /* Layar main: kanvas memenuhi layar, HUD melayang di atasnya */
  #play { position: fixed; inset: 0; z-index: 20; background: var(--ground); }
  .stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: pointer; }
  .bg { position: absolute; inset: 0; background: linear-gradient(#173E35, #2D5F4B); }
  #bgB { opacity: 0; }
  .bg.glow { background: radial-gradient(ellipse 90% 70% at 50% -5%, rgba(255,214,150,.28), rgba(255,214,150,0)); }
  #cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .hud {
    position: absolute; left: 0; right: 0; top: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: calc(8px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px)) 0 calc(12px + env(safe-area-inset-left, 0px));
  }
  .hud-top { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 480px; }
  .hud-top button { pointer-events: auto; }
  .back {
    background: rgba(14, 53, 52, .72); border: 1px solid var(--board-edge); color: var(--ink); border-radius: 10px;
    min-height: 44px; padding: 8px 12px; font-weight: 800; font-size: 13px; cursor: pointer;
  }
  .chip {
    font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--tile); border: 1px solid var(--tile-shade); background: rgba(14, 53, 52, .6); padding: 1px 10px; border-radius: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .hud .best { margin-left: auto; background: rgba(21, 80, 77, .8); padding: 6px 10px; font-size: 14px; }
  .hud .icon-btn { background: rgba(21, 80, 77, .8); }
  .floors {
    font-family: var(--display); font-weight: 800; font-size: 60px; line-height: .95; margin-top: 4px; font-variant-numeric: tabular-nums;
    text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 18px rgba(0,0,0,.25);
  }
  .floors.bump { animation: pop .25s ease-out; }
  @keyframes pop { 40% { transform: scale(1.14); } }
  .floors-lbl { font-weight: 800; font-size: 12px; color: rgba(234, 246, 243, .8); letter-spacing: 1px; text-transform: uppercase; margin-top: -4px; }
  .hud-row { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; background: rgba(8, 30, 30, .62); border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px; padding: 3px 10px; font-weight: 800; font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .pill .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--c, #fff); box-shadow: inset 0 2px 0 rgba(255,255,255,.35); }
  .pill.gold .dot { box-shadow: 0 0 0 2px #FFD76A; }
  .streak { color: var(--tile); }
  .streak.hot { color: #fff; background: rgba(201, 149, 42, .75); border-color: var(--tile); }
  .turn {
    margin-top: 6px; padding: 6px 18px; border-radius: 999px; font-family: var(--display); font-weight: 800; font-size: 19px;
    background: var(--pc, #E5484D); color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), 0 3px 10px rgba(0,0,0,.3);
    white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis;
  }
  .turn.wait { animation: breathe .7s ease-in-out infinite alternate; }
  @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.07); } }
  .duo-score { font-weight: 800; font-size: 12.5px; color: rgba(234,246,243,.85); margin-top: 2px; }
  .tap-hint {
    position: absolute; left: 50%; top: 58%; transform: translateX(-50%); pointer-events: none; text-align: center;
    font-family: var(--display); font-weight: 800; font-size: 22px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.4);
    background: rgba(8, 30, 30, .55); padding: 8px 18px; border-radius: 14px; white-space: nowrap;
  }
  .tap-hint small { display: block; font-family: var(--body); font-size: 12.5px; font-weight: 800; color: var(--muted); }
  .tap-hint i { display: inline-block; font-style: normal; animation: tapf 1s ease-in-out infinite; }
  @keyframes tapf { 50% { transform: translateY(5px) scale(.92); } }
  .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .float {
    position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-weight: 800; font-size: 24px;
    color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.4); animation: rise .85s ease-out forwards; white-space: nowrap;
  }
  @keyframes rise { from { opacity: 1; transform: translate(-50%, -50%) scale(.8); } 20% { transform: translate(-50%, -60%) scale(1.1); } to { opacity: 0; transform: translate(-50%, calc(-50% - 50px)); } }
  .banner {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--tile); color: var(--tile-ink);
    font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.15; padding: 8px 16px; border-radius: 14px; text-align: center;
    box-shadow: inset 0 -3px 0 var(--tile-shade), 0 6px 18px rgba(0,0,0,.35); animation: banner 2.4s ease-out forwards; max-width: 88%;
  }
  .banner small { display: block; font-family: var(--body); font-size: 13px; font-weight: 800; opacity: .85; }
  @keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.7); } 10% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 18% { transform: translate(-50%, -50%) scale(1); } 82% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -62%); } }
  .confetti { position: fixed; top: -14px; width: 9px; height: 13px; border-radius: 2px; z-index: 80; pointer-events: none; animation: fall 1.5s ease-in forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .7; } }

  /* Panel */
  .overlay { position: fixed; inset: 0; background: rgba(5, 20, 20, .86); display: grid; place-items: center; padding: 16px; z-index: 60; overflow-y: auto; }
  .overlay.lock .panel { pointer-events: none; }
  .panel {
    width: 100%; max-width: 380px; background: var(--board); border: 1px solid var(--board-edge); border-radius: 16px;
    padding: 22px 18px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center;
    animation: slideUp .28s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .panel h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.1; color: var(--tile); }
  .panel h3 { margin: 4px 0 0; font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--ink); }
  .panel p { margin: 0; color: var(--muted); line-height: 1.45; }
  .panel b { color: var(--ink); }
  .big { font-family: var(--display); font-weight: 800; font-size: 48px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .big small { font-size: 18px; color: var(--muted); }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .facts div { background: var(--ground); border: 1px solid var(--board-edge); border-radius: 10px; padding: 8px 4px; font-size: 11.5px; color: var(--muted); }
  .facts b { display: block; font-size: 18px; font-family: var(--display); line-height: 1.2; }
  .col { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .row { display: flex; gap: 8px; width: 100%; }
  .row .btn { flex: 1; }
  .btn {
    border: 1px solid var(--board-edge); background: var(--ground); color: var(--ink); border-radius: 10px;
    padding: 11px 8px; font-weight: 800; font-size: 14px; cursor: pointer; line-height: 1.2; min-height: 44px;
  }
  .btn.main { background: var(--tile); color: var(--tile-ink); border: 0; box-shadow: inset 0 -4px 0 var(--tile-shade); font-family: var(--display); font-size: 20px; }
  .help { text-align: left; margin: 0; padding-left: 20px; color: var(--ink); line-height: 1.5; display: flex; flex-direction: column; gap: 6px; }
  .help li::marker { color: var(--tile); }
  .rasa-list { display: grid; gap: 6px; width: 100%; text-align: left; font-size: 13px; }
  .rasa-list div { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  .rasa-list i { flex: none; width: 26px; height: 12px; border-radius: 6px; background: var(--c); box-shadow: inset 0 3px 0 rgba(255,255,255,.3); }
  .rasa-list b { color: var(--ink); }
  .versus { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; width: 100%; }
  .versus .side { background: var(--ground); border: 1px solid var(--board-edge); border-radius: 12px; padding: 10px 6px; min-width: 0; }
  .versus .side.win { border-color: var(--good); box-shadow: 0 0 0 1px var(--good); }
  .versus .who { font-weight: 800; overflow-wrap: anywhere; }
  .versus .pts { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .versus .side.win .pts { color: var(--good); }
  .versus .vs { font-family: var(--display); font-weight: 800; color: var(--tile); }
  .name-input {
    width: 100%; padding: 10px 12px; border-radius: 10px; text-align: center; border: 1px solid var(--board-edge);
    background: var(--ground); color: var(--ink); font-family: var(--body); font-weight: 800; font-size: 18px; user-select: text; -webkit-user-select: text; min-height: 44px;
  }
  .player { width: 100%; display: flex; flex-direction: column; gap: 6px; background: var(--ground); border: 1px solid var(--board-edge); border-radius: 12px; padding: 10px; }
  .player .name-input { border-color: var(--pc); box-shadow: inset 4px 0 0 var(--pc); }
  .swatches { display: flex; gap: 4px; justify-content: center; }
  .sw { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; background: var(--c); cursor: pointer; padding: 0; }
  .sw[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--c); }
  .sw:disabled {
    cursor: default; opacity: .55; border: 2px dashed rgba(255,255,255,.45);
    background: linear-gradient(135deg, transparent 44%, #fff 44% 56%, transparent 56%), var(--c);
  }
  .seg { display: flex; width: 100%; border: 1px solid var(--board-edge); border-radius: 10px; overflow: hidden; }
  .seg button { flex: 1; background: none; border: 0; color: var(--muted); font-weight: 800; font-size: 12.5px; padding: 8px 4px; min-height: 44px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--tile); color: var(--tile-ink); }
  .board-list { width: 100%; display: grid; gap: 4px; font-size: 13px; }
  .board-list div { display: flex; justify-content: space-between; background: var(--ground); border-radius: 8px; padding: 6px 10px; }
  .jars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; }
  .jar { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; color: var(--muted); }
  .jar i {
    position: relative; width: 44px; height: 54px; border-radius: 10px 10px 14px 14px; border: 2px solid rgba(255,255,255,.35);
    background: linear-gradient(to top, var(--c) 0 62%, rgba(255,255,255,.06) 62%);
  }
  .jar i::before { content: ""; position: absolute; left: 6px; right: 6px; top: -7px; height: 7px; border-radius: 3px 3px 0 0; background: #B98A5A; }
  .jar.off i { background: rgba(255,255,255,.05); border-style: dashed; }
  .jar.off i::after { content: "?"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 20px; color: rgba(255,255,255,.35); }
  .jar.gold i { border-color: #FFD76A; box-shadow: 0 0 10px rgba(255, 215, 106, .6); }
  .jar.gold { color: #FFD76A; }
  .badges { width: 100%; display: grid; gap: 6px; text-align: left; font-size: 13px; }
  .badges div { background: var(--ground); border: 1px solid var(--board-edge); border-radius: 10px; padding: 8px 10px; color: var(--muted); }
  .badges div.on { color: var(--ink); border-color: var(--tile-shade); }
  .toast {
    position: fixed; left: 50%; top: calc(62px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    background: var(--ink); color: var(--ground); font-weight: 800; font-size: 13px; padding: 8px 14px; border-radius: 999px;
    z-index: 70; max-width: calc(100% - 32px); text-align: center; pointer-events: none;
  }
  body.playing .toast { top: auto; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 400px) {
    .overlay { padding: 12px; }
    .panel { padding: 20px 14px; }
    .player { padding: 8px; }
  }
  @media (max-width: 370px) {
    .brand { font-size: 21px; }
    .hud .best { padding: 6px 8px; font-size: 13px; }
    .chip { font-size: 12px; padding: 1px 7px; letter-spacing: .5px; }
  }
  @media (max-height: 600px) {
    .floors { font-size: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .best.bump, .floors.bump, .panel, .turn.wait, .tap-hint i { animation: none; }
    .banner { animation-duration: 2.4s; animation-name: fadeOnly; }
    @keyframes fadeOnly { 0%, 85% { opacity: 1; } 100% { opacity: 0; } }
    .confetti { display: none; }
  }
</style>

<div class="wrap" id="homeWrap">
  <header>
    <div class="brand-box">
      <a class="hub" href="/">‹ Dehayuk</a>
      <div class="brand">Lapis<span>Menjulang</span></div>
    </div>
    <div class="head-right">
      <div class="best" id="bestBox" title="Skor terbaik">🏆 <span id="best">0</span></div>
      <button class="icon-btn" id="btnSound" type="button" aria-label="Matikan suara" title="Suara">🔊</button>
    </div>
  </header>

  <section id="home">
    <div class="hero">
      <div class="logo" aria-hidden="true"><b></b><i style="--c:var(--r1)"></i><i style="--c:var(--r2)"></i><i style="--c:var(--r3)"></i><i style="--c:var(--r4)"></i><i style="--c:var(--r5)"></i></div>

<script>
/*CORE:BEGIN*/
// Aturan murni Lapis Menjulang: tanpa DOM, bisa diuji di Node.
// Semua gerak dihitung dari waktu (detik), bukan dari jumlah frame, jadi adil di HP lambat maupun cepat.
const GameCore = (() => {
  const W = 360, CX = 180, BASE_W = 220, LH = 22, XMIN = -40, XMAX = 400;
  const V0 = 170, DV = 4, VMAX = 420, DUO_BOOST = 40;
  const REGROW = 8, REGROW_FROM = 3, CALM_STREAK = 3;
  const SWAY_K = 0.3, SWAY_MAX = 12, SWAY_PERIOD = 1.8, SWAY_EASE = 0.5;
  const THIN = 0.2, THIN_MAX = 12, THIN_SLOW = 0.85;
  const KEJU_BACK = 0.22;
  const MIN_OVERLAP = 1;          // sisa tumpuan di bawah 1 satuan dihitung meleset (remah, bukan lapisan)
  const MAX_FLOORS = 999;
  const DAILY_LAUNCH = "2026-09-26"; // Harian #1

  // Tabel rasa: data saja, jadi rasa baru cukup ditambah di sini.
  const RASA = [
    { key: "pandan", name: "Pandan", motion: "linear", tip: "Santai dulu. Ketuk pas di atas kue!" },
    { key: "cokelat", name: "Cokelat", motion: "sine", tip: "Pelan di tepi, ngebut di tengah!" },
    { key: "keju", name: "Keju", motion: "zigzag", tip: "Awas balik arah!" },
    { key: "stroberi", name: "Stroberi", motion: "linear", thin: true, tip: "Adonan lebih tipis, tapi lebih pelan." },
    { key: "ketan", name: "Ketan Hitam", motion: "linear", sway: true, tip: "Kue bergoyang! Susun rapi supaya tenang." }
  ];
  const TOPPINGS = ["Meses warna", "Meses cokelat", "Keju parut", "Kacang cincang", "Kelapa parut", "Ceri merah"];

  // Generator acak mulberry32, sama dengan game Dehayuk lainnya.
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // Pengaduk tiga bilangan: acak yang sama untuk (seed, tingkat, lintasan) di semua perangkat.
  function mix(a, b, c) {
    let h = (a >>> 0) ^ Math.imul((b + 0x9E3779B9) | 0, 0x85EBCA6B);
    h = Math.imul(h ^ (h >>> 16), 0x7FEB352D);
    h ^= Math.imul((c + 0x632BE5AB) | 0, 0xC2B2AE35);
    h = Math.imul(h ^ (h >>> 15), 0x846CA68B);
    return (h ^ (h >>> 16)) >>> 0;
  }
  const rnd = (a, b, c) => rng(mix(a, b, c))();

  // ---------- Urutan rasa ----------
  const orderCache = new Map();
  function rasaOrder(seed, cycle) {
    if (cycle <= 0) return [0, 1, 2, 3, 4];
    const key = seed + ":" + cycle;
    if (orderCache.has(key)) return orderCache.get(key);
    const prev = rasaOrder(seed, cycle - 1);
    const r = rng(mix(seed, 0x5A5A, cycle));
    const o = [0, 1, 2, 3, 4];
    for (let i = 4; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = o[i]; o[i] = o[j]; o[j] = t; }
    // Rasa pertama putaran baru tidak sama dengan rasa terakhir putaran sebelumnya.
    if (o[0] === prev[4]) { const t = o[0]; o[0] = o[1]; o[1] = t; }
    if (orderCache.size > 200) orderCache.clear();
    orderCache.set(key, o);
    return o;
  }
  // Tingkat n (mulai 1) → rasa, putaran, dan ruas 10-lapis ke berapa.
  function rasaAt(seed, n) {
    if (n < 1) return { rasa: -1, cycle: 0, seg: -1 };
    const seg = Math.floor((n - 1) / 10), cycle = Math.floor(seg / 5);
    return { rasa: rasaOrder(seed, cycle)[seg % 5], cycle, seg };
  }

  // ---------- Keadaan permainan ----------
  function newGame(seed, opts) {
    const duo = !!(opts && opts.duo);
    return {
      v: 1, seed: seed >>> 0, duo, v0: duo ? V0 + DUO_BOOST : V0,
      layers: [{ x: CX, w: BASE_W, r: -1 }],
      floors: 0, perfects: 0, streak: 0, bestStreak: 0, score: 0, offs: [], over: false
    };
  }
  const scoreOf = (floors, perfects) => floors + 2 * perfects + 5 * Math.floor(floors / 10);
  const speedAt = (v0, n) => Math.min(VMAX, v0 + DV * n);

  // Lapisan yang sedang meluncur (tingkat berikutnya).
  function spec(g) {
    const n = g.layers.length, below = g.layers[n - 1];
    const ra = rasaAt(g.seed, n), R = RASA[ra.rasa];
    let w = below.w, v = speedAt(g.v0, n);
    if (R.thin) { w = below.w - Math.min(below.w * THIN, THIN_MAX); v *= THIN_SLOW; }
    let amp = 0;
    if (R.sway && g.streak < CALM_STREAK) {
      let s = 0;
      for (const o of g.offs) s += o;
      amp = Math.min(SWAY_MAX, SWAY_K * s);
    }
    const from = n % 2 ? -1 : 1; // tingkat ganjil datang dari kiri, genap dari kanan
    // s0 = goyangan kue saat lapisan sebelumnya jatuh; goyangan baru bermula dari situ supaya kue tidak melompat ke tengah.
    const s0 = Number.isFinite(g.s0) ? g.s0 : 0;
    return { n, rasa: ra.rasa, cycle: ra.cycle, seg: ra.seg, w, v, from, cmin: XMIN + w / 2, cmax: XMAX - w / 2, amp, s0, below, motion: R.motion, seed: g.seed };
  }
  // Posisi tengah lapisan meluncur pada waktu t (detik sejak muncul).
  function posAt(sp, t) {
    const L = sp.cmax - sp.cmin, dir = -sp.from;
    const start = sp.from < 0 ? sp.cmin : sp.cmax;
    if (L <= 0) return start;
    if (t < 0) t = 0;
    if (sp.motion === "sine") {
      // Cokelat: pelan di tepi, cepat di tengah; kecepatan rata-rata tetap v.
      const A = L / 2, C = (sp.cmin + sp.cmax) / 2, om = Math.PI * sp.v / (2 * A);
      return C - dir * A * Math.cos(om * t);
    }
    if (sp.motion === "zigzag") {
      // Keju: tiap lintasan berbalik sekali di titik acak 35–65%, mundur sedikit, lalu lanjut.
      const b = KEJU_BACK * L, P = L + 2 * b, dist = sp.v * t;
      const k = Math.floor(dist / P), d = dist - k * P;
      const a = (0.35 + 0.3 * rnd(sp.seed, sp.n, k)) * L;
      const u = d <= a ? d : d <= a + b ? 2 * a - d : d - 2 * b;
      return k % 2 ? start + dir * (L - u) : start + dir * u;
    }
    const d = (sp.v * t) % (2 * L);
    return d <= L ? start + dir * d : start + dir * (2 * L - d);
  }
  // Titik balik Keju pada lintasan k (untuk uji dan tampilan).
  function kejuTurn(sp, k) { return 0.35 + 0.3 * rnd(sp.seed, sp.n, k); }
  // Goyangan kue Ketan: bermula dari goyangan terakhir (s0), lalu berpindah halus ke goyangan baru.
  // Tampilan dan tabrakan memakai fungsi yang sama, jadi yang terlihat selalu yang dihitung.
  function swayAt(sp, t) {
    const s0 = sp.s0 || 0;
    if (t <= 0) return s0;
    const e = Math.min(1, t / SWAY_EASE), ease = e * e * (3 - 2 * e);
    const rest = s0 * (1 - ease);
    if (!sp.amp) return rest;
    return rest + sp.amp * ease * Math.sin(2 * Math.PI * t / SWAY_PERIOD);
  }
  const r3 = (x) => Math.round(x * 1000) / 1000;

  // Menjatuhkan lapisan pada waktu t. Mengembalikan hasil lengkap untuk efek tampilan.
  function drop(g, t) {
    if (!g || g.over) return null;
    const sp = spec(g), below = sp.below;
    const x = posAt(sp, t), sway = swayAt(sp, t);
    const xt = x - sway; // posisi relatif terhadap kue (goyangan menggeser sasaran)
    const off = xt - below.x, hw = sp.w / 2;
    const bl = below.x - below.w / 2, br = below.x + below.w / 2;
    const left = Math.max(xt - hw, bl), right = Math.min(xt + hw, br), ov = right - left;
    const tol = sp.n <= 10 ? 5 : 3;
    const res = { n: sp.n, rasa: sp.rasa, cycle: sp.cycle, x, xt, sway, w: sp.w, off, perfect: false, regrow: false,
      cut: null, over: false, gained: 0, rasaDone: false, next: null };
    let nx, nw;
    if (Math.abs(off) <= tol) {
      // Pas sempurna: menempel tepat, tanpa potongan. Adonan tipis Stroberi pun melebar penuh.
      res.perfect = true;
      nx = below.x; nw = below.w;
      g.streak++; g.perfects++;
      if (g.streak >= REGROW_FROM && nw < BASE_W) { nw = Math.min(BASE_W, nw + REGROW); res.regrow = true; }
    } else if (ov < MIN_OVERLAP) {
      g.over = true; g.streak = 0;
      res.over = true;
      return res;
    } else {
      nx = (left + right) / 2; nw = ov;
      const l0 = xt - hw, r0 = xt + hw;
      if (l0 < left - 0.01) res.cut = { x: (l0 + left) / 2, w: left - l0, side: -1 };
      else if (r0 > right + 0.01) res.cut = { x: (right + r0) / 2, w: r0 - right, side: 1 };
      g.streak = 0;
    }
    if (g.streak > g.bestStreak) g.bestStreak = g.streak;
    g.layers.push({ x: r3(nx), w: r3(nw), r: sp.rasa });
    g.s0 = r3(sway);
    g.offs.push(r3(Math.abs(off)));
    if (g.offs.length > 5) g.offs.shift();
    const before = g.score;
    g.floors = sp.n;
    g.score = scoreOf(g.floors, g.perfects);
    res.gained = g.score - before;
    res.nx = nx; res.nw = nw;
    res.rasaDone = sp.n % 10 === 0;
    if (res.rasaDone) res.next = rasaAt(g.seed, sp.n + 1);
    return res;
  }
  function isValid(g) {
    if (!g || g.v !== 1 || !Array.isArray(g.layers) || g.layers.length < 1 || g.layers.length > MAX_FLOORS + 1) return false;
    if (!Number.isInteger(g.seed) || g.seed < 0 || !Number.isFinite(g.v0)) return false;
    if (!Array.isArray(g.offs) || typeof g.over !== "boolean") return false;
    if (g.s0 !== undefined && (!Number.isFinite(g.s0) || Math.abs(g.s0) > SWAY_MAX)) return false;
    for (const L of g.layers) if (!L || !Number.isFinite(L.x) || !Number.isFinite(L.w) || L.w <= 0 || L.w > BASE_W) return false;
    return g.floors === g.layers.length - 1 && Number.isInteger(g.perfects) && Number.isInteger(g.streak);
  }

  // ---------- Tanggal, Harian, Tantangan, teks bagikan ----------
  function dateKey(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function hashStr(s) {
    let h = 2166136261;
    for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
    return h >>> 0;
  }
  // Seed Harian = hash('lapis-menjulang:' + YYYYMMDD)
  function dailySeed(key) { return hashStr("lapis-menjulang:" + key.replace(/-/g, "")); }
  function dailyNumber(key) {
    const [y1, m1, d1] = DAILY_LAUNCH.split("-").map(Number);
    const [y2, m2, d2] = key.split("-").map(Number);
    return Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 86400000) + 1;
  }
  function prevDay(key) {
    const [y, m, d] = key.split("-").map(Number);
    return dateKey(new Date(y, m - 1, d - 1));
  }
  const toppingOf = (seed) => mix(seed, 0x70, 0x9) % TOPPINGS.length;
  function cleanName(s) { return String(s || "").replace(/[^\p{L}\p{N} ._-]/gu, "").replace(/\s+/g, " ").trim().slice(0, 12); }
  function encodeDuel(d) {
    const json = JSON.stringify({ v: 1, s: d.s >>> 0, f: d.f, n: cleanName(d.n) });
    return btoa(unescape(encodeURIComponent(json))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function decodeDuel(code) {
    try {
      const o = JSON.parse(decodeURIComponent(escape(atob(String(code).replace(/-/g, "+").replace(/_/g, "/")))));
      if (!o || o.v !== 1) return null;
      if (!Number.isInteger(o.s) || o.s < 0 || o.s > 0xFFFFFFFF) return null;
      if (!Number.isInteger(o.f) || o.f < 1 || o.f > MAX_FLOORS) return null;
      const n = cleanName(o.n);
      return n ? { s: o.s, f: o.f, n } : null;
    } catch (e) { return null; }
  }
  function dailyShare(o) {
    return "Lapis Menjulang Harian #" + o.number + "\n🍰 Kue lapisku " + o.floors + " tingkat!\n✨ Pas sempurna " + o.perfects +
      "x · sampai rasa " + o.rasaName + "\nBisa lebih tinggi? " + o.url;
  }
  function duoShare(o) {
    return o.winner + " menang " + o.w + "–" + o.l + " lawan " + o.loser + " di Lapis Menjulang Dehayuk 🍰\n" + o.url;
  }

  return {
    W, CX, BASE_W, LH, XMIN, XMAX, V0, DV, VMAX, DUO_BOOST, MAX_FLOORS, SWAY_MAX, RASA, TOPPINGS,
    rng, mix, rasaOrder, rasaAt, newGame, scoreOf, speedAt, spec, posAt, kejuTurn, swayAt, drop, isValid,
    dateKey, dailySeed, dailyNumber, prevDay, toppingOf, cleanName, encodeDuel, decodeDuel, dailyShare, duoShare
  };
})();
/*CORE:END*/

// ================= Antarmuka =================
const STORE_KEY = "lapis-menjulang.v1";
const HOME_URL = "https://dehayuk.netlify.app/lapis-menjulang/";
const { RASA, LH } = GameCore;
const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const $ = (id) => document.getElementById(id);
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");

// Warna tiap rasa: sisi, muka atas, bayangan bawah, latar dapur (atas, bawah).
const RC = [
  { side: "#5DB548", top: "#9EDC7A", dark: "#357A27", bg: ["#173E35", "#2D5F4B"] },
  { side: "#8A5536", top: "#B98260", dark: "#57311D", bg: ["#2D2019", "#58402F"] },
  { side: "#EDBE3A", top: "#FFE07A", dark: "#B3861A", bg: ["#372D15", "#6A5427"] },
  { side: "#EE7FA8", top: "#FFBBD4", dark: "#B94C78", bg: ["#3B1C2B", "#6B3650"] },
  { side: "#5E3C73", top: "#9170A8", dark: "#382048", bg: ["#221931", "#46365C"] }
];
const SPONGE = { side: "#EFCB8A", top: "#FBE4B6", dark: "#C49A5A" };
const PLAYER_COLORS = ["#E5484D", "#3E8BF0", "#2FA86B", "#F08A24", "#8E5CE0", "#E0529C"];

let S = {
  best: 0, games: 0, totalFloors: 0, daily: null, streak: { last: null, count: 0 },
  settings: { mute: false, vibrate: true, handover: 700 }, badges: [], name: "", runs: {},
  toples: [0, 0, 0, 0, 0], bestStreakEver: 0,
  duo: { a: { n: "Merah", c: 0 }, b: { n: "Biru", c: 1 }, board: [], matches: 0 },
  chalW: 0, chalL: 0, chalD: 0, pendingChal: null, chalDone: []
};
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (saved && typeof saved.best === "number") {
    S = Object.assign(S, saved);
    S.settings = Object.assign({ mute: false, vibrate: true, handover: 700 }, saved.settings || {});
    S.streak = Object.assign({ last: null, count: 0 }, saved.streak || {});
    S.duo = Object.assign({ a: { n: "Merah", c: 0 }, b: { n: "Biru", c: 1 }, board: [], matches: 0 }, saved.duo || {});
    if (!Array.isArray(S.duo.board)) S.duo.board = [];
    if (!S.runs || typeof S.runs !== "object") S.runs = {};
    if (!Array.isArray(S.badges)) S.badges = [];
    if (!Array.isArray(S.chalDone)) S.chalDone = [];
    if (!Array.isArray(S.toples) || S.toples.length !== 5) S.toples = [0, 0, 0, 0, 0];
  }
} catch (e) {}
// Tiap permainan dimulai dengan Pandan: siapa pun yang pernah menyusun kue sudah mencapai rasa Pandan.
if (S.totalFloors > 0 && !S.toples[0]) S.toples[0] = 1;
// Tantangan lama dicatat per kode link; sekarang dicatat per seed kue supaya link tiruan tidak bisa dipakai berlatih.
S.chalDone = S.chalDone.map((x) => {
  if (!x || typeof x !== "object") return null;
  if (!Number.isInteger(x.s)) { const d = GameCore.decodeDuel(x.code); if (!d) return null; x.s = d.s; }
  if (x.done === undefined) x.done = true;
  return x;
}).filter(Boolean);
// Sebelum menulis, catatan tab lain digabung dulu, supaya save() di tab lama tidak menimpa hasil tab yang lebih baru.
function save() { mergeStored(); try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
// Menggabungkan catatan dari tab lain (atau simpanan yang lebih baru) sebelum memutuskan sesuatu yang hanya boleh sekali:
// hasil resmi Harian, runtunan hari, dan tantangan yang sudah dimainkan tidak boleh tertimpa keadaan lama di memori.
function mergeStored() {
  let o = null;
  try { o = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) {}
  if (!o || typeof o.best !== "number") return;
  if (o.daily && o.daily.done && typeof o.daily.date === "string") {
    const mine = S.daily && S.daily.done ? S.daily.date : "";
    if (o.daily.date > mine || (o.daily.date === mine && !(S.daily && S.daily.done))) S.daily = o.daily;
  }
  if (o.streak && typeof o.streak.last === "string" && (!S.streak.last || o.streak.last > S.streak.last ||
      (o.streak.last === S.streak.last && o.streak.count > S.streak.count))) S.streak = { last: o.streak.last, count: o.streak.count | 0 };
  S.best = Math.max(S.best, o.best);
  if (o.bestFloors > (S.bestFloors || 0)) S.bestFloors = o.bestFloors;
  if (o.games > S.games) S.games = o.games;
  if (o.totalFloors > S.totalFloors) S.totalFloors = o.totalFloors;
  if (o.bestStreakEver > S.bestStreakEver) S.bestStreakEver = o.bestStreakEver;
  if (Array.isArray(o.toples) && o.toples.length === 5) S.toples = S.toples.map((v, i) => Math.max(v, o.toples[i] | 0));
  if (Array.isArray(o.badges)) for (const b of o.badges) if (!S.badges.includes(b)) S.badges.push(b);

// ---------- Ketukan ----------
function onTap(ts) {
  if (!run || !$("overlay").hidden) return;
  const now = performance.now();
  if (run.state === "ready") {
    run.state = "play";
    $("tapHint").hidden = true;
    lastNow = now;
    if (!S.settings.mute) { try { audio(); } catch (e) {} }
    return;
  }
  if (run.state !== "play" || run.g.over) return;
  if (now - run.lastDrop < 90) return;
  // Ketukan dihitung pada saat jari menyentuh layar (timeStamp), mundur maksimal 50 ms, supaya WebView yang lambat tetap adil.
  let when = typeof ts === "number" && ts > 0 && Math.abs(now - ts) < 1000 ? ts : now;
  const delta = Math.max(-50, Math.min(50, when - lastNow));
  const t = Math.max(0, run.lt + delta / 1000);
  doDrop(t);
}
function doDrop(t) {
  const r = run, g = r.g;

  const res = GameCore.drop(g, t);
  if (!res) return;
  r.lastDrop = performance.now();
  const yTop = sy((res.n + 1) * LH);
  if (res.over) {
    // Hasil dicatat SEKARANG, sebelum animasi; keluar mendadak tidak bisa menghapus atau mengulang hasil.
    addCrumb(r, res.x, res.n * LH, res.w, res.rasa, res.x < sp.below.x + res.sway ? -1 : 1, true);
    if (r.kind === "duo") finalizeRound(r); else finalize(r);
    r.state = "dying";
    r.fx.dying = { t0: performance.now(), dir: res.x < sp.below.x + res.sway ? -1 : 1, from: Math.max(1, g.layers.length - 3) };
    sfx.fall();
    buzz([40, 60, 90]);
    say("Kue ambruk di tingkat " + (res.n) + ".");
    $("tapHint").hidden = true;
    later(() => { sfx.clink(); buzz(20); }, RM ? 200 : 950);
    later(() => { if (r.kind === "duo") showRoundResult(); else showResult(); }, RM ? 450 : 1450);
    return;
  }
  sfx.puk();
  buzz(res.perfect ? [12, 30, 12] : 10);
  r.fx.squash = { k: res.n, t0: performance.now() };
  if (res.cut) addCrumb(r, res.cut.x + res.sway, res.n * LH, res.cut.w, res.rasa, res.cut.side, false);
  const midX = res.nx + res.sway;
  if (res.perfect) {
    r.fx.rings.push({ x: midX, y: res.n * LH + LH / 2, w: res.nw, t0: performance.now() });
    if (r.fx.rings.length > 6) r.fx.rings.shift();
    sfx.perfect(g.streak);
    floatText(midX, yTop - 10, g.streak >= 2 ? "Pas x" + g.streak + "!" : "Pas!", g.streak >= 3 ? "#FFE07A" : "#fff");
    if (res.regrow) { r.fx.glow = { k: res.n, t0: performance.now() }; later(() => sfx.grow(), 60); }
  }
  // Rekor: hanya bila mengalahkan skor lama yang lebih dari 0.
  if (r.kind !== "duo" && g.score > S.best) {
    S.best = g.score;
    if (r.bestAtStart > 0 && !r.recordShown) {

      later(() => { banner("Rekor baru!"); sfx.record(); bump($("bestBox2")); }, 250);
    }
  }
  if (g.bestStreak > S.bestStreakEver) S.bestStreakEver = g.bestStreak;

  if (r.kind !== "duo" && S.best > 0 && r.bestFloorLine) pin = drawLine(r.bestFloorLine, "Rekormu · " + r.bestFloorLine, "rgba(244,193,82,.8)", xl, xr, pin);

    tg.addColorStop(0, "#8A5A34"); tg.addColorStop(1, "#4A2E1B");
    c.fillStyle = tg; c.fillRect(xl, tY, LW, LHt - tY + 40);
    c.fillStyle = "rgba(255,230,190,.25)"; c.fillRect(xl, tY, LW, 2);
    c.fillStyle = "rgba(0,0,0,.25)"; c.beginPath(); c.ellipse(180, tY + 3, 158, 7, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#D9D3C7"; c.beginPath(); c.ellipse(180, plateY + 4, 152, 8, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#F7F4EE"; c.beginPath(); c.ellipse(180, plateY + 1.5, 148, 6.5, 0, 0, Math.PI * 2); c.fill();

    c.globalAlpha = 1;
    // Penanda giliran (mode berdua): segitiga warna pemain.
    if (r.kind === "duo") {

    c.save(); c.translate(cr.x, y + LH / 2); c.rotate(cr.rot);

    c.restore();

  if (r.fx.rings.length) {
    r.fx.rings = r.fx.rings.filter((q) => now - q.t0 < 520);

const TOP_STYLE = [

  { cols: ["#4A2A18", "#6B3D22"], shape: "bar" },
  { cols: ["#FFE07A", "#F7D25A"], shape: "shred" },
  { cols: ["#D9B98A", "#B98F5E"], shape: "dot" },
  { cols: ["#FFFFFF", "#F2EEE6"], shape: "shred" },

function drawTopping(c, x, y, w, k, seed) {

  roundRect(c, x - w / 2 + 1, y - 1.5, w - 2, 5, 2.5); c.fill();

// Mencatat hasil satu kali, langsung saat permainan berakhir (sinkron, sebelum animasi apa pun).
function finalize(r) {
  if (!r || r.finalized || !r.g.over) return;
  r.finalized = true;
  const g = r.g;
  S.games++;
  S.totalFloors += g.floors;
  if (g.score > S.best) S.best = g.score;
  if (!S.bestFloors || g.floors > S.bestFloors) S.bestFloors = g.floors;
  const record = r.bestAtStart > 0 && g.score > r.bestAtStart;
  const first = r.bestAtStart === 0 && g.score > 0;
  const lastRasa = GameCore.rasaAt(g.seed, g.layers.length);
  let official = false;
  if (r.kind === "daily" && !r.practice) {
    // Baca ulang simpanan: tab lain mungkin sudah mencatat hasil resmi hari ini.
    mergeStored();
    const already = S.daily && S.daily.date === r.date && S.daily.done;
    if (already) r.practice = true; // percobaan kedua hanya dihitung latihan
    else {
      official = true;
      S.daily = { date: r.date, floors: g.floors, score: g.score, perfects: g.perfects, rasa: lastRasa.rasa, done: true };
      if (S.streak.last !== r.date) {
        S.streak.count = S.streak.last === GameCore.prevDay(r.date) ? S.streak.count + 1 : 1;
        S.streak.last = r.date;
      }
    }
  }
  let verdict = 0;
  if (r.kind === "chal") {
    mergeStored();
    verdict = recordChal({ s: g.seed, n: r.chal.n, f: r.chal.f, code: r.chal.code }, g.floors);
  }
  checkBadges(r);
  r.result = { kind: r.kind, seed: g.seed, floors: g.floors, score: g.score, perfects: g.perfects, bestStreak: g.bestStreak,
    rasa: lastRasa.rasa, cycle: lastRasa.cycle, record, first, official, practice: !!r.practice, date: r.date, chal: r.chal, verdict, replyTo: r.replyTo || "" };
  delete S.runs[r.slot];
  save();
}
// Satu ronde berdua selesai: skor pertandingan dicatat langsung, dan ronde berikutnya sudah disiapkan di simpanan.
function finalizeRound(r) {
  if (!r || r.finalized || !r.g.over) return;
  r.finalized = true;
  const d = r.duo, loser = playerOf(r.g.layers.length), winner = 1 - loser;
  d.wins[winner]++;
  const matchOver = d.wins[winner] >= 2;
  r.roundResult = { loser, winner, floors: r.g.floors, matchOver, wins: d.wins.slice() };
  if (matchOver) {
    S.duo.matches++;
    const nm = d.n[winner], key = nm.toLowerCase();
    const row = S.duo.board.find((x) => x.k === key);
    if (row) { row.w++; row.n = nm; } else S.duo.board.push({ k: key, n: nm, w: 1 });
    S.duo.board.sort((a, b) => b.w - a.w);
    S.duo.board = S.duo.board.slice(0, 12);
    delete S.runs.duo;
    checkBadges(r);
  } else {
    const nd = JSON.parse(JSON.stringify(d));
    nd.round++; nd.starter = 1 - d.starter;
    S.runs.duo = packRun({ kind: "duo", slot: "duo", g: GameCore.newGame(newSeed(), { duo: true }), duo: nd, bestAtStart: 0 });
  }
  save();
}

// ---------- Bagikan ----------
function shareText(text) {
  if (navigator.share) navigator.share({ text }).catch((e) => { if (!e || e.name !== "AbortError") copyText(text, true); });
  else copyText(text, true);
}
function copyText(text, wa) {
  const done = () => {
    toast("Tersalin. Tempel di WhatsApp!");
    if (wa) { try { window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener"); } catch (e) {} }
  };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("Gagal menyalin"); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}
function shareDaily() {
  const d = S.daily;
  if (!d || !d.done) return toast("Selesaikan Harian dulu, ya");
  shareText(GameCore.dailyShare({ number: GameCore.dailyNumber(d.date), floors: d.floors, perfects: d.perfects, rasaName: RASA[Math.max(0, d.rasa)].name, url: shareUrl() }));

// ---------- Tantangan ----------
// Tantangan dicatat per seed kue, bukan per teks link: link tiruan (nama beda huruf, kunci tambahan) tetap kue yang sama.
const chalDoneOf = (seed) => S.chalDone.find((x) => x.s === seed) || null;
// Seed Harian kemarin, hari ini, dan besok tidak boleh dipakai sebagai tantangan (itu jalan pintas berlatih Harian).
function isDailySeed(seed) {
  const t = today(), tm = GameCore.dateKey(new Date(Date.now() + 86400000));
  return [GameCore.prevDay(t), t, tm].some((k) => GameCore.dailySeed(k) === seed);
}
// Mencatat hasil satu tantangan sekali saja; mengembalikan 1 menang, -1 kalah, 0 seri.
function recordChal(c, floors) {
  const verdict = floors > c.f ? 1 : floors < c.f ? -1 : 0;
  const cur = chalDoneOf(c.s);
  if (cur && cur.done) return verdict;
  if (verdict > 0) S.chalW++; else if (verdict < 0) S.chalL++; else S.chalD++;
  const pend = S.pendingChal ? GameCore.decodeDuel(S.pendingChal) : null;
  if (pend && pend.s === c.s) S.pendingChal = null;
  S.chalDone = S.chalDone.filter((x) => x.s !== c.s).concat([{ s: c.s, code: c.code, n: c.n, f: c.f, mine: floors, done: true }]).slice(-60);
  if (S.runs.chal && S.runs.chal.g && S.runs.chal.g.seed === c.s) delete S.runs.chal;
  return verdict;
}
// Balas tantangan: permainan Sendiri baru dengan seed baru; hasilnya dikirim sebagai tantangan baru.
function startReply(name) {
  hideOverlay();
  const seed = newSeed();

}
function showChalDone(d) {

  showPanel(

    "<div class=\"col\"><button class=\"btn main\" id=\"xReply\" type=\"button\">Balas tantangan</button><button class=\"btn\" id=\"xClose\" type=\"button\">Tutup</button></div>",
    () => {
      $("xReply").onclick = () => startReply(d.n);
      $("xClose").onclick = () => { hideOverlay(); renderHome(); };
    });
}
function startChal(inv) {
  mergeStored();
  if (isDailySeed(inv.s)) {
    if (S.pendingChal === inv.code) S.pendingChal = null;
    save(); hideOverlay(); renderHome();
    return toast("Link tantangan tidak valid. Minta link baru, ya.");
  }
  const r = S.runs.chal, e = chalDoneOf(inv.s);
  if (resumeOk(r) && r.chal && r.g.seed === inv.s && !(e && e.done)) return openRun(withLines(Object.assign({}, r, { topping: GameCore.toppingOf(r.g.seed) })));
  if (e && !e.done) {
    // Sudah pernah dimulai lalu ditinggal atau tertimpa: hasilnya tingkat yang sempat dicapai.
    recordChal(e, e.mine | 0);
    save();
    return showChalDone(chalDoneOf(inv.s));
  }
  if (e) return showChalDone(e);
  // Tantangan lain yang masih berjalan ditutup dulu dengan tingkat yang sudah dicapai, supaya tidak bisa diulang dari awal.
  if (r && r.chal && r.g && r.g.seed !== inv.s) recordChal({ s: r.g.seed, n: r.chal.n, f: r.chal.f, code: r.chal.code }, r.g.floors | 0);
  S.chalDone = S.chalDone.concat([{ s: inv.s, code: inv.code, n: inv.n, f: inv.f, mine: 0, done: false }]).slice(-60);
  save();
  openRun(withLines(newRun("chal", inv.s, { chal: { n: inv.n, f: inv.f, code: inv.code }, topping: GameCore.toppingOf(inv.s) })));
}

function readChalHash() {
  const h = location.hash || "";
  if (!/^#t=/.test(h)) return;
  const m = /^#t=([A-Za-z0-9_-]+)$/.exec(h);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  const inv = m ? GameCore.decodeDuel(m[1]) : null;
  if (!inv || isDailySeed(inv.s)) { toast("Link tantangan tidak valid atau sudah diubah. Minta link baru, ya."); return; }
  inv.code = m[1];
  if (!$("play").hidden) goHome(true);
  mergeStored();
  const e = chalDoneOf(inv.s), done = e && e.done ? e : null;
  if (!done) { S.pendingChal = inv.code; save(); }
  renderHome();
  if (done) showChalDone(done); else showInvite(inv);
}

function renderToggles() {
  $("btnSound").textContent = S.settings.mute ? "🔇" : "🔊";
  $("btnSound").setAttribute("aria-label", S.settings.mute ? "Nyalakan suara" : "Matikan suara");
  $("btnVibe").textContent = "📳 Getar: " + (S.settings.vibrate ? "nyala" : "mati");
}
// keepBack = true bila layar berikutnya (panel undangan) memakai entri riwayat yang sama.
function goHome(keepBack) {
  stopRunTimers();
  if (run && !run.g.over) saveRun();
  run = null;
  fxEl.innerHTML = "";
  $("play").hidden = true;
  $("homeWrap").hidden = false;
  document.body.classList.remove("playing");
  renderHome();
  if (keepBack !== true) releaseBack();
}

// ---------- Panel, tombol Back, pesan ----------
let backArmed = false, overlayBack = null, ignorePop = false, releaseTimer = 0;
function enterScreen() {
  if (backArmed) return;
  try { history.pushState({ lapis: 1 }, ""); backArmed = true; } catch (e) {}
}
// Kembali ke menu lewat tombol di layar: entri riwayat milik layar main/panel dilepas,
// supaya tombol Back HP berikutnya langsung bekerja (tidak perlu ditekan dua kali).
// Ditunda sebentar: bila layar lain langsung dibuka, entrinya dipakai ulang.
function releaseBack() {
  clearTimeout(releaseTimer);
  releaseTimer = setTimeout(() => {
    if (!backArmed || !$("play").hidden || !$("overlay").hidden) return;
    backArmed = false; ignorePop = true;
    try { history.back(); } catch (e) { ignorePop = false; }
  }, 0);
}
function showPanel(html, wire, onBack) {
  const o = $("overlay");
  o.innerHTML = "<div class=\"panel\" role=\"dialog\" aria-modal=\"true\">" + html + "</div>";
  o.hidden = false;
  overlayBack = onBack || null;
  enterScreen();
  if (wire) wire();
  const btn = o.querySelector(".btn.main") || o.querySelector("button");
  if (btn && !o.querySelector("input:not(.name-input)") && !o.querySelector("#nameIn")) btn.focus({ preventScroll: true });
}
function hideOverlay() {
  $("overlay").hidden = true; $("overlay").innerHTML = ""; overlayBack = null;
  if ($("play").hidden) releaseBack(); else ensureLoop();
}
// Back menutup panel atau kembali ke menu; tidak pernah keluar dari situs saat sedang main.
window.addEventListener("popstate", () => {
  backArmed = false;
  if (ignorePop) {
    // Ini hasil releaseBack sendiri. Bila sementara itu layar baru terbuka, pasang lagi entrinya.
    ignorePop = false;
    if (!$("play").hidden || !$("overlay").hidden) enterScreen();
    return;
  }
  if (!$("overlay").hidden) {
    const after = overlayBack;
    hideOverlay();
    if (after) after();
    if (!$("play").hidden) enterScreen();
    return;
  }
  if (!$("play").hidden) goHome();
});
window.addEventListener("hashchange", readChalHash);
// Tab lain menyimpan sesuatu: gabungkan supaya hasil sekali-main tidak tertimpa.
window.addEventListener("storage", (e) => {
  if (e.key !== STORE_KEY) return;
  mergeStored();
  if ($("play").hidden) renderHome();
});
let toastTimer = 0;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

// ---------- Masukan ----------
stageEl.addEventListener("pointerdown", (e) => {
  if (e.target.closest("button")) return;
  if (e.button !== undefined && e.button > 0) return;
  e.preventDefault();
  onTap(e.timeStamp);
});
stageEl.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("keydown", (e) => {
  if ($("play").hidden || !$("overlay").hidden || e.repeat) return;
  if (e.key === " " || e.key === "Enter" || e.key === "Spacebar") { e.preventDefault(); onTap(e.timeStamp); }
  else if (e.key === "p" || e.key === "P" || e.key === "Escape") { e.preventDefault(); showPause(); }
});
$("modeSolo").onclick = () => startSolo(false);
$("modeDaily").onclick = startDaily;
$("modeDuo").onclick = openDuoSetup;
$("modeChal").onclick = openChalMenu;
$("btnHelp").onclick = showHelp;
$("btnJars").onclick = showJars;
$("btnMenu").onclick = goHome;
$("btnPause").onclick = () => { $("btnPause").blur(); showPause(); };
$("btnSound").onclick = () => {
  S.settings.mute = !S.settings.mute;
  save();
  renderToggles();
  if (!S.settings.mute) sfx.tap();
};
$("btnVibe").onclick = () => {
  S.settings.vibrate = !S.settings.vibrate;
  save();
  renderToggles();
  buzz(20);
};
let resizeRaf = 0;
window.addEventListener("resize", () => {
  if (resizeRaf) return;
  resizeRaf = requestAnimationFrame(() => {
    resizeRaf = 0;
    if (!run) return;
    layout(); measureHud();
    // Mengubah ukuran kanvas menghapus isinya; bila loop sedang berhenti di balik panel, gambar sekali lagi.
    if (!loopRaf && !$("play").hidden) draw(performance.now());
  });
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden || !run) return;
  if (run.state === "play" || run.state === "wait") showPause();
  else saveRun();
});

renderHome();
readChalHash();
</script>
</html>
